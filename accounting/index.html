<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Knowledge Graph — WAEC · NECO · JAMB</title>
<style>
  :root{
    --bg:#0d1418; --panel:#16212a; --panel-2:#1a2733;
    --line:#1e2d38; --line-2:#2b4356;
    --ink:#c9dcef; --ink-soft:#7d8f9c; --ink-dim:#5d7284;
    --cyan:#4fc3ff; --green:#58cc02; --amber:#ffb347;
    --coral:#ff5a4a; --violet:#c07aff; --yellow:#ffe040;
    --pink:#ff4fa3;
    --waec:#58cc02; --neco:#4fc3ff; --jamb:#ffe040;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--ink); font-weight:600;}
  .app{width:100%; height:100vh; display:flex; flex-direction:column;}

  header{padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; flex:0 0 auto; z-index:10;}
  .title-block{flex:1; min-width:0;}
  .eyebrow{font-size:9.5px; font-weight:800; letter-spacing:1.4px;
    text-transform:uppercase; color:var(--cyan); margin-bottom:2px;}
  h1{font-size:16px; font-weight:800; color:#e6f1fa; line-height:1.15;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .exam-pills{display:flex; gap:5px; flex:0 0 auto;}
  .exam-pill{
    font-size:9px; font-weight:800; letter-spacing:.8px; padding:4px 8px;
    border-radius:99px; text-transform:uppercase; border:1.5px solid;
    cursor:pointer; transition:.15s; background:transparent;
    font-family:inherit; color:#7d8f9c; border-color:#2b4356;
  }
  .exam-pill[data-exam="WAEC"]{color:#58cc02; border-color:rgba(88,204,2,.4);}
  .exam-pill[data-exam="NECO"]{color:#4fc3ff; border-color:rgba(79,195,255,.4);}
  .exam-pill[data-exam="JAMB"]{color:#ffe040; border-color:rgba(255,224,64,.4);}
  .exam-pill.on{background:currentColor; }
  .exam-pill.on[data-exam="WAEC"]{background:rgba(88,204,2,.18); color:#58cc02;}
  .exam-pill.on[data-exam="NECO"]{background:rgba(79,195,255,.18); color:#4fc3ff;}
  .exam-pill.on[data-exam="JAMB"]{background:rgba(255,224,64,.18); color:#ffe040;}
  .exam-pill.off{opacity:.35;}
  .controls{display:flex; gap:5px; flex:0 0 auto;}
  .ctrl{min-width:34px; height:34px; padding:0 10px; background:var(--panel-2);
    border:1.5px solid var(--line); border-radius:9px; color:var(--ink-soft);
    font-family:inherit; font-size:13px; font-weight:800; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;}
  .ctrl:hover{border-color:var(--cyan); color:var(--cyan);}
  .ctrl.wide{font-size:10px; letter-spacing:.8px; text-transform:uppercase; padding:0 12px;}

  .legend-bar{padding:8px 18px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; gap:12px; overflow-x:auto; flex:0 0 auto; scrollbar-width:none; z-index:9;}
  .legend-bar::-webkit-scrollbar{display:none}
  .legend-item{display:flex; align-items:center; gap:5px; font-size:9.5px;
    font-weight:800; letter-spacing:.9px; text-transform:uppercase;
    color:var(--ink-soft); flex:0 0 auto; white-space:nowrap; cursor:pointer;}
  .legend-item.dim{opacity:.3;}
  .legend-swatch{width:10px; height:10px; border-radius:3px; flex:0 0 auto;}

  .stage{flex:1; position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 20% 30%, rgba(79,195,255,.04), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(192,122,255,.04), transparent 40%),
      var(--bg);}
  #graph{width:100%; height:100%; display:block; cursor:grab; touch-action:none; user-select:none;}
  #graph.dragging{cursor:grabbing;}

  .hint{position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    font-size:9.5px; letter-spacing:1px; text-transform:uppercase;
    color:var(--ink-dim); font-weight:800; pointer-events:none;
    background:rgba(13,20,24,.85); padding:6px 14px; border-radius:99px;
    border:1px solid var(--line); transition:opacity .4s;}
  .hint.hide{opacity:0;}

  .node{cursor:pointer; transition:opacity .25s;}
  .node rect{transition:stroke-opacity .15s, fill .15s; fill:#16212a; stroke-width:1.4;}
  .node:hover rect{stroke-opacity:1; fill:#1c2c39;}
  .node.selected rect{stroke-opacity:1; stroke-width:2.4; fill:#1f3040;}
  .node.dim{opacity:.12;}
  .node text{pointer-events:none;}
  .node .node-name{font-family:'Nunito',sans-serif; font-weight:800;
    fill:#d0e2f0; pointer-events:none;}
  .node .node-footer{font-family:ui-monospace,'SF Mono',monospace; font-weight:700;
    letter-spacing:.5px; pointer-events:none;}
  .node .mis-dot{fill:#ff4b4b;}
  .node .exam-badge{font-family:'Nunito',sans-serif; font-weight:800; font-size:7px;
    letter-spacing:.5px; pointer-events:none;}

  .edge{fill:none; stroke-linecap:round; transition:stroke .2s, stroke-opacity .2s, stroke-width .2s;}
  .edge.prereq{stroke:#3a5468; stroke-width:1.2; stroke-opacity:.5;}
  .edge.cross{stroke:#c07aff; stroke-width:1; stroke-opacity:.35; stroke-dasharray:4 4;}
  .edge.highlight{stroke-opacity:1 !important; stroke-width:2.2;}
  .edge.highlight.prereq{stroke:#4fc3ff;}
  .edge.highlight.cross{stroke:#c07aff;}
  .edge.dim{stroke-opacity:.04 !important;}

  .detail{position:absolute; left:0; right:0; bottom:0; max-height:78vh;
    background:var(--panel); border-top:2px solid var(--line-2);
    border-radius:22px 22px 0 0; transform:translateY(105%);
    transition:transform .4s cubic-bezier(.4,0,.2,1); z-index:20;
    box-shadow:0 -12px 40px rgba(0,0,0,.55); display:flex; flex-direction:column;}
  .detail.open{transform:translateY(0);}
  .detail-inner{padding:20px 22px 28px; overflow-y:auto; flex:1;
    scrollbar-width:thin; scrollbar-color:var(--line-2) transparent;}
  .detail-inner::-webkit-scrollbar{width:6px}
  .detail-inner::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:3px}

  .detail-close{position:absolute; top:12px; right:14px; width:34px; height:34px;
    border-radius:10px; background:var(--panel-2); border:1.5px solid var(--line);
    color:var(--ink-soft); font-size:18px; font-weight:800; cursor:pointer;
    display:grid; place-items:center; transition:.15s; z-index:2; font-family:inherit;}
  .detail-close:hover{border-color:var(--coral); color:var(--coral);}

  .detail-layer{font-size:10px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; margin-bottom:6px;}
  .detail h2{font-size:22px; font-weight:800; color:#e6f1fa; line-height:1.2;
    margin-bottom:8px; padding-right:40px;}
  .exam-chips{display:flex; gap:5px; margin-bottom:12px; flex-wrap:wrap;}
  .exam-chip{font-size:9px; font-weight:800; letter-spacing:.8px; padding:3px 9px;
    border-radius:99px; text-transform:uppercase; border:1.5px solid;}
  .exam-chip[data-exam="WAEC"]{color:#58cc02; border-color:rgba(88,204,2,.5);
    background:rgba(88,204,2,.08);}
  .exam-chip[data-exam="NECO"]{color:#4fc3ff; border-color:rgba(79,195,255,.5);
    background:rgba(79,195,255,.08);}
  .exam-chip[data-exam="JAMB"]{color:#ffe040; border-color:rgba(255,224,64,.5);
    background:rgba(255,224,64,.08);}

  .detail-desc{font-size:14px; line-height:1.55; color:var(--ink-soft); margin-bottom:18px;}
  .detail-section{margin-bottom:16px;}
  .detail-section:last-child{margin-bottom:0;}
  .detail-label{font-size:10px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; color:var(--ink-dim); margin-bottom:8px;
    display:flex; align-items:center; gap:8px;}
  .detail-label .count{background:var(--panel-2); border:1px solid var(--line);
    padding:1px 7px; border-radius:99px; font-size:9px; color:var(--ink-soft);
    font-family:ui-monospace,monospace;}

  .chip-row{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{display:inline-flex; align-items:center; gap:6px;
    background:var(--panel-2); border:1.5px solid var(--line);
    border-radius:8px; padding:7px 10px; font-size:11.5px; font-weight:700;
    color:var(--ink); font-family:inherit; cursor:pointer; transition:.15s; text-align:left;}
  .chip:hover{border-color:var(--cyan); color:var(--cyan); transform:translateY(-1px);}
  .chip .cdot{width:6px; height:6px; border-radius:50%; flex:0 0 auto;}
  .chip.empty{background:transparent; border:none; color:var(--ink-dim);
    font-style:italic; cursor:default; padding:4px 0; font-weight:600;}
  .chip.empty:hover{color:var(--ink-dim); transform:none;}

  .detail-list{list-style:none; display:flex; flex-direction:column; gap:6px;}
  .detail-list li{font-size:12.5px; line-height:1.5; color:var(--ink);
    display:flex; gap:9px; align-items:flex-start; font-weight:600;}
  .detail-list li::before{content:''; width:5px; height:5px; border-radius:50%;
    flex:0 0 auto; margin-top:8px; background:var(--cyan);}
  .detail-list.warn li::before{background:var(--coral);}
  .detail-list.code li{font-family:ui-monospace,'SF Mono',monospace;
    background:var(--panel-2); border:1px solid var(--line);
    padding:7px 10px; border-radius:7px; font-size:11.5px; color:var(--amber);
    display:block;}
  .detail-list.code li::before{display:none;}

  @media (max-width:600px){
    header{padding:8px 12px; gap:8px;}
    h1{font-size:14px;}
    .exam-pill{font-size:8px; padding:3px 6px;}
    .legend-bar{padding:6px 12px;}
    .detail-inner{padding:18px 18px 24px;}
    .detail h2{font-size:19px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title-block">
      <div class="eyebrow">Physics · WAEC · NECO · JAMB</div>
      <h1>Integrated Knowledge Graph</h1>
    </div>
    <div class="exam-pills" id="examPills">
      <button class="exam-pill on" data-exam="WAEC">WAEC</button>
      <button class="exam-pill on" data-exam="NECO">NECO</button>
      <button class="exam-pill on" data-exam="JAMB">JAMB</button>
    </div>
    <div class="controls">
      <button class="ctrl" id="zoomOut" title="Zoom out">−</button>
      <button class="ctrl wide" id="zoomReset">Fit</button>
      <button class="ctrl" id="zoomIn" title="Zoom in">+</button>
    </div>
  </header>

  <div class="legend-bar" id="legendBar"></div>

  <main class="stage">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="hint" id="hint">Drag to pan · Scroll to zoom · Click a node</div>
  </main>

  <div class="detail" id="detail">
    <button class="detail-close" id="detailClose">×</button>
    <div class="detail-inner" id="detailInner"></div>
  </div>

</div>

<script>
// ============================================================
// LAYERS — full WAEC / NECO / JAMB span
// ============================================================
const LAYERS = [
  { id:0,  name:'Foundations & Measurement',  color:'#4fc3ff' },
  { id:1,  name:'Vectors & Position',         color:'#3fb8f0' },
  { id:2,  name:'Kinematics',                 color:'#58cc02' },
  { id:3,  name:'Forces & Newton',            color:'#7ac020' },
  { id:4,  name:'Equilibrium & Machines',     color:'#ff8c40' },
  { id:5,  name:'Work, Energy & Power',       color:'#ffb347' },
  { id:6,  name:'Elasticity & Matter',        color:'#ffd040' },
  { id:7,  name:'Fluids at Rest',             color:'#ffe040' },
  { id:8,  name:'Heat & Thermal',             color:'#ff5a4a' },
  { id:9,  name:'Waves',                      color:'#c07aff' },
  { id:10, name:'Sound',                      color:'#a85fe0' },
  { id:11, name:'Light & Optics',             color:'#ff4fa3' },
  { id:12, name:'Electrostatics & Capacitors',color:'#40e0d0' },
  { id:13, name:'Current Electricity',        color:'#20c0b0' },
  { id:14, name:'Magnetism',                  color:'#40a0e0' },
  { id:15, name:'EM Induction & AC',          color:'#6a80e0' },
  { id:16, name:'Modern Physics',             color:'#a050e0' },
  { id:17, name:'Electronics & Applications', color:'#e050a0' }
];

// ============================================================
// NODES — comprehensive WAEC / NECO / JAMB coverage
// ============================================================
const NODES = [
  /* ===== L0 · FOUNDATIONS ===== */
  { id:'fund-units', name:'Fundamental Quantities & Units', layer:0, pre:[], exams:['WAEC','NECO','JAMB'],
    desc:'The seven SI base quantities: length, mass, time, electric current, temperature, luminous intensity, amount of substance.',
    formulas:['[L]=m','[M]=kg','[T]=s','[I]=A','[θ]=K','[Iv]=cd','[n]=mol'],
    misc:['Units are optional','Any unit system works'] },

  { id:'derived-units', name:'Derived Quantities & Units', layer:0, pre:['fund-units'], exams:['WAEC','NECO','JAMB'],
    desc:'Quantities built from base units — area, volume, speed, force, pressure, work, power.',
    formulas:['[v]=m·s⁻¹','[F]=kg·m·s⁻²','[P]=kg·m⁻¹·s⁻²','[W]=kg·m²·s⁻²'],
    misc:['Derived units are independent of base units'] },

  { id:'dimensions', name:'Dimensions & Dimensional Analysis', layer:0, pre:['derived-units'], exams:['WAEC','NECO','JAMB'],
    desc:'Expressing quantities as powers of M, L, T, I, θ. Used to verify equations and derive relationships.',
    formulas:['[F]=MLT⁻²','[E]=ML²T⁻²','[P]=ML⁻¹T⁻²','[h]=ML²T⁻¹'],
    misc:['Dimensions must balance on both sides','Dimensionless means meaningless'] },

  { id:'measuring-tools', name:'Measuring Instruments', layer:0, pre:['fund-units'], exams:['WAEC','NECO','JAMB'],
    desc:'Vernier calipers, micrometer screw gauge, metre rule, measuring cylinder, stopwatch, beam balance.',
    formulas:['Vernier LC = 0.1 mm','Micrometer LC = 0.01 mm'],
    misc:['All measurements are exact','Zero error is always positive'] },

  { id:'errors-precision', name:'Errors, Accuracy & Precision', layer:0, pre:['measuring-tools'], exams:['WAEC','NECO','JAMB'],
    desc:'Systematic vs random errors; accuracy vs precision; simple error estimation.',
    formulas:['% error = (|true − meas| / true) × 100','% diff = |a−b|/avg × 100'],
    misc:['Precision and accuracy mean the same','More readings eliminate all errors'] },

  { id:'sigfig-standard', name:'Significant Figures & Standard Form', layer:0, pre:['measuring-tools'], exams:['WAEC','NECO','JAMB'],
    desc:'How many digits matter; writing very large/small numbers as a × 10ⁿ.',
    formulas:['3.14 → 3 s.f.','0.0042 → 2 s.f.','3000 = 3 × 10³'],
    misc:['Trailing zeros never count','All digits are significant'] },

  { id:'graphing-data', name:'Graphing & Data Analysis', layer:0, pre:['measuring-tools'], exams:['WAEC','NECO','JAMB'],
    desc:'Plotting measurements, drawing lines of best fit, reading slope and intercept.',
    formulas:['y = mx + c','slope = Δy/Δx','intercept = c'],
    misc:['Slope has no physical meaning','Always connect the dots'] },

  { id:'math-tools', name:'Mathematical Tools', layer:0, pre:['fund-units'], exams:['WAEC','NECO','JAMB'],
    desc:'Algebra, trigonometry, and geometry used throughout physics.',
    formulas:['sin²θ + cos²θ = 1','tan θ = sin θ / cos θ','Area = πr²','Volume = (4/3)πr³'],
    misc:['Trig is only for right triangles','All angles are in degrees'] },

  /* ===== L1 · VECTORS & POSITION ===== */
  { id:'scalars-vectors', name:'Scalars & Vectors', layer:1, pre:['fund-units','math-tools'], exams:['WAEC','NECO','JAMB'],
    desc:'Scalars: magnitude only. Vectors: magnitude and direction.',
    formulas:['Scalars: mass, time, speed, energy','Vectors: force, velocity, displacement'],
    misc:['Vectors add like numbers','Direction is optional'] },

  { id:'vector-notation', name:'Vector Representation', layer:1, pre:['scalars-vectors'], exams:['WAEC','NECO','JAMB'],
    desc:'Drawing vectors as arrows; notation A, ā, or bold; unit vector notation.',
    formulas:['A = Ax î + Ay ĵ','|A| = length of arrow'],
    misc:['Arrow length is arbitrary','Vectors cannot be negative'] },

  { id:'vector-addition', name:'Vector Addition & Resultant', layer:1, pre:['vector-notation'], exams:['WAEC','NECO','JAMB'],
    desc:'Triangle, parallelogram, and polygon laws; analytical addition by components.',
    formulas:['R² = A² + B² + 2AB cos θ','Rx = Ax + Bx','Ry = Ay + By'],
    misc:['Order affects the result','Resultant equals sum of magnitudes'] },

  { id:'vector-resolution', name:'Resolution of Vectors', layer:1, pre:['vector-addition'], exams:['WAEC','NECO','JAMB'],
    desc:'Splitting a vector into two perpendicular components.',
    formulas:['Ax = A cos θ','Ay = A sin θ','A = √(Ax² + Ay²)','θ = tan⁻¹(Ay/Ax)'],
    misc:['Both components have the same magnitude as A','cos and sin are interchangeable'] },

  { id:'position-coords', name:'Position & Coordinate Systems', layer:1, pre:['scalars-vectors'], exams:['WAEC','NECO','JAMB'],
    desc:'Locating a point using rectangular (Cartesian) coordinates in 2D and 3D.',
    formulas:['(x, y) in 2D','(x, y, z) in 3D'],
    misc:['Position is absolute','Coordinates only work in 2D'] },

  { id:'distance-displacement', name:'Distance & Displacement', layer:1, pre:['position-coords'], exams:['WAEC','NECO','JAMB'],
    desc:'Distance = total path length; displacement = straight-line change in position.',
    formulas:['Δx = x_f − x_i','distance ≥ |displacement|'],
    misc:['Distance equals displacement','Displacement can exceed distance'] },

  { id:'bearing-direction', name:'Direction & Bearing', layer:1, pre:['position-coords'], exams:['WAEC','NECO','JAMB'],
    desc:'Describing direction using compass points, angles, and bearings measured clockwise from North.',
    formulas:['Bearing ∈ [0°, 360°)','Compass: N, S, E, W'],
    misc:['Bearings measured counterclockwise'] },

  { id:'frame-of-reference', name:'Frame of Reference', layer:1, pre:['position-coords'], exams:['WAEC','NECO','JAMB'],
    desc:'Motion is relative to a chosen reference frame. Relative velocity between two frames.',
    formulas:['v_AB = v_A − v_B','v_BA = −v_AB'],
    misc:['Motion is absolute','Any frame gives the same velocity'] },

  /* ===== L2 · KINEMATICS ===== */
  { id:'types-of-motion', name:'Types of Motion', layer:2, pre:['scalars-vectors'], exams:['WAEC','NECO','JAMB'],
    desc:'Random, rectilinear, translational, rotational, circular, orbital, spin, oscillatory.',
    formulas:['Uniform vs non-uniform','Linear vs angular'],
    misc:['All motion is the same type','Oscillatory is the same as circular'] },

  { id:'speed', name:'Speed', layer:2, pre:['distance-displacement'], exams:['WAEC','NECO','JAMB'],
    desc:'Rate of change of distance. Scalar quantity.',
    formulas:['speed = distance / time','avg speed = total dist / total time'],
    misc:['Speed is a vector','Speed and velocity are identical'] },

  { id:'velocity', name:'Velocity', layer:2, pre:['distance-displacement'], exams:['WAEC','NECO','JAMB'],
    desc:'Rate of change of displacement. Vector quantity.',
    formulas:['v = Δx/Δt','v_avg = (u + v)/2 (uniform a)'],
    misc:['Velocity is scalar','Zero velocity means zero acceleration'] },

  { id:'acceleration', name:'Acceleration / Deceleration', layer:2, pre:['velocity'], exams:['WAEC','NECO','JAMB'],
    desc:'Rate of change of velocity. Negative acceleration = deceleration.',
    formulas:['a = Δv/Δt','units: m·s⁻²'],
    misc:['Acceleration always means speeding up','Heavy objects accelerate slower'] },

  { id:'motion-graphs', name:'Motion Graphs', layer:2, pre:['graphing-data','velocity'], exams:['WAEC','NECO','JAMB'],
    desc:'Reading and translating between distance-time, displacement-time, velocity-time graphs.',
    formulas:['slope of x-t = v','slope of v-t = a','area under v-t = Δx'],
    misc:['Flat line means at rest','Slope always means speed'] },

  { id:'eqns-motion', name:'Equations of Motion', layer:2, pre:['acceleration'], exams:['WAEC','NECO','JAMB'],
    desc:'The four kinematic equations for uniform acceleration.',
    formulas:['v = u + at','s = ut + ½at²','v² = u² + 2as','s = (u+v)t/2'],
    misc:['Any equation works for any motion','Valid when acceleration changes'] },

  { id:'free-fall', name:'Motion Under Gravity', layer:2, pre:['eqns-motion'], exams:['WAEC','NECO','JAMB'],
    desc:'Special case of kinematics with a = g = 9.8 m/s² downward.',
    formulas:['v = gt','h = ½gt²','v² = 2gh'],
    misc:['Heavier objects fall faster','g depends on the object'] },

  { id:'projectile', name:'Projectile Motion', layer:2, pre:['eqns-motion','vector-resolution'], exams:['WAEC','NECO','JAMB'],
    desc:'2D motion under gravity. Horizontal and vertical components are independent.',
    formulas:['T = 2u sinθ/g','H = u²sin²θ/(2g)','R = u²sin(2θ)/g'],
    misc:['Horizontal velocity changes during flight','Components are coupled'] },

  { id:'relative-motion', name:'Relative Motion', layer:2, pre:['velocity','frame-of-reference'], exams:['WAEC','NECO','JAMB'],
    desc:'Velocity measured in different frames of reference.',
    formulas:['v_AB = v_A − v_B','River-crossing problems'],
    misc:['Velocity is the same in all frames','Relative velocity is always zero'] },

  /* ===== L3 · FORCES & NEWTON ===== */
  { id:'concept-force', name:'Concept of Force', layer:3, pre:['vector-notation'], exams:['WAEC','NECO','JAMB'],
    desc:'A push or pull that changes motion. Vector quantity, measured in newtons.',
    formulas:['1 N = 1 kg·m·s⁻²','F_net = ΣF'],
    misc:['Force causes motion','Motion requires constant force'] },

  { id:'types-force', name:'Types of Force', layer:3, pre:['concept-force'], exams:['WAEC','NECO','JAMB'],
    desc:'Contact forces (push, pull, friction) and non-contact / field forces (gravity, electric, magnetic).',
    formulas:['Contact: acts on contact','Field: acts at a distance'],
    misc:['Gravity requires contact','All forces act at a distance'] },

  { id:'newton-first', name:"Newton's First Law", layer:3, pre:['concept-force'], exams:['WAEC','NECO','JAMB'],
    desc:'An object stays at rest or in uniform motion unless acted on by a net external force.',
    formulas:['ΣF = 0 → v = constant'],
    misc:['Objects naturally slow down','Motion needs a force'] },

  { id:'inertia-mass', name:'Inertia & Mass', layer:3, pre:['newton-first'], exams:['WAEC','NECO','JAMB'],
    desc:'Inertia is resistance to change in motion; mass is its measure.',

  ['refraction-plane', 'sound-speed'],  // refraction applies to sound too
  ['projectile', 'free-fall'],          // shared kinematics
  ['circular-motion', 'shm'],           // circular ↔ oscillation
  ['grav-not-used2', 'electric-field'], // placeholder
  ['kinetic-theory', 'gas-laws'],       // micro ↔ macro
  ['friction', 'viscosity-stokes'],     // friction in solids vs fluids
  ['ac-currents', 'rlc-resonance'],     // AC building blocks
  ['faraday-law', 'lenz-law'],          // same law, two perspectives
  ['magnetic-field', 'electric-field'], // field analogies
  ['resistors-combo', 'capacitors'],    // series/parallel similarity
  ['heat-transfer', 'thermal-conductivity'],
  ['pressure', 'electric-potential'],   // gradient analogies
  ['wave-particle', 'em-waves'],        // light wave nature
  ['photo-electric-intro', 'photoelectric'],
  ['equilibrium-coplanar', 'newton-first'],
  ['optical-instruments', 'lenses'],
  ['electron-diffraction', 'em-waves']
];

const byId = {};
NODES.forEach(n => byId[n.id] = n);

function isPrereq(a, b){
  return (byId[a]?.pre || []).includes(b) || (byId[b]?.pre || []).includes(a);
}

const CLEAN_CROSS = CROSS_LINKS.filter(([a,b]) => byId[a] && byId[b] && !isPrereq(a,b));

// ============================================================
// DERIVE SUCCESSORS
// ============================================================
const NEXT = {};
NODES.forEach(n => { NEXT[n.id] = []; });
NODES.forEach(n => {
  n.pre.forEach(p => { if (NEXT[p]) NEXT[p].push(n.id); });
});

// Cross-link map
const CROSS_MAP = {};
NODES.forEach(n => { CROSS_MAP[n.id] = []; });
CLEAN_CROSS.forEach(([a,b]) => {
  CROSS_MAP[a].push(b);
  CROSS_MAP[b].push(a);
});

// ============================================================
// LAYOUT
// ============================================================
const NODE_W = 175;
const NODE_H = 60;
const COL_GAP = 55;
const COL_SPACING = NODE_W + COL_GAP;
const COL_X = LAYERS.map((_, i) => 40 + i * COL_SPACING);
const CANVAS_W = COL_X[LAYERS.length-1] + NODE_W + 60;
const CANVAS_H = 1250;
const CENTER_Y = CANVAS_H / 2;

const byLayer = LAYERS.map(() => []);
NODES.forEach(n => byLayer[n.layer].push(n));

byLayer.forEach(list => {
  const gap = 18;
  const totalH = list.length * NODE_H + (list.length - 1) * gap;
  const startY = Math.max(80, CENTER_Y - totalH / 2);
  list.forEach((n, i) => {
    n.x = COL_X[n.layer];
    n.y = startY + i * (NODE_H + gap);
  });
});

// Barycenter passes
for (let iter = 0; iter < 8; iter++){
  NODES.forEach(n => {
    if (n.pre.length === 0){ n._want = n.y; return; }
    const avg = n.pre.reduce((s, p) => s + (byId[p]?.y ?? n.y), 0) / n.pre.length;
    n._want = avg;
  });
  byLayer.forEach(list => {
    list.sort((a, b) => (a._want ?? a.y) - (b._want ?? b.y));
    const gap = 18;
    const totalH = list.length * NODE_H + (list.length - 1) * gap;
    const startY = Math.max(80, CENTER_Y - totalH / 2);
    list.forEach((n, i) => {
      n.y = startY + i * (NODE_H + gap);
    });
  });
}

// ============================================================
// SVG HELPERS
// ============================================================
const SVG_NS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs = {}){
  const el = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function splitName(name){
  if (name.length <= 16) return [name];
  const words = name.split(' ');
  if (words.length === 1) return [name];
  let best = 1, bestDiff = Infinity;
  for (let i = 1; i < words.length; i++){
    const a = words.slice(0, i).join(' ');
    const b = words.slice(i).join(' ');
    const diff = Math.abs(a.length - b.length);
    if (diff < bestDiff){ bestDiff = diff; best = i; }
  }
  return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
}

// ============================================================
// STATE
// ============================================================
const state = {
  selected: null,
  examFilter: new Set(['WAEC','NECO','JAMB'])
};

const svgEl = document.getElementById('graph');
let viewport, edgesGroup, nodesGroup;
const nodeEls = {};
const edgeEls = [];

// ============================================================
// RENDER
// ============================================================
function render(){
  svgEl.innerHTML = '';

  const defs = svg('defs');
  const grid = svg('pattern', { id:'grid', width:40, height:40, patternUnits:'userSpaceOnUse' });
  grid.appendChild(svg('circle', { cx:1, cy:1, r:0.7, fill:'#1a2733' }));
  defs.appendChild(grid);

  const marker = svg('marker', {
    id:'arrow', viewBox:'0 0 10 10', refX:'9', refY:'5',
    markerWidth:'5', markerHeight:'5', orient:'auto-start-reverse'
  });
  marker.appendChild(svg('path', { d:'M 0 0 L 10 5 L 0 10 Z', fill:'#3a5468' }));
  defs.appendChild(marker);
  svgEl.appendChild(defs);

  svgEl.appendChild(svg('rect', { x:0, y:0, width:CANVAS_W, height:CANVAS_H, fill:'url(#grid)' }));

  viewport = svg('g', { id:'viewport' });
  svgEl.appendChild(viewport);

  // Layer headers
  const headerG = svg('g');
  LAYERS.forEach((layer, i) => {
    const t = svg('text', {
      x: COL_X[i] + NODE_W / 2, y: 28,
      'text-anchor':'middle',
      'font-family':"'Nunito',sans-serif",
      'font-size':10,
      'font-weight':800,
      'letter-spacing':1.5,
      fill: layer.color, opacity:0.75
    });
    t.textContent = layer.name.toUpperCase();
    headerG.appendChild(t);

    headerG.appendChild(svg('line', {
      x1: COL_X[i] + 8, y1: 40, x2: COL_X[i] + NODE_W - 8, y2: 40,
      stroke: layer.color, 'stroke-width':1, opacity:0.2
    }));
  });
  viewport.appendChild(headerG);

  edgesGroup = svg('g');
  viewport.appendChild(edgesGroup);
  nodesGroup = svg('g');
  viewport.appendChild(nodesGroup);

  // Prereq edges
  NODES.forEach(n => {
    n.pre.forEach(pid => {
      const p = byId[pid];
      if (p) drawEdge(p, n, 'prereq');
    });
  });

  // Cross edges
  CLEAN_CROSS.forEach(([a, b]) => {
    const A = byId[a], B = byId[b];
    const [left, right] = A.x <= B.x ? [A, B] : [B, A];
    drawEdge(left, right, 'cross');
  });

  // Nodes
  NODES.forEach(n => drawNode(n));

  applyExamFilter();
  fitToView();
}

function drawEdge(from, to, type){
  const x1 = from.x + NODE_W;
  const y1 = from.y + NODE_H / 2;
  const x2 = to.x;
  const y2 = to.y + NODE_H / 2;
  const dx = Math.max(40, (x2 - x1) * 0.5);
  const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

  const path = svg('path', {
    d, class:`edge ${type}`,
    'data-from': from.id, 'data-to': to.id
  });
  if (type === 'prereq') path.setAttribute('marker-end', 'url(#arrow)');
  edgeEls.push({ el: path, from: from.id, to: to.id, type });
  edgesGroup.appendChild(path);
}

function drawNode(n){
  const layer = LAYERS[n.layer];
  const g = svg('g', {
    class:'node', 'data-id': n.id,
    transform:`translate(${n.x} ${n.y})`
  });

  const rect = svg('rect', {
    x:0, y:0, width:NODE_W, height:NODE_H, rx:12, ry:12,
    stroke: layer.color, 'stroke-opacity':0.7
  });
  g.appendChild(rect);

  g.appendChild(svg('rect', {
    x:0, y:0, width:3.5, height:NODE_H, rx:1.7, ry:1.7,
    fill: layer.color, opacity:0.9
  }));

  // Name
  const lines = splitName(n.name);
  if (lines.length === 1){
    const t = svg('text', {
      x:13, y:32, class:'node-name', 'font-size':12.5
    });
    t.textContent = lines[0];
    g.appendChild(t);
  } else {
    const t1 = svg('text', { x:13, y:25, class:'node-name', 'font-size':11.5 });
    t1.textContent = lines[0];
    g.appendChild(t1);
    const t2 = svg('text', { x:13, y:40, class:'node-name', 'font-size':11.5 });
    t2.textContent = lines[1];
    g.appendChild(t2);
  }

  // Exam badges
  const exams = n.exams || [];
  const badgeY = NODE_H - 9;
  let badgeX = 13;
  exams.forEach(ex => {
    const col = ex === 'WAEC' ? '#58cc02' : ex === 'NECO' ? '#4fc3ff' : '#ffe040';
    const label = ex[0]; // W, N, J
    const badge = svg('text', {
      x: badgeX, y: badgeY,
      class:'exam-badge', fill: col, opacity:0.85
    });
    badge.textContent = label;
    g.appendChild(badge);
    badgeX += 10;
  });

  // Prereq count
  const preCount = n.pre.length;
  const footer = svg('text', {
    x: NODE_W - 10, y: badgeY,
    class:'node-footer', 'font-size':7,
    'text-anchor':'end',
    fill: layer.color, opacity:0.6
  });
  footer.textContent = preCount === 0 ? 'ENTRY' : `${preCount} PRE`;
  g.appendChild(footer);

  // Misconception dot
  if (n.misc && n.misc.length){
    g.appendChild(svg('circle', { cx: NODE_W - 10, cy: 11, r: 3, class:'mis-dot' }));
  }

  g.addEventListener('click', (e) => {
    e.stopPropagation();
    selectNode(n.id);
  });
  g.addEventListener('mouseenter', () => hoverNode(n.id));
  g.addEventListener('mouseleave', unhoverNode);

  nodesGroup.appendChild(g);
  nodeEls[n.id] = g;
}

// ============================================================
// EXAM FILTER
// ============================================================
function applyExamFilter(){
  NODES.forEach(n => {
    const visible = (n.exams || []).some(ex => state.examFilter.has(ex));
    nodeEls[n.id].style.display = visible ? '' : 'none';
  });
  edgeEls.forEach(e => {
    const a = byId[e.from], b = byId[e.to];
    const aVis = (a.exams || []).some(ex => state.examFilter.has(ex));
    const bVis = (b.exams || []).some(ex => state.examFilter.has(ex));
    e.el.style.display = (aVis && bVis) ? '' : 'none';
  });
  if (state.selected){
    const n = byId[state.selected];
    if (!(n.exams || []).some(ex => state.examFilter.has(ex))){
      clearSelection();
    }
  }
}

// ============================================================
// HOVER
// ============================================================
function hoverNode(id){
  const connected = new Set([id]);
  edgeEls.forEach(e => {
    if (e.from === id || e.to === id){
      connected.add(e.from); connected.add(e.to);
    }
  });
  NODES.forEach(n => {
    nodeEls[n.id].classList.toggle('dim', !connected.has(n.id));
  });
  edgeEls.forEach(e => {
    const on = e.from === id || e.to === id;
    e.el.classList.toggle('highlight', on);
    e.el.classList.toggle('dim', !on);
  });
}

function unhoverNode(){
  if (state.selected) return;
  NODES.forEach(n => nodeEls[n.id].classList.remove('dim'));
  edgeEls.forEach(e => {
    e.el.classList.remove('highlight', 'dim');
  });
}

// ============================================================
// SELECT
// ============================================================
function selectNode(id){
  state.selected = id;
  const connected = new Set([id]);
  edgeEls.forEach(e => {
    if (e.from === id || e.to === id){
      connected.add(e.from); connected.add(e.to);
    }
  });
  NODES.forEach(n => {
    const g = nodeEls[n.id];
    g.classList.toggle('selected', n.id === id);
    g.classList.toggle('dim', !connected.has(n.id));
  });
  edgeEls.forEach(e => {
    const on = e.from === id || e.to === id;
    e.el.classList.toggle('highlight', on);
    e.el.classList.toggle('dim', !on);
  });
  showDetail(byId[id]);
}

function clearSelection(){
  state.selected = null;
  NODES.forEach(n => nodeEls[n.id].classList.remove('dim', 'selected'));
  edgeEls.forEach(e => e.el.classList.remove('highlight', 'dim'));
  closeDetail();
}

// ============================================================
// DETAIL PANEL
// ============================================================
const detailEl = document.getElementById('detail');
const detailInner = document.getElementById('detailInner');

function chipHTML(id){
  const n = byId[id];
  if (!n) return '';
  const layer = LAYERS[n.layer];
  const visible = (n.exams || []).some(ex => state.examFilter.has(ex));
  if (!visible) return '';
  return `<button class="chip" data-jump="${id}">
    <span class="cdot" style="background:${layer.color}"></span>${n.name}
  </button>`;
}

function section(label, count, html){
  return `<div class="detail-section">
    <div class="detail-label">${label}${count != null ? `<span class="count">${count}</span>` : ''}</div>
    ${html}
  </div>`;
}

function listSection(label, items, cls=''){
  if (!items || !items.length) return '';
  return section(label, items.length,
    `<ul class="detail-list ${cls}">${items.map(i => `<li>${i}</li>`).join('')}</ul>`);
}

function showDetail(node){
  const layer = LAYERS[node.layer];
  const nexts = NEXT[node.id] || [];
  const crosses = CROSS_MAP[node.id] || [];
  const exams = node.exams || [];

  let html = `
    <div class="detail-layer" style="color:${layer.color}">
      Layer ${node.layer} · ${layer.name}
    </div>
    <h2>${node.name}</h2>
    <div class="exam-chips">
      ${exams.map(ex => `<span class="exam-chip" data-exam="${ex}">${ex}</span>`).join('')}
    </div>
    <p class="detail-desc">${node.desc}</p>
  `;

  html += section('Prerequisites', node.pre.length,
    node.pre.length
      ? `<div class="chip-row">${node.pre.map(chipHTML).join('')}</div>`
      : `<span class="chip empty">None — this is an entry point.</span>`);

  html += section('Leads to', nexts.length,
    nexts.length
      ? `<div class="chip-row">${nexts.map(chipHTML).join('')}</div>`
      : `<span class="chip empty">Terminal node — no follow-ups.</span>`);

  const crossChips = crosses.map(chipHTML).join('');
  if (crosses.length){
    html += section('Cross-links', crosses.length,
      `<div class="chip-row">${crossChips}</div>`);
  }

  html += listSection('Key formulas', node.formulas, 'code');
  html += listSection('Common misconceptions', node.misc, 'warn');

  detailInner.innerHTML = html;

  detailInner.querySelectorAll('[data-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.jump;
      centerOn(id);
      selectNode(id);
    });
  });

  detailEl.classList.add('open');
}

function closeDetail(){ detailEl.classList.remove('open'); }
document.getElementById('detailClose').addEventListener('click', clearSelection);

// ============================================================
// PAN / ZOOM
// ============================================================
const view = { tx:0, ty:0, scale:1 };

function applyTransform(){
  viewport.setAttribute('transform',
    `translate(${view.tx} ${view.ty}) scale(${view.scale})`);
}

function fitToView(){
  const rect = svgEl.getBoundingClientRect();
  const cw = rect.width, ch = rect.height;
  const scale = Math.min(cw / CANVAS_W, ch / CANVAS_H) * 0.92;
  view.scale = scale;
  view.tx = (cw - CANVAS_W * scale) / 2;
  view.ty = (ch - CANVAS_H * scale) / 2;
  applyTransform();
}

function centerOn(id){
  const n = byId[id];
  if (!n) return;
  const rect = svgEl.getBoundingClientRect();
  const cw = rect.width, ch = rect.height;
  view.tx = cw / 2 - (n.x + NODE_W/2) * view.scale;
  view.ty = ch / 2 - (n.y + NODE_H/2) * view.scale;
  applyTransform();
}

document.getElementById('zoomIn').onclick = () => zoomAt(svgEl.clientWidth/2, svgEl.clientHeight/2, 1.25);
document.getElementById('zoomOut').onclick = () => zoomAt(svgEl.clientWidth/2, svgEl.clientHeight/2, 0.8);
document.getElementById('zoomReset').onclick = fitToView;

function zoomAt(px, py, factor){
  const newScale = Math.max(0.12, Math.min(4, view.scale * factor));
  const wx = (px - view.tx) / view.scale;
  const wy = (py - view.ty) / view.scale;
  view.scale = newScale;
  view.tx = px - wx * newScale;
  view.ty = py - wy * newScale;
  applyTransform();
}

let isDragging = false, dragStart = null, moved = false;

svgEl.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.node')) return;
  isDragging = true; moved = false;
  dragStart = { x:e.clientX, y:e.clientY, tx:view.tx, ty:view.ty };
  svgEl.classList.add('dragging');
  svgEl.setPointerCapture(e.pointerId);
});

svgEl.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
  view.tx = dragStart.tx + dx;
  view.ty = dragStart.ty + dy;
  applyTransform();
});

function endDrag(e){
  if (!isDragging) return;
  isDragging = false;
  svgEl.classList.remove('dragging');
  try { svgEl.releasePointerCapture(e.pointerId); } catch(_){}
  if (!moved && !e.target.closest('.node')) clearSelection();
}
svgEl.addEventListener('pointerup', endDrag);
svgEl.addEventListener('pointercancel', endDrag);

svgEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = svgEl.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.12 : 0.89);
}, { passive:false });

// ============================================================
// LEGEND
// ============================================================
function buildLegend(){
  const bar = document.getElementById('legendBar');
  bar.innerHTML = '';
  LAYERS.forEach(layer => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.layer = layer.id;
    item.innerHTML = `
      <span class="legend-swatch" style="background:${layer.color}"></span>
      <span>${layer.name}</span>`;
    bar.appendChild(item);
  });
}

// ============================================================
// EXAM FILTER PILLS
// ============================================================
document.querySelectorAll('.exam-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    const ex = pill.dataset.exam;
    if (state.examFilter.has(ex)){
      if (state.examFilter.size === 1) return; // keep at least one
      state.examFilter.delete(ex);
      pill.classList.remove('on');
      pill.classList.add('off');
    } else {
      state.examFilter.add(ex);
      pill.classList.add('on');
      pill.classList.remove('off');
    }
    applyExamFilter();
  });
});

// ============================================================
// HINT
// ============================================================
const hintEl = document.getElementById('hint');
setTimeout(() => hintEl.classList.add('hide'), 4500);

// ============================================================
// INIT
// ============================================================
render();
buildLegend();

window.addEventListener('resize', () => { if (!state.selected) fitToView(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') clearSelection();
});
</script>
</body>
