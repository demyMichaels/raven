<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy Rig — Stores &amp; Transfers</title>
<style>
  :root{
    --bg:#05080d; --panel:#0b121b; --panel2:#0e1822; --line:#1b2b3a;
    --txt:#c9dcec; --dim:#5d7891; --cy:#4fc3ff; --am:#ffb347; --rd:#ff5a4a; --gr:#4fe0a8;
    --pk:#ff4fa3; --vi:#c07aff; --yl:#ffe040;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:13px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    overflow:hidden;
  }
  .app{display:flex;height:100vh;width:100vw}
  .stage{
    position:relative;flex:1;min-width:0;overflow:hidden;
    background:radial-gradient(circle at 50% 45%, #121a2e 0%, #080c16 60%, #04060b 100%);
    display:flex;align-items:center;justify-content:center;
  }
  svg#rig{display:block;height:100%;width:100%;overflow:visible}
  .overlay{position:absolute;inset:0;pointer-events:none;padding:14px 16px;
           display:flex;flex-direction:column;justify-content:space-between}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{
    background:rgba(10,22,34,.78);border:1px solid var(--line);
    padding:5px 11px;border-radius:99px;font-size:11px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--dim);backdrop-filter:blur(6px)
  }
  .chip b{color:var(--cy);font-weight:600}
  .chip.state b{color:var(--am)}
  .chip.focus b{color:var(--vi)}
  .chip.energy b{color:var(--yl)}
  .chip.quiz b{color:var(--gr)}
  .chip.device b{color:var(--pk)}
  .hud-bottom{display:flex;flex-direction:column;gap:8px;max-width:460px}
  .meter{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.12em;color:var(--dim)}
  .track{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:99px;
         overflow:hidden;border:1px solid var(--line);display:flex}
  .track i{display:block;height:100%;transition:width .12s linear}
  .seg-gpe{background:linear-gradient(180deg,#ffb347,#a86f30);}
  .seg-ke {background:linear-gradient(180deg,#4fc3ff,#1e6fa8);}
  .seg-th {background:linear-gradient(180deg,#ff5a4a,#8a2010);}
  .blend{display:flex;gap:14px;font-size:10px;letter-spacing:.1em;color:var(--dim)}
  .blend b{color:var(--cy);font-weight:600}
  .panel{
    width:352px;flex:0 0 352px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain
  }
  .panel::-webkit-scrollbar{width:8px}
  .panel::-webkit-scrollbar-thumb{background:#1b2b3a;border-radius:9px}
  section{padding:13px 15px;border-bottom:1px solid var(--line)}
  h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
     font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between}
  h3 span{color:#2f4457}
  .tabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
  .tab{
    flex:1 1 auto;min-width:0;padding:7px 4px;text-align:center;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim);border-radius:6px;cursor:pointer;
    font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;transition:.15s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .tab:hover{color:var(--txt);border-color:#2b4356}
  .tab.on{background:#12283a;border-color:var(--cy);color:var(--cy)}
  .btn{
    padding:7px 8px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    border-radius:6px;cursor:pointer;font:inherit;font-size:11px;text-align:center;
    transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .btn:hover{color:var(--txt);border-color:#2b4356;background:#122232}
  .btn.on{background:#173a2a;border-color:var(--gr);color:var(--gr)}
  .btn.vi{border-color:#2a1a4a;color:#a880e0}
  .btn.vi:hover{background:#1a0e2a;border-color:var(--vi);color:#d0a0ff}
  .btn.vi.on{background:#2a0f3a;border-color:var(--vi);color:#e0c0ff}
  .btn.fire{border-color:#3a2a12;color:#a8865a}
  .btn.fire:hover{background:#2a1f0e;border-color:var(--am);color:var(--am)}
  .btn.fire:active{background:#3a2a12}
  .btn.go{border-color:#1a4a3a;color:var(--gr);font-weight:600;
          letter-spacing:.1em;font-size:11px;padding:9px 4px}
  .btn.go:hover{background:#0d2a1e;border-color:#4fe0a8;color:#7fffc8}
  .fire-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .store-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .conv-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .slider{margin-bottom:11px}
  .slider:last-child{margin-bottom:0}
  .slider label{display:flex;justify-content:space-between;font-size:10px;
                letter-spacing:.1em;color:var(--dim);margin-bottom:5px}
  .slider label b{color:var(--cy);font-weight:600}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;
    background:#16242f;outline:none;cursor:pointer
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--vi);border:2px solid #05121c;cursor:pointer;
    box-shadow:0 0 8px rgba(192,122,255,.6)
  }
  .big-readout{
    display:flex;justify-content:space-between;align-items:baseline;
    background:#0a1218;border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;margin-bottom:8px
  }
  .big-readout .k{font-size:9.5px;color:var(--dim);letter-spacing:.15em;text-transform:uppercase}
  .big-readout .v{font-size:18px;color:var(--cy);font-weight:700;font-family:ui-monospace,monospace}
  .big-readout .v.vi{color:var(--vi)}
  .big-readout .v.am{color:var(--am)}
  .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .tlrow{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:10.5px}
  .tlrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#7e9ab3}
  .tlrow.on .nm{color:var(--txt)}
  .tlrow .bar{width:56px;height:4px;background:#132029;border-radius:99px;overflow:hidden;flex:none}
  .tlrow .bar i{display:block;height:100%;width:0;background:var(--vi);border-radius:99px}
  .tlrow.one .bar i{background:var(--am)}
  .tlrow.gr .bar i{background:var(--gr)}
  .tlrow .spd{width:34px;text-align:right;color:#3f5a72;flex:none;font-size:9.5px}
  .log{font-size:10.5px;line-height:1.7;max-height:112px;overflow:hidden;color:#4d6b84}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log b{color:var(--am);font-weight:600}
  .log i{color:var(--cy);font-style:normal}
  .legstatus{
    margin-top:8px;font-size:9.5px;letter-spacing:.08em;color:#3d5a72;
    display:flex;flex-wrap:wrap;gap:6px;min-height:14px
  }
  .legstatus .tag{
    padding:1px 5px;border-radius:3px;background:#0e1a24;border:1px solid #1c2f3d;
    color:#5a8aa8;font-size:9px;text-transform:uppercase
  }
  .legstatus .tag.vi{background:#1e0d2e;border-color:#4a1a5a;color:var(--vi)}
  .legstatus .tag.am{background:#2a1f0e;border-color:#5a3010;color:var(--am)}
  .legstatus .tag.gr{background:#0d2a1e;border-color:#1a4a3a;color:var(--gr)}
  .legstatus .tag.cy{background:#0d2533;border-color:#1a3a4a;color:var(--cy)}
  .legstatus .tag.pk{background:#2a0a1f;border-color:#7a1040;color:var(--pk)}
  @media (max-width:820px){
    .app{flex-direction:column}
    .panel{width:100%;flex:1 1 auto;border-left:none;border-top:1px solid var(--line)}
    .stage{flex:0 0 46vh}
  }
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <svg id="rig" viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="coreRad">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="0.3" stop-color="#ffe040"/>
          <stop offset="0.7" stop-color="#ffb347" stop-opacity="0.4"/>
          <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="particleRad">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="0.4" stop-color="#4fc3ff"/>
          <stop offset="1" stop-color="#4fc3ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="flashRad">
          <stop offset="0" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.4" stop-color="#4fc3ff" stop-opacity="0.4"/>
          <stop offset="1" stop-color="#4fc3ff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0e1e2e" stop-opacity="0.6"/>
          <stop offset="1" stop-color="#0e1e2e" stop-opacity="0"/>
        </linearGradient>
        <pattern id="dotPat" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.7" fill="#1a2a3a"/>
        </pattern>
      </defs>

      <rect width="720" height="540" fill="url(#dotPat)" opacity="0.5"/>

      <!-- ═══════════════════════════════════════════════════════
           SCENE 1 — INTRO
           ═══════════════════════════════════════════════════════ -->
      <g id="sceneIntro">
        <circle cx="360" cy="270" r="80" fill="url(#coreRad)" opacity="0.35"/>
        <circle cx="360" cy="270" r="32" fill="url(#coreRad)"/>
        <circle cx="360" cy="270" r="8" fill="#ffffff"/>
        <circle cx="360" cy="270" r="185" fill="none" stroke="#1e3244" stroke-width="1" stroke-dasharray="3 6"/>

        <g id="introIcons">
          <g class="introIcon" data-i="0">
            <circle r="15" fill="#4fc3ff" opacity="0.9"/>
            <circle r="15" fill="none" stroke="#1e6fa8" stroke-width="1.5"/>
          </g>
          <g class="introIcon" data-i="1">
            <line x1="-16" y1="10" x2="16" y2="10" stroke="#a86f30" stroke-width="2"/>
            <circle cy="-2" r="11" fill="#ffb347" opacity="0.9"/>
            <circle cy="-2" r="11" fill="none" stroke="#8a4a10" stroke-width="1.4"/>
          </g>
          <g class="introIcon" data-i="2">
            <path d="M -12 -14 L -6 -8 L -12 -2 L -6 4 L -12 10 L -6 14 L 0 14"
                  fill="none" stroke="#4fe0a8" stroke-width="2" stroke-linecap="round"/>
            <rect x="-20" y="-18" width="8" height="6" fill="#3a5468"/>
          </g>
          <g class="introIcon" data-i="3">
            <path d="M -12 -8 L -10 14 L 10 14 L 12 -8 Z" fill="#ff5a4a" opacity="0.8"
                  stroke="#8a2010" stroke-width="1.2"/>
            <path d="M -14 -8 L 14 -8" stroke="#8a2010" stroke-width="1.4"/>
            <path d="M -4 -14 Q -6 -18 0 -20" stroke="#ff8c40" stroke-width="1.2"
                  fill="none" opacity="0.7"/>
            <path d="M 4 -14 Q 6 -18 0 -22" stroke="#ff8c40" stroke-width="1.2"
                  fill="none" opacity="0.5"/>
          </g>
          <g class="introIcon" data-i="4">
            <rect x="-14" y="-10" width="28" height="20" rx="2" fill="#58cc02"
                  stroke="#2a6a1a" stroke-width="1.2"/>
            <rect x="-6" y="-13" width="4" height="3" fill="#2a6a1a"/>
            <rect x="2" y="-13" width="4" height="3" fill="#2a6a1a"/>
            <text y="4" text-anchor="middle" font-size="10" font-weight="700" fill="#0a1218">+</text>
          </g>
          <g class="introIcon" data-i="5">
            <circle r="5" fill="#c07aff" stroke="#5a1a8a" stroke-width="1.2"/>
            <ellipse rx="14" ry="5" fill="none" stroke="#c07aff" stroke-width="1.2" opacity="0.7"/>
            <ellipse rx="14" ry="5" fill="none" stroke="#c07aff" stroke-width="1.2"
                     opacity="0.7" transform="rotate(60)"/>
            <ellipse rx="14" ry="5" fill="none" stroke="#c07aff" stroke-width="1.2"
                     opacity="0.7" transform="rotate(-60)"/>
          </g>
        </g>

        <g id="introParticle">
          <circle r="8" fill="url(#particleRad)"/>
          <circle r="3" fill="#ffffff"/>
        </g>

        <text x="360" y="500" text-anchor="middle" font-size="12" fill="#7e9ab3"
              font-family="ui-monospace,monospace" letter-spacing="0.15em">
          ENERGY CANNOT BE CREATED OR DESTROYED
        </text>
        <text x="360" y="518" text-anchor="middle" font-size="10" fill="#5d7891"
              font-family="ui-monospace,monospace" letter-spacing="0.1em">
          only transferred between stores
        </text>
      </g>

      <!-- ═══════════════════════════════════════════════════════
           SCENE 2 — STORES (9 tiles in 3×3)
           ═══════════════════════════════════════════════════════ -->
      <g id="sceneStores" style="display:none"></g>

      <!-- ═══════════════════════════════════════════════════════
           SCENE 3 — TRANSFERS
           ═══════════════════════════════════════════════════════ -->
      <g id="sceneTransfers" style="display:none">
        <rect x="0" y="0" width="720" height="300" fill="url(#skyGrad)"/>
        <text x="360" y="28" text-anchor="middle" font-size="11" fill="#5d7891"
              font-family="ui-monospace,monospace" letter-spacing="0.18em">
          ROLLER COASTER — CONSERVATION OF ENERGY
        </text>
        <path id="coasterTrack" fill="none" stroke="#3a5468" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path id="coasterRail" fill="none" stroke="#1e3244" stroke-width="1.5" stroke-dasharray="4 8"/>
        <g id="coasterCar">
          <rect x="-18" y="-10" width="36" height="14" rx="3" fill="#ff4fa3"
                stroke="#a02060" stroke-width="1.5"/>
          <rect x="-14" y="-8" width="10" height="10" fill="#ffe040" opacity="0.5"/>
          <circle cx="-10" cy="6" r="3.5" fill="#0a1218" stroke="#5d7891" stroke-width="0.8"/>
          <circle cx="10" cy="6" r="3.5" fill="#0a1218" stroke="#5d7891" stroke-width="0.8"/>
        </g>
        <line id="carHeightLine" x1="0" y1="0" x2="0" y2="0"
              stroke="#ffb347" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/>
        <text id="carHeightLabel" x="0" y="0" font-family="ui-monospace,monospace"
              font-size="10" fill="#ffb347">h = 0 m</text>
        <text id="carSpeedLabel" x="0" y="0" font-family="ui-monospace,monospace"
              font-size="10" fill="#4fc3ff" text-anchor="middle">v = 0 m/s</text>

        <g transform="translate(60 350)">
          <text x="0" y="-6" font-family="ui-monospace,monospace" font-size="10"
                fill="#5d7891" letter-spacing="0.15em">ENERGY STORES</text>
          <rect x="0" y="0" width="600" height="48" rx="6" fill="#0a1218" stroke="#1b2b3a"/>
          <rect id="barGPE" x="2" y="2" height="44" rx="4" class="seg-gpe"/>
          <rect id="barKE"  x="2" y="2" height="44" rx="4" class="seg-ke"/>
          <rect id="barTH"  x="2" y="2" height="44" rx="4" class="seg-th"/>
        </g>
        <g transform="translate(60 420)">
          <rect x="0" y="0" width="14" height="14" rx="2" class="seg-gpe"/>
          <text x="22" y="11" font-family="ui-monospace,monospace" font-size="10"
                fill="#7e9ab3">GRAVITATIONAL POTENTIAL</text>
          <text id="valGPE" x="260" y="11" font-family="ui-monospace,monospace"
                font-size="11" font-weight="700" fill="#ffb347">0 J</text>
          <rect x="320" y="0" width="14" height="14" rx="2" class="seg-ke"/>
          <text x="342" y="11" font-family="ui-monospace,monospace" font-size="10"
                fill="#7e9ab3">KINETIC</text>
          <text id="valKE" x="580" y="11" text-anchor="end"
                font-family="ui-monospace,monospace" font-size="11" font-weight="700"
                fill="#4fc3ff">0 J</text>
          <rect x="0" y="26" width="14" height="14" rx="2" class="seg-th"/>
          <text x="22" y="37" font-family="ui-monospace,monospace" font-size="10"
                fill="#7e9ab3">THERMAL (friction)</text>
          <text id="valTH" x="260" y="37" font-family="ui-monospace,monospace"
                font-size="11" font-weight="700" fill="#ff5a4a">0 J</text>
          <text x="320" y="37" font-family="ui-monospace,monospace" font-size="10"
                fill="#7e9ab3">TOTAL</text>
          <text id="valTotal" x="580" y="37" text-anchor="end"
                font-family="ui-monospace,monospace" font-size="11" font-weight="700"
                fill="#4fe0a8">500 J</text>
        </g>
      </g>

      <!-- ═══════════════════════════════════════════════════════
           SCENE 4 — FORMULAS
           ═══════════════════════════════════════════════════════ -->
      <g id="sceneFormulas" style="display:none">
        <text x="360" y="28" text-anchor="middle" font-size="11" fill="#5d7891"
              font-family="ui-monospace,monospace" letter-spacing="0.18em">
          FORMULAS — LIVE WORKED EXAMPLE
        </text>
        <g transform="translate(80 80)">
          <line x1="0" y1="0" x2="0" y2="360" stroke="#3a5468" stroke-width="1.5"/>
          <line x1="-6" y1="0"   x2="6" y2="0"   stroke="#5d7891" stroke-width="1"/>
          <text x="-10" y="4" text-anchor="end" font-family="ui-monospace,monospace"
                font-size="9" fill="#5d7891">3 m</text>
          <line x1="-6" y1="180" x2="6" y2="180" stroke="#5d7891" stroke-width="1"/>
          <text x="-10" y="184" text-anchor="end" font-family="ui-monospace,monospace"
                font-size="9" fill="#5d7891">1.5 m</text>
          <line x1="-6" y1="360" x2="6" y2="360" stroke="#5d7891" stroke-width="1"/>
          <text x="-10" y="364" text-anchor="end" font-family="ui-monospace,monospace"
                font-size="9" fill="#5d7891">0 m</text>
          <g id="demoBall">
            <circle r="18" fill="#4fc3ff" stroke="#1e6fa8" stroke-width="1.5"/>
            <text y="4" text-anchor="middle" font-family="ui-monospace,monospace"
                  font-size="9" font-weight="700" fill="#0a1218">2kg</text>
          </g>
          <line id="demoHeightLine" x1="0" y1="0" x2="0" y2="0"
                stroke="#ffb347" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
          <text id="demoHeightText" x="0" y="0" font-family="ui-monospace,monospace"
                font-size="10" fill="#ffb347">h = 0.00 m</text>
        </g>
        <g transform="translate(360 100)">
          <rect x="0" y="0" width="320" height="90" rx="8" fill="#0a1218" stroke="#1b2b3a"/>
          <text x="14" y="24" font-family="ui-monospace,monospace" font-size="10"
                fill="#5d7891" letter-spacing="0.15em">GRAVITATIONAL POTENTIAL</text>
          <text x="14" y="52" font-family="ui-monospace,monospace" font-size="16"
                font-weight="700" fill="#ffb347">E<tspan font-size="10" dy="4">p</tspan>
            <tspan dy="-4" font-size="16"> = m g h</tspan></text>
          <text x="14" y="76" font-family="ui-monospace,monospace" font-size="12" fill="#7e9ab3">
            = <tspan id="eq1m" fill="#4fc3ff">2.00</tspan> ×
              <tspan fill="#4fc3ff">9.8</tspan> ×
              <tspan id="eq1h" fill="#ffb347">0.00</tspan> = </text>
          <text x="240" y="76" font-family="ui-monospace,monospace" font-size="12"
                font-weight="700" fill="#ffb347"><tspan id="eq1Ep">0.00</tspan> J</text>
        </g>
        <g transform="translate(360 210)">
          <rect x="0" y="0" width="320" height="90" rx="8" fill="#0a1218" stroke="#1b2b3a"/>
          <text x="14" y="24" font-family="ui-monospace,monospace" font-size="10"
                fill="#5d7891" letter-spacing="0.15em">KINETIC ENERGY</text>
          <text x="14" y="52" font-family="ui-monospace,monospace" font-size="16"
                font-weight="700" fill="#4fc3ff">E<tspan font-size="10" dy="4">k</tspan>
            <tspan dy="-4" font-size="16"> = ½ m v²</tspan></text>
          <text x="14" y="76" font-family="ui-monospace,monospace" font-size="12" fill="#7e9ab3">
            = ½ × <tspan fill="#4fc3ff">2.00</tspan> ×
              <tspan id="eq2v" fill="#4fe0a8">0.00</tspan>² = </text>
          <text x="240" y="76" font-family="ui-monospace,monospace" font-size="12"
                font-weight="700" fill="#4fc3ff"><tspan id="eq2Ek">0.00</tspan> J</text>
        </g>
        <g transform="translate(360 320)">
          <rect x="0" y="0" width="320" height="90" rx="8" fill="#0a1218" stroke="#1b2b3a"/>
          <text x="14" y="24" font-family="ui-monospace,monospace" font-size="10"
                fill="#5d7891" letter-spacing="0.15em">WORK DONE / POWER</text>
          <text x="14" y="52" font-family="ui-monospace,monospace" font-size="14"
                font-weight="700" fill="#c07aff">W = F s    P = W / t</text>
          <text x="14" y="76" font-family="ui-monospace,monospace" font-size="12" fill="#7e9ab3">
            <tspan id="eq3w">W = 0.00</tspan> J ·

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   1. TIMELINE ENGINE
   ══════════════════════════════════════════════════════════════ */
let clock = 0;

class Timeline {
  constructor(name, dur, mode = 'loop', opts = {}) {
    this.name = name; this.dur = dur; this.mode = mode;
    this.t = opts.offset || 0; this.dir = 1; this.speed = 1;
    this.active = false; this.w = 0; this.wTarget = 0;
    this.manual = false; this.weightTarget = 0;
    this.events = opts.events || []; this.onDone = null;
  }
  get p() { return this.dur ? Math.min(1, Math.max(0, this.t / this.dur)) : 0; }
  start() {
    if (this.mode === 'oneshot') this.t = 0;
    this.active = true;
    if (!this.manual) this.wTarget = 1;
  }
  stop() { this.active = false; if (!this.manual) this.wTarget = 0; }
  tick(dt) {
    const target = this.manual ? this.weightTarget : (this.active ? 1 : 0);
    this.wTarget = target;
    this.w += (target - this.w) * Math.min(1, dt * 9);
    if (!this.active) return;
    const prev = this.t;
    this.t += dt * this.speed * this.dir;
    if (this.mode === 'loop') {
      if (this.t >= this.dur) { this.t -= this.dur; this._events(prev, this.t, true); }
      else this._events(prev, this.t, false);
    } else {
      if (this.t >= this.dur) {
        this.t = this.dur; this._events(prev, this.dur, false);
        this.active = false; this.wTarget = 0;
        if (this.onDone) this.onDone(this);
      } else this._events(prev, this.t, false);
    }
  }
  _events(p0, p1, wrapped) {
    if (!this.events.length) return;
    const a = p0 / this.dur, b = p1 / this.dur;
    for (const e of this.events) {
      const hit = wrapped ? (e.at > a || e.at <= b) : (e.at > a && e.at <= b);
      if (hit) fireEvent(e.name, this.name);
    }
  }
}

const T = {};
function reg(name, dur, mode, opts) { T[name] = new Timeline(name, dur, mode, opts || {}); }

reg('Intro_Cycle',     6.0, 'loop');
reg('Store_Pulse',     1.2, 'loop');
reg('Transfer_Roll',   8.0, 'loop');
reg('Formula_Cycle',   6.0, 'loop');
reg('Conversion_Cycle',3.0, 'loop');
reg('Resource_Build',  1.0, 'loop');
reg('Grid_Flow',       1.5, 'loop');
reg('Quiz_Show',       0.8, 'oneshot');
reg('Reveal_Next',     0.4, 'oneshot');
reg('Check_Answer',    0.6, 'oneshot');
reg('Global_Reset',    0.4, 'oneshot');

/* ══════════════════════════════════════════════════════════════
   2. STATE MACHINE
   ══════════════════════════════════════════════════════════════ */
const STATES = {
  Scene_Intro:       { scene:'sceneIntro',       primary:'Intro_Cycle' },
  Scene_Stores:      { scene:'sceneStores',      primary:'Store_Pulse' },
  Scene_Transfers:   { scene:'sceneTransfers',   primary:'Transfer_Roll' },
  Scene_Formulas:    { scene:'sceneFormulas',    primary:'Formula_Cycle' },
  Scene_Conversions: { scene:'sceneConversions', primary:'Conversion_Cycle' },
  Scene_Resources:   { scene:'sceneResources',   primary:'Resource_Build' },
  Scene_Quiz:        { scene:'sceneQuiz',        primary:'Quiz_Show' },
};
let state = 'Scene_Intro';
let stateChangeTime = -10;

function setState(name) {
  if (!STATES[name] || state === name) return;
  const prev = STATES[state];
  if (prev && prev.primary) T[prev.primary].stop();
  for (const k in STATES) {
    const el = document.getElementById(STATES[k].scene);
    if (el) el.style.display = 'none';
  }
  state = name;
  const next = STATES[name];
  const el = document.getElementById(next.scene);
  if (el) el.style.display = '';
  if (next.primary) T[next.primary].start();
  stateChangeTime = clock;
  syncUI();
}

/* ══════════════════════════════════════════════════════════════
   3. MODEL
   ══════════════════════════════════════════════════════════════ */
const G = 9.8;
const MODEL = {
  mass: 2.0, height: 0, velocity: 0,
  maxHeight: 3.0, thermalLoss: 0, efficiency: 40,
};
let speedMult = 1.0;
let paused = false;
const FOCUS = { store: 'kinetic', device: 'mic' };

/* ══════════════════════════════════════════════════════════════
   4. SVG HELPERS
   ══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function svgText(str, attrs) {
  const el = svgEl('text', attrs);
  el.textContent = str;
  return el;
}

/* ══════════════════════════════════════════════════════════════
   5. STORES  (9 stores, 3×3 layout)
   ══════════════════════════════════════════════════════════════ */
const STORES = [
  { id:'kinetic',       label:'KINETIC',       col:'#4fc3ff' },
  { id:'gpe',           label:'G.P.E',         col:'#ffb347' },
  { id:'elastic',       label:'ELASTIC',       col:'#4fe0a8' },
  { id:'thermal',       label:'THERMAL',       col:'#ff5a4a' },
  { id:'chemical',      label:'CHEMICAL',      col:'#58cc02' },
  { id:'nuclear',       label:'NUCLEAR',       col:'#c07aff' },
  { id:'magnetic',      label:'MAGNETIC',      col:'#ff7ea8' },
  { id:'electrostatic', label:'ELECTROSTATIC', col:'#ffe040' },
  { id:'sound',         label:'SOUND',         col:'#7a9ed8' },
];

function buildStoresScene() {
  const g = $('sceneStores');
  g.innerHTML = '';
  const cols = 3;
  const tileW = 186, tileH = 137, gapX = 20, gapY = 14;
  const totalW = cols*tileW + (cols-1)*gapX;
  const x0 = (720 - totalW)/2;
  const y0 = 70;

  STORES.forEach((s, i) => {
    const cx = x0 + (i%cols)*(tileW+gapX);
    const cy = y0 + Math.floor(i/cols)*(tileH+gapY);
    const tile = svgEl('g', {
      class: 'storeTile',
      'data-store': s.id,
      transform: `translate(${cx} ${cy})`
    });

    const bg = svgEl('rect', {
      width: tileW, height: tileH, rx: 10,
      fill: '#0a1218', stroke: '#1b2b3a', 'stroke-width': 1.5
    });
    bg.dataset.bg = '1';
    tile.appendChild(bg);

    const icon = svgEl('g', {
      transform: `translate(${tileW/2} ${tileH/2 - 12})`
    });
    icon.classList.add('storeIcon');
    icon.dataset.icon = s.id;
    tile.appendChild(icon);

    const lab = svgText(s.label, {
      x: tileW/2, y: tileH - 18, 'text-anchor':'middle',
      'font-family':'ui-monospace,monospace', 'font-size':'10',
      'letter-spacing':'0.14em', fill: s.col, 'font-weight':'700'
    });
    tile.appendChild(lab);

    g.appendChild(tile);
    buildStoreIcon(icon, s.id, s.col);
  });
}

function buildStoreIcon(parent, id, col) {
  parent.innerHTML = '';
  const mk = (tag, attrs) => svgEl(tag, attrs);

  if (id === 'kinetic') {
    parent.appendChild(mk('line', { x1:-24, y1:20, x2:24, y2:20,
      stroke:'#3a5468', 'stroke-width':1.5, 'stroke-linecap':'round' }));
    const ball = mk('circle', { r:9, fill:col, stroke:'#1e6fa8', 'stroke-width':1.4 });
    ball.classList.add('ballRoll');
    parent.appendChild(ball);
  }

  if (id === 'gpe') {
    parent.appendChild(mk('line', { x1:-26, y1:16, x2:26, y2:16,
      stroke:'#8a4a10', 'stroke-width':2.5, 'stroke-linecap':'round' }));
    const ball = mk('circle', { cx:0, cy:-2, r:11, fill:col, stroke:'#8a4a10', 'stroke-width':1.4 });
    ball.classList.add('ballBob');
    parent.appendChild(ball);
  }

  if (id === 'elastic') {
    parent.appendChild(mk('rect', { x:-4, y:-24, width:8, height:5, fill:'#3a5468' }));
    const spring = mk('path', {
      d:'M 0 -19 L -8 -15 L 8 -11 L -8 -7 L 8 -3 L -8 1 L 8 5 L -8 9 L 0 13',
      fill:'none', stroke:col, 'stroke-width':2, 'stroke-linecap':'round',
      'stroke-linejoin':'round'
    });
    spring.classList.add('springStretch');
    parent.appendChild(spring);
    parent.appendChild(mk('circle', { cx:0, cy:16, r:7, fill:'#2b3d4f', stroke:col, 'stroke-width':1.2 }));
  }

  if (id === 'thermal') {
    parent.appendChild(mk('path', {
      d:'M -18 -6 L -15 18 L 15 18 L 18 -6 Z',
      fill:'#3a1a1a', stroke:col, 'stroke-width':1.5, 'stroke-linejoin':'round'
    }));
    parent.appendChild(mk('line', { x1:-20, y1:-6, x2:20, y2:-6, stroke:col, 'stroke-width':2 }));
    for (let i = 0; i < 3; i++) {
      const path = mk('path', {
        d:`M ${-6 + i*6} -12 Q ${-8 + i*6} -18 ${-6 + i*6} -24`,
        fill:'none', stroke:'#ff8c40', 'stroke-width':1.4,
        'stroke-linecap':'round', opacity:0
      });
      path.classList.add('steam');
      path.dataset.idx = i;
      parent.appendChild(path);
    }
  }

  if (id === 'chemical') {
    parent.appendChild(mk('rect', { x:-24, y:-12, width:48, height:24, rx:3,
      fill:'#1a2a1a', stroke:col, 'stroke-width':1.5 }));
    parent.appendChild(mk('rect', { x:-8, y:-16, width:5, height:4, fill:col }));
    parent.appendChild(mk('rect', { x:3,  y:-16, width:5, height:4, fill:col }));
    const p = svgText('+', { x:-12, y:4, 'text-anchor':'middle',
      'font-family':'ui-monospace,monospace', 'font-size':11, 'font-weight':700, fill:col });
    p.classList.add('pulseText');
    parent.appendChild(p);
    const m = svgText('−', { x:12, y:4, 'text-anchor':'middle',
      'font-family':'ui-monospace,monospace', 'font-size':11, 'font-weight':700, fill:col });
    m.classList.add('pulseText');
    parent.appendChild(m);
  }

  if (id === 'nuclear') {
    parent.appendChild(mk('circle', { r:6, fill:col, stroke:'#5a1a8a', 'stroke-width':1.4 }));
    for (let i = 0; i < 3; i++) {
      parent.appendChild(mk('ellipse', {
        rx:20, ry:8, fill:'none', stroke:col, 'stroke-width':1.2,
        opacity:0.5, transform:`rotate(${i*60})`
      }));
      const e = mk('circle', { r:3, fill:col, 'stroke':'#0a1218', 'stroke-width':0.8 });
      e.classList.add('orbitElectron');
      e.dataset.idx = i;
      parent.appendChild(e);
    }
  }

  if (id === 'magnetic') {
    parent.appendChild(mk('rect', { x:-24, y:-14, width:24, height:28, rx:2, fill:'#c04040' }));
    parent.appendChild(mk('rect', { x:0,   y:-14, width:24, height:28, rx:2, fill:'#4060c0' }));
    parent.appendChild(svgText('N', { x:-12, y:4, 'text-anchor':'middle',
      'font-family':'ui-monospace,monospace', 'font-size':11, 'font-weight':700, fill:'#ffffff' }));
    parent.appendChild(svgText('S', { x:12, y:4, 'text-anchor':'middle',
      'font-family':'ui-monospace,monospace', 'font-size':11, 'font-weight':700, fill:'#ffffff' }));
    for (let i = 0; i < 3; i++) {
      const path = mk('path', {
        d:`M ${20 + i*3} -16 Q ${40 + i*3} -24 ${52 + i*3} -8 Q ${58 + i*3} 8 ${40 + i*3} 16`,
        fill:'none', stroke:col, 'stroke-width':1.2, opacity:0.5
      });
      path.classList.add('fieldLine');
      path.dataset.idx = i;
      parent.appendChild(path);
    }

const INTRO_POS = [];
{
  const cx = 360, cy = 270, R = 185;
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI/2 + i * (Math.PI * 2 / 6);
    INTRO_POS.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R });
  }
  document.querySelectorAll('.introIcon').forEach((g, i) => {
    g.setAttribute('transform',
      `translate(${INTRO_POS[i].x.toFixed(1)} ${INTRO_POS[i].y.toFixed(1)})`);
  });
}
function introParticlePosition(p) {
  p = (p % 1 + 1) % 1;
  const n = INTRO_POS.length;
  const s = p * n;
  const i0 = Math.floor(s) % n;
  const i1 = (i0 + 1) % n;
  const u = s - Math.floor(s);
  const a = INTRO_POS[i0], b = INTRO_POS[i1];
  const cx = 360, cy = 270;
  const ue = u * u * (3 - 2 * u);
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const ctrlX = (mx + cx) / 2, ctrlY = (my + cy) / 2;
  const x = (1-ue)*(1-ue)*a.x + 2*(1-ue)*ue*ctrlX + ue*ue*b.x;
  const y = (1-ue)*(1-ue)*a.y + 2*(1-ue)*ue*ctrlY + ue*ue*b.y;
  return { x, y };
}

  for (let i = 1; i < TRACK_PTS.length; i++) {
    const a = TRACK_PTS[i-1], b = TRACK_PTS[i];
    simple += ` C ${a.x + (b.x-a.x)/3} ${a.y} ${a.x + (b.x-a.x)*2/3} ${b.y} ${b.x} ${b.y}`;
  }
  $('coasterTrack').setAttribute('d', simple);
  $('coasterRail').setAttribute('d', simple);
}
buildCoasterTrack();

function sampleTrackPath() {
  const samples = [], N = 400;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const idx = t * (TRACK_PTS.length - 1);
    const i0 = Math.min(Math.floor(idx), TRACK_PTS.length - 2);
    const u = idx - i0;
    const a = TRACK_PTS[i0], b = TRACK_PTS[i0 + 1];
    const ue = u * u * (3 - 2 * u);
    samples.push({ x: a.x + (b.x - a.x) * ue, y: a.y + (b.y - a.y) * ue });
  }
  return samples;
}
const TRACK_SAMPLES = sampleTrackPath();
function trackAt(p) {
  p = Math.max(0, Math.min(1, p));
  const f = p * (TRACK_SAMPLES.length - 1);
  const i0 = Math.floor(f);
  const i1 = Math.min(i0 + 1, TRACK_SAMPLES.length - 1);
  const u = f - i0;
  const a = TRACK_SAMPLES[i0], b = TRACK_SAMPLES[i1];
  return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
}

   12. RENDER
   ══════════════════════════════════════════════════════════════ */
function applyRig() {
  const t = clock;

  /* ============ INTRO ============ */
  if (state === 'Scene_Intro') {
    const tl = T['Intro_Cycle'];
    const pp = introParticlePosition(tl.p);
    const introParticle = $('introParticle');
    introParticle.setAttribute('transform',
      `translate(${pp.x.toFixed(1)} ${pp.y.toFixed(1)})`);
    let minDist = 1e9, minI = 0;
    INTRO_POS.forEach((p, i) => {
      const d = Math.hypot(p.x - pp.x, p.y - pp.y);
      if (d < minDist) { minDist = d; minI = i; }
    });
    document.querySelectorAll('.introIcon').forEach((g, i) => {
      const near = i === minI && minDist < 60;
      const s = near ? 1.15 : 1.0;
      g.setAttribute('transform',
        `translate(${INTRO_POS[i].x.toFixed(1)} ${INTRO_POS[i].y.toFixed(1)}) scale(${s.toFixed(3)})`);
      g.style.filter = near ? 'drop-shadow(0 0 8px #4fc3ff)' : '';
    });
  }

  /* ============ STORES ============ */
  if (state === 'Scene_Stores') {
    const sp = T['Store_Pulse'].p;
    document.querySelectorAll('.storeTile').forEach(tile => {
      const id = tile.dataset.store;
      const focused = id === FOCUS.store;
      const bg = tile.querySelector('rect');
      if (bg) {
        bg.setAttribute('stroke', focused ? '#4fc3ff' : '#1b2b3a');
        bg.setAttribute('stroke-width', focused ? 2 : 1.5);
      }
      tile.style.filter = focused
        ? `drop-shadow(0 0 ${6 + 6*Math.sin(sp*Math.PI*2)}px rgba(79,195,255,0.6))`
        : '';
    });

    const kr = document.querySelector('.ballRoll');
    if (kr) kr.setAttribute('cx', (Math.sin(t * 1.6) * 22).toFixed(1));

    const gb = document.querySelector('.ballBob');
    if (gb) gb.setAttribute('cy', (-2 + Math.sin(t * 2.2) * 2).toFixed(1));

    const sp2 = document.querySelector('.springStretch');
    if (sp2) {
      const stretch = 1 + 0.15 * Math.sin(t * 3);
      sp2.setAttribute('transform', `scale(1 ${stretch.toFixed(3)})`);
    }

    document.querySelectorAll('.steam').forEach((el, i) => {
      const phase = (t * 0.8 + i * 0.33) % 1;
      const rise = phase * 20;
      const opacity = Math.sin(phase * Math.PI) * 0.7;
      const xoff = Math.sin(phase * Math.PI * 3 + i) * 2;
      const x0 = -6 + i*6 + xoff;
      el.setAttribute('d', `M ${x0} -12 Q ${x0 - 2} ${-18 - rise/2} ${x0} ${-24 - rise}`);
      el.setAttribute('opacity', opacity.toFixed(2));
    });

    document.querySelectorAll('.pulseText').forEach((el, i) => {
      el.setAttribute('opacity', (0.6 + 0.4 * Math.sin(t * 4 + i * Math.PI)).toFixed(2));
    });

    document.querySelectorAll('.orbitElectron').forEach((el, i) => {
      const angle = t * 1.5 + i * (Math.PI * 2 / 3);
      const rx = 20, ry = 8;
      const rot = i * 60 * Math.PI / 180;
      const ex = rx * Math.cos(angle), ey = ry * Math.sin(angle);
      const fx = ex * Math.cos(rot) - ey * Math.sin(rot);
      const fy = ex * Math.sin(rot) + ey * Math.cos(rot);
      el.setAttribute('cx', fx.toFixed(1));
      el.setAttribute('cy', fy.toFixed(1));
    });

    document.querySelectorAll('.fieldLine').forEach((el, i) => {
      const dash = Math.max(0, (t * 20 + i * 6) % 12);
      el.setAttribute('stroke-dasharray', `${dash} ${12 - dash}`);
    });

    const spark = document.querySelector('.spark');
    if (spark) {
      const cycle = (t * 2) % 1;
      const intensity = cycle < 0.15 ? Math.sin(cycle / 0.15 * Math.PI) : 0;
      spark.setAttribute('opacity', intensity.toFixed(2));
    }
    document.querySelectorAll('.balloonFloat').forEach((el, i) => {
      const dy = Math.sin(t * 1.8 + i * Math.PI) * 2;
      if (!el.dataset.baseCy) el.dataset.baseCy = el.getAttribute('cy');
      el.setAttribute('cy', (parseFloat(el.dataset.baseCy) + dy).toFixed(1));
    });

    // ── Sound waves pulsing outward ──
    document.querySelectorAll('.soundWave').forEach((el, i) => {
      const phase = (t * 1.6 - i * 0.25) % 1;
      const w = (phase + 1) % 1;
      const amp = 4 + i * 3;
      const baseX = 14 + i * 5;
      const scale = 0.85 + 0.3 * w;
      el.setAttribute('d',
        `M ${baseX} ${(-6 - i*2) * scale} Q ${baseX + 7 * scale} 0 ${baseX} ${(6 + i*2) * scale}`);
      el.setAttribute('opacity', (0.3 + 0.5 * (1 - w)).toFixed(2));
    });
  }

  /* ============ TRANSFERS ============ */
  if (state === 'Scene_Transfers') {
    const tl = T['Transfer_Roll'];
    const car = trackAt(tl.p);
    $('coasterCar').setAttribute('transform',
      `translate(${car.x.toFixed(1)} ${car.y.toFixed(1)})`);

    const h = (400 - car.y);
    const hMeters = h / 100 * 1.5;
    const chl = $('carHeightLine');
    chl.setAttribute('x1', (car.x - 4).toFixed(1));
    chl.setAttribute('y1', car.y.toFixed(1));
    chl.setAttribute('x2', (car.x - 4).toFixed(1));
    chl.setAttribute('y2', 400);
    const chlab = $('carHeightLabel');
    chlab.setAttribute('x', (car.x - 8).toFixed(1));
    chlab.setAttribute('y', ((car.y + 400) / 2).toFixed(1));
    chlab.textContent = 'h = ' + hMeters.toFixed(2) + ' m';

    const speed = 0.8 + Math.sin(tl.p * Math.PI * 2) * 0.6 + 0.6;
    const v = Math.max(0, speed * 6);
    const sl = $('carSpeedLabel');
    sl.setAttribute('x', car.x.toFixed(1));
    sl.setAttribute('y', (car.y - 26).toFixed(1));
    sl.textContent = 'v = ' + v.toFixed(1) + ' m/s';

    const totalE = 500;
    const gpeFrac = Math.max(0, Math.min(1, (h - 20) / 260));
    const thFrac = Math.min(0.18, tl.p * 0.18);
    const keFrac = Math.max(0, 1 - gpeFrac - thFrac);
    const scaleW = 596;

    $('barGPE').setAttribute('width', (gpeFrac * scaleW).toFixed(1));
    $('barKE').setAttribute('x', (2 + gpeFrac * scaleW).toFixed(1));
    $('barKE').setAttribute('width', (keFrac * scaleW).toFixed(1));
    $('barTH').setAttribute('x', (2 + (gpeFrac + keFrac) * scaleW).toFixed(1));
    $('barTH').setAttribute('width', (thFrac * scaleW).toFixed(1));

    $('valGPE').textContent = (gpeFrac * totalE).toFixed(0) + ' J';
    $('valKE').textContent  = (keFrac * totalE).toFixed(0) + ' J';
    $('valTH').textContent  = (thFrac * totalE).toFixed(0) + ' J';

    $('meterGPE').style.width = (gpeFrac * 100).toFixed(1) + '%';
    $('meterKE').style.width  = (keFrac * 100).toFixed(1) + '%';
    $('meterTH').style.width  = (thFrac * 100).toFixed(1) + '%';
    $('meterVal').textContent = totalE + ' J';
    $('blendGPE').textContent = (gpeFrac * 100).toFixed(1);
    $('blendKE').textContent  = (keFrac * 100).toFixed(1);
    $('blendTH').textContent  = (thFrac * 100).toFixed(1);

    MODEL.height = hMeters;
    MODEL.velocity = v;
  }

  /* ============ FORMULAS ============ */
  if (state === 'Scene_Formulas') {
    const tl = T['Formula_Cycle'];
    let h;
    const p = tl.p;
    if (p < 0.5) h = (p / 0.5) * MODEL.maxHeight;
    else h = MODEL.maxHeight * (1 - (p - 0.5) / 0.5);
    MODEL.height = h;
    MODEL.velocity = Math.sqrt(Math.max(0, 2 * G * (MODEL.maxHeight - h)));

    const ballX = 80;
    const ballY = 80 + 360 - (h / MODEL.maxHeight) * 360;
    $('demoBall').setAttribute('transform',
      `translate(${ballX.toFixed(1)} ${ballY.toFixed(1)})`);

    const dhl = $('demoHeightLine');
    dhl.setAttribute('x1', (ballX + 20).toFixed(1));
    dhl.setAttribute('y1', ballY.toFixed(1));
    dhl.setAttribute('x2', (ballX + 20).toFixed(1));
    dhl.setAttribute('y2', 440);
    const dht = $('demoHeightText');
    dht.setAttribute('x', (ballX + 26).toFixed(1));
    dht.setAttribute('y', ((ballY + 440) / 2).toFixed(1));
    dht.textContent = 'h = ' + h.toFixed(2) + ' m';

    const m = MODEL.mass;
    const Ep = m * G * h;
    const Ek = 0.5 * m * MODEL.velocity * MODEL.velocity;
    $('eq1m').textContent = m.toFixed(2);
    $('eq1h').textContent = h.toFixed(2);
    $('eq1Ep').textContent = Ep.toFixed(2);
    $('eq2v').textContent = MODEL.velocity.toFixed(2);
    $('eq2Ek').textContent = Ek.toFixed(2);

    const work = m * G * MODEL.maxHeight;
    const power = work / 3;
    $('eq3w').textContent = 'W = ' + work.toFixed(2);
    $('eq3p').textContent = 'P = ' + power.toFixed(2);

    const eff = MODEL.efficiency;
    $('effBar').setAttribute('width', (eff / 100 * 558).toFixed(1));
    $('effVal').textContent = eff + ' %';

    const maxE = m * G * MODEL.maxHeight;
    $('meterGPE').style.width = (Ep / maxE * 100).toFixed(1) + '%';
    $('meterKE').style.width  = (Ek / maxE * 100).toFixed(1) + '%';
    $('meterTH').style.width  = '0%';
    $('meterVal').textContent = (Ep + Ek).toFixed(1) + ' J';
    $('blendGPE').textContent = Ep.toFixed(1);
    $('blendKE').textContent  = Ek.toFixed(1);
    $('blendTH').textContent  = '0.0';
  }

  /* ============ CONVERSIONS  (NEW) ============ */
  if (state === 'Scene_Conversions') {
    const tl = T['Conversion_Cycle'];

    document.querySelectorAll('.convCard').forEach(card => {
      const id = card.dataset.conv;
      const focused = id === FOCUS.device;
      const bg = card.querySelector('rect');
      if (bg) {
        bg.setAttribute('stroke', focused ? '#4fc3ff' : '#1b2b3a');
        bg.setAttribute('stroke-width', focused ? 2 : 1.4);
      }
      card.style.filter = focused
        ? `drop-shadow(0 0 ${8 + 6*Math.sin(t*4)}px rgba(79,195,255,0.55))`
        : '';
    });

    // Animated dashes on the two arrows (flowing in → direction)
    document.querySelectorAll('.convArrow').forEach((el, i) => {
      const phase = (t * 40 + i * 7) % 16;
      el.setAttribute('stroke-dashoffset', (-phase).toFixed(1));
    });

    // Energy icon gentle pulse
    document.querySelectorAll('[data-role="in"], [data-role="out"]').forEach((el, i) => {
      const pulse = 1 + 0.06 * Math.sin(t * 3 + i * 0.8);
      const base = el.dataset.role === 'in' ? 'translate(35 52)' : 'translate(185 52)';
      el.setAttribute('transform', `${base} scale(${pulse.toFixed(3)})`);
    });

    // Motor / Dynamo rotors spinning
    document.querySelectorAll('.motorRotor').forEach((el, i) => {
      const spin = t * 240 + i * 40;
      el.setAttribute('transform', `rotate(${spin.toFixed(1)})`);
    });

    // Battery bubbles rising
    document.querySelectorAll('.batteryBubble').forEach((el, i) => {
      const phase = (t * 0.9 + i * 0.33) % 1;
      const y = 8 - phase * 20;
      const opacity = Math.sin(phase * Math.PI) * 0.85;
      el.setAttribute('cx', (-6 + i * 6).toFixed(1));
      el.setAttribute('cy', y.toFixed(1));
      el.setAttribute('opacity', opacity.toFixed(2));
    });

    // Piezo flex
    const piezoCard = document.querySelector('[data-conv="piezo"]');
    if (piezoCard) {
      const pg = piezoCard.querySelector('[data-role="device"]');
      const flex = 1 + 0.08 * Math.sin(t * 6);
      pg.setAttribute('transform', `translate(112 52) scale(${flex.toFixed(3)})`);
    }

    // Solar cell shine
    const solarCard = document.querySelector('[data-conv="solar"]');
    if (solarCard) {
      const shine = 0.7 + 0.3 * Math.sin(t * 2.2);
      const sg = solarCard.querySelector('[data-role="device"]');
      sg.style.filter = `drop-shadow(0 0 ${6 * shine}px rgba(255,224,64,${shine.toFixed(2)}))`;
    }

    // LED glow
    const ledCard = document.querySelector('[data-conv="led"]');
    if (ledCard) {
      const glow = 0.6 + 0.4 * Math.sin(t * 3.5);
      const lg = ledCard.querySelector('[data-role="device"]');
      lg.style.filter = `drop-shadow(0 0 ${9 * glow}px rgba(255,224,64,${glow.toFixed(2)}))`;
    }
  }

  /* ============ RESOURCES ============ */
  if (state === 'Scene_Resources') {
    const tl = T['Resource_Build'];
    document.querySelectorAll('.renewItem').forEach((el, i) => {
      const revealAt = 0.1 + i * 0.13;
      const w = Math.max(0, Math.min(1, (tl.p - revealAt) * 6));

      el.setAttribute('transform',
        `translate(${(-20 * (1-w)).toFixed(1)} ${52 + i*30})`);
    });
    document.querySelectorAll('.nonRenewItem').forEach((el, i) => {
      const revealAt = 0.1 + i * 0.13;

      el.style.opacity = w;
      el.setAttribute('transform',
        `translate(${(20 * (1-w)).toFixed(1)} ${52 + i*30})`);
    });
    document.querySelectorAll('.gridDash').forEach((el, i) => {
      const seg = (i / 12 + t * 0.4) % 1;
      if (seg < 0.5) {
        el.setAttribute('cx', (130 + (seg/0.5) * 160).toFixed(1));
        el.setAttribute('cy', '72');
      } else {
        el.setAttribute('cx', (350 + ((seg-0.5)/0.5) * 180).toFixed(1));
        el.setAttribute('cy', '72');
      }
      el.setAttribute('opacity', '0.9');

  }

  /* ============ QUIZ ============ */
  if (state === 'Scene_Quiz') {
    const tl = T['Quiz_Show'];
    const slide = (1 - tl.w) * 20;
    $('quizCard').setAttribute('transform', `translate(${slide.toFixed(1)} 0)`);
    $('quizCard').style.opacity = tl.w;
    document.querySelectorAll('.quizOpt').forEach((el, i) => {
      const sp = (1 - tl.w) * 20 + (i % 2 === 0 ? -1 : 1) * (1 - tl.w) * 10;
      el.setAttribute('transform', `translate(${sp.toFixed(1)} 0)`);
      el.style.opacity = Math.max(0, Math.min(1, tl.w));
      const baseTransform = el.dataset.baseTransform;
      if (!baseTransform) {
        const r = el.getBoundingClientRect();
        // store nothing — recompute from data on first pass
      }
    });
  }

  /* state-change flash */
  const dt = clock - stateChangeTime;
  if (dt >= 0 && dt < 0.4) {
    const a = Math.max(0, 1 - dt / 0.4);
    $('stateFlash').setAttribute('r', (240 * a).toFixed(1));
    $('stateFlash').setAttribute('opacity', (a * 0.7).toFixed(2));
  } else {
    $('stateFlash').setAttribute('opacity', 0);
  }
}

      kinetic: 'car, runner, falling ball',

      elastic: 'bow, trampoline, stretched spring',
      thermal: 'hot water, warm engine',
      chemical: 'battery, food, fuel',
      nuclear: 'power station, sun',
      magnetic: 'magnet, motor',
      electrostatic: 'charged balloon, static shock',
      sound: 'loudspeaker, vibrating string, thunder',
    };
    $('focusStatus').innerHTML =
      `<span class="tag vi">${s.label}</span><span class="tag cy">${examples[s.id]}</span>`;

$('fMass').oninput = (e) => {
  MODEL.mass = +e.target.value / 10;
  $('vMass').textContent = MODEL.mass.toFixed(1);
  $('rMass').textContent = MODEL.mass.toFixed(2) + ' kg';
};
$('fSpeed').oninput = (e) => {
  speedMult = +e.target.value / 100;
  $('vSpeed').textContent = e.target.value;
};

document.querySelectorAll('[data-fire]').forEach(b => {
  b.onclick = () => {
    const name = b.dataset.fire;
    if (name === 'Reveal_Next') {
      if (state === 'Scene_Quiz') {
        quizIndex = (quizIndex + 1) % QUIZ.length;
        buildQuizOptions();
        T['Reveal_Next'].start();
        logs.unshift({ t: clock, name: 'next-question', tl: 'quiz' });
      } else {
        const order = ['Scene_Intro','Scene_Stores','Scene_Transfers','Scene_Formulas',
                       'Scene_Conversions','Scene_Resources','Scene_Quiz'];
        const i = order.indexOf(state);
        setState(order[(i + 1) % order.length]);
        return;
      }
    } else if (name === 'Check_Answer') {
      if (state === 'Scene_Quiz') checkQuizAnswer();
      else T['Check_Answer'].start();
    } else {
      T[name].start();
    }
    if (logs.length > 40) logs.pop();
    renderLog();
  };
});

function checkQuizAnswer() {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = QUIZ[quizIndex];
  document.querySelectorAll('.quizOpt').forEach((el, i) => {
    const bg = el.querySelector('rect');
    if (i === q.ans) {
      bg.setAttribute('stroke', '#4fe0a8');
      bg.setAttribute('stroke-width', '2.5');
      bg.setAttribute('fill', '#0d2a1e');
    } else {
      bg.setAttribute('fill', '#0a1218');
      bg.setAttribute('stroke', '#2a1a1a');
    }
  });
  $('quizChip').innerHTML = 'quiz <b>' + (quizIndex+1) + '/' + QUIZ.length + '</b> ✓';
  T['Check_Answer'].start();
  logs.unshift({ t: clock, name: 'answer=' + String.fromCharCode(65+q.ans), tl: 'quiz' });
  if (logs.length > 40) logs.pop();
  renderLog();
}

$('btnReset').onclick = () => {
  for (const k in T) T[k].stop();
  T['Global_Reset'].start();
  MODEL.mass = 2.0; MODEL.height = 0; MODEL.velocity = 0;
  speedMult = 1.0; paused = false;
  $('fMass').value = 20; $('vMass').textContent = '2.0';
  $('fSpeed').value = 100; $('vSpeed').textContent = '100';
  $('rMass').textContent = '2.00 kg';
  quizIndex = 0;
  buildQuizOptions();
  setState('Scene_Intro');
  renderLog();
};

/* ══════════════════════════════════════════════════════════════
   15. TIMELINE INSPECTOR
   ══════════════════════════════════════════════════════════════ */
const GROUPS = [
  { title: 'Scenes', items: ['Intro_Cycle','Store_Pulse','Transfer_Roll','Formula_Cycle',
                              'Conversion_Cycle','Resource_Build','Grid_Flow','Quiz_Show'] },
  { title: 'Actions', items: ['Reveal_Next','Check_Answer'] },
  { title: 'Global', items: ['Global_Reset'] },
];
const rows = {};
const inspEl = $('inspector');
GROUPS.forEach(g => {
  const h = document.createElement('div');
  h.style.cssText = 'font-size:9.5px;letter-spacing:.14em;color:#31485b;margin:9px 0 3px;text-transform:uppercase';
  h.textContent = g.title;
  inspEl.appendChild(h);
  g.items.forEach(name => {
    const tl = T[name];
    if (!tl) return;
    const row = document.createElement('div');
    row.className = 'tlrow ' + (tl.mode === 'oneshot' ? 'one' : '');
    row.innerHTML = `<span class="nm">${name}</span>
                     <span class="bar"><i></i></span>
                     <span class="spd">1.00×</span>`;
    inspEl.appendChild(row);
    rows[name] = { el: row, bar: row.querySelector('i'), spd: row.querySelector('.spd') };
  });
});
$('tlCount').textContent = Object.keys(T).length + ' timelines';

/* ══════════════════════════════════════════════════════════════
   16. SIDE READOUTS + STATUS
   ══════════════════════════════════════════════════════════════ */
function updateSideReadouts() {
  if (state === 'Scene_Transfers' || state === 'Scene_Formulas') {
    $('rHeight').textContent = MODEL.height.toFixed(2) + ' m';
    $('rVel').textContent    = MODEL.velocity.toFixed(2) + ' m/s';
    const Ep = MODEL.mass * G * MODEL.height;
    const Ek = 0.5 * MODEL.mass * MODEL.velocity * MODEL.velocity;
    $('rEp').textContent = Ep.toFixed(2) + ' J';
    $('rEk').textContent = Ek.toFixed(2) + ' J';
    $('energyChip').innerHTML = 'E <b>' + (Ep + Ek).toFixed(1) + ' J</b>';
  } else {
    $('rHeight').textContent = '—';
    $('rVel').textContent = '—';
    $('rEp').textContent = '—';
    $('rEk').textContent = '—';
    $('energyChip').innerHTML = 'E <b>0 J</b>';
  }
}

function updateStatus() {
  for (const name in rows) {
    const tl = T[name], r = rows[name];
    r.bar.style.width = (tl.p * 100).toFixed(1) + '%';
    r.el.classList.toggle('on', tl.w > 0.05);
    r.el.style.opacity = (0.28 + 0.72 * tl.w).toFixed(2);
    r.spd.textContent = tl.speed.toFixed(2) + '×';
  }
}

/* ══════════════════════════════════════════════════════════════
   17. MAIN LOOP
   ══════════════════════════════════════════════════════════════ */
let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsT = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.05);
  update(dt);
  applyRig();
  updateSideReadouts();
  updateStatus();
  fpsAcc += dt; fpsN++; fpsT += dt;
  if (fpsT > 0.5) {
    $('fpsChip').textContent = Math.round(fpsN / fpsAcc) + ' fps';
    fpsAcc = 0; fpsN = 0; fpsT = 0;
  }
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════
   18. BOOT
   ══════════════════════════════════════════════════════════════ */
setState('Scene_Intro');
buildFocusGrid();
updateFocusStatus();
syncUI();
renderLog();
requestAnimationFrame(frame);
</script>
</body>
</html>
