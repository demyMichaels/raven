<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Physics by Charge — 30 Animated Quantities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FFFFFF; --ink:#3C3C3C; --ink-soft:#777777; --muted:#AFAFAF; --line:#E5E5E5;
      --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8; --green-t:#4B8B00;
      --blue:#1CB0F6; --blue-d:#0B7BB0; --blue-l:#DDF4FF;
      --purple:#A855F7; --purple-d:#8B44B8; --purple-l:#F3E4FF;
      --orange:#FF9600; --orange-d:#B36A00; --orange-l:#FFF1DC;
      --red:#FF4B4B; --red-d:#C42B2B; --red-l:#FFECEC;
      --teal:#00C2A8; --teal-d:#007F6E; --teal-l:#DDFAF5;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html{scroll-behavior:smooth;}
    body{
      font-family:'Nunito', ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:var(--bg);color:var(--ink);font-weight:700;line-height:1.45;
      min-height:100vh;overflow-x:hidden;
      padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
    }
    .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
      -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
      border-bottom:2px solid var(--line);}
    .topbar-inner{max-width:640px;margin:0 auto;padding:10px 14px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .brand{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:900;letter-spacing:-.02em;}
    .brand-icon{width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;
      display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 var(--blue-d);flex-shrink:0;}
    .brand .accent{color:var(--blue-d);}
    .stat{display:inline-flex;align-items:center;gap:5px;background:#F7F7F7;border:2px solid var(--line);
      border-radius:999px;padding:5px 12px;font-size:.7rem;font-weight:900;color:var(--ink-soft);
      letter-spacing:.03em;white-space:nowrap;}
    main{max-width:640px;margin:0 auto;padding:0 8px;}
    .svg-wrap{margin:12px 8px 0;border-radius:18px;overflow:hidden;background:#FFFFFF;}
    .svg-wrap svg{display:block;width:100%;height:auto;}
    footer{max-width:640px;margin:32px auto 0;padding:22px 18px 8px;
      border-top:2px solid var(--line);text-align:center;
      font-size:.75rem;font-weight:700;color:var(--muted);line-height:1.7;}
    footer strong{color:var(--ink-soft);}
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{
        animation-duration:0.001ms !important;animation-iteration-count:1 !important;
        transition-duration:0.001ms !important;
      }
      html{scroll-behavior:auto;}
      svg *{animation:none !important;}
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div><span class="accent">Physics</span> by Charge</div>
    </div>
    <div class="stat">⚡ 30 animated</div>
  </div>
</div>

<main>

  <div class="svg-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 4420" role="img"
         aria-label="Thirty animated electric charge quantities.">

      <defs>
        <radialGradient id="blobG"><stop offset="0" stop-color="#D7FFB8" stop-opacity="0.9"/><stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobB"><stop offset="0" stop-color="#DDF4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobP"><stop offset="0" stop-color="#F3E4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/></radialGradient>
      </defs>

      <style>
        text{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;}
        .card{fill:#FFFFFF;stroke-width:2.5;}
        .sh{stroke:none;}
        .s-g{fill:#A5E88A;} .c-g{stroke:#D7F2C0;}
        .s-b{fill:#8FD9FB;} .c-b{stroke:#D8F0FE;}
        .s-p{fill:#E0BEFB;} .c-p{stroke:#EBD9FA;}
        .s-o{fill:#FFC97A;} .c-o{stroke:#FFE0B8;}
        .s-r{fill:#FFA3A3;} .c-r{stroke:#FFD0D0;}
        .s-t{fill:#7FE5D6;} .c-t{stroke:#B8F0E7;}
        .bg-g{fill:#EAF6DE;} .tx-g{fill:#4B8B00;}
        .bg-b{fill:#E1F3FE;} .tx-b{fill:#0B7BB0;}
        .bg-p{fill:#F3E4FF;} .tx-p{fill:#8B44B8;}
        .bg-o{fill:#FFF1DC;} .tx-o{fill:#B36A00;}
        .bg-r{fill:#FFECEC;} .tx-r{fill:#C42B2B;}
        .bg-t{fill:#DDFAF5;} .tx-t{fill:#007F6E;}
        .h1{font-size:25px;font-weight:900;fill:#3C3C3C;letter-spacing:-0.5px;}
        .h2{font-size:12px;font-weight:700;fill:#AFAFAF;}
        .ttl{font-size:13px;font-weight:800;fill:#3C3C3C;}
        .val{font-size:10.5px;font-weight:800;}
        .cap{font-size:11px;font-weight:700;fill:#AFAFAF;}
        .dim{font-size:10px;font-weight:800;}
        .arr{stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}
        .attract{stroke:#C42B2B;stroke-width:1.2;stroke-dasharray:4 3;fill:none;opacity:0.45;}
      </style>

      <rect width="420" height="4420" fill="#FFFFFF"/>
      <circle cx="20"  cy="90"   r="200" fill="url(#blobG)"/>
      <circle cx="410" cy="1400" r="220" fill="url(#blobB)"/>
      <circle cx="10"  cy="2600" r="210" fill="url(#blobP)"/>
      <circle cx="410" cy="3700" r="220" fill="url(#blobB)"/>

      <!-- ===== HEADER ===== -->
      <text x="210" y="70" text-anchor="middle" font-size="42">⚡
        <animate attributeName="opacity" values="0.75;1;0.75" dur="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="210" y="118" text-anchor="middle" class="h1">Physics by Charge</text>
      <text x="210" y="146" text-anchor="middle" class="h2">30 charge quantities — measured in coulombs.</text>

      <!-- ============ 01 · ELECTRIC CHARGE Q ============ -->
      <rect class="sh s-g" x="16" y="181" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="176" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="192" width="32" height="32" rx="11"/>
      <text x="48" y="213" text-anchor="middle" font-size="15">⚡</text>
      <text x="76" y="213" class="ttl">Electric charge Q</text>
      <text x="388" y="213" text-anchor="end" class="val tx-g">1 C</text>

      <g>
        <!-- faint attraction line -->
        <line class="attract" x1="194" y1="256" x2="246" y2="256"/>
        <circle cx="180" cy="256" r="14" fill="#FFA3A3" stroke="#C42B2B" stroke-width="2">
          <animate attributeName="r" values="12;16;12" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="180" y="261" text-anchor="middle" font-size="12" font-weight="900" fill="#C42B2B">+</text>
        <circle cx="260" cy="256" r="14" fill="#8FD9FB" stroke="#0B7BB0" stroke-width="2">
          <animate attributeName="r" values="12;16;12" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
        </circle>
        <text x="260" y="261" text-anchor="middle" font-size="12" font-weight="900" fill="#0B7BB0">−</text>
      </g>
      <text x="220" y="296" text-anchor="middle" class="dim tx-g">Q = n e</text>

      <!-- ============ 02 · ELEMENTARY CHARGE ============ -->
      <rect class="sh s-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="337" width="32" height="32" rx="11"/>
      <text x="48" y="358" text-anchor="middle" font-size="15">🔬</text>
      <text x="76" y="358" class="ttl">Elementary charge e</text>
      <text x="388" y="358" text-anchor="end" class="val tx-b">1.602×10⁻¹⁹ C</text>

      <!-- attraction line -->
      <line class="attract" x1="212" y1="398" x2="268" y2="398"/>
      <circle cx="200" cy="398" r="22" fill="#8FD9FB" stroke="#1CB0F6" stroke-width="2.5">
        <animate attributeName="r" values="20;24;20" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="200" y="403" text-anchor="middle" font-size="14" font-weight="900" fill="#0B7BB0">e</text>
      <circle cx="280" cy="398" r="18" fill="#FFA3A3" stroke="#C42B2B" stroke-width="2">
        <animate attributeName="r" values="16;20;16" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="280" y="403" text-anchor="middle" font-size="12" font-weight="900" fill="#C42B2B">+</text>

      <!-- ============ 03 · COULOMB ============ -->
      <rect class="sh s-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="477" width="32" height="32" rx="11"/>
      <text x="48" y="498" text-anchor="middle" font-size="15">📐</text>
      <text x="76" y="498" class="ttl">Coulomb</text>
      <text x="388" y="498" text-anchor="end" class="val tx-p">A·s</text>

      <rect x="130" y="516" width="80" height="64" rx="6" fill="#F3E4FF" stroke="#A855F7" stroke-width="2.5"/>
      <text x="170" y="554" text-anchor="middle" font-size="18" font-weight="900" fill="#8B44B8">C</text>
      <text x="270" y="548" class="dim tx-p">amp × second</text>

      <!-- ============ 04 · MILLIAMPERE-HOUR ============ -->
      <rect class="sh s-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="617" width="32" height="32" rx="11"/>
      <text x="48" y="638" text-anchor="middle" font-size="15">🔋</text>
      <text x="76" y="638" class="ttl">Milliampere-hour</text>
      <text x="388" y="638" text-anchor="end" class="val tx-o">mAh</text>

      <rect x="130" y="660" width="70" height="56" rx="6" fill="#FFE0B8" stroke="#FF9600" stroke-width="2.5"/>
      <rect x="134" y="664" width="62" height="48" rx="4" fill="#FFC97A">
        <animate attributeName="height" values="24;40;24" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="688;672;688" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <text x="270" y="694" class="dim tx-o">1 mAh = 3.6 C</text>

      <!-- ============ 05 · AMPERE-HOUR ============ -->
      <rect class="sh s-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="757" width="32" height="32" rx="11"/>
      <text x="48" y="778" text-anchor="middle" font-size="15">🔋</text>
      <text x="76" y="778" class="ttl">Ampere-hour</text>
      <text x="388" y="778" text-anchor="end" class="val tx-r">Ah</text>

      <rect x="130" y="796" width="100" height="60" rx="8" fill="#FFECEC" stroke="#FF4B4B" stroke-width="2.5"/>
      <rect x="134" y="800" width="92" height="52" rx="5" fill="#FFA3A3">
        <animate attributeName="width" values="60;84;60" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="180" y="836" text-anchor="middle" font-size="14" font-weight="900" fill="#C42B2B">1 Ah</text>
      <text x="290" y="832" class="dim tx-r">= 3600 C</text>

      <!-- ============ 06 · NANOCCOULOMB ============ -->
      <rect class="sh s-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="897" width="32" height="32" rx="11"/>
      <text x="48" y="918" text-anchor="middle" font-size="15">⚡</text>
      <text x="76" y="918" class="ttl">Nanocoulomb</text>
      <text x="388" y="918" text-anchor="end" class="val tx-t">nC</text>

      <!-- attraction line -->
      <line class="attract" x1="214" y1="956" x2="266" y2="956"/>
      <circle cx="200" cy="956" r="18" fill="#7FE5D6" stroke="#00C2A8" stroke-width="2.5">
        <animate attributeName="r" values="15;21;15" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="200" y="961" text-anchor="middle" font-size="11" font-weight="900" fill="#007F6E">nC</text>
      <circle cx="280" cy="956" r="16" fill="#FFA3A3" stroke="#C42B2B" stroke-width="2">
        <animate attributeName="r" values="14;18;14" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <text x="280" y="961" text-anchor="middle" font-size="10" font-weight="900" fill="#C42B2B">+</text>

      <!-- ============ 07 · PICOCCOULOMB ============ -->
      <rect class="sh s-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="1037" width="32" height="32" rx="11"/>
      <text x="48" y="1058" text-anchor="middle" font-size="15">⚡</text>
      <text x="76" y="1058" class="ttl">Picocoulomb</text>
      <text x="388" y="1058" text-anchor="end" class="val tx-g">pC</text>

      <!-- attraction line -->
      <line class="attract" x1="210" y1="1096" x2="270" y2="1096"/>
      <circle cx="200" cy="1096" r="14" fill="#A5E88A" stroke="#58CC02" stroke-width="2.5">
        <animate attributeName="r" values="11;17;11" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="200" y="1101" text-anchor="middle" font-size="10" font-weight="900" fill="#4B8B00">pC</text>
      <circle cx="280" cy="1096" r="12" fill="#8FD9FB" stroke="#0B7BB0" stroke-width="2">
        <animate attributeName="r" values="10;14;10" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="280" y="1101" text-anchor="middle" font-size="9" font-weight="900" fill="#0B7BB0">−</text>

      <!-- ============ 08 · STATCOULOMB ============ -->
      <rect class="sh s-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="1177" width="32" height="32" rx="11"/>
      <text x="48" y="1198" text-anchor="middle" font-size="15">🧲</text>
      <text x="76" y="1198" class="ttl">Statcoulomb</text>
      <text x="388" y="1198" text-anchor="end" class="val tx-b">statC</text>

      <!-- attraction line -->
      <line class="attract" x1="192" y1="1240" x2="208" y2="1240"/>
      <circle cx="170" cy="1240" r="20" fill="#8FD9FB" stroke="#1CB0F6" stroke-width="2.5"/>
      <circle cx="230" cy="1240" r="20" fill="#8FD9FB" stroke="#1CB0F6" stroke-width="2.5"/>
      <text x="200" y="1280" text-anchor="middle" class="dim tx-b">esu · CGS</text>

      <!-- ============ 09 · FARADAY ============ -->
      <rect class="sh s-p" x="16" y="1301" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="1301" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="1317" width="32" height="32" rx="11"/>
      <text x="48" y="1338" text-anchor="middle" font-size="15">🧪</text>
      <text x="76" y="1338" class="ttl">Faraday constant F</text>
      <text x="388" y="1338" text-anchor="end" class="val tx-p">96485 C/mol</text>

      <rect x="130" y="1356" width="80" height="56" rx="6" fill="#F3E4FF" stroke="#A855F7" stroke-width="2.5"/>
      <text x="170" y="1392" text-anchor="middle" font-size="16" font-weight="900" fill="#8B44B8">F</text>
      <text x="280" y="1388" class="dim tx-p">N_A · e</text>

      <!-- ============ 10 · CHARGE DENSITY ============ -->
      <rect class="sh s-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="1457" width="32" height="32" rx="11"/>
      <text x="48" y="1478" text-anchor="middle" font-size="15">📦</text>
      <text x="76" y="1478" class="ttl">Charge density ρ</text>
      <text x="388" y="1478" text-anchor="end" class="val tx-o">C/m³</text>

      <rect x="140" y="1496" width="100" height="60" rx="6" fill="#FFE0B8" stroke="#FF9600" stroke-width="2.5"/>
      <g fill="#FF9600" opacity="0.6">
        <circle cx="160" cy="1516" r="3"/>
        <circle cx="185" cy="1530" r="3"/>
        <circle cx="210" cy="1512" r="3"/>
        <circle cx="225" cy="1535" r="3"/>
      </g>
      <text x="290" y="1535" class="dim tx-o">ρ = Q/V</text>

      <!-- ============ 11 · SURFACE CHARGE DENSITY ============ -->
      <rect class="sh s-r" x="16" y="1581" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="1581" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="1597" width="32" height="32" rx="11"/>
      <text x="48" y="1618" text-anchor="middle" font-size="15">⬜</text>
      <text x="76" y="1618" class="ttl">Surface charge density σ</text>
      <text x="388" y="1618" text-anchor="end" class="val tx-r">C/m²</text>

      <rect x="140" y="1640" width="140" height="56" rx="6" fill="#FFECEC" stroke="#FF4B4B" stroke-width="2.5"/>
      <g fill="#FF4B4B" opacity="0.55">
        <circle cx="165" cy="1656" r="3"/>
        <circle cx="195" cy="1672" r="3"/>
        <circle cx="230" cy="1654" r="3"/>
        <circle cx="260" cy="1670" r="3"/>
        <circle cx="180" cy="1680" r="3"/>
      </g>
      <text x="300" y="1678" class="dim tx-r">σ = Q/A</text>

      <!-- ============ 12 · LINEAR CHARGE DENSITY ============ -->
      <rect class="sh s-t" x="16" y="1721" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="1721" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="1737" width="32" height="32" rx="11"/>
      <text x="48" y="1758" text-anchor="middle" font-size="15">📏</text>
      <text x="76" y="1758" class="ttl">Linear charge density λ</text>
      <text x="388" y="1758" text-anchor="end" class="val tx-t">C/m</text>

      <line x1="120" y1="1798" x2="300" y2="1798" stroke="#00C2A8" stroke-width="4" stroke-linecap="round"/>
      <g fill="#007F6E">
        <circle cx="140" cy="1798" r="5"/>
        <circle cx="180" cy="1798" r="5"/>
        <circle cx="220" cy="1798" r="5"/>
        <circle cx="260" cy="1798" r="5"/>
      </g>
      <text x="210" y="1830" text-anchor="middle" class="dim tx-t">λ = Q/L</text>

      <!-- ============ 13 · VOLUME CHARGE DENSITY ============ -->
      <rect class="sh s-g" x="16" y="1861" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="1861" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="1877" width="32" height="32" rx="11"/>
      <text x="48" y="1898" text-anchor="middle" font-size="15">🧊</text>
      <text x="76" y="1898" class="ttl">Volume charge density ρ_v</text>
      <text x="388" y="1898" text-anchor="end" class="val tx-g">C/m³</text>

      <rect x="150" y="1918" width="100" height="58" rx="6" fill="#EAF6DE" stroke="#58CC02" stroke-width="2.5"/>
      <g fill="#58CC02" opacity="0.5">
        <circle cx="170" cy="1938" r="3"/>
        <circle cx="195" cy="1950" r="3"/>
        <circle cx="225" cy="1936" r="3"/>
        <circle cx="210" cy="1962" r="3"/>
        <circle cx="175" cy="1962" r="3"/>
      </g>
      <text x="300" y="1952" class="dim tx-g">ρ = Q/V</text>

      <!-- ============ 14 · POLARIZATION CHARGE ============ -->
      <rect class="sh s-b" x="16" y="2001" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="2001" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="2017" width="32" height="32" rx="11"/>
      <text x="48" y="2038" text-anchor="middle" font-size="15">🔀</text>
      <text x="76" y="2038" class="ttl">Polarization charge</text>
      <text x="388" y="2038" text-anchor="end" class="val tx-b">Q_pol</text>

      <g>
        <!-- faint attraction line -->
