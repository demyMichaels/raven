<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Physics by Volume — 30 Animated Quantities</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF; --ink:#3C3C3C; --ink-soft:#777777; --muted:#AFAFAF; --line:#E5E5E5;
    --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8; --green-t:#4B8B00;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Nunito', ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg);color:var(--ink);font-weight:700;line-height:1.45;
    min-height:100vh;overflow-x:hidden;
    padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
  }
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:2px solid var(--line);}
  .topbar-inner{max-width:640px;margin:0 auto;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:900;letter-spacing:-.02em;}
  .brand-icon{width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 var(--green-d);flex-shrink:0;}
  .brand .accent{color:var(--green-t);}
  .stat{display:inline-flex;align-items:center;gap:5px;background:#F7F7F7;border:2px solid var(--line);
    border-radius:999px;padding:5px 12px;font-size:.7rem;font-weight:900;color:var(--ink-soft);
    letter-spacing:.03em;white-space:nowrap;}
  main{max-width:640px;margin:0 auto;padding:0 8px;}
  .svg-wrap{margin:12px 8px 0;border-radius:18px;overflow:hidden;background:#FFFFFF;}
  .svg-wrap svg{display:block;width:100%;height:auto;}
  footer{max-width:640px;margin:32px auto 0;padding:22px 18px 8px;
    border-top:2px solid var(--line);text-align:center;
    font-size:.75rem;font-weight:700;color:var(--muted);line-height:1.7;}
  footer strong{color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.001ms !important;animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    html{scroll-behavior:auto;}
    svg *{animation:none !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">📦</div>
      <div><span class="accent">Physics</span> by Volume</div>
    </div>
    <div class="stat">📦 30 animated</div>
  </div>
</div>

<main>

  <div class="svg-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 4420" role="img"
         aria-label="Thirty animated volume quantities.">

      <defs>
        <radialGradient id="blobG"><stop offset="0" stop-color="#D7FFB8" stop-opacity="0.9"/><stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobB"><stop offset="0" stop-color="#DDF4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobP"><stop offset="0" stop-color="#F3E4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/></radialGradient>
      </defs>

      <style>
        text{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;}
        .card{fill:#FFFFFF;stroke-width:2.5;}
        .sh{stroke:none;}
        .s-g{fill:#A5E88A;} .c-g{stroke:#D7F2C0;}
        .s-b{fill:#8FD9FB;} .c-b{stroke:#D8F0FE;}
        .s-p{fill:#E0BEFB;} .c-p{stroke:#EBD9FA;}
        .s-o{fill:#FFC97A;} .c-o{stroke:#FFE0B8;}
        .s-r{fill:#FFA3A3;} .c-r{stroke:#FFD0D0;}
        .s-t{fill:#7FE5D6;} .c-t{stroke:#B8F0E7;}
        .bg-g{fill:#EAF6DE;} .tx-g{fill:#4B8B00;}
        .bg-b{fill:#E1F3FE;} .tx-b{fill:#0B7BB0;}
        .bg-p{fill:#F3E4FF;} .tx-p{fill:#8B44B8;}
        .bg-o{fill:#FFF1DC;} .tx-o{fill:#B36A00;}
        .bg-r{fill:#FFECEC;} .tx-r{fill:#C42B2B;}
        .bg-t{fill:#DDFAF5;} .tx-t{fill:#007F6E;}
        .h1{font-size:25px;font-weight:900;fill:#3C3C3C;letter-spacing:-0.5px;}
        .h2{font-size:12px;font-weight:700;fill:#AFAFAF;}
        .ttl{font-size:13px;font-weight:800;fill:#3C3C3C;}
        .val{font-size:10.5px;font-weight:800;}
        .cap{font-size:11px;font-weight:700;fill:#AFAFAF;}
        .dim{font-size:10px;font-weight:800;}
        .arr{stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}
      </style>

      <rect width="420" height="4420" fill="#FFFFFF"/>
      <circle cx="20"  cy="90"   r="200" fill="url(#blobG)"/>
      <circle cx="410" cy="1400" r="220" fill="url(#blobB)"/>
      <circle cx="10"  cy="2600" r="210" fill="url(#blobP)"/>
      <circle cx="410" cy="3700" r="220" fill="url(#blobB)"/>

      <!-- ===== HEADER ===== -->
      <text x="210" y="70" text-anchor="middle" font-size="42">📦
        <animate attributeName="opacity" values="0.75;1;0.75" dur="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="210" y="118" text-anchor="middle" class="h1">Physics by Volume</text>
      <text x="210" y="146" text-anchor="middle" class="h2">30 volumes — measured in cubic metres.</text>

      <!-- ============ 01 · VOLUME V ============ -->
      <rect class="sh s-g" x="16" y="181" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="176" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="192" width="32" height="32" rx="11"/>
      <text x="48" y="213" text-anchor="middle" font-size="15">📦</text>
      <text x="76" y="213" class="ttl">Volume V</text>
      <text x="388" y="213" text-anchor="end" class="val tx-g">1 m³</text>

      <g>
        <polygon points="185,240 235,240 245,252 195,252" fill="#A5E88A" stroke="#58CC02" stroke-width="2" stroke-linejoin="round"/>
        <polygon points="185,240 195,252 195,290 185,278" fill="#D7FFB8" stroke="#58CC02" stroke-width="2" stroke-linejoin="round"/>
        <polygon points="195,252 245,252 245,290 195,290" fill="#EAF6DE" stroke="#58CC02" stroke-width="2" stroke-linejoin="round"/>
        <polygon points="235,240 245,252 245,290 235,278" fill="#A5E88A" stroke="#58CC02" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <text x="220" y="282" text-anchor="middle" font-size="10" font-weight="900" fill="#4B8B00">V</text>
      <text x="300" y="266" class="dim tx-g">l × w × h</text>

      <!-- ============ 02 · SPECIFIC VOLUME ============ -->
      <rect class="sh s-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="337" width="32" height="32" rx="11"/>
      <text x="48" y="358" text-anchor="middle" font-size="15">📐</text>
      <text x="76" y="358" class="ttl">Specific volume v</text>
      <text x="388" y="358" text-anchor="end" class="val tx-b">v = V / m</text>

      <rect x="140" y="378" width="70" height="60" rx="4" fill="#E1F3FE" stroke="#1CB0F6" stroke-width="2.5"/>
      <circle cx="175" cy="408" r="14" fill="#8FD9FB" stroke="#1CB0F6" stroke-width="2">
        <animate attributeName="r" values="13;16;13" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="175" y="413" text-anchor="middle" font-size="11" font-weight="900" fill="#0B7BB0">m</text>
      <line x1="222" y1="408" x2="268" y2="408" stroke="#1CB0F6" stroke-width="2.5" stroke-linecap="round"/>
      <text x="290" y="412" class="dim tx-b">v = V/m</text>

      <!-- ============ 03 · MOLAR VOLUME ============ -->
      <rect class="sh s-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="477" width="32" height="32" rx="11"/>
      <text x="48" y="498" text-anchor="middle" font-size="15">🧪</text>
      <text x="76" y="498" class="ttl">Molar volume V_m</text>
      <text x="388" y="498" text-anchor="end" class="val tx-p">V_m = V / n</text>

      <rect x="130" y="514" width="80" height="64" rx="6" fill="#F3E4FF" stroke="#A855F7" stroke-width="2.5"/>
      <g fill="#8B44B8">
        <circle cx="152" cy="534" r="4">
          <animate attributeName="cx" values="150;156;150" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="182" cy="546" r="4">
          <animate attributeName="cy" values="544;550;544" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="162" cy="562" r="4">
          <animate attributeName="cx" values="164;158;164" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="192" cy="520" r="4">
          <animate attributeName="cy" values="518;524;518" dur="1.6s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <text x="270" y="546" class="dim tx-p">n mol → V_m</text>

      <!-- ============ 04 · DISPLACED VOLUME ============ -->
      <rect class="sh s-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="617" width="32" height="32" rx="11"/>
      <text x="48" y="638" text-anchor="middle" font-size="15">🛟</text>
      <text x="76" y="638" class="ttl">Displaced volume</text>
      <text x="388" y="638" text-anchor="end" class="val tx-o">Archimedes</text>

      <rect x="80" y="660" width="240" height="66" rx="6" fill="#FFE0B8" opacity="0.55"/>
      <rect x="80" y="696" width="240" height="30" rx="4" fill="#FFC97A">
        <animate attributeName="y" values="700;688;700" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="height" values="26;38;26" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="170" y="672" width="60" height="40" rx="6" fill="#FF9600">
        <animate attributeName="y" values="672;676;672" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="200" y="698" text-anchor="middle" font-size="10" font-weight="900" fill="#FFFFFF">m</text>

      <!-- ============ 05 · ENGINE STROKE VOLUME ============ -->
      <rect class="sh s-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="757" width="32" height="32" rx="11"/>
      <text x="48" y="778" text-anchor="middle" font-size="15">🔧</text>
      <text x="76" y="778" class="ttl">Engine stroke volume</text>
      <text x="388" y="778" text-anchor="end" class="val tx-r">V_d</text>

      <rect x="180" y="790" width="60" height="70" rx="4" fill="#FFECEC" stroke="#FF4B4B" stroke-width="2.5"/>
      <rect x="182" y="812" width="56" height="46" fill="#FFA3A3">
        <animate attributeName="y" values="816;806;816" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="height" values="42;52;42" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <line x1="210" y1="812" x2="210" y2="790" stroke="#C42B2B" stroke-width="2.5" stroke-linecap="round"/>
      <text x="210" y="874" text-anchor="middle" class="dim tx-r">piston</text>

      <!-- ============ 06 · SWEPT VOLUME ============ -->
      <rect class="sh s-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="897" width="32" height="32" rx="11"/>
      <text x="48" y="918" text-anchor="middle" font-size="15">⚙️</text>
      <text x="76" y="918" class="ttl">Swept volume</text>
      <text x="388" y="918" text-anchor="end" class="val tx-t">πr²·s</text>

      <rect x="130" y="932" width="80" height="66" rx="4" fill="#DDFAF5" stroke="#00C2A8" stroke-width="2.5"/>
      <rect x="132" y="942" width="76" height="54" fill="#7FE5D6" opacity="0.7">
        <animate attributeName="height" values="54;34;54" dur="2s" repeatCount="indefinite"/>
      </rect>
      <line x1="140" y1="938" x2="200" y2="938" stroke="#007F6E" stroke-width="2.5" stroke-linecap="round">
        <animate attributeName="y1" values="938;952;938" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="938;952;938" dur="2s" repeatCount="indefinite"/>
      </line>
      <text x="270" y="972" class="dim tx-t">swept</text>

      <!-- ============ 07 · CLEARANCE VOLUME ============ -->
      <rect class="sh s-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="1037" width="32" height="32" rx="11"/>
      <text x="48" y="1058" text-anchor="middle" font-size="15">📏</text>
      <text x="76" y="1058" class="ttl">Clearance volume</text>
      <text x="388" y="1058" text-anchor="end" class="val tx-g">V_c</text>

      <rect x="170" y="1072" width="80" height="70" rx="4" fill="#EAF6DE" stroke="#58CC02" stroke-width="2.5"/>
      <rect x="172" y="1074" width="76" height="20" rx="2" fill="#A5E88A">
        <animate attributeName="height" values="18;24;18" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="172" y="1110" width="76" height="30" fill="#D7FFB8"/>
      <line x1="180" y1="1108" x2="242" y2="1108" stroke="#4B8B00" stroke-width="2.5" stroke-linecap="round"/>
      <text x="290" y="1090" class="dim tx-g">V_c</text>
      <line x1="256" y1="1086" x2="280" y2="1086" stroke="#4B8B00" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- ============ 08 · TIDAL VOLUME ============ -->
      <rect class="sh s-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="1177" width="32" height="32" rx="11"/>
      <text x="48" y="1198" text-anchor="middle" font-size="15">🫁</text>
      <text x="76" y="1198" class="ttl">Tidal volume</text>
      <text x="388" y="1198" text-anchor="end" class="val tx-b">≈ 500 mL</text>

      <ellipse cx="170" cy="1245" rx="22" ry="30" fill="#E1F3FE" stroke="#1CB0F6" stroke-width="2.5">
        <animate attributeName="ry" values="26;34;26" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="230" cy="1245" rx="22" ry="30" fill="#E1F3FE" stroke="#1CB0F6" stroke-width="2.5">
        <animate attributeName="ry" values="26;34;26" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <line x1="200" y1="1196" x2="200" y2="1230" stroke="#1CB0F6" stroke-width="2.5" stroke-linecap="round"/>
      <text x="320" y="1250" text-anchor="middle" class="dim tx-b">500 mL</text>

      <!-- ============ 09 · RESIDUAL VOLUME ============ -->
      <rect class="sh s-p" x="16" y="1301" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="1301" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="1317" width="32" height="32" rx="11"/>
      <text x="48" y="1338" text-anchor="middle" font-size="15">💨</text>
      <text x="76" y="1338" class="ttl">Residual volume</text>
      <text x="388" y="1338" text-anchor="end" class="val tx-p">≈ 1.2 L</text>

      <ellipse cx="170" cy="1385" rx="22" ry="24" fill="#E0BEFB" stroke="#A855F7" stroke-width="2.5"/>
      <ellipse cx="230" cy="1385" rx="22" ry="24" fill="#E0BEFB" stroke="#A855F7" stroke-width="2.5"/>
      <line x1="200" y1="1340" x2="200" y2="1370" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
      <g fill="#8B44B8" opacity="0.75">
        <circle cx="170" cy="1385" r="3">
          <animate attributeName="r" values="2.5;4;2.5" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="230" cy="1385" r="3">
          <animate attributeName="r" values="2.5;4;2.5" dur="2s" begin="1s" repeatCount="indefinite"/>
        </circle>
      </g>
      <text x="320" y="1390" text-anchor="middle" class="dim tx-p">always there</text>

      <!-- ============ 10 · VITAL CAPACITY ============ -->
      <rect class="sh s-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="1457" width="32" height="32" rx="11"/>
      <text x="48" y="1478" text-anchor="middle" font-size="15">🎈</text>
      <text x="76" y="1478" class="ttl">Vital capacity</text>
      <text x="388" y="1478" text-anchor="end" class="val tx-o">≈ 4.8 L</text>

      <ellipse cx="200" cy="1522" rx="60" ry="38" fill="#FFE0B8" stroke="#FF9600" stroke-width="2.5">
        <animate attributeName="ry" values="34;42;34" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="56;64;56" dur="2.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="200" cy="1522" rx="42" ry="24" fill="#FFC97A" opacity="0.7">
        <animate attributeName="ry" values="22;28;22" dur="2.4s" repeatCount="indefinite"/>
      </ellipse>
      <text x="200" y="1527" text-anchor="middle" font-size="11" font-weight="900" fill="#B36A00">4.8 L</text>

      <!-- ============ 11 · DEAD SPACE VOLUME ============ -->
      <rect class="sh s-r" x="16" y="1581" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="1581" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="1597" width="32" height="32" rx="11"/>
      <text x="48" y="1618" text-anchor="middle" font-size="15">🚬</text>
      <text x="76" y="1618" class="ttl">Dead space volume</text>
      <text x="388" y="1618" text-anchor="end" class="val tx-r">≈ 150 mL</text>

      <path d="M 100,1660 L 300,1660" stroke="#FF4B4B" stroke-width="14" stroke-linecap="round" opacity="0.25"/>
      <path d="M 100,1660 L 190,1660" stroke="#FF4B4B" stroke-width="14" stroke-linecap="round" opacity="0.65"/>
      <text x="200" y="1700" text-anchor="middle" class="dim tx-r">no gas exchange</text>

      <!-- ============ 12 · END-DIASTOLIC VOLUME ============ -->
      <rect class="sh s-t" x="16" y="1721" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="1721" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="1737" width="32" height="32" rx="11"/>
      <text x="48" y="1758" text-anchor="middle" font-size="15">❤️</text>
      <text x="76" y="1758" class="ttl">End-diastolic volume</text>
      <text x="388" y="1758" text-anchor="end" class="val tx-t">≈ 120 mL</text>

      <path d="M 160,1780 Q 160,1832 200,1832 Q 240,1832 240,1780 Q 240,1760 220,1760 Q 200,1776 180,1760 Q 160,1760 160,1780 Z"
            fill="#7FE5D6" stroke="#00C2A8" stroke-width="2.5">
        <animate attributeName="d"
          values="M 160,1780 Q 160,1832 200,1832 Q 240,1832 240,1780 Q 240,1760 220,1760 Q 200,1776 180,1760 Q 160,1760 160,1780 Z;
                  M 152,1774 Q 152,1840 200,1840 Q 248,1840 248,1774 Q 248,1750 220,1752 Q 200,1772 180,1752 Q 152,1750 152,1774 Z;
                  M 160,1780 Q 160,1832 200,1832 Q 240,1832 240,1780 Q 240,1760 220,1760 Q 200,1776 180,1760 Q 160,1760 160,1780 Z"
          dur="2s" repeatCount="indefinite"/>
      </path>
      <text x="300" y="1816" text-anchor="middle" class="dim tx-t">filled</text>

      <!-- ============ 13 · END-SYSTOLIC VOLUME ============ -->
      <rect class="sh s-g" x="16" y="1861" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="1861" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="1877" width="32" height="32" rx="11"/>
      <text x="48" y="1898" text-anchor="middle" font-size="15">💓</text>
