<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Physics by Force — 30 Animated Quantities</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF; --ink:#3C3C3C; --ink-soft:#777777; --muted:#AFAFAF; --line:#E5E5E5;
    --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8; --green-t:#4B8B00;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Nunito', ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg);color:var(--ink);font-weight:700;line-height:1.45;
    min-height:100vh;overflow-x:hidden;
    padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
  }
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:2px solid var(--line);}
  .topbar-inner{max-width:640px;margin:0 auto;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:900;letter-spacing:-.02em;}
  .brand-icon{width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 var(--green-d);flex-shrink:0;}
  .brand .accent{color:var(--green-t);}
  .stat{display:inline-flex;align-items:center;gap:5px;background:#F7F7F7;border:2px solid var(--line);
    border-radius:999px;padding:5px 12px;font-size:.7rem;font-weight:900;color:var(--ink-soft);
    letter-spacing:.03em;white-space:nowrap;}
  main{max-width:640px;margin:0 auto;padding:0 8px;}
  .svg-wrap{margin:12px 8px 0;border-radius:18px;overflow:hidden;background:#FFFFFF;}
  .svg-wrap svg{display:block;width:100%;height:auto;}
  footer{max-width:640px;margin:32px auto 0;padding:22px 18px 8px;
    border-top:2px solid var(--line);text-align:center;
    font-size:.75rem;font-weight:700;color:var(--muted);line-height:1.7;}
  footer strong{color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.001ms !important;animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    html{scroll-behavior:auto;}
    svg *{animation:none !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">💪</div>
      <div><span class="accent">Physics</span> by Force</div>
    </div>
    <div class="stat">💪 30 animated</div>
  </div>
</div>

<main>

  <div class="svg-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 4420" role="img"
         aria-label="Thirty animated force quantities.">

      <defs>
        <radialGradient id="blobG"><stop offset="0" stop-color="#D7FFB8" stop-opacity="0.9"/><stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobB"><stop offset="0" stop-color="#DDF4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobP"><stop offset="0" stop-color="#F3E4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/></radialGradient>
        <marker id="arrowG" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#58CC02"/>
        </marker>
        <marker id="arrowB" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#1CB0F6"/>
        </marker>
        <marker id="arrowP" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#A855F7"/>
        </marker>
        <marker id="arrowO" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#FF9600"/>
        </marker>
        <marker id="arrowR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#FF4B4B"/>
        </marker>
        <marker id="arrowT" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#00C2A8"/>
        </marker>
      </defs>

      <style>
        text{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;}
        .card{fill:#FFFFFF;stroke-width:2.5;}
        .sh{stroke:none;}
        .s-g{fill:#A5E88A;} .c-g{stroke:#D7F2C0;}
        .s-b{fill:#8FD9FB;} .c-b{stroke:#D8F0FE;}
        .s-p{fill:#E0BEFB;} .c-p{stroke:#EBD9FA;}
        .s-o{fill:#FFC97A;} .c-o{stroke:#FFE0B8;}
        .s-r{fill:#FFA3A3;} .c-r{stroke:#FFD0D0;}
        .s-t{fill:#7FE5D6;} .c-t{stroke:#B8F0E7;}
        .bg-g{fill:#EAF6DE;} .tx-g{fill:#4B8B00;}
        .bg-b{fill:#E1F3FE;} .tx-b{fill:#0B7BB0;}
        .bg-p{fill:#F3E4FF;} .tx-p{fill:#8B44B8;}
        .bg-o{fill:#FFF1DC;} .tx-o{fill:#B36A00;}
        .bg-r{fill:#FFECEC;} .tx-r{fill:#C42B2B;}
        .bg-t{fill:#DDFAF5;} .tx-t{fill:#007F6E;}
        .h1{font-size:25px;font-weight:900;fill:#3C3C3C;letter-spacing:-0.5px;}
        .h2{font-size:12px;font-weight:700;fill:#AFAFAF;}
        .ttl{font-size:13px;font-weight:800;fill:#3C3C3C;}
        .val{font-size:10.5px;font-weight:800;}
        .cap{font-size:11px;font-weight:700;fill:#AFAFAF;}
        .dim{font-size:10px;font-weight:800;}
        .arr{stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}
      </style>

      <rect width="420" height="4420" fill="#FFFFFF"/>
      <circle cx="20"  cy="90"   r="200" fill="url(#blobG)"/>
      <circle cx="410" cy="1400" r="220" fill="url(#blobB)"/>
      <circle cx="10"  cy="2600" r="210" fill="url(#blobP)"/>
      <circle cx="410" cy="3700" r="220" fill="url(#blobB)"/>

      <!-- ===== HEADER ===== -->
      <text x="210" y="70" text-anchor="middle" font-size="42">💪
        <animate attributeName="opacity" values="0.75;1;0.75" dur="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="210" y="118" text-anchor="middle" class="h1">Physics by Force</text>
      <text x="210" y="146" text-anchor="middle" class="h2">30 forces — measured in newtons.</text>

      <!-- ============ 01 · FORCE F ============ -->
      <rect class="sh s-g" x="16" y="181" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="176" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="192" width="32" height="32" rx="11"/>
      <text x="48" y="213" text-anchor="middle" font-size="15">💪</text>
      <text x="76" y="213" class="ttl">Force F</text>
      <text x="388" y="213" text-anchor="end" class="val tx-g">F = ma</text>

      <rect x="110" y="260" width="60" height="40" rx="8" fill="#D7FFB8" stroke="#58CC02" stroke-width="2"/>
      <text x="140" y="286" text-anchor="middle" font-size="11" font-weight="900" fill="#4B8B00">m</text>
      <line x1="180" y1="280" x2="300" y2="280" stroke="#58CC02" class="arr" marker-end="url(#arrowG)">
        <animate attributeName="x2" values="280;310;280" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="250" y="270" text-anchor="middle" class="dim tx-g">F</text>

      <!-- ============ 02 · WEIGHT ============ -->
      <rect class="sh s-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="337" width="32" height="32" rx="11"/>
      <text x="48" y="358" text-anchor="middle" font-size="15">⚖️</text>
      <text x="76" y="358" class="ttl">Weight W</text>
      <text x="388" y="358" text-anchor="end" class="val tx-b">W = mg</text>

      <rect x="130" y="390" width="60" height="40" rx="8" fill="#E1F3FE" stroke="#1CB0F6" stroke-width="2"/>
      <text x="160" y="416" text-anchor="middle" font-size="11" font-weight="900" fill="#0B7BB0">m</text>
      <line x1="160" y1="430" x2="160" y2="470" stroke="#1CB0F6" class="arr" marker-end="url(#arrowB)">
        <animate attributeName="y2" values="460;480;460" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="175" y="455" class="dim tx-b">W</text>

      <!-- ============ 03 · NORMAL FORCE ============ -->
      <rect class="sh s-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="477" width="32" height="32" rx="11"/>
      <text x="48" y="498" text-anchor="middle" font-size="15">🧱</text>
      <text x="76" y="498" class="ttl">Normal force</text>
      <text x="388" y="498" text-anchor="end" class="val tx-p">⊥ surface</text>

      <rect x="130" y="530" width="100" height="12" rx="4" fill="#A855F7"/>
      <rect x="150" y="515" width="60" height="40" rx="8" fill="#F3E4FF" stroke="#A855F7" stroke-width="2"/>
      <text x="180" y="541" text-anchor="middle" font-size="11" font-weight="900" fill="#8B44B8">m</text>
      <line x1="180" y1="515" x2="180" y2="475" stroke="#A855F7" class="arr" marker-end="url(#arrowP)">
        <animate attributeName="y2" values="485;465;485" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="195" y="490" class="dim tx-p">N</text>

      <!-- ============ 04 · FRICTION ============ -->
      <rect class="sh s-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="617" width="32" height="32" rx="11"/>
      <text x="48" y="638" text-anchor="middle" font-size="15">🛑</text>
      <text x="76" y="638" class="ttl">Friction force</text>
      <text x="388" y="638" text-anchor="end" class="val tx-o">μN</text>

      <rect x="100" y="698" width="200" height="10" rx="4" fill="#FF9600" opacity="0.3"/>
      <rect x="140" y="660" width="60" height="36" rx="8" fill="#FFC97A" stroke="#FF9600" stroke-width="2"/>
      <text x="170" y="684" text-anchor="middle" font-size="11" font-weight="900" fill="#B36A00">m</text>
      <line x1="240" y1="678" x2="300" y2="678" stroke="#FF9600" class="arr" marker-end="url(#arrowO)">
        <animate attributeName="x2" values="290;310;290" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <line x1="140" y1="678" x2="80" y2="678" stroke="#FF9600" class="arr" marker-end="url(#arrowO)" opacity="0.6">
        <animate attributeName="x2" values="90;70;90" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="210" y="715" text-anchor="middle" class="dim tx-o">f</text>

      <!-- ============ 05 · TENSION ============ -->
      <rect class="sh s-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="757" width="32" height="32" rx="11"/>
      <text x="48" y="778" text-anchor="middle" font-size="15">🪢</text>
      <text x="76" y="778" class="ttl">Tension T</text>
      <text x="388" y="778" text-anchor="end" class="val tx-r">pulling force</text>

      <rect x="80" y="804" width="40" height="30" rx="6" fill="#FFECEC" stroke="#FF4B4B" stroke-width="2"/>
      <rect x="300" y="804" width="40" height="30" rx="6" fill="#FFECEC" stroke="#FF4B4B" stroke-width="2"/>
      <line x1="120" y1="819" x2="300" y2="819" stroke="#FF4B4B" stroke-width="2.5" stroke-dasharray="4 3"/>
      <line x1="120" y1="819" x2="80" y2="819" stroke="#FF4B4B" class="arr" marker-end="url(#arrowR)">
        <animate attributeName="x1" values="120;110;120" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <line x1="300" y1="819" x2="340" y2="819" stroke="#FF4B4B" class="arr" marker-end="url(#arrowR)">
        <animate attributeName="x1" values="300;310;300" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="210" y="812" text-anchor="middle" class="dim tx-r">T</text>

      <!-- ============ 06 · SPRING FORCE ============ -->
      <rect class="sh s-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="897" width="32" height="32" rx="11"/>
      <text x="48" y="918" text-anchor="middle" font-size="15">🌀</text>
      <text x="76" y="918" class="ttl">Spring force F_s</text>
      <text x="388" y="918" text-anchor="end" class="val tx-t">F = −kx</text>

      <line x1="100" y1="960" x2="140" y2="960" stroke="#00C2A8" stroke-width="2"/>
      <path d="M 140,960 L 150,950 L 160,970 L 170,950 L 180,970 L 190,950 L 200,970 L 210,950 L 220,970 L 230,950 L 240,960"
            fill="none" stroke="#00C2A8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="240" y1="960" x2="300" y2="960" stroke="#00C2A8" stroke-width="2"/>
      <rect x="300" y="942" width="40" height="36" rx="6" fill="#DDFAF5" stroke="#00C2A8" stroke-width="2"/>
      <line x1="340" y1="960" x2="370" y2="960" stroke="#00C2A8" class="arr" marker-end="url(#arrowT)">
        <animate attributeName="x2" values="360;375;360" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="330" y="935" text-anchor="middle" class="dim tx-t">x</text>

      <!-- ============ 07 · GRAVITATIONAL FORCE ============ -->
      <rect class="sh s-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="1037" width="32" height="32" rx="11"/>
      <text x="48" y="1058" text-anchor="middle" font-size="15">🌍</text>
      <text x="76" y="1058" class="ttl">Gravitational force</text>
      <text x="388" y="1058" text-anchor="end" class="val tx-g">G m₁m₂ / r²</text>

      <circle cx="120" cy="1100" r="20" fill="#A5E88A" stroke="#58CC02" stroke-width="2"/>
      <circle cx="300" cy="1100" r="20" fill="#A5E88A" stroke="#58CC02" stroke-width="2"/>
      <line x1="150" y1="1100" x2="240" y2="1100" stroke="#58CC02" class="arr" marker-end="url(#arrowG)">
        <animate attributeName="x2" values="235;245;235" dur="1.8s" repeatCount="indefinite"/>
      </line>
      <line x1="270" y1="1100" x2="180" y2="1100" stroke="#58CC02" class="arr" marker-end="url(#arrowG)">
        <animate attributeName="x2" values="185;175;185" dur="1.8s" repeatCount="indefinite"/>
      </line>
      <text x="210" y="1090" text-anchor="middle" class="dim tx-g">F_g</text>

      <!-- ============ 08 · CENTRIPETAL FORCE ============ -->
      <rect class="sh s-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="1177" width="32" height="32" rx="11"/>
      <text x="48" y="1198" text-anchor="middle" font-size="15">⭕</text>
      <text x="76" y="1198" class="ttl">Centripetal force</text>
      <text x="388" y="1198" text-anchor="end" class="val tx-b">mv² / r</text>

      <circle cx="210" cy="1248" r="40" fill="none" stroke="#1CB0F6" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
      <circle cx="210" cy="1248" r="8" fill="#1CB0F6">
        <animateTransform attributeName="transform" type="rotate" values="0 210 1248;360 210 1248" dur="3s" repeatCount="indefinite"/>
      </circle>
      <line x1="210" y1="1248" x2="170" y2="1248" stroke="#1CB0F6" class="arr" marker-end="url(#arrowB)" opacity="0.8">
        <animate attributeName="x2" values="175;165;175" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="130" y="1244" text-anchor="end" class="dim tx-b">F_c</text>

      <!-- ============ 09 · CENTRIFUGAL FORCE ============ -->
      <rect class="sh s-p" x="16" y="1301" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="1301" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="1317" width="32" height="32" rx="11"/>
      <text x="48" y="1338" text-anchor="middle" font-size="15">🌀</text>
      <text x="76" y="1338" class="ttl">Centrifugal force</text>
      <text x="388" y="1338" text-anchor="end" class="val tx-p">pseudo</text>

      <circle cx="210" cy="1388" r="40" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
      <circle cx="210" cy="1388" r="8" fill="#A855F7">
        <animateTransform attributeName="transform" type="rotate" values="0 210 1388;360 210 1388" dur="3s" repeatCount="indefinite"/>
      </circle>
      <line x1="210" y1="1388" x2="250" y2="1388" stroke="#A855F7" class="arr" marker-end="url(#arrowP)" opacity="0.8">
        <animate attributeName="x2" values="245;255;245" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="290" y="1384" text-anchor="start" class="dim tx-p">F_cf</text>

      <!-- ============ 10 · BUOYANT FORCE ============ -->
      <rect class="sh s-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="1457" width="32" height="32" rx="11"/>
      <text x="48" y="1478" text-anchor="middle" font-size="15">🛟</text>
      <text x="76" y="1478" class="ttl">Buoyant force F_b</text>
      <text x="388" y="1478" text-anchor="end" class="val tx-o">ρVg</text>

      <rect x="140" y="1500" width="140" height="50" rx="6" fill="#FFE0B8" opacity="0.5"/>
      <rect x="170" y="1510" width="80" height="30" rx="6" fill="#FFC97A" stroke="#FF9600" stroke-width="2"/>
      <line x1="210" y1="1510" x2="210" y2="1470" stroke="#FF9600" class="arr" marker-end="url(#arrowO)">
        <animate attributeName="y2" values="1480;1465;1480" dur="1.8s" repeatCount="indefinite"/>
      </line>
      <text x="225" y="1490" class="dim tx-o">F_b</text>
      <text x="210" y="1548" text-anchor="middle" class="dim tx-o" opacity="0.6">fluid</text>

      <!-- ============ 11 · DRAG FORCE ============ -->
      <rect class="sh s-r" x="16" y="1581" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="1581" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="1597" width="32" height="32" rx="11"/>
      <text x="48" y="1618" text-anchor="middle" font-size="15">💨</text>
      <text x="76" y="1618" class="ttl">Drag force F_d</text>
      <text x="388" y="1618" text-anchor="end" class="val tx-r">½ρv²C_dA</text>

      <circle cx="210" cy="1670" r="18" fill="#FFECEC" stroke="#FF4B4B" stroke-width="2"/>
      <line x1="210" y1="1652" x2="210" y2="1618" stroke="#FF4B4B" class="arr" marker-end="url(#arrowR)" opacity="0.6">
        <animate attributeName="y2" values="1628;1615;1628" dur="1.4s" repeatCount="indefinite"/>
      </line>
      <line x1="210" y1="1688" x2="210" y2="1715" stroke="#FF4B4B" class="arr" marker-end="url(#arrowR)">
        <animate attributeName="y2" values="1705;1720;1705" dur="1.4s" repeatCount="indefinite"/>
      </line>
      <text x="225" y="1660" class="dim tx-r">F_d</text>
      <text x="225" y="1700" class="dim tx-r">mg</text>

      <!-- ============ 12 · LIFT FORCE ============ -->
      <rect class="sh s-t" x="16" y="1721" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="1721" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="1737" width="32" height="32" rx="11"/>
      <text x="48" y="1758" text-anchor="middle" font-size="15">✈️</text>
      <text x="76" y="1758" class="ttl">Lift force L</text>
      <text x="388" y="1758" text-anchor="end" class="val tx-t">½ρv²S C_L</text>
