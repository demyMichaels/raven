<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Physics by Specific Heat Capacity — 30 Quantities</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{--bg:#FFFFFF;--ink:#3C3C3C;--ink-soft:#777;--muted:#AFAFAF;--line:#E5E5E5;
    --green:#58CC02;--green-d:#46A302;--green-l:#D7FFB8;--green-t:#4B8B00;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{font-family:'Nunito',ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);font-weight:700;line-height:1.45;min-height:100vh;
    overflow-x:hidden;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));}
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:2px solid var(--line);}
  .topbar-inner{max-width:640px;margin:0 auto;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:900;letter-spacing:-.02em;}
  .brand-icon{width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 var(--green-d);flex-shrink:0;}
  .brand .accent{color:var(--green-t);}
  .stat{display:inline-flex;align-items:center;gap:5px;background:#F7F7F7;border:2px solid var(--line);
    border-radius:999px;padding:5px 12px;font-size:.7rem;font-weight:900;color:var(--ink-soft);
    letter-spacing:.03em;white-space:nowrap;}
  main{max-width:640px;margin:0 auto;padding:0 8px;}
  .svg-wrap{margin:12px 8px 0;border-radius:18px;overflow:hidden;background:#FFFFFF;}
  .svg-wrap svg{display:block;width:100%;height:auto;}
  .primer-cap{text-align:center;padding:10px 14px 2px;font-size:.75rem;font-weight:800;color:var(--ink-soft);}
  .primer-cap strong{color:var(--green-t);}
  footer{max-width:640px;margin:32px auto 0;padding:22px 18px 8px;border-top:2px solid var(--line);
    text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);line-height:1.7;}
  footer strong{color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;
    animation-iteration-count:1!important;transition-duration:.001ms!important;}
    html{scroll-behavior:auto;}svg *{animation:none!important;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">🌡️</div>
      <div><span class="accent">Physics</span> by Specific Heat</div>
    </div>
    <div class="stat">30 materials</div>
  </div>
</div>

<main>

  <!-- ============================================================= -->
  <!-- PRIMER                                                        -->
  <!-- ============================================================= -->
  <div class="svg-wrap" style="margin-top:16px;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" role="img"
         aria-label="Specific heat capacity primer.">

      <defs>
        <radialGradient id="pr-blobG"><stop offset="0" stop-color="#D7FFB8" stop-opacity="0.9"/><stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/></radialGradient>
        <radialGradient id="pr-blobB"><stop offset="0" stop-color="#DDF4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></radialGradient>
        <radialGradient id="pr-blobP"><stop offset="0" stop-color="#F3E4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/></radialGradient>
      </defs>

      <style>
        text{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;}
        .p-h{font-size:22px;font-weight:900;fill:#3C3C3C;letter-spacing:-0.4px;}
        .p-hs{font-size:12px;font-weight:700;fill:#777;}
        .p-ttl{font-size:13px;font-weight:900;fill:#3C3C3C;}
        .p-sub{font-size:11px;font-weight:700;fill:#777;}
        .p-lbl{font-size:10px;font-weight:800;}
      </style>

      <rect width="420" height="900" fill="#FFFFFF"/>
      <circle cx="20"  cy="80"  r="200" fill="url(#pr-blobG)"/>
      <circle cx="410" cy="440" r="200" fill="url(#pr-blobB)"/>
      <circle cx="10"  cy="790" r="200" fill="url(#pr-blobP)"/>

      <text x="210" y="34" text-anchor="middle" font-size="30">🌡️</text>
      <text x="210" y="66" text-anchor="middle" class="p-h">Same heat, different rise</text>
      <text x="210" y="88" text-anchor="middle" class="p-hs">Specific heat decides how fast a material warms up.</text>

      <!-- Card 1: Same heat, different materials -->
      <g transform="translate(16 110)">
        <rect x="0" y="0" width="388" height="150" rx="18" fill="#EAF6DE" stroke="#D7F2C0" stroke-width="2.5"/>
        <text x="20" y="26" class="p-ttl">1 · Same energy in, different temperature out</text>
        <text x="20" y="44" class="p-sub">1 kg of each, 4.2 kJ of heat added.</text>
        <!-- Water: small rise -->
        <g transform="translate(100 108)">
          <rect x="-28" y="-42" width="56" height="42" rx="4" fill="#DDF4FF" stroke="#1CB0F6" stroke-width="2"/>
          <rect x="-22" y="-38" width="6" height="30" rx="3" fill="#FFFFFF" stroke="#1CB0F6" stroke-width="1"/>
          <rect x="-22" y="-18" width="6" height="10" rx="3" fill="#C42B2B"/>
          <text x="0" y="16" text-anchor="middle" class="p-lbl" fill="#0B7BB0">water</text>
          <text x="0" y="30" text-anchor="middle" class="p-lbl" fill="#0B7BB0">+1 °C</text>
        </g>
        <!-- Lead: big rise -->
        <g transform="translate(290 108)">
          <rect x="-28" y="-42" width="56" height="42" rx="4" fill="#FFECEC" stroke="#FF4B4B" stroke-width="2"/>
          <rect x="-22" y="-38" width="6" height="30" rx="3" fill="#FFFFFF" stroke="#FF4B4B" stroke-width="1"/>
          <rect x="-22" y="-38" width="6" height="30" rx="3" fill="#C42B2B"/>
          <text x="0" y="16" text-anchor="middle" class="p-lbl" fill="#C42B2B">lead</text>
          <text x="0" y="30" text-anchor="middle" class="p-lbl" fill="#C42B2B">+33 °C</text>
        </g>
      </g>

      <!-- Card 2: More mass, same c -->
      <g transform="translate(16 270)">
        <rect x="0" y="0" width="388" height="150" rx="18" fill="#E1F3FE" stroke="#D8F0FE" stroke-width="2.5"/>
        <text x="20" y="26" class="p-ttl">2 · Same material, more mass = more energy</text>
        <text x="20" y="44" class="p-sub">Twice the mass needs twice the heat for the same rise.</text>
        <g transform="translate(110 108)">
          <rect x="-20" y="-42" width="40" height="42" rx="4" fill="#E1F3FE" stroke="#1CB0F6" stroke-width="2"/>
          <text x="0" y="16" text-anchor="middle" class="p-lbl" fill="#0B7BB0">1 kg</text>
          <text x="0" y="30" text-anchor="middle" class="p-lbl" fill="#0B7BB0">Q</text>
        </g>
        <g transform="translate(290 108)">
          <rect x="-32" y="-42" width="64" height="42" rx="4" fill="#E1F3FE" stroke="#1CB0F6" stroke-width="2"/>
          <text x="0" y="16" text-anchor="middle" class="p-lbl" fill="#0B7BB0">2 kg</text>
          <text x="0" y="30" text-anchor="middle" class="p-lbl" fill="#0B7BB0">2Q</text>
        </g>
      </g>

      <!-- Card 3: The definition -->
      <g transform="translate(16 430)">
        <rect x="0" y="0" width="388" height="150" rx="18" fill="#F3E4FF" stroke="#EBD9FA" stroke-width="2.5"/>
        <text x="20" y="26" class="p-ttl">3 · The formula</text>
        <text x="20" y="44" class="p-sub">c is energy per kilogram per kelvin.</text>
        <foreignObject x="30" y="70" width="360" height="60">
          <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;height:100%;font-family:'Nunito',sans-serif;color:#8B44B8;font-size:18px;font-weight:900;">
            <math xmlns="http://www.w3.org/1998/Math/MathML"><mi>c</mi><mo>=</mo><mfrac><mi>Q</mi><mrow><mi>m</mi><mi>&#x394;T</mi></mrow></mfrac></math>
          </div>
        </foreignObject>
        <text x="210" y="140" text-anchor="middle" class="p-lbl" fill="#8B44B8">J per kg per K</text>
      </g>

      <!-- Card 4: High c = slow to heat, slow to cool -->
      <g transform="translate(16 590)">
        <rect x="0" y="0" width="388" height="150" rx="18" fill="#DDFAF5" stroke="#B8F0E7" stroke-width="2.5"/>
        <text x="20" y="26" class="p-ttl">4 · High c = thermal ballast</text>
        <text x="20" y="44" class="p-sub">Water's high c keeps coasts mild and cities cool.</text>
        <g transform="translate(110 108)">
          <path d="M 0,-40 Q 20,-20 20,5 Q 20,20 0,20 Q -20,20 -20,5 Q -20,-20 0,-40 Z" fill="#7FE5D6" stroke="#00C2A8" stroke-width="2"/>
          <text x="0" y="38" text-anchor="middle" class="p-lbl" fill="#007F6E">water</text>
        </g>
        <g transform="translate(290 108)">
          <circle cx="0" cy="0" r="18" fill="#FFC97A" stroke="#FF9600" stroke-width="2"/>
          <text x="0" y="38" text-anchor="middle" class="p-lbl" fill="#B36A00">metal</text>
        </g>
      </g>

      <!-- Card 5: The range -->
      <g transform="translate(16 750)">
        <rect x="0" y="0" width="388" height="150" rx="18" fill="#FFF1DC" stroke="#FFE0B8" stroke-width="2.5"/>
        <text x="20" y="26" class="p-ttl">5 · Two orders of magnitude apart</text>
        <text x="20" y="44" class="p-sub">From 128 (lead) to 14,304 (hydrogen) J/(kg·K).</text>
        <!-- log-scale bar -->
        <rect x="30" y="76" width="360" height="26" rx="6" fill="none" stroke="#B36A00" stroke-width="2"/>
        <rect x="30" y="76" width="30" height="26" rx="6" fill="#FFC97A"/>
        <rect x="30" y="76" width="330" height="26" rx="6" fill="#FFC97A" opacity="0.35"/>
        <text x="46" y="94" class="p-lbl" fill="#B36A00">lead</text>
        <text x="374" y="94" text-anchor="end" class="p-lbl" fill="#B36A00">hydrogen</text>
        <text x="210" y="120" text-anchor="middle" class="p-lbl" fill="#B36A00" opacity="0.7">bar length on log scale</text>
      </g>
    </svg>
  </div>

  <div class="primer-cap">Now — <strong>30 materials</strong>, sorted from low specific heat to high.</div>

  <!-- ============================================================= -->
  <!-- MAIN DECK: 30 SPECIFIC HEAT CAPACITIES                        -->
  <!-- ============================================================= -->
  <div class="svg-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 4420" role="img"
         aria-label="Thirty specific heat capacities, from lead to hydrogen.">

      <defs>
        <radialGradient id="blobG"><stop offset="0" stop-color="#D7FFB8" stop-opacity="0.9"/><stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobB"><stop offset="0" stop-color="#DDF4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobP"><stop offset="0" stop-color="#F3E4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/></radialGradient>
      </defs>

      <style>
        text{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;}
        .card{fill:#FFFFFF;stroke-width:2.5;}
        .sh{stroke:none;}
        .bg-g{fill:#EAF6DE;} .tx-g{fill:#4B8B00;} .c-g{stroke:#D7F2C0;} .f-g{fill:#A5E88A;} .s-g{fill:#A5E88A;}
        .bg-b{fill:#E1F3FE;} .tx-b{fill:#0B7BB0;} .c-b{stroke:#D8F0FE;} .f-b{fill:#8FD9FB;} .s-b{fill:#8FD9FB;}
        .bg-p{fill:#F3E4FF;} .tx-p{fill:#8B44B8;} .c-p{stroke:#EBD9FA;} .f-p{fill:#E0BEFB;} .s-p{fill:#E0BEFB;}
        .bg-o{fill:#FFF1DC;} .tx-o{fill:#B36A00;} .c-o{stroke:#FFE0B8;} .f-o{fill:#FFC97A;} .s-o{fill:#FFC97A;}
        .bg-r{fill:#FFECEC;} .tx-r{fill:#C42B2B;} .c-r{stroke:#FFD0D0;} .f-r{fill:#FFA3A3;} .s-r{fill:#FFA3A3;}
        .bg-t{fill:#DDFAF5;} .tx-t{fill:#007F6E;} .c-t{stroke:#B8F0E7;} .f-t{fill:#7FE5D6;} .s-t{fill:#7FE5D6;}
        .h1{font-size:25px;font-weight:900;fill:#3C3C3C;letter-spacing:-0.5px;}
        .h2{font-size:12px;font-weight:700;fill:#AFAFAF;}
        .ttl{font-size:13px;font-weight:800;fill:#3C3C3C;}
        .val{font-size:10.5px;font-weight:800;}
        .cap{font-size:11px;font-weight:700;fill:#AFAFAF;}
        .info{font-size:9.5px;font-weight:700;fill:#AFAFAF;letter-spacing:.005em;}
      </style>

      <rect width="420" height="4420" fill="#FFFFFF"/>
      <circle cx="20"  cy="90"   r="200" fill="url(#blobG)"/>
      <circle cx="410" cy="1400" r="220" fill="url(#blobB)"/>
      <circle cx="10"  cy="2600" r="210" fill="url(#blobP)"/>
      <circle cx="410" cy="3700" r="220" fill="url(#blobB)"/>

      <!-- HEADER -->
      <text x="210" y="70" text-anchor="middle" font-size="42">🌡️</text>
      <text x="210" y="118" text-anchor="middle" class="h1">Specific Heat Capacity</text>
      <text x="210" y="146" text-anchor="middle" class="h2">30 materials · J/(kg·K) · bar length on log scale</text>

      <!-- 01 · c (definition) -->
      <rect class="sh s-g" x="16" y="181" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="176" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="192" width="32" height="32" rx="11"/>
      <text x="48" y="213" text-anchor="middle" font-size="15">🌡️</text>
      <text x="76" y="213" class="ttl">Specific heat capacity c</text>
      <foreignObject x="210" y="197" width="178" height="22">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:#4B8B00;">
          <math xmlns="http://www.w3.org/1998/Math/MathML"><mi>c</mi><mo>=</mo><mfrac><mi>Q</mi><mrow><mi>m</mi><mi>&#x394;T</mi></mrow></mfrac></math>
        </div>
      </foreignObject>
      <rect x="60" y="232" width="300" height="26" rx="6" fill="#EAF6DE" stroke="#58CC02" stroke-width="2"/>
      <rect x="62" y="234" width="30" height="22" rx="4" fill="#A5E88A"/>
      <rect x="30" y="272" width="360" height="0" fill="none"/>
      <text x="210" y="290" text-anchor="middle" class="info">energy to raise 1 kg by 1 K — the property that matters</text>

      <!-- 02 · C (heat capacity) -->
      <rect class="sh s-g" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="316" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="332" width="32" height="32" rx="11"/>
      <text x="48" y="353" text-anchor="middle" font-size="15">🪣</text>
      <text x="76" y="353" class="ttl">Heat capacity C</text>
      <foreignObject x="210" y="337" width="178" height="22">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:#4B8B00;">
          <math xmlns="http://www.w3.org/1998/Math/MathML"><mi>C</mi><mo>=</mo><mi>m</mi><mi>c</mi></math>
        </div>
      </foreignObject>
      <text x="210" y="290" text-anchor="middle" class="info">extensive — depends on how much material you have</text>

      <!-- 03 · C_m (molar) -->
      <rect class="sh s-g" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="456" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="472" width="32" height="32" rx="11"/>
      <text x="48" y="493" text-anchor="middle" font-size="15">⚗️</text>
      <text x="76" y="493" class="ttl">Molar heat capacity C_m</text>
      <foreignObject x="210" y="477" width="178" height="22">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:#4B8B00;">
          <math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>C</mi><mi>m</mi></msub><mo>=</mo><mfrac><mi>C</mi><mi>n</mi></mfrac></math>
        </div>
      </foreignObject>
      <text x="210" y="530" text-anchor="middle" class="info">per mole — useful for chemistry, J/(mol·K)</text>

      <!-- 04 · volumetric -->
      <rect class="sh s-g" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="596" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="612" width="32" height="32" rx="11"/>
      <text x="48" y="633" text-anchor="middle" font-size="15">📦</text>
      <text x="76" y="633" class="ttl">Volumetric heat capacity</text>
      <foreignObject x="210" y="617" width="178" height="22">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:#4B8B00;">
          <math xmlns="http://www.w3.org/1998/Math/MathML"><mi>&#x3C1;</mi><mi>c</mi></math>
        </div>
      </foreignObject>
      <text x="210" y="670" text-anchor="middle" class="info">per volume — key for buildings, soil, heat storage</text>

      <!-- 05 · γ (ratio) -->
      <rect class="sh s-g" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="736" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="752" width="32" height="32" rx="11"/>
      <text x="48" y="773" text-anchor="middle" font-size="15">♨️</text>
      <text x="76" y="773" class="ttl">Specific heat ratio γ</text>
      <foreignObject x="210" y="757" width="178" height="22">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:#4B8B00;">
          <math xmlns="http://www.w3.org/1998/Math/MathML"><mi>&#x3B3;</mi><mo>=</mo><mfrac><msub><mi>c</mi><mi>p</mi></msub><msub><mi>c</mi><mi>v</mi></msub></mfrac></math>
        </div>
      </foreignObject>
      <text x="210" y="810" text-anchor="middle" class="info">for gases: c_p vs c_v · air ≈ 1.40, helium ≈ 1.66</text>

      <!-- 06 · Water -->
      <rect class="sh s-b" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="876" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="892" width="32" height="32" rx="11"/>
      <text x="48" y="913" text-anchor="middle" font-size="15">💧</text>
      <text x="76" y="913" class="ttl">Water (liquid, 20 °C)</text>
      <text x="388" y="913" text-anchor="end" class="val tx-b">4186 J/(kg·K)</text>
      <rect x="60" y="935" width="252" height="26" rx="6" fill="#8FD9FB"/>
      <rect x="60" y="935" width="300" height="26" rx="6" fill="none" stroke="#1CB0F6" stroke-width="2.5"/>
      <text x="210" y="983" text-anchor="middle" class="info">highest of any common liquid — oceans buffer the climate</text>

      <!-- 07 · Seawater -->
      <rect class="sh s-b" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="1016" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="1032" width="32" height="32" rx="11"/>
      <text x="48" y="1053" text-anchor="middle" font-size="15">🌊</text>
      <text x="76" y="1053" class="ttl">Seawater</text>
      <text x="388" y="1053" text-anchor="end" class="val tx-b">3850 J/(kg·K)</text>
      <rect x="60" y="1075" width="246" height="26" rx="6" fill="#8FD9FB"/>
      <rect x="60" y="1075" width="300" height="26" rx="6" fill="none" stroke="#1CB0F6" stroke-width="2.5"/>
      <text x="210" y="1123" text-anchor="middle" class="info">salt lowers it slightly — still very high</text>

      <!-- 08 · Ice -->
      <rect class="sh s-t" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="1156" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="1172" width="32" height="32" rx="11"/>
      <text x="48" y="1193" text-anchor="middle" font-size="15">🧊</text>
      <text x="76" y="1193" class="ttl">Ice (−10 °C)</text>
