<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Physics by Power — 30 Animated Quantities</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF; --ink:#3C3C3C; --ink-soft:#777777; --muted:#AFAFAF; --line:#E5E5E5;
    --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8; --green-t:#4B8B00;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Nunito', ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg);color:var(--ink);font-weight:700;line-height:1.45;
    min-height:100vh;overflow-x:hidden;
    padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
  }
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:2px solid var(--line);}
  .topbar-inner{max-width:640px;margin:0 auto;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:900;letter-spacing:-.02em;}
  .brand-icon{width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 var(--green-d);flex-shrink:0;}
  .brand .accent{color:var(--green-t);}
  .stat{display:inline-flex;align-items:center;gap:5px;background:#F7F7F7;border:2px solid var(--line);
    border-radius:999px;padding:5px 12px;font-size:.7rem;font-weight:900;color:var(--ink-soft);
    letter-spacing:.03em;white-space:nowrap;}
  main{max-width:640px;margin:0 auto;padding:0 8px;}
  .svg-wrap{margin:12px 8px 0;border-radius:18px;overflow:hidden;background:#FFFFFF;}
  .svg-wrap svg{display:block;width:100%;height:auto;}
  footer{max-width:640px;margin:32px auto 0;padding:22px 18px 8px;
    border-top:2px solid var(--line);text-align:center;
    font-size:.75rem;font-weight:700;color:var(--muted);line-height:1.7;}
  footer strong{color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.001ms !important;animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    html{scroll-behavior:auto;}
    svg *{animation:none !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div><span class="accent">Physics</span> by Power</div>
    </div>
    <div class="stat">⚡ 30 animated</div>
  </div>
</div>

<main>

  <div class="svg-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 4420" role="img"
         aria-label="Thirty animated power quantities.">

      <defs>
        <radialGradient id="blobG"><stop offset="0" stop-color="#D7FFB8" stop-opacity="0.9"/><stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobB"><stop offset="0" stop-color="#DDF4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobP"><stop offset="0" stop-color="#F3E4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/></radialGradient>

        <marker id="arrowG" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#58CC02"/></marker>
        <marker id="arrowB" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1CB0F6"/></marker>
        <marker id="arrowP" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#A855F7"/></marker>
        <marker id="arrowO" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#FF9600"/></marker>
        <marker id="arrowR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#FF4B4B"/></marker>
        <marker id="arrowT" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#00C2A8"/></marker>

        <path id="p10" d="M 60,1530 Q 90,1504 120,1530 Q 150,1556 180,1530 Q 210,1504 240,1530 Q 270,1556 300,1530 Q 330,1504 360,1530"/>
      </defs>

      <style>
        text{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;}
        .card{fill:#FFFFFF;stroke-width:2.5;}
        .sh{stroke:none;}
        .s-g{fill:#A5E88A;} .c-g{stroke:#D7F2C0;}
        .s-b{fill:#8FD9FB;} .c-b{stroke:#D8F0FE;}
        .s-p{fill:#E0BEFB;} .c-p{stroke:#EBD9FA;}
        .s-o{fill:#FFC97A;} .c-o{stroke:#FFE0B8;}
        .s-r{fill:#FFA3A3;} .c-r{stroke:#FFD0D0;}
        .s-t{fill:#7FE5D6;} .c-t{stroke:#B8F0E7;}
        .bg-g{fill:#EAF6DE;} .tx-g{fill:#4B8B00;}
        .bg-b{fill:#E1F3FE;} .tx-b{fill:#0B7BB0;}
        .bg-p{fill:#F3E4FF;} .tx-p{fill:#8B44B8;}
        .bg-o{fill:#FFF1DC;} .tx-o{fill:#B36A00;}
        .bg-r{fill:#FFECEC;} .tx-r{fill:#C42B2B;}
        .bg-t{fill:#DDFAF5;} .tx-t{fill:#007F6E;}
        .h1{font-size:25px;font-weight:900;fill:#3C3C3C;letter-spacing:-0.5px;}
        .h2{font-size:12px;font-weight:700;fill:#AFAFAF;}
        .ttl{font-size:13px;font-weight:800;fill:#3C3C3C;}
        .val{font-size:10.5px;font-weight:800;}
        .cap{font-size:11px;font-weight:700;fill:#AFAFAF;}
        .dim{font-size:10px;font-weight:800;}
        .arr{stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}
      </style>

      <rect width="420" height="4420" fill="#FFFFFF"/>
      <circle cx="20"  cy="90"   r="200" fill="url(#blobG)"/>
      <circle cx="410" cy="1400" r="220" fill="url(#blobB)"/>
      <circle cx="10"  cy="2600" r="210" fill="url(#blobP)"/>
      <circle cx="410" cy="3700" r="220" fill="url(#blobB)"/>

      <!-- ===== HEADER ===== -->
      <text x="210" y="70" text-anchor="middle" font-size="42">⚡
        <animate attributeName="opacity" values="0.75;1;0.75" dur="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="210" y="118" text-anchor="middle" class="h1">Physics by Power</text>
      <text x="210" y="146" text-anchor="middle" class="h2">30 powers — measured in watts.</text>

      <!-- ============ 01 · POWER P ============ -->
      <rect class="sh s-g" x="16" y="181" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="176" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="192" width="32" height="32" rx="11"/>
      <text x="48" y="213" text-anchor="middle" font-size="15">⚡</text>
      <text x="76" y="213" class="ttl">Power P</text>
      <text x="388" y="213" text-anchor="end" class="val tx-g">P = W / t</text>
      <line x1="70" y1="258" x2="350" y2="258" stroke="#D7F2C0" stroke-width="2.5" stroke-linecap="round"/>
      <g fill="#4B8B00">
        <circle cy="258" r="5"><animate attributeName="cx" values="78;342" dur="2s" repeatCount="indefinite"/></circle>
        <circle cy="258" r="5"><animate attributeName="cx" values="78;342" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
        <circle cy="258" r="5"><animate attributeName="cx" values="78;342" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
        <circle cy="258" r="5"><animate attributeName="cx" values="78;342" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
      </g>
      <text x="210" y="292" text-anchor="middle" class="dim tx-g">1 J / s = 1 W</text>

      <!-- ============ 02 · MECHANICAL POWER ============ -->
      <rect class="sh s-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="316" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="332" width="32" height="32" rx="11"/>
      <text x="48" y="353" text-anchor="middle" font-size="15">🚜</text>
      <text x="76" y="353" class="ttl">Mechanical power</text>
      <text x="388" y="353" text-anchor="end" class="val tx-b">P = F·v</text>
      <rect x="150" y="368" width="60" height="38" rx="8" fill="#E1F3FE" stroke="#1CB0F6" stroke-width="2.5"/>
      <text x="180" y="392" text-anchor="middle" font-size="12" font-weight="900" fill="#0B7BB0">m</text>
      <line x1="212" y1="387" x2="288" y2="387" stroke="#1CB0F6" class="arr" marker-end="url(#arrowB)">
        <animate attributeName="x2" values="276;296;276" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="252" y="379" text-anchor="middle" class="dim tx-b">F</text>
      <line x1="150" y1="424" x2="256" y2="424" stroke="#0B7BB0" class="arr" marker-end="url(#arrowB)">
        <animate attributeName="x2" values="244;264;244" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="205" y="438" text-anchor="middle" class="dim tx-b">v</text>

      <!-- ============ 03 · ELECTRICAL POWER ============ -->
      <rect class="sh s-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="456" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="472" width="32" height="32" rx="11"/>
      <text x="48" y="493" text-anchor="middle" font-size="15">💡</text>
      <text x="76" y="493" class="ttl">Electrical power</text>
      <text x="388" y="493" text-anchor="end" class="val tx-p">P = V·I</text>
      <rect x="90" y="514" width="56" height="42" rx="8" fill="#F3E4FF" stroke="#A855F7" stroke-width="2.5"/>
      <text x="118" y="541" text-anchor="middle" font-size="13" font-weight="900" fill="#8B44B8">V</text>
      <line x1="146" y1="535" x2="272" y2="535" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="294" cy="535" r="20" fill="#F3E4FF" stroke="#A855F7" stroke-width="2.5">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <line x1="314" y1="535" x2="350" y2="535" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="180" y1="560" x2="248" y2="560" stroke="#8B44B8" class="arr" marker-end="url(#arrowP)">
        <animate attributeName="x2" values="240;256;240" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <text x="214" y="576" text-anchor="middle" class="dim tx-p">I</text>

      <!-- ============ 04 · ACTIVE POWER ============ -->
      <rect class="sh s-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="596" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="612" width="32" height="32" rx="11"/>
      <text x="48" y="633" text-anchor="middle" font-size="15">📐</text>
      <text x="76" y="633" class="ttl">Active power</text>
      <text x="388" y="633" text-anchor="end" class="val tx-o">VI cos φ</text>
      <line x1="150" y1="692" x2="275" y2="692" stroke="#FFC97A" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="275" y1="646" x2="275" y2="692" stroke="#FFC97A" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="150" y1="692" x2="275" y2="646" stroke="#FF9600" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 186,692 A 36,36 0 0,1 184,681" fill="none" stroke="#FF9600" stroke-width="2"/>
      <circle cx="275" cy="646" r="4" fill="#FF9600">
        <animate attributeName="r" values="3;5;3" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="215" y="708" text-anchor="middle" class="dim tx-o">P</text>
      <text x="287" y="646" class="dim tx-o">S</text>
      <text x="176" y="682" text-anchor="middle" class="dim tx-o">φ</text>

      <!-- ============ 05 · REACTIVE POWER ============ -->
      <rect class="sh s-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="736" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="752" width="32" height="32" rx="11"/>
      <text x="48" y="773" text-anchor="middle" font-size="15">🔃</text>
      <text x="76" y="773" class="ttl">Reactive power Q</text>
      <text x="388" y="773" text-anchor="end" class="val tx-r">var</text>
      <line x1="80" y1="848" x2="350" y2="848" stroke="#FFD0D0" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="150" y1="848" x2="150" y2="794" stroke="#FF4B4B" class="arr" marker-end="url(#arrowR)">
        <animate attributeName="y2" values="804;788;804" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <path d="M 150,836 L 162,836 L 162,848" fill="none" stroke="#FF4B4B" stroke-width="1.8"/>
      <text x="164" y="802" class="dim tx-r">Q</text>
      <text x="196" y="842" class="dim tx-r">90°</text>

      <!-- ============ 06 · APPARENT POWER ============ -->
      <rect class="sh s-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="876" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="892" width="32" height="32" rx="11"/>
      <text x="48" y="913" text-anchor="middle" font-size="15">📊</text>
      <text x="76" y="913" class="ttl">Apparent power S</text>
      <text x="388" y="913" text-anchor="end" class="val tx-t">VA</text>
      <line x1="130" y1="980" x2="250" y2="980" stroke="#00C2A8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="250" y1="980" x2="250" y2="930" stroke="#00C2A8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="130" y1="980" x2="250" y2="930" stroke="#007F6E" stroke-width="2.5" stroke-linecap="round"/>
      <text x="190" y="996" text-anchor="middle" class="dim tx-t">P</text>
      <text x="258" y="960" class="dim tx-t">Q</text>
      <text x="182" y="950" class="dim tx-t">S</text>

      <!-- ============ 07 · AVERAGE POWER ============ -->
      <rect class="sh s-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="1016" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="1032" width="32" height="32" rx="11"/>
      <text x="48" y="1053" text-anchor="middle" font-size="15">📉</text>
      <text x="76" y="1053" class="ttl">Average power</text>
      <text x="388" y="1053" text-anchor="end" class="val tx-g">P_avg</text>
      <line x1="60" y1="1122" x2="360" y2="1122" stroke="#D7F2C0" stroke-width="1.5"/>
      <path d="M 70,1122 Q 105,1078 140,1122 Q 175,1078 210,1122 Q 245,1078 280,1122 Q 315,1078 350,1122"
            fill="none" stroke="#58CC02" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="60" y1="1102" x2="360" y2="1102" stroke="#4B8B00" stroke-width="2" stroke-dasharray="5 4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </line>
      <text x="384" y="1106" text-anchor="end" class="dim tx-g">avg</text>

      <!-- ============ 08 · PEAK POWER ============ -->
      <rect class="sh s-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="1156" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="1172" width="32" height="32" rx="11"/>
      <text x="48" y="1193" text-anchor="middle" font-size="15">📈</text>
      <text x="76" y="1193" class="ttl">Peak power</text>
      <text x="388" y="1193" text-anchor="end" class="val tx-b">P_peak</text>
      <line x1="60" y1="1272" x2="360" y2="1272" stroke="#D8F0FE" stroke-width="1.5"/>
      <path d="M 70,1272 L 150,1272 L 165,1216 L 180,1272 L 350,1272"
            fill="none" stroke="#1CB0F6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="60" y1="1216" x2="200" y2="1216" stroke="#1CB0F6" stroke-width="1.5" stroke-dasharray="4 3">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <circle cx="165" cy="1216" r="4.5" fill="#0B7BB0">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="224" y="1220" class="dim tx-b">peak</text>

      <!-- ============ 09 · RMS POWER ============ -->
      <rect class="sh s-p" x="16" y="1301" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="1296" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="1312" width="32" height="32" rx="11"/>
      <text x="48" y="1333" text-anchor="middle" font-size="15">📊</text>
      <text x="76" y="1333" class="ttl">RMS power</text>
      <text x="388" y="1333" text-anchor="end" class="val tx-p">P_rms</text>
      <line x1="60" y1="1390" x2="360" y2="1390" stroke="#EBD9FA" stroke-width="1.5"/>
      <path d="M 70,1390 Q 105,1360 140,1390 Q 175,1420 210,1390 Q 245,1360 280,1390 Q 315,1420 350,1390"
            fill="none" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="60" y1="1369" x2="360" y2="1369" stroke="#8B44B8" stroke-width="2" stroke-dasharray="5 4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </line>
      <text x="384" y="1373" text-anchor="end" class="dim tx-p">rms</text>

      <!-- ============ 10 · INSTANTANEOUS POWER ============ -->
      <rect class="sh s-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="1436" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="1452" width="32" height="32" rx="11"/>
      <text x="48" y="1473" text-anchor="middle" font-size="15">〰️</text>
      <text x="76" y="1473" class="ttl">Instantaneous power p(t)</text>
      <text x="388" y="1473" text-anchor="end" class="val tx-o">p(t)</text>
      <line x1="60" y1="1530" x2="360" y2="1530" stroke="#FFE0B8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <use href="#p10" fill="none" stroke="#FF9600" stroke-width="2.5" stroke-linecap="round"/>
      <circle r="5" fill="#B36A00">
        <animateMotion dur="2.6s" repeatCount="indefinite">
          <mpath href="#p10"/>
        </animateMotion>
      </circle>

      <!-- ============ 11 · JOULE HEATING ============ -->
      <rect class="sh s-r" x="16" y="1581" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="1576" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="1592" width="32" height="32" rx="11"/>
      <text x="48" y="1613" text-anchor="middle" font-size="15">♨️</text>
      <text x="76" y="1613" class="ttl">Joule heating</text>
      <text x="388" y="1613" text-anchor="end" class="val tx-r">I²R</text>
      <line x1="56" y1="1663" x2="96" y2="1663" stroke="#FF4B4B" class="arr" marker-end="url(#arrowR)"/>
      <rect x="100" y="1645" width="110" height="36" rx="8" fill="#FFECEC" stroke="#FF4B4B" stroke-width="2.5"/>
      <text x="155" y="1669" text-anchor="middle" font-size="12" font-weight="900" fill="#C42B2B">R</text>
      <g fill="none" stroke="#FF4B4B" stroke-width="2.5" stroke-linecap="round">
        <path d="M 240,1650 q 7,6 0,12 q -7,6 0,12">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M 266,1650 q 7,6 0,12 q -7,6 0,12">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
        </path>
        <path d="M 292,1650 q 7,6 0,12 q -7,6 0,12">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
        </path>
      </g>
      <text x="340" y="1669" text-anchor="middle" class="dim tx-r">heat</text>
