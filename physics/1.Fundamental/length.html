<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1760" role="img"
     aria-label="Sixteen mobile-first UI widgets, each using scaleX or scaleY to represent a length or value. Duolingo-inspired light theme.">

  <defs>
    <!-- ============ Horizontal gradients (progress fills) ============ -->
    <linearGradient id="gGreenH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58CC02"/><stop offset="1" stop-color="#8FE22E"/>
    </linearGradient>
    <linearGradient id="gBlueH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1CB0F6"/><stop offset="1" stop-color="#5BCBFF"/>
    </linearGradient>
    <linearGradient id="gPurpleH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CE82FF"/><stop offset="1" stop-color="#E2ADFF"/>
    </linearGradient>
    <linearGradient id="gRedH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4B4B"/><stop offset="1" stop-color="#FF8080"/>
    </linearGradient>
    <linearGradient id="gOrangeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9600"/><stop offset="1" stop-color="#FFBE4D"/>
    </linearGradient>
    <linearGradient id="gTealH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C2A8"/><stop offset="1" stop-color="#3FDCC6"/>
    </linearGradient>

    <!-- ============ Vertical gradients (bars grow from baseline) ============ -->
    <linearGradient id="gGreenV" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#46A302"/><stop offset="1" stop-color="#8FE22E"/>
    </linearGradient>
    <linearGradient id="gPurpleV" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#E2ADFF"/>
    </linearGradient>

    <!-- ============ Soft background blobs ============ -->
    <radialGradient id="blobG">
      <stop offset="0" stop-color="#D7FFB8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB">
      <stop offset="0" stop-color="#DDF4FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobP">
      <stop offset="0" stop-color="#F3E4FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/>
    </radialGradient>

    <!-- ============ Clip paths (keep rounded tracks crisp while fill scales) ============ -->
    <clipPath id="cp1"><rect x="38"  y="252" width="296" height="20" rx="10"/></clipPath>
    <clipPath id="cp2"><rect x="386" y="254" width="296" height="12" rx="6"/></clipPath>
    <clipPath id="cp3"><rect x="45"  y="435" width="266" height="42" rx="9"/></clipPath>
    <clipPath id="cp4a"><rect x="386" y="430" width="296" height="16" rx="8"/></clipPath>
    <clipPath id="cp4b"><rect x="386" y="472" width="296" height="16" rx="8"/></clipPath>
    <clipPath id="cp5"><rect x="38"  y="634" width="296" height="10" rx="5"/></clipPath>
    <clipPath id="cp16"><rect x="386" y="1566" width="296" height="14" rx="7"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Nunito', ui-rounded, 'Segoe UI', system-ui, -apple-system, sans-serif; }

    /* Card shell */
    .card { fill:#FFFFFF; stroke-width:2.5; }
    .sh   { stroke:none; }

    /* Accent families — shadow fill + card border */
    .s-g{fill:#A5E88A;} .c-g{stroke:#D7F2C0;}
    .s-b{fill:#8FD9FB;} .c-b{stroke:#D8F0FE;}
    .s-p{fill:#E0BEFB;} .c-p{stroke:#EBD9FA;}
    .s-o{fill:#FFC97A;} .c-o{stroke:#FFE0B8;}
    .s-r{fill:#FFA3A3;} .c-r{stroke:#FFD0D0;}
    .s-t{fill:#7FE5D6;} .c-t{stroke:#B8F0E7;}

    /* Typography */
    .hdr  { font-size:25px; font-weight:900; fill:#3C3C3C; letter-spacing:-0.4px; }
    .sub  { font-size:13px; font-weight:700; fill:#AFAFAF; }
    .ttl  { font-size:14px; font-weight:800; fill:#3C3C3C; }
    .cap  { font-size:11px; font-weight:700; fill:#AFAFAF; }
    .lbl  { font-size:10px; font-weight:800; fill:#AFAFAF; letter-spacing:0.5px; }
    .val  { font-size:14px; font-weight:800; }
  </style>

  <!-- ================= CANVAS ================= -->
  <rect width="720" height="1760" fill="#FFFFFF"/>
  <circle cx="30"  cy="120"  r="230" fill="url(#blobG)"/>
  <circle cx="700" cy="880"  r="250" fill="url(#blobB)"/>
  <circle cx="10"  cy="1520" r="230" fill="url(#blobP)"/>

  <!-- ================= HEADER ================= -->
  <text x="360" y="52" text-anchor="middle" font-size="36">📐</text>
  <text x="360" y="104" text-anchor="middle" class="hdr">Length is a scale on a fixed shape</text>
  <text x="360" y="132" text-anchor="middle" class="sub">Sixteen widgets. One primitive.</text>

  <!-- ============================================================ -->
  <!-- 1. PROGRESS BAR — green — (20, 168)                          -->
  <!-- ============================================================ -->
  <rect class="sh s-g" x="20" y="173" width="332" height="172" rx="20"/>
  <rect class="card c-g" x="20" y="168" width="332" height="172" rx="20"/>
  <text x="42" y="202" font-size="17">📊</text>
  <text x="70" y="202" class="ttl">Progress bar</text>
  <text x="334" y="202" text-anchor="end" class="val" fill="#4B8B00">65%</text>
  <rect x="38" y="252" width="296" height="20" rx="10" fill="#EAF6DE"/>
  <g clip-path="url(#cp1)">
    <g transform="translate(38,252)">
      <rect width="296" height="20" fill="url(#gGreenH)">
        <animateTransform attributeName="transform" type="scale"
          values="0 1; 1 1; 1 1; 0 1" keyTimes="0;0.25;0.75;1"
          dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <text x="38" y="320" class="cap">One rect. Its length is the value.</text>

  <!-- ============================================================ -->
  <!-- 2. VOLUME SLIDER — blue — (368, 168)                         -->
  <!-- ============================================================ -->
  <rect class="sh s-b" x="368" y="173" width="332" height="172" rx="20"/>
  <rect class="card c-b" x="368" y="168" width="332" height="172" rx="20"/>
  <text x="390" y="202" font-size="17">🔊</text>
  <text x="418" y="202" class="ttl">Volume slider</text>
  <text x="682" y="202" text-anchor="end" class="val" fill="#0B7BB0">70%</text>
  <rect x="386" y="254" width="296" height="12" rx="6" fill="#E1F3FE"/>
  <g clip-path="url(#cp2)">
    <g transform="translate(386,254)">
      <rect width="296" height="12" fill="url(#gBlueH)">
        <animateTransform attributeName="transform" type="scale"
          values="0.3 1; 0.9 1; 0.9 1; 0.3 1" keyTimes="0;0.4;0.6;1"
          dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <circle cy="260" r="12" fill="#FFFFFF" stroke="#1CB0F6" stroke-width="4">
    <animate attributeName="cx" values="474.8; 652.4; 652.4; 474.8" keyTimes="0;0.4;0.6;1"
      dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="386" y="320" class="cap">The knob and the fill share one value.</text>

  <!-- ============================================================ -->
  <!-- 3. BATTERY — green — (20, 358)                               -->
  <!-- ============================================================ -->
  <rect class="sh s-g" x="20" y="363" width="332" height="172" rx="20"/>
  <rect class="card c-g" x="20" y="358" width="332" height="172" rx="20"/>
  <text x="42" y="392" font-size="17">🔋</text>
  <text x="70" y="392" class="ttl">Battery indicator</text>
  <text x="334" y="392" text-anchor="end" class="val" fill="#4B8B00">78%</text>
  <rect x="38" y="428" width="280" height="56" rx="14" fill="none" stroke="#A5E88A" stroke-width="3"/>
  <rect x="322" y="446" width="10" height="20" rx="3" fill="#A5E88A"/>
  <g clip-path="url(#cp3)">
    <g transform="translate(45,435)">
      <rect width="266" height="42" fill="url(#gGreenH)">
        <animateTransform attributeName="transform" type="scale"
          values="0.15 1; 1 1; 1 1; 0.15 1" keyTimes="0;0.4;0.6;1"
          dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <text x="38" y="510" class="cap">Charge is a rect with a scale on X.</text>

  <!-- ============================================================ -->
  <!-- 4. HEALTH BAR — red — (368, 358)                             -->
  <!-- ============================================================ -->
  <rect class="sh s-r" x="368" y="363" width="332" height="172" rx="20"/>
  <rect class="card c-r" x="368" y="358" width="332" height="172" rx="20"/>
  <text x="390" y="392" font-size="17">❤️</text>
  <text x="418" y="392" class="ttl">Health bar</text>

  <text x="386" y="424" class="lbl">HP</text>
  <rect x="386" y="430" width="296" height="16" rx="8" fill="#FFECEC"/>
  <g clip-path="url(#cp4a)">
    <g transform="translate(386,430)">
      <rect width="296" height="16" fill="url(#gRedH)">
        <animateTransform attributeName="transform" type="scale"
          values="1 1; 0.3 1; 0.75 1; 1 1" keyTimes="0;0.35;0.6;1"
          dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <text x="386" y="466" class="lbl">MP</text>
  <rect x="386" y="472" width="296" height="16" rx="8" fill="#E3F2FD"/>
  <g clip-path="url(#cp4b)">
    <g transform="translate(386,472)">
      <rect width="296" height="16" fill="url(#gBlueH)">
        <animateTransform attributeName="transform" type="scale"
          values="0.6 1; 0.25 1; 0.8 1; 0.6 1" keyTimes="0;0.35;0.6;1"
          dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <text x="386" y="510" class="cap">Two bars. Two values. One track shape.</text>

  <!-- ============================================================ -->
  <!-- 5. TIMELINE SCRUBBER — blue — (20, 548)                      -->
  <!-- ============================================================ -->
  <rect class="sh s-b" x="20" y="553" width="332" height="172" rx="20"/>
  <rect class="card c-b" x="20" y="548" width="332" height="172" rx="20"/>
  <text x="42" y="582" font-size="17">⏱️</text>
  <text x="70" y="582" class="ttl">Timeline scrubber</text>
  <rect x="38" y="634" width="296" height="10" rx="5" fill="#E1F3FE"/>
  <g clip-path="url(#cp5)">
    <g transform="translate(38,634)">
      <rect width="296" height="10" fill="url(#gBlueH)">
        <animateTransform attributeName="transform" type="scale"
          values="0 1; 1 1; 1 1; 0 1" keyTimes="0;0.4;0.6;1"
          dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <circle cy="639" r="11" fill="#FFFFFF" stroke="#1CB0F6" stroke-width="3.5">
    <animate attributeName="cx" values="38; 334; 334; 38" keyTimes="0;0.4;0.6;1"
      dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="38"  y="672" class="lbl">0:00</text>
  <text x="334" y="672" text-anchor="end" class="lbl">3:42</text>
  <text x="38"  y="700" class="cap">The fill and the knob move as one.</text>

  <!-- ============================================================ -->
  <!-- 6. SIGNAL STRENGTH — green — (368, 548)                      -->
  <!-- ============================================================ -->
  <rect class="sh s-g" x="368" y="553" width="332" height="172" rx="20"/>
  <rect class="card c-g" x="368" y="548" width="332" height="172" rx="20"/>
  <text x="390" y="582" font-size="17">📶</text>
  <text x="418" y="582" class="ttl">Signal strength</text>

  <g transform="translate(446,668)">
    <rect x="-15" y="-16" width="30" height="16" rx="6" fill="url(#gGreenV)">
      <animateTransform attributeName="transform" type="scale" values="1 0.7; 1 1; 1 0.8; 1 1; 1 0.7" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(490,668)">
    <rect x="-15" y="-30" width="30" height="30" rx="6" fill="url(#gGreenV)">
      <animateTransform attributeName="transform" type="scale" values="1 0.8; 1 0.6; 1 1; 1 0.7; 1 0.8" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(534,668)">
    <rect x="-15" y="-44" width="30" height="44" rx="6" fill="url(#gGreenV)">
      <animateTransform attributeName="transform" type="scale" values="1 0.6; 1 0.9; 1 0.7; 1 1; 1 0.6" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(578,668)">
    <rect x="-15" y="-58" width="30" height="58" rx="6" fill="url(#gGreenV)">
      <animateTransform attributeName="transform" type="scale" values="1 0.7; 1 0.5; 1 0.9; 1 0.8; 1 1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(622,668)">
    <rect x="-15" y="-72" width="30" height="72" rx="6" fill="url(#gGreenV)">
      <animateTransform attributeName="transform" type="scale" values="1 0.9; 1 0.7; 1 1; 1 0.6; 1 0.9" dur="2.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="386" y="700" class="cap">Every bar scales from the same baseline.</text>

  <!-- ============================================================ -->
  <!-- 7. BAR CHART — purple — (20, 738)                            -->
  <!-- ============================================================ -->
  <rect class="sh s-p" x="20" y="743" width="332" height="172" rx="20"/>
  <rect class="card c-p" x="20" y="738" width="332" height="172" rx="20"/>
  <text x="42" y="772" font-size="17">📈</text>
  <text x="70" y="772" class="ttl">Bar chart</text>

  <g transform="translate(76,858)">
    <rect x="-13" y="-24" width="26" height="24" rx="6" fill="url(#gPurpleV)">
      <animateTransform attributeName="transform" type="scale" values="0 1; 1 1; 1 1; 0 1" keyTimes="0;0.2;0.8;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(120,858)">
    <rect x="-13" y="-46" width="26" height="46" rx="6" fill="url(#gPurpleV)">
      <animateTransform attributeName="transform" type="scale" values="0 1; 1 1; 1 1; 0 1" keyTimes="0;0.2;0.8;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(164,858)">
    <rect x="-13" y="-34" width="26" height="34" rx="6" fill="url(#gPurpleV)">
      <animateTransform attributeName="transform" type="scale" values="0 1; 1 1; 1 1; 0 1" keyTimes="0;0.2;0.8;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(208,858)">
    <rect x="-13" y="-60" width="26" height="60" rx="6" fill="url(#gPurpleV)">
      <animateTransform attributeName="transform" type="scale" values="0 1; 1 1; 1 1; 0 1" keyTimes="0;0.2;0.8;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(252,858)">
    <rect x="-13" y="-40" width="26" height="40" rx="6" fill="url(#gPurpleV)">
      <animateTransform attributeName="transform" type="scale" values="0 1; 1 1; 1 1; 0 1" keyTimes="0;0.2;0.8;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(296,858)">
    <rect x="-13" y="-72" width="26" height="72" rx="6" fill="url(#gPurpleV)">
      <animateTransform attributeName="transform" type="scale" values="0 1; 1 1; 1 1; 0 1" keyTimes="0;0.2;0.8;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="38" y="890" class="cap">Six rects, six scaleY values.</text>

  <!-- ============================================================ -->
  <!-- 8. TEXT UNDERLINE — blue — (368, 738)                        -->
  <!-- ============================================================ -->
  <rect class="sh s-b" x="368" y="743" width="332" height="172" rx="20"/>
  <rect class="card c-b" x="368" y="738" width="332" height="172" rx="20"/>
  <text x="390" y="772" font-size="17">✏️</text>
  <text x="418" y="772" class="ttl">Text underline</text>
  <text x="534" y="846" text-anchor="middle" font-size="30" font-weight="900" fill="#3C3C3C">About</text>
  <g transform="translate(490,860)">
    <rect width="88" height="5" rx="2.5" fill="url(#gBlueH)">
      <animateTransform attributeName="transform" type="scale"
        values="0 1; 1 1; 1 1; 0 1" keyTimes="0;0.3;0.7;1"
        dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="386" y="890" class="cap">The underline grows from the left edge.</text>

  <!-- ============================================================ -->
  <!-- 9. DIVIDER LINE — orange — (20, 928)                         -->
  <!-- ============================================================ -->
  <rect class="sh s-o" x="20" y="933" width="332" height="172" rx="20"/>
  <rect class="card c-o" x="20" y="928" width="332" height="172" rx="20"/>
  <text x="42" y="962" font-size="17">➖</text>
  <text x="70" y="962" class="ttl">Divider line</text>
  <circle cx="48"  cy="1036" r="5" fill="#FFC97A"/>
  <circle cx="324" cy="1036" r="5" fill="#FFC97A"/>
  <g transform="translate(186,1035)">
    <rect x="-138" width="276" height="3" rx="1.5" fill="url(#gOrangeH)">
      <animateTransform attributeName="transform" type="scale"
        values="0 1; 1 1; 1 1; 0 1" keyTimes="0;0.3;0.7;1"
        dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="38" y="1080" class="cap">Anchored in the centre. Only the length changes.</text>

  <!-- ============================================================ -->
  <!-- 10. ROPE TENSION — purple — (368, 928)                       -->
  <!-- ============================================================ -->
  <rect class="sh s-p" x="368" y="933" width="332" height="172" rx="20"/>
  <rect class="card c-p" x="368" y="928" width="332" height="172" rx="20"/>
  <text x="390" y="962" font-size="17">🪢</text>
  <text x="418" y="962" class="ttl">Rope tension</text>
  <path fill="none" stroke="url(#gPurpleH)" stroke-width="5" stroke-linecap="round"
        d="M 400 1030 Q 534 1062 668 1030">
    <animate attributeName="d"
      values="M 400 1030 Q 534 1062 668 1030; M 400 1030 Q 534 1032 668 1030; M 400 1030 Q 534 1062 668 1030"
      keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle cx="400" cy="1030" r="9" fill="#FFFFFF" stroke="#CE82FF" stroke-width="4"/>
  <circle cx="668" cy="1030" r="9" fill="#FFFFFF" stroke="#A78BFA" stroke-width="4"/>
  <text x="386" y="1080" class="cap">Sag → taut. The endpoints never move.</text>

  <!-- ============================================================ -->
  <!-- 11. PULL-TO-REFRESH — blue — (20, 1118)                      -->
  <!-- ============================================================ -->
  <rect class="sh s-b" x="20" y="1123" width="332" height="172" rx="20"/>
  <rect class="card c-b" x="20" y="1118" width="332" height="172" rx="20"/>
  <text x="42" y="1152" font-size="17">🔄</text>
  <text x="70" y="1152" class="ttl">Pull-to-refresh</text>
  <circle cx="186" cy="1210" r="30" fill="none" stroke="#E1F3FE" stroke-width="6"/>
  <circle cx="186" cy="1210" r="30" fill="none" stroke="url(#gBlueH)" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="188.5" stroke-dashoffset="188.5"
          transform="rotate(-90 186 1210)">
    <animate attributeName="stroke-dashoffset"
      values="188.5; 0; 0; 188.5" keyTimes="0;0.4;0.6;1"
      dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M 179 1205 L 186 1198 L 193 1205" fill="none" stroke="#AFAFAF" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="186" y1="1198" x2="186" y2="1220" stroke="#AFAFAF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="38" y="1270" class="cap">The arc length is the pull progress.</text>

  <!-- ============================================================ -->
  <!-- 12. NODE CONNECTOR — purple — (368, 1118)                    -->
  <!-- ============================================================ -->
  <rect class="sh s-p" x="368" y="1123" width="332" height="172" rx="20"/>
  <rect class="card c-p" x="368" y="1118" width="332" height="172" rx="20"/>
  <text x="390" y="1152" font-size="17">🔗</text>
  <text x="418" y="1152" class="ttl">Node connector</text>
  <line y1="1210" y2="1210" stroke="#CE82FF" stroke-width="4" stroke-linecap="round" x1="426" x2="426">
    <animate attributeName="x2"
      values="426; 642; 642; 426" keyTimes="0;0.4;0.6;1"
      dur="3.5s" repeatCount="indefinite"/>
  </line>
  <circle cx="410" cy="1210" r="16" fill="#FFFFFF" stroke="#CE82FF" stroke-width="4"/>
  <circle cx="658" cy="1210" r="16" fill="#FFFFFF" stroke="#A78BFA" stroke-width="4"/>
  <text x="386" y="1270" class="cap">The edge grows from node A to node B.</text>

  <!-- ============================================================ -->
  <!-- 13. RUBBER BAND — red — (20, 1308)                           -->
  <!-- ============================================================ -->
  <rect class="sh s-r" x="20" y="1313" width="332" height="172" rx="20"/>
  <rect class="card c-r" x="20" y="1308" width="332" height="172" rx="20"/>
  <text x="42" y="1342" font-size="17">🏹</text>
  <text x="70" y="1342" class="ttl">Rubber band</text>
  <path fill="none" stroke="#FF4B4B" stroke-width="5" stroke-linecap="round"
        d="M 60 1412 Q 120 1430 180 1412">
    <animate attributeName="d"
      values="M 60 1412 Q 120 1430 180 1412; M 60 1412 Q 190 1436 320 1412; M 60 1412 Q 190 1436 320 1412; M 60 1412 Q 120 1430 180 1412"
      keyTimes="0;0.4;0.6;1" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle cx="60" cy="1412" r="8" fill="#FF4B4B"/>
  <circle cy="1412" r="8" fill="#FF4B4B">
    <animate attributeName="cx" values="180; 320; 320; 180" keyTimes="0;0.4;0.6;1"
