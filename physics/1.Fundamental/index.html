<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" role="img"
     aria-label="Sixteen real UI widgets, each using scaleX or scaleY to represent a length or value.">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Clip paths to keep rounded tracks crisp while the fill scales -->
    <clipPath id="cp1"><rect x="46"  y="190" width="218" height="12" rx="6"/></clipPath>
    <clipPath id="cp2"><rect x="326" y="192" width="218" height="8"  rx="4"/></clipPath>
    <clipPath id="cp3"><rect x="610" y="184" width="168" height="38" rx="5"/></clipPath>
    <clipPath id="cp4a"><rect x="886" y="168" width="218" height="14" rx="7"/></clipPath>
    <clipPath id="cp4b"><rect x="886" y="208" width="218" height="14" rx="7"/></clipPath>
    <clipPath id="cp5"><rect x="46"  y="380" width="218" height="6"  rx="3"/></clipPath>

  <!-- Canvas -->
  <rect width="1150" height="820" fill="#0b0f19"/>

  <!-- Title -->
  <text x="30" y="46" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="24" font-weight="600" fill="#e2e8f0">Length is a scale on a fixed shape</text>
  <text x="30" y="70" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="13" fill="#64748b">Every widget below is one rect, one line, or one circle. The value lives only in scaleX / scaleY / an endpoint.</text>

  <!-- ============================================================ -->
  <!-- 1. PROGRESS BAR                                              -->
  <!-- ============================================================ -->

  <text x="46" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Progress bar</text>

  <g clip-path="url(#cp1)">

        <animateTransform attributeName="transform" type="scale"

          dur="4s" repeatCount="indefinite"/>
