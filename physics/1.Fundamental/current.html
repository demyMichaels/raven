<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Physics by Current — 30 Animated Quantities</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF; --ink:#3C3C3C; --ink-soft:#777777; --muted:#AFAFAF; --line:#E5E5E5;
    --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8; --green-t:#4B8B00;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Nunito', ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg);color:var(--ink);font-weight:700;line-height:1.45;
    min-height:100vh;overflow-x:hidden;
    padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
  }
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:2px solid var(--line);}
  .topbar-inner{max-width:640px;margin:0 auto;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:900;letter-spacing:-.02em;}
  .brand-icon{width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 var(--green-d);flex-shrink:0;}
  .brand .accent{color:var(--green-t);}
  .stat{display:inline-flex;align-items:center;gap:5px;background:#F7F7F7;border:2px solid var(--line);
    border-radius:999px;padding:5px 12px;font-size:.7rem;font-weight:900;color:var(--ink-soft);
    letter-spacing:.03em;white-space:nowrap;}
  main{max-width:640px;margin:0 auto;padding:0 8px;}
  .hero{margin:18px 8px 6px;
    background:linear-gradient(165deg, #EAFBD9 0%, #F7FFF0 55%, #FFFFFF 100%);
    border:2px solid var(--green-l);border-radius:22px;
    padding:22px 18px 20px;text-align:center;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle, rgba(88,204,2,.14), transparent 70%);
    top:-80px;right:-70px;pointer-events:none;}
  .hero .mascot{display:block;font-size:46px;line-height:1;margin-bottom:8px;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.06));
    animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .hero h1{font-size:clamp(1.5rem, 7vw, 2rem);font-weight:900;letter-spacing:-.03em;line-height:1.12;margin-bottom:8px;}
  .hero p{max-width:460px;margin:0 auto;font-size:.86rem;font-weight:700;color:var(--ink-soft);}
  .svg-wrap{margin:12px 8px 0;border-radius:18px;overflow:hidden;background:#FFFFFF;}
  .svg-wrap svg{display:block;width:100%;height:auto;}
  footer{max-width:640px;margin:32px auto 0;padding:22px 18px 8px;
    border-top:2px solid var(--line);text-align:center;
    font-size:.75rem;font-weight:700;color:var(--muted);line-height:1.7;}
  footer strong{color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.001ms !important;animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    html{scroll-behavior:auto;}
    svg *{animation:none !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div><span class="accent">Physics</span> by Current</div>
    </div>
    <div class="stat">⚡ 30 animated</div>
  </div>
</div>

<main>

  <section class="hero">
    <span class="mascot">⚡</span>
    <h1>Physics Measured as Current</h1>
    <p>Thirty animated currents — from the base SI ampere to lightning, photocurrent, and superconductors.</p>
  </section>

  <div class="svg-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 4420" role="img"
         aria-label="Thirty animated electric current quantities.">

      <defs>
        <radialGradient id="blobG"><stop offset="0" stop-color="#D7FFB8" stop-opacity="0.9"/><stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobB"><stop offset="0" stop-color="#DDF4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobP"><stop offset="0" stop-color="#F3E4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/></radialGradient>
        <!-- Named coil path for field current -->
        <path id="coilPath" d="M 150,2920 Q 150,2880 210,2880 Q 270,2880 270,2920 Q 270,2960 210,2960 Q 150,2960 150,2920"/>
      </defs>

      <style>
        text{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;}
        .card{fill:#FFFFFF;stroke-width:2.5;}
        .sh{stroke:none;}
        .s-g{fill:#A5E88A;} .c-g{stroke:#D7F2C0;}
        .s-b{fill:#8FD9FB;} .c-b{stroke:#D8F0FE;}
        .s-p{fill:#E0BEFB;} .c-p{stroke:#EBD9FA;}
        .s-o{fill:#FFC97A;} .c-o{stroke:#FFE0B8;}
        .s-r{fill:#FFA3A3;} .c-r{stroke:#FFD0D0;}
        .s-t{fill:#7FE5D6;} .c-t{stroke:#B8F0E7;}
        .bg-g{fill:#EAF6DE;} .tx-g{fill:#4B8B00;}
        .bg-b{fill:#E1F3FE;} .tx-b{fill:#0B7BB0;}
        .bg-p{fill:#F3E4FF;} .tx-p{fill:#8B44B8;}
        .bg-o{fill:#FFF1DC;} .tx-o{fill:#B36A00;}
        .bg-r{fill:#FFECEC;} .tx-r{fill:#C42B2B;}
        .bg-t{fill:#DDFAF5;} .tx-t{fill:#007F6E;}
        .h1{font-size:25px;font-weight:900;fill:#3C3C3C;letter-spacing:-0.5px;}
        .h2{font-size:12px;font-weight:700;fill:#AFAFAF;}
        .ttl{font-size:13px;font-weight:800;fill:#3C3C3C;}
        .val{font-size:10.5px;font-weight:800;}
        .cap{font-size:11px;font-weight:700;fill:#AFAFAF;}
        .dim{font-size:10px;font-weight:800;}
      </style>

      <rect width="420" height="4420" fill="#FFFFFF"/>
      <circle cx="20"  cy="90"   r="200" fill="url(#blobG)"/>
      <circle cx="410" cy="1400" r="220" fill="url(#blobB)"/>
      <circle cx="10"  cy="2600" r="210" fill="url(#blobP)"/>
      <circle cx="410" cy="3700" r="220" fill="url(#blobB)"/>

      <!-- ===== HEADER ===== -->
      <text x="210" y="70" text-anchor="middle" font-size="42">⚡
        <animate attributeName="opacity" values="0.75;1;0.75" dur="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="210" y="118" text-anchor="middle" class="h1">Physics by Current</text>
      <text x="210" y="146" text-anchor="middle" class="h2">30 electric currents — measured in amperes.</text>

      <!-- ============ 01 · ELECTRIC CURRENT I ============ -->
      <rect class="sh s-g" x="16" y="181" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="176" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="192" width="32" height="32" rx="11"/>
      <text x="48" y="213" text-anchor="middle" font-size="15">⚡</text>
      <text x="76" y="213" class="ttl">Electric current I</text>
      <text x="388" y="213" text-anchor="end" class="val tx-g">I = 5 A</text>
      <rect x="60" y="251" width="300" height="20" rx="10" fill="#EAF6DE" stroke="#58CC02" stroke-width="2"/>
      <circle cy="261" r="5" fill="#4B8B00"><animate attributeName="cx" values="80;345" dur="2s" repeatCount="indefinite"/></circle>
      <circle cy="261" r="5" fill="#4B8B00"><animate attributeName="cx" values="80;345" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cy="261" r="5" fill="#4B8B00"><animate attributeName="cx" values="80;345" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cy="261" r="5" fill="#4B8B00"><animate attributeName="cx" values="80;345" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cy="261" r="5" fill="#4B8B00"><animate attributeName="cx" values="80;345" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle>

      <!-- ============ 02 · DIRECT CURRENT ============ -->
      <rect class="sh s-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="332" width="32" height="32" rx="11"/>
      <text x="48" y="353" text-anchor="middle" font-size="15">🔋</text>
      <text x="76" y="353" class="ttl">Direct current DC</text>
      <text x="388" y="353" text-anchor="end" class="val tx-b">steady</text>
      <line x1="60" y1="401" x2="360" y2="401" stroke="#1CB0F6" stroke-width="3" stroke-linecap="round"/>
      <circle cy="401" r="5" fill="#1CB0F6"><animate attributeName="cx" values="80;345" dur="2s" repeatCount="indefinite"/></circle>
      <circle cy="401" r="5" fill="#1CB0F6"><animate attributeName="cx" values="80;345" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cy="401" r="5" fill="#1CB0F6"><animate attributeName="cx" values="80;345" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cy="401" r="5" fill="#1CB0F6"><animate attributeName="cx" values="80;345" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <polygon points="345,395 360,401 345,407" fill="#1CB0F6"/>
      <text x="210" y="432" text-anchor="middle" class="dim tx-b">one direction →</text>

      <!-- ============ 03 · ALTERNATING CURRENT · FIXED ============ -->
      <rect class="sh s-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="472" width="32" height="32" rx="11"/>
      <text x="48" y="493" text-anchor="middle" font-size="15">〰️</text>
      <text x="76" y="493" class="ttl">Alternating current AC</text>
      <text x="388" y="493" text-anchor="end" class="val tx-p">50 Hz</text>

      <!-- direction arrows that flip -->
      <polygon points="80,510 100,504 100,516" fill="#A855F7">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.95;1" dur="2.4s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="340,510 320,504 320,516" fill="#A855F7">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.45;0.95;1" dur="2.4s" repeatCount="indefinite"/>
      </polygon>

      <!-- wire -->
      <line x1="60" y1="541" x2="360" y2="541" stroke="#CE82FF" stroke-width="3" stroke-linecap="round"/>

      <!-- oscillating dots back and forth -->
      <circle cy="541" r="5" fill="#A855F7">
        <animate attributeName="cx" values="120;300;120" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cy="541" r="5" fill="#A855F7" opacity="0.85">
        <animate attributeName="cx" values="160;340;160" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cy="541" r="5" fill="#A855F7" opacity="0.7">
        <animate attributeName="cx" values="200;360;200" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cy="541" r="5" fill="#A855F7" opacity="0.85">
        <animate attributeName="cx" values="80;260;80" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cy="541" r="5" fill="#A855F7" opacity="0.7">
        <animate attributeName="cx" values="140;320;140" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </circle>

      <text x="210" y="572" text-anchor="middle" class="dim tx-p">back and forth ↔</text>

      <!-- ============ 04 · PEAK CURRENT ============ -->
      <rect class="sh s-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="612" width="32" height="32" rx="11"/>
      <text x="48" y="633" text-anchor="middle" font-size="15">📈</text>
      <text x="76" y="633" class="ttl">Peak current I₀</text>
      <text x="388" y="633" text-anchor="end" class="val tx-o">I₀ = 7.07 A</text>
      <line x1="60" y1="681" x2="360" y2="681" stroke="#FFE0B8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M 60,681 Q 90,646 120,681 Q 150,716 180,681 Q 210,646 240,681 Q 270,716 300,681 Q 330,646 360,681"
            fill="none" stroke="#FF9600" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="90" y1="646" x2="90" y2="681" stroke="#FF9600" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="90" cy="646" r="4" fill="#FF9600">
        <animate attributeName="r" values="3;5;3" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="90" y="640" text-anchor="middle" class="dim tx-o">I₀</text>

      <!-- ============ 05 · RMS CURRENT ============ -->
      <rect class="sh s-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="752" width="32" height="32" rx="11"/>
      <text x="48" y="773" text-anchor="middle" font-size="15">📊</text>
      <text x="76" y="773" class="ttl">RMS current I_rms</text>
      <text x="388" y="773" text-anchor="end" class="val tx-r">I₀/√2</text>
      <line x1="60" y1="821" x2="360" y2="821" stroke="#FFD0D0" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M 60,821 Q 90,786 120,821 Q 150,856 180,821 Q 210,786 240,821 Q 270,856 300,821 Q 330,786 360,821"
            fill="none" stroke="#FF8080" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
      <line x1="60" y1="796" x2="360" y2="796" stroke="#FF4B4B" stroke-width="2">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </line>
      <text x="365" y="799" text-anchor="end" class="dim tx-r">rms</text>

      <!-- ============ 06 · AVERAGE CURRENT ============ -->
      <rect class="sh s-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="892" width="32" height="32" rx="11"/>
      <text x="48" y="913" text-anchor="middle" font-size="15">📉</text>
      <text x="76" y="913" class="ttl">Average current I_avg</text>
      <text x="388" y="913" text-anchor="end" class="val tx-t">half-wave</text>
      <line x1="60" y1="961" x2="360" y2="961" stroke="#B8F0E7" stroke-width="1.5"/>
      <path d="M 60,961 Q 90,926 120,961 L 120,961 Q 150,961 180,961 Q 210,926 240,961 Q 270,961 300,961 Q 330,926 360,961"
            fill="none" stroke="#00C2A8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="60" y1="944" x2="360" y2="944" stroke="#00C2A8" stroke-width="2" stroke-dasharray="4 3">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </line>
      <text x="365" y="947" text-anchor="end" class="dim tx-t">avg</text>

      <!-- ============ 07 · DISPLACEMENT CURRENT ============ -->
      <rect class="sh s-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="1032" width="32" height="32" rx="11"/>
      <text x="48" y="1053" text-anchor="middle" font-size="15">⚡</text>
      <text x="76" y="1053" class="ttl">Displacement current I_d</text>
      <text x="388" y="1053" text-anchor="end" class="val tx-g">dD/dt</text>
      <rect x="130" y="1070" width="10" height="60" rx="3" fill="#58CC02"/>
      <rect x="260" y="1070" width="10" height="60" rx="3" fill="#58CC02"/>
      <text x="118" y="1090" text-anchor="end" font-size="14" font-weight="900" fill="#4B8B00">+</text>
      <text x="282" y="1090" font-size="14" font-weight="900" fill="#4B8B00">−</text>
      <g stroke="#58CC02" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
        <line x1="160" y1="1090" x2="240" y2="1090"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></line>
        <line x1="160" y1="1100" x2="240" y2="1100"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></line>
        <line x1="160" y1="1110" x2="240" y2="1110"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></line>
      </g>
      <text x="200" y="1085" text-anchor="middle" class="dim tx-g">∂D/∂t</text>

      <!-- ============ 08 · CONDUCTION CURRENT ============ -->
      <rect class="sh s-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="1172" width="32" height="32" rx="11"/>
      <text x="48" y="1193" text-anchor="middle" font-size="15">🔌</text>
      <text x="76" y="1193" class="ttl">Conduction current</text>
      <text x="388" y="1193" text-anchor="end" class="val tx-b">e⁻ in metal</text>

        <circle cy="1240" r="3.5"><animate attributeName="cx" values="80;340" dur="1.8s" repeatCount="indefinite"/></circle>

      <!-- ============ 09 · CONVECTION CURRENT ============ -->
      <rect class="sh s-p" x="16" y="1301" width="388" height="130" rx="20"/>

      <rect class="bg-p" x="32" y="1312" width="32" height="32" rx="11"/>

      <text x="76" y="1333" class="ttl">Convection current</text>
      <text x="388" y="1333" text-anchor="end" class="val tx-p">ions in fluid</text>
      <path d="M 90,1400 Q 130,1350 170,1400 Q 210,1450 250,1400 Q 290,1350 330,1400" fill="none" stroke="#A855F7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <circle cx="110" cy="1372" r="6" fill="#A855F7">

        <animate attributeName="cy" values="1395;1355;1395" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="1372" r="6" fill="#A855F7">
        <animate attributeName="cx" values="180;150;180" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="1355;1395;1355" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="270" cy="1372" r="6" fill="#A855F7">
        <animate attributeName="cx" values="270;300;270" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="1395;1358;1395" dur="3s" repeatCount="indefinite"/>
      </circle>
      <g font-size="11" font-weight="900" fill="#8B44B8">
        <text x="100" y="1385">+</text>
        <text x="185" y="1378">−</text>
        <text x="280" y="1385">+</text>
      </g>

      <!-- ============ 10 · LEAKAGE CURRENT ============ -->
      <rect class="sh s-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="1452" width="32" height="32" rx="11"/>
      <text x="48" y="1473" text-anchor="middle" font-size="15">💧</text>
      <text x="76" y="1473" class="ttl">Leakage current</text>
      <text x="388" y="1473" text-anchor="end" class="val tx-o">I_leak</text>
      <rect x="80" y="1508" width="260" height="44" rx="4" fill="#FFF1DC" stroke="#FF9600" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="210" y="1536" text-anchor="middle" class="dim tx-o">insulator</text>
