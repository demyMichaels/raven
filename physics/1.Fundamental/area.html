<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Physics by Area — 30 Animated Quantities</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF; --ink:#3C3C3C; --ink-soft:#777777; --muted:#AFAFAF; --line:#E5E5E5;
    --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8; --green-t:#4B8B00;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Nunito', ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg);color:var(--ink);font-weight:700;line-height:1.45;
    min-height:100vh;overflow-x:hidden;
    padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
  }
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:2px solid var(--line);}
  .topbar-inner{max-width:640px;margin:0 auto;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:900;letter-spacing:-.02em;}
  .brand-icon{width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 var(--green-d);flex-shrink:0;}
  .brand .accent{color:var(--green-t);}
  .stat{display:inline-flex;align-items:center;gap:5px;background:#F7F7F7;border:2px solid var(--line);
    border-radius:999px;padding:5px 12px;font-size:.7rem;font-weight:900;color:var(--ink-soft);
    letter-spacing:.03em;white-space:nowrap;}
  main{max-width:640px;margin:0 auto;padding:0 8px;}
  .svg-wrap{margin:12px 8px 0;border-radius:18px;overflow:hidden;background:#FFFFFF;}
  .svg-wrap svg{display:block;width:100%;height:auto;}
  footer{max-width:640px;margin:32px auto 0;padding:22px 18px 8px;
    border-top:2px solid var(--line);text-align:center;
    font-size:.75rem;font-weight:700;color:var(--muted);line-height:1.7;}
  footer strong{color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.001ms !important;animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    html{scroll-behavior:auto;}
    svg *{animation:none !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">▦</div>
      <div><span class="accent">Physics</span> by Area</div>
    </div>
    <div class="stat">▦ 30 animated</div>
  </div>
</div>

<main>

  <div class="svg-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 4420" role="img"
         aria-label="Thirty animated area quantities.">

      <defs>
        <radialGradient id="blobG"><stop offset="0" stop-color="#D7FFB8" stop-opacity="0.9"/><stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobB"><stop offset="0" stop-color="#DDF4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobP"><stop offset="0" stop-color="#F3E4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/></radialGradient>

        <!-- clip for the sea fill in Ocean/Land cards -->
        <clipPath id="globeClip">
          <circle cx="180" cy="3482" r="34"/>
        </clipPath>
        <clipPath id="globeClip2">
          <circle cx="180" cy="3622" r="34"/>
        </clipPath>

        <!-- coin/clip for wire cross-section -->
        <clipPath id="wireClip">
          <rect x="80" y="816" width="240" height="20" rx="10"/>
        </clipPath>
      </defs>

      <style>
        text{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;}
        .card{fill:#FFFFFF;stroke-width:2.5;}
        .sh{stroke:none;}
        .s-g{fill:#A5E88A;} .c-g{stroke:#D7F2C0;}
        .s-b{fill:#8FD9FB;} .c-b{stroke:#D8F0FE;}
        .s-p{fill:#E0BEFB;} .c-p{stroke:#EBD9FA;}
        .s-o{fill:#FFC97A;} .c-o{stroke:#FFE0B8;}
        .s-r{fill:#FFA3A3;} .c-r{stroke:#FFD0D0;}
        .s-t{fill:#7FE5D6;} .c-t{stroke:#B8F0E7;}
        .bg-g{fill:#EAF6DE;} .tx-g{fill:#4B8B00;}
        .bg-b{fill:#E1F3FE;} .tx-b{fill:#0B7BB0;}
        .bg-p{fill:#F3E4FF;} .tx-p{fill:#8B44B8;}
        .bg-o{fill:#FFF1DC;} .tx-o{fill:#B36A00;}
        .bg-r{fill:#FFECEC;} .tx-r{fill:#C42B2B;}
        .bg-t{fill:#DDFAF5;} .tx-t{fill:#007F6E;}
        .h1{font-size:25px;font-weight:900;fill:#3C3C3C;letter-spacing:-0.5px;}
        .h2{font-size:12px;font-weight:700;fill:#AFAFAF;}
        .ttl{font-size:13px;font-weight:800;fill:#3C3C3C;}
        .val{font-size:10.5px;font-weight:800;}
        .cap{font-size:11px;font-weight:700;fill:#AFAFAF;}
        .dim{font-size:10px;font-weight:800;}
      </style>

      <rect width="420" height="4420" fill="#FFFFFF"/>
      <circle cx="20"  cy="90"   r="200" fill="url(#blobG)"/>
      <circle cx="410" cy="1400" r="220" fill="url(#blobB)"/>
      <circle cx="10"  cy="2600" r="210" fill="url(#blobP)"/>
      <circle cx="410" cy="3700" r="220" fill="url(#blobB)"/>

      <!-- ===== HEADER ===== -->
      <text x="210" y="70" text-anchor="middle" font-size="42">▦
        <animate attributeName="opacity" values="0.75;1;0.75" dur="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="210" y="118" text-anchor="middle" class="h1">Physics by Area</text>
      <text x="210" y="146" text-anchor="middle" class="h2">30 areas — measured in square metres.</text>

      <!-- ============ 01 · AREA A ============ -->
      <rect class="sh s-g" x="16" y="181" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="176" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="192" width="32" height="32" rx="11"/>
      <text x="48" y="213" text-anchor="middle" font-size="15">▦</text>
      <text x="76" y="213" class="ttl">Area A</text>
      <text x="388" y="213" text-anchor="end" class="val tx-g">1 m²</text>

      <!-- unit square grid with sweeping fill -->
      <rect x="150" y="240" width="120" height="66" rx="6" fill="#FFFFFF" stroke="#58CC02" stroke-width="2.5"/>
      <clipPath id="area1clip"><rect x="150" y="240" width="120" height="66" rx="6"/></clipPath>
      <g clip-path="url(#area1clip)">
        <rect x="150" y="240" width="0" height="66" fill="#A5E88A">
          <animate attributeName="width" values="0;120;0" dur="3s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g stroke="#58CC02" stroke-width="1" opacity="0.55">
        <line x1="180" y1="240" x2="180" y2="306"/>
        <line x1="210" y1="240" x2="210" y2="306"/>
        <line x1="240" y1="240" x2="240" y2="306"/>
        <line x1="150" y1="262" x2="270" y2="262"/>
        <line x1="150" y1="284" x2="270" y2="284"/>
      </g>
      <rect x="150" y="240" width="120" height="66" rx="6" fill="none" stroke="#58CC02" stroke-width="2.5"/>
      <text x="210" y="330" text-anchor="middle" class="dim tx-g">l × w</text>

      <!-- ============ 02 · SURFACE AREA ============ -->
      <rect class="sh s-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="337" width="32" height="32" rx="11"/>
      <text x="48" y="358" text-anchor="middle" font-size="15">🧊</text>
      <text x="76" y="358" class="ttl">Surface area</text>
      <text x="388" y="358" text-anchor="end" class="val tx-b">6 s²</text>

      <!-- rotating cube with face highlight -->
      <g transform="translate(210 400)">
        <g>
          <polygon points="-35,-20 15,-20 25,-8 -25,-8" fill="#8FD9FB" stroke="#1CB0F6" stroke-width="2" stroke-linejoin="round"/>
          <polygon points="-35,-20 -25,-8 -25,36 -35,24" fill="#D8F0FE" stroke="#1CB0F6" stroke-width="2" stroke-linejoin="round"/>
          <polygon points="-25,-8 25,-8 25,36 -25,36" fill="#E1F3FE" stroke="#1CB0F6" stroke-width="2" stroke-linejoin="round"/>
          <polygon points="15,-20 25,-8 25,36 15,24" fill="#8FD9FB" stroke="#1CB0F6" stroke-width="2" stroke-linejoin="round"/>
          <animateTransform attributeName="transform" type="rotate" values="-8 -5 8;8 -5 8;-8 -5 8" dur="3.6s" repeatCount="indefinite"/>
        </g>
      </g>
      <text x="290" y="412" class="dim tx-b">6 faces</text>

      <!-- ============ 03 · CROSS-SECTIONAL AREA ============ -->
      <rect class="sh s-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="477" width="32" height="32" rx="11"/>
      <text x="48" y="498" text-anchor="middle" font-size="15">✂️</text>
      <text x="76" y="498" class="ttl">Cross-sectional area</text>
      <text x="388" y="498" text-anchor="end" class="val tx-p">A_c</text>

      <!-- pipe (cylinder) with cut plane -->
      <rect x="100" y="518" width="180" height="40" rx="4" fill="#F3E4FF" opacity="0.35"/>
      <path d="M 100,518 L 100,558" stroke="#A855F7" stroke-width="2" opacity="0.5"/>
      <ellipse cx="100" cy="538" rx="6" ry="20" fill="#E0BEFB" opacity="0.5" stroke="#A855F7" stroke-width="2"/>
      <ellipse cx="280" cy="538" rx="6" ry="20" fill="#E0BEFB" stroke="#A855F7" stroke-width="2"/>
      <line x1="100" y1="518" x2="280" y2="518" stroke="#A855F7" stroke-width="2" opacity="0.5"/>
      <line x1="100" y1="558" x2="280" y2="558" stroke="#A855F7" stroke-width="2" opacity="0.5"/>
      <!-- dashed cut plane that sweeps -->
      <g>
        <line x1="100" y1="518" x2="100" y2="558" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="5 3"/>
        <line x1="100" y1="518" x2="100" y2="558" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="5 3" opacity="0">
          <animate attributeName="x1" values="100;280;100" dur="2.6s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="100;280;100" dur="2.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
        </line>
      </g>
      <!-- the actual cross section shown -->
      <ellipse cx="100" cy="538" rx="6" ry="20" fill="#E0BEFB" stroke="#A855F7" stroke-width="2.5"/>
      <text x="76" y="543" text-anchor="end" class="dim tx-p">A_c</text>
      <text x="330" y="543" text-anchor="middle" class="dim tx-p" opacity="0.6">cut</text>

      <!-- ============ 04 · PROJECTED AREA ============ -->
      <rect class="sh s-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="617" width="32" height="32" rx="11"/>
      <text x="48" y="638" text-anchor="middle" font-size="15">🔦</text>
      <text x="76" y="638" class="ttl">Projected area</text>
      <text x="388" y="638" text-anchor="end" class="val tx-o">A cos θ</text>

      <!-- light source and tilting plate -->
      <circle cx="80" cy="678" r="7" fill="#FF9600"/>
      <g stroke="#FFC97A" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
        <line x1="95" y1="678" x2="150" y2="678"/>
        <line x1="92" y1="670" x2="148" y2="670"/>
        <line x1="92" y1="686" x2="148" y2="686"/>
      </g>
      <g transform="translate(230 678)">
        <rect x="-45" y="-30" width="90" height="60" rx="4" fill="#FFE0B8" stroke="#FF9600" stroke-width="2.5" opacity="0.75"/>
        <animateTransform attributeName="transform" type="rotate" values="0 230 678;-35 230 678;0 230 678;35 230 678;0 230 678" dur="4s" repeatCount="indefinite" additive="replace"/>
      </g>
      <text x="320" y="683" text-anchor="middle" class="dim tx-o">θ</text>

      <!-- ============ 05 · WIRE CROSS-SECTION ============ -->
      <rect class="sh s-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="757" width="32" height="32" rx="11"/>
      <text x="48" y="778" text-anchor="middle" font-size="15">🔌</text>
      <text x="76" y="778" class="ttl">Wire cross-section</text>
      <text x="388" y="778" text-anchor="end" class="val tx-r">π r²</text>

      <!-- cylinder wire with end-on view -->
      <rect x="80" y="816" width="220" height="20" rx="10" fill="#FFA3A3" stroke="#FF4B4B" stroke-width="2"/>
      <g clip-path="url(#wireClip)" fill="#FF4B4B" opacity="0.5">
        <circle cx="110" cy="826" r="3">
          <animate attributeName="cx" values="86;296;86" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="110" cy="826" r="3">
          <animate attributeName="cx" values="86;296;86" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <ellipse cx="300" cy="826" rx="8" ry="14" fill="#FFD0D0" stroke="#FF4B4B" stroke-width="2.5"/>
      <ellipse cx="300" cy="826" rx="3" ry="6" fill="#FF4B4B"/>
      <line x1="300" y1="808" x2="300" y2="804" stroke="#FF4B4B" stroke-width="1.5"/>
      <text x="310" y="812" class="dim tx-r">r</text>
      <text x="180" y="862" text-anchor="middle" class="dim tx-r">A = π r²</text>

      <!-- ============ 06 · EFFECTIVE AREA ============ -->
      <rect class="sh s-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="897" width="32" height="32" rx="11"/>
      <text x="48" y="918" text-anchor="middle" font-size="15">🎯</text>
      <text x="76" y="918" class="ttl">Effective area</text>
      <text x="388" y="918" text-anchor="end" class="val tx-t">A_eff</text>

      <!-- grid of tiles, one highlighted scanning -->
      <rect x="120" y="938" width="180" height="66" rx="6" fill="#DDFAF5" stroke="#00C2A8" stroke-width="2.5"/>
      <g>
        <rect x="124" y="942" width="42" height="28" fill="#7FE5D6"/>
        <rect x="172" y="942" width="42" height="28" fill="#7FE5D6"/>
        <rect x="220" y="942" width="42" height="28" fill="#7FE5D6"/>
        <rect x="268" y="942" width="28" height="28" fill="#7FE5D6"/>
        <rect x="124" y="976" width="42" height="24" fill="#7FE5D6"/>
        <rect x="172" y="976" width="42" height="24" fill="#7FE5D6"/>
        <rect x="220" y="976" width="42" height="24" fill="#7FE5D6"/>
        <rect x="268" y="976" width="28" height="24" fill="#7FE5D6"/>
      </g>
      <!-- a highlight box that scans through the grid -->
      <rect x="172" y="942" width="42" height="28" fill="#00C2A8">
        <animate attributeName="x" values="124;172;220;268;268;220;172;124;124" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="942;942;942;942;976;976;976;976;942" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="width" values="42;42;42;28;28;42;42;42;42" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="height" values="28;28;28;28;24;24;24;24;28" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="210" y="1024" text-anchor="middle" class="dim tx-t">A_eff</text>

      <!-- ============ 07 · CONTACT AREA ============ -->
      <rect class="sh s-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="1037" width="32" height="32" rx="11"/>
      <text x="48" y="1058" text-anchor="middle" font-size="15">👟</text>
      <text x="76" y="1058" class="ttl">Contact area</text>
      <text x="388" y="1058" text-anchor="end" class="val tx-g">A_contact</text>

      <!-- shoe footprint with pressure patch -->
      <rect x="80" y="1104" width="260" height="8" rx="4" fill="#A5E88A"/>
      <g transform="translate(210 1072)">
        <rect x="-60" y="-14" width="120" height="34" rx="8" fill="#EAF6DE" stroke="#58CC02" stroke-width="2.5"/>
        <text x="0" y="8" text-anchor="middle" font-size="10" font-weight="900" fill="#4B8B00">m</text>
      </g>
      <!-- contact patch on the ground -->
      <rect x="176" y="1100" width="68" height="6" rx="3" fill="#4B8B00">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <text x="210" y="1092" text-anchor="middle" class="dim tx-g">A</text>

      <!-- ============ 08 · FRONTAL AREA ============ -->
      <rect class="sh s-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="1177" width="32" height="32" rx="11"/>
      <text x="48" y="1198" text-anchor="middle" font-size="15">💨</text>
      <text x="76" y="1198" class="ttl">Frontal area</text>
      <text x="388" y="1198" text-anchor="end" class="val tx-b">A_front</text>

      <!-- sphere with a highlighted disc (frontal silhouette) -->
      <circle cx="210" cy="1248" r="30" fill="#E1F3FE" stroke="#1CB0F6" stroke-width="2"/>
      <ellipse cx="210" cy="1248" rx="30" ry="30" fill="#8FD9FB" opacity="0.55" stroke="#1CB0F6" stroke-width="2.5"/>
      <ellipse cx="210" cy="1248" rx="30" ry="12" fill="none" stroke="#1CB0F6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
      <g stroke="#1CB0F6" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
        <line x1="120" y1="1238" x2="176" y2="1238" stroke-dasharray="6 5">
          <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" repeatCount="indefinite"/>
        </line>
        <line x1="120" y1="1248" x2="176" y2="1248" stroke-dasharray="6 5">
          <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" begin="0.35s" repeatCount="indefinite"/>
        </line>
        <line x1="120" y1="1258" x2="176" y2="1258" stroke-dasharray="6 5">
          <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" begin="0.7s" repeatCount="indefinite"/>
        </line>
      </g>
      <text x="290" y="1252" text-anchor="middle" class="dim tx-b">A_front</text>

      <!-- ============ 09 · WING AREA ============ -->
      <rect class="sh s-p" x="16" y="1301" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="1301" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="1317" width="32" height="32" rx="11"/>
      <text x="48" y="1338" text-anchor="middle" font-size="15">✈️</text>
      <text x="76" y="1338" class="ttl">Wing area S</text>
      <text x="388" y="1338" text-anchor="end" class="val tx-p">S</text>

      <!-- top-down wing with area shading -->
      <path d="M 80,1378 Q 200,1356 340,1378 Q 340,1398 200,1404 Q 80,1398 80,1378 Z"
            fill="#E0BEFB" stroke="#A855F7" stroke-width="2.5"/>
      <path d="M 80,1378 Q 200,1356 340,1378 Q 340,1398 200,1404 Q 80,1398 80,1378 Z"
            fill="#8B44B8" opacity="0.18"/>
      <line x1="80" y1="1384" x2="340" y2="1384" stroke="#8B44B8" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="210" y="1392" text-anchor="middle" font-size="10" font-weight="900" fill="#8B44B8">S = 16 m²</text>

      <!-- ============ 10 · WETTED AREA ============ -->
      <rect class="sh s-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="1457" width="32" height="32" rx="11"/>
      <text x="48" y="1478" text-anchor="middle" font-size="15">🌊</text>
      <text x="76" y="1478" class="ttl">Wetted area</text>
      <text x="388" y="1478" text-anchor="end" class="val tx-o">submerged</text>

      <!-- hull with rising waterline -->
      <path d="M 100,1502 L 320,1502 L 320,1552 L 100,1552 Z"
            fill="#FFE0B8" stroke="#FF9600" stroke-width="2.5"/>
      <clipPath id="hullClip">
        <path d="M 100,1502 L 320,1502 L 320,1552 L 100,1552 Z"/>
