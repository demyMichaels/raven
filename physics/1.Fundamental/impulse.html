<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img"
     aria-label="Top: two force-time curves with equal area but different peak forces. Bottom left: equal-mass collision transfers velocity. Bottom right: light ball recoils off a heavy ball.">
  <defs>
    <radialGradient id="gA" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="gB" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#475569"/>
    </radialGradient>
    <radialGradient id="gLight" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="gHeavy" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#b91c1c"/>
    </radialGradient>

    <!-- reveal clips for the two impulses -->
    <clipPath id="cpHard">
      <rect x="110" y="110" width="0" height="160">
        <animate attributeName="width" values="0; 70; 70" keyTimes="0; 0.6; 1"
          dur="3.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="cpSoft">
      <rect x="300" y="110" width="0" height="160">
        <animate attributeName="width" values="0; 200; 200" keyTimes="0; 0.6; 1"
          dur="3.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="560" fill="#0b0f19"/>

  <!-- ============================= HEADER ============================= -->
  <text x="30" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">
    Impulse = force × time
  </text>
  <text x="30" y="66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748b">
    J = F·Δt = Δp = m·Δv  —  the same change in momentum, delivered two very different ways.
  </text>

  <!-- ============================= TOP PANEL: FORCE–TIME ============================= -->
  <rect x="30" y="90" width="840" height="200" rx="12" fill="#111827" stroke="#1e293b"/>

  <!-- axes -->
  <line x1="80" y1="262" x2="530" y2="262" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="262" x2="80" y2="110" stroke="#334155" stroke-width="2"/>
  <text x="70" y="120" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#475569">F</text>
  <text x="524" y="284" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#475569">t</text>

  <!-- RIGID: tall narrow spike -->
  <path d="M 110 262 L 145 122 L 180 262 Z" fill="#f87171" fill-opacity="0.28"
        stroke="#f87171" stroke-width="2" stroke-linejoin="round"/>
  <g clip-path="url(#cpHard)">
    <path d="M 110 262 L 145 122 L 180 262 Z" fill="#f87171" fill-opacity="0.75"/>
  </g>
  <line y1="110" y2="262" stroke="#f87171" stroke-width="1.5" stroke-opacity="0.6">
    <animate attributeName="x1" values="110; 180; 180" keyTimes="0; 0.6; 1"
      dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="110; 180; 180" keyTimes="0; 0.6; 1"
      dur="3.5s" repeatCount="indefinite"/>
  </line>

  <text x="145" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="12" font-weight="700" fill="#f87171">RIGID STOP</text>
  <text x="145" y="286" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="10.5" fill="#64748b">Δt = 0.04 s</text>
  <text x="145" y="302" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="10.5" fill="#64748b">F_peak = 5000 N</text>
  <text x="145" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="10.5" fill="#475569">“face on the steering wheel”</text>

  <!-- CUSHIONED: short wide hump -->
  <path d="M 300 262 Q 400 192 500 262 Z" fill="#22d3ee" fill-opacity="0.28"
        stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>
  <g clip-path="url(#cpSoft)">
    <path d="M 300 262 Q 400 192 500 262 Z" fill="#22d3ee" fill-opacity="0.75"/>
  </g>
  <line y1="110" y2="262" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.6">
    <animate attributeName="x1" values="300; 500; 500" keyTimes="0; 0.6; 1"
      dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="300; 500; 500" keyTimes="0; 0.6; 1"
      dur="3.5s" repeatCount="indefinite"/>
  </line>

  <text x="400" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="12" font-weight="700" fill="#22d3ee">CUSHIONED STOP</text>
  <text x="400" y="286" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="10.5" fill="#64748b">Δt = 0.40 s</text>
  <text x="400" y="302" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="10.5" fill="#64748b">F_peak = 500 N</text>
  <text x="400" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="10.5" fill="#475569">“airbag, crumple zone”</text>

  <!-- equality callout -->
  <line x1="220" y1="140" x2="290" y2="140" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="255" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="10.5" fill="#475569">same area</text>
  <text x="255" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="10.5" font-weight="600" fill="#94a3b8">= same impulse</text>

  <!-- ============================= BOTTOM LEFT: EQUAL MASS ============================= -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="410" height="230" rx="12" fill="#111827" stroke="#1e293b"/>
    <text x="18" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
      Equal masses — velocity transfers
    </text>
    <text x="18" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">
      m₁ = m₂ → A stops dead, B leaves with A's full speed.
    </text>

    <!-- track -->
    <line x1="20" y1="170" x2="392" y2="170" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ball A -->
    <circle cy="146" r="24" fill="url(#gA)">
      <animate attributeName="cx" values="60; 192; 192" keyTimes="0; 0.35; 1"
        dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- ball B -->
    <circle cy="146" r="24" fill="url(#gB)">
      <animate attributeName="cx" values="240; 240; 372; 372" keyTimes="0; 0.35; 0.75; 1"
        dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- velocity labels -->
    <text y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="12" font-weight="700" fill="#93c5fd">
      v
      <animate attributeName="x" values="60; 192; 192" keyTimes="0; 0.35; 1"
        dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.33; 0.37; 1"
        dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="12" font-weight="700" fill="#94a3b8">
      0
      <animate attributeName="x" values="192; 192; 192" keyTimes="0; 0.35; 1"
        dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.33; 0.37; 1"
        dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="12" font-weight="700" fill="#cbd5e1">
      0
      <animate attributeName="x" values="240; 240; 372; 372" keyTimes="0; 0.35; 0.75; 1"
        dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.33; 0.37; 1"
        dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="12" font-weight="700" fill="#93c5fd">
      v
      <animate attributeName="x" values="372; 372; 372" keyTimes="0; 0.35; 1"
        dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.33; 0.37; 1"
        dur="3.2s" repeatCount="indefinite"/>
    </text>

    <!-- momentum strip -->
    <rect x="20" y="192" width="372" height="24" rx="6" fill="#0b0f19" stroke="#1e293b"/>
    <text x="32" y="209" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">
      p_total
    </text>
    <text x="382" y="209" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#22d3ee">
      before = after
    </text>
  </g>

  <!-- ============================= BOTTOM RIGHT: LIGHT VS HEAVY ============================= -->
  <g transform="translate(460, 300)">
    <rect x="0" y="0" width="410" height="230" rx="12" fill="#111827" stroke="#1e293b"/>
    <text x="18" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
      Light hits heavy — recoil
    </text>
    <text x="18" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">
      m₁ ≪ m₂ → the light ball bounces back, the heavy one barely budges.
    </text>

    <!-- track -->
    <line x1="20" y1="170" x2="392" y2="170" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- light ball -->
    <circle cy="154" r="16" fill="url(#gLight)">
      <animate attributeName="cx" values="50; 232; 232; 123; 123"
        keyTimes="0; 0.35; 0.38; 0.75; 1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <!-- heavy ball -->
    <circle cy="138" r="32" fill="url(#gHeavy)">
      <animate attributeName="cx" values="280; 280; 353; 353"
        keyTimes="0; 0.38; 0.75; 1" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- velocity labels -->
    <text y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="11" font-weight="700" fill="#67e8f9">
      v
      <animate attributeName="x" values="50; 232; 232" keyTimes="0; 0.35; 1"
        dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.33; 0.38; 1"
        dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="11" font-weight="700" fill="#fca5a5">
      −0.6v
      <animate attributeName="x" values="232; 232; 123; 123" keyTimes="0; 0.38; 0.75; 1"
        dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.35; 0.40; 1"
        dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="11" font-weight="700" fill="#fca5a5">
      0
      <animate attributeName="x" values="280; 280; 353; 353" keyTimes="0; 0.38; 0.75; 1"
        dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.36; 0.41; 1"
        dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="11" font-weight="700" fill="#fca5a5">
      +0.4v
      <animate attributeName="x" values="353; 353; 353" keyTimes="0; 0.38; 1"
        dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.36; 0.41; 1"
        dur="3.5s" repeatCount="indefinite"/>
    </text>

    <!-- momentum strip -->
    <rect x="20" y="192" width="372" height="24" rx="6" fill="#0b0f19" stroke="#1e293b"/>
    <text x="32" y="209" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">
      p_total
    </text>
    <text x="382" y="209" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#22d3ee">
      still conserved
    </text>
  </g>

  <text x="30" y="550" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#334155">
    Impulse is the area under the force–time curve. Same area, different shape — that difference is what your body feels.
  </text>
</svg>
