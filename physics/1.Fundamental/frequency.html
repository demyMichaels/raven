<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Physics by Frequency — 30 Animated Quantities</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF; --ink:#3C3C3C; --ink-soft:#777777; --muted:#AFAFAF; --line:#E5E5E5;
    --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8; --green-t:#4B8B00;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Nunito', ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg);color:var(--ink);font-weight:700;line-height:1.45;
    min-height:100vh;overflow-x:hidden;
    padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
  }
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:2px solid var(--line);}
  .topbar-inner{max-width:640px;margin:0 auto;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:900;letter-spacing:-.02em;}
  .brand-icon{width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 var(--green-d);flex-shrink:0;}
  .brand .accent{color:var(--green-t);}
  .stat{display:inline-flex;align-items:center;gap:5px;background:#F7F7F7;border:2px solid var(--line);
    border-radius:999px;padding:5px 12px;font-size:.7rem;font-weight:900;color:var(--ink-soft);
    letter-spacing:.03em;white-space:nowrap;}
  main{max-width:640px;margin:0 auto;padding:0 8px;}
  .svg-wrap{margin:12px 8px 0;border-radius:18px;overflow:hidden;background:#FFFFFF;}
  .svg-wrap svg{display:block;width:100%;height:auto;}
  footer{max-width:640px;margin:32px auto 0;padding:22px 18px 8px;
    border-top:2px solid var(--line);text-align:center;
    font-size:.75rem;font-weight:700;color:var(--muted);line-height:1.7;}
  footer strong{color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.001ms !important;animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    html{scroll-behavior:auto;}
    svg *{animation:none !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">〰️</div>
      <div><span class="accent">Physics</span> by Frequency</div>
    </div>
    <div class="stat">〰️ 30 animated</div>
  </div>
</div>

<main>

  <div class="svg-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 4420" role="img"
         aria-label="Thirty animated frequency quantities.">

      <defs>
        <radialGradient id="blobG"><stop offset="0" stop-color="#D7FFB8" stop-opacity="0.9"/><stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobB"><stop offset="0" stop-color="#DDF4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobP"><stop offset="0" stop-color="#F3E4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/></radialGradient>

        <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#E53935"/>
          <stop offset="17%" stop-color="#FB8C00"/>
          <stop offset="33%" stop-color="#FDD835"/>
          <stop offset="50%" stop-color="#43A047"/>
          <stop offset="67%" stop-color="#1E88E5"/>
          <stop offset="83%" stop-color="#3949AB"/>
          <stop offset="100%" stop-color="#8E24AA"/>
        </linearGradient>

        <!-- reusable sine wave for card 01 -->
        <path id="wave1" d="M 60,258 Q 85,236 110,258 Q 135,280 160,258 Q 185,236 210,258 Q 235,280 260,258 Q 285,236 310,258 Q 335,280 360,258" fill="none"/>

        <!-- Larmor precession orbit for card 23 -->
        <path id="larmorOrbit" d="M 180,3348 a 30,10 0 1,0 60,0 a 30,10 0 1,0 -60,0" fill="none"/>
      </defs>

      <style>
        text{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;}
        .card{fill:#FFFFFF;stroke-width:2.5;}
        .sh{stroke:none;}
        .s-g{fill:#A5E88A;} .c-g{stroke:#D7F2C0;}
        .s-b{fill:#8FD9FB;} .c-b{stroke:#D8F0FE;}
        .s-p{fill:#E0BEFB;} .c-p{stroke:#EBD9FA;}
        .s-o{fill:#FFC97A;} .c-o{stroke:#FFE0B8;}
        .s-r{fill:#FFA3A3;} .c-r{stroke:#FFD0D0;}
        .s-t{fill:#7FE5D6;} .c-t{stroke:#B8F0E7;}
        .bg-g{fill:#EAF6DE;} .tx-g{fill:#4B8B00;}
        .bg-b{fill:#E1F3FE;} .tx-b{fill:#0B7BB0;}
        .bg-p{fill:#F3E4FF;} .tx-p{fill:#8B44B8;}
        .bg-o{fill:#FFF1DC;} .tx-o{fill:#B36A00;}
        .bg-r{fill:#FFECEC;} .tx-r{fill:#C42B2B;}
        .bg-t{fill:#DDFAF5;} .tx-t{fill:#007F6E;}
        .h1{font-size:25px;font-weight:900;fill:#3C3C3C;letter-spacing:-0.5px;}
        .h2{font-size:12px;font-weight:700;fill:#AFAFAF;}
        .ttl{font-size:13px;font-weight:800;fill:#3C3C3C;}
        .val{font-size:10.5px;font-weight:800;}
        .cap{font-size:11px;font-weight:700;fill:#AFAFAF;}
        .dim{font-size:10px;font-weight:800;}
      </style>

      <rect width="420" height="4420" fill="#FFFFFF"/>
      <circle cx="20"  cy="90"   r="200" fill="url(#blobG)"/>
      <circle cx="410" cy="1400" r="220" fill="url(#blobB)"/>
      <circle cx="10"  cy="2600" r="210" fill="url(#blobP)"/>
      <circle cx="410" cy="3700" r="220" fill="url(#blobB)"/>

      <!-- ===== HEADER ===== -->
      <text x="210" y="70" text-anchor="middle" font-size="42">〰️
        <animate attributeName="opacity" values="0.75;1;0.75" dur="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="210" y="118" text-anchor="middle" class="h1">Physics by Frequency</text>
      <text x="210" y="146" text-anchor="middle" class="h2">30 frequencies — measured in hertz.</text>

      <!-- ============ 01 · FREQUENCY f ============ -->
      <rect class="sh s-g" x="16" y="181" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="176" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="192" width="32" height="32" rx="11"/>
      <text x="48" y="213" text-anchor="middle" font-size="15">〰️</text>
      <text x="76" y="213" class="ttl">Frequency f</text>
      <text x="388" y="213" text-anchor="end" class="val tx-g">f = 50 Hz</text>

      <use href="#wave1" stroke="#4B8B00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle r="5" fill="#4B8B00">
        <animateMotion dur="2.4s" repeatCount="indefinite">
          <mpath href="#wave1"/>
        </animateMotion>
      </circle>
      <text x="210" y="297" text-anchor="middle" class="dim tx-g">1 Hz = 1 cycle per second</text>

      <!-- ============ 02 · ANGULAR FREQUENCY ω ============ -->
      <rect class="sh s-b" x="16" y="326" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="337" width="32" height="32" rx="11"/>
      <text x="48" y="358" text-anchor="middle" font-size="15">🔄</text>
      <text x="76" y="358" class="ttl">Angular frequency ω</text>
      <text x="388" y="358" text-anchor="end" class="val tx-b">ω = 2πf</text>

      <circle cx="180" cy="403" r="30" fill="none" stroke="#1CB0F6" stroke-width="2" stroke-dasharray="4 4" opacity="0.55"/>
      <g>
        <line x1="180" y1="403" x2="180" y2="373" stroke="#1CB0F6" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="180" cy="373" r="4.5" fill="#1CB0F6"/>
        <animateTransform attributeName="transform" type="rotate" values="0 180 403;360 180 403" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <circle cx="180" cy="403" r="4" fill="#0B7BB0"/>
      <text x="300" y="408" text-anchor="middle" class="dim tx-b">rad / s</text>

      <!-- ============ 03 · PERIOD T ============ -->
      <rect class="sh s-p" x="16" y="466" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="477" width="32" height="32" rx="11"/>
      <text x="48" y="498" text-anchor="middle" font-size="15">⏱️</text>
      <text x="76" y="498" class="ttl">Period T</text>
      <text x="388" y="498" text-anchor="end" class="val tx-p">T = 1 / f</text>

      <circle cx="210" cy="545" r="28" fill="none" stroke="#A855F7" stroke-width="2.5"/>
      <g stroke="#A855F7" stroke-width="2" stroke-linecap="round">
        <line x1="210" y1="519" x2="210" y2="525"/>
        <line x1="236" y1="545" x2="230" y2="545"/>
        <line x1="210" y1="571" x2="210" y2="565"/>
        <line x1="184" y1="545" x2="190" y2="545"/>
      </g>
      <g>
        <line x1="210" y1="545" x2="210" y2="523" stroke="#8B44B8" stroke-width="2.5" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="0 210 545;360 210 545" dur="3s" repeatCount="indefinite"/>
      </g>
      <circle cx="210" cy="545" r="3.5" fill="#8B44B8"/>
      <text x="210" y="585" text-anchor="middle" class="dim tx-p">one full cycle</text>

      <!-- ============ 04 · NATURAL FREQUENCY f₀ ============ -->
      <rect class="sh s-o" x="16" y="606" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="617" width="32" height="32" rx="11"/>
      <text x="48" y="638" text-anchor="middle" font-size="15">🕰️</text>
      <text x="76" y="638" class="ttl">Natural frequency f₀</text>
      <text x="388" y="638" text-anchor="end" class="val tx-o">f₀</text>

      <g>
        <line x1="210" y1="645" x2="210" y2="695" stroke="#FF9600" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="210" cy="695" r="9" fill="#FFC97A" stroke="#FF9600" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" values="-22 210 645;22 210 645;-22 210 645" dur="1.8s" repeatCount="indefinite"/>
      </g>
      <circle cx="210" cy="645" r="4" fill="#B36A00"/>
      <text x="240" y="692" class="dim tx-o">f₀</text>

      <!-- ============ 05 · RESONANT FREQUENCY ============ -->
      <rect class="sh s-r" x="16" y="746" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="757" width="32" height="32" rx="11"/>
      <text x="48" y="778" text-anchor="middle" font-size="15">📈</text>
      <text x="76" y="778" class="ttl">Resonant frequency</text>
      <text x="388" y="778" text-anchor="end" class="val tx-r">f_r</text>

      <line x1="70" y1="850" x2="350" y2="850" stroke="#FFD0D0" stroke-width="1.5"/>
      <line x1="70" y1="850" x2="70" y2="795" stroke="#FFD0D0" stroke-width="1.5"/>
      <path d="M 70,846 C 150,845 185,838 200,810 C 205,795 215,795 220,810 C 235,838 270,845 350,846"
            fill="none" stroke="#FF4B4B" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="210" y1="802" x2="210" y2="850" stroke="#FF4B4B" stroke-width="1.5" stroke-dasharray="3 3">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <circle cx="210" cy="802" r="4.5" fill="#FF4B4B">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="220" y="862" class="dim tx-r">f_r</text>

      <!-- ============ 06 · BEAT FREQUENCY ============ -->
      <rect class="sh s-t" x="16" y="886" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="881" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="897" width="32" height="32" rx="11"/>
      <text x="48" y="918" text-anchor="middle" font-size="15">🎵</text>
      <text x="76" y="918" class="ttl">Beat frequency</text>
      <text x="388" y="918" text-anchor="end" class="val tx-t">| f₁ − f₂ |</text>

      <path d="M 70,965 Q 210,935 350,965" fill="none" stroke="#00C2A8" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"/>
      <path d="M 70,965 Q 210,995 350,965" fill="none" stroke="#00C2A8" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"/>
      <path d="M 70,965 Q 77,955 84,965 Q 91,975 98,965 Q 105,955 112,965 Q 119,975 126,965 Q 133,955 140,965 Q 147,975 154,965 Q 161,955 168,965 Q 175,975 182,965 Q 189,955 196,965 Q 203,975 210,965 Q 217,955 224,965 Q 231,975 238,965 Q 245,955 252,965 Q 259,975 266,965 Q 273,955 280,965 Q 287,975 294,965 Q 301,955 308,965 Q 315,975 322,965 Q 329,955 336,965 Q 343,975 350,965"
            fill="none" stroke="#00C2A8" stroke-width="2.2" stroke-linecap="round"/>

      <!-- ============ 07 · AUDIO FREQUENCY ============ -->
      <rect class="sh s-g" x="16" y="1026" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="1021" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="1037" width="32" height="32" rx="11"/>
      <text x="48" y="1058" text-anchor="middle" font-size="15">🔊</text>
      <text x="76" y="1058" class="ttl">Audio frequency</text>
      <text x="388" y="1058" text-anchor="end" class="val tx-g">20 Hz – 20 kHz</text>

      <rect x="110" y="1078" width="24" height="30" rx="4" fill="#A5E88A" stroke="#58CC02" stroke-width="2"/>
      <polygon points="134,1093 158,1078 158,1108" fill="#58CC02"/>
      <g fill="none" stroke="#4B8B00" stroke-width="2.2" stroke-linecap="round">
        <path d="M 168,1080 Q 180,1093 168,1106">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M 184,1072 Q 200,1093 184,1114">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="1.6s" begin="0.35s" repeatCount="indefinite"/>
        </path>
        <path d="M 200,1064 Q 220,1093 200,1122">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="1.6s" begin="0.7s" repeatCount="indefinite"/>
        </path>
      </g>
      <text x="300" y="1098" text-anchor="middle" class="dim tx-g">audible</text>

      <!-- ============ 08 · RADIO FREQUENCY ============ -->
      <rect class="sh s-b" x="16" y="1166" width="388" height="130" rx="20"/>
      <rect class="card c-b" x="16" y="1161" width="388" height="130" rx="20"/>
      <rect class="bg-b" x="32" y="1177" width="32" height="32" rx="11"/>
      <text x="48" y="1198" text-anchor="middle" font-size="15">📡</text>
      <text x="76" y="1198" class="ttl">Radio frequency</text>
      <text x="388" y="1198" text-anchor="end" class="val tx-b">kHz – GHz</text>

      <line x1="250" y1="1225" x2="250" y2="1278" stroke="#1CB0F6" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="250" cy="1225" r="4" fill="#0B7BB0"/>
      <g fill="none" stroke="#1CB0F6" stroke-width="2.2" stroke-linecap="round">
        <path d="M 230,1225 A 20,20 0 0,1 270,1225">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" repeatCount="indefinite"/>
        </path>
        <path d="M 215,1225 A 35,35 0 0,1 285,1225">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
        </path>
        <path d="M 200,1225 A 50,50 0 0,1 300,1225">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.8s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- ============ 09 · MICROWAVE FREQUENCY ============ -->
      <rect class="sh s-p" x="16" y="1306" width="388" height="130" rx="20"/>
      <rect class="card c-p" x="16" y="1301" width="388" height="130" rx="20"/>
      <rect class="bg-p" x="32" y="1317" width="32" height="32" rx="11"/>
      <text x="48" y="1338" text-anchor="middle" font-size="15">📶</text>
      <text x="76" y="1338" class="ttl">Microwave frequency</text>
      <text x="388" y="1338" text-anchor="end" class="val tx-p">0.3 – 300 GHz</text>

      <rect x="110" y="1348" width="200" height="5" rx="2.5" fill="#A855F7"/>
      <rect x="110" y="1395" width="200" height="5" rx="2.5" fill="#A855F7"/>
      <path d="M 120,1371 Q 145,1353 170,1371 Q 195,1389 220,1371 Q 245,1353 270,1371 Q 295,1389 310,1375"
            fill="none" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
      <circle r="4" fill="#8B44B8">
        <animateMotion dur="1.8s" repeatCount="indefinite"
          path="M 120,1371 Q 145,1353 170,1371 Q 195,1389 220,1371 Q 245,1353 270,1371 Q 295,1389 310,1375"/>
      </circle>

      <!-- ============ 10 · INFRARED FREQUENCY ============ -->
      <rect class="sh s-o" x="16" y="1446" width="388" height="130" rx="20"/>
      <rect class="card c-o" x="16" y="1441" width="388" height="130" rx="20"/>
      <rect class="bg-o" x="32" y="1457" width="32" height="32" rx="11"/>
      <text x="48" y="1478" text-anchor="middle" font-size="15">🔥</text>
      <text x="76" y="1478" class="ttl">Infrared frequency</text>
      <text x="388" y="1478" text-anchor="end" class="val tx-o">0.3 – 430 THz</text>

      <circle cx="140" cy="1528" r="26" fill="#FFC97A" stroke="#FF9600" stroke-width="2"/>
      <g fill="none" stroke="#FF9600" stroke-width="2.2" stroke-linecap="round">
        <path d="M 180,1508 Q 200,1500 220,1508 Q 240,1516 260,1508">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/>
        </path>
        <path d="M 180,1528 Q 200,1520 220,1528 Q 240,1536 260,1528">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="2s" begin="0.4s" repeatCount="indefinite"/>
        </path>
        <path d="M 180,1548 Q 200,1540 220,1548 Q 240,1556 260,1548">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="2s" begin="0.8s" repeatCount="indefinite"/>
        </path>
      </g>
      <text x="310" y="1533" text-anchor="middle" class="dim tx-o">heat</text>

      <!-- ============ 11 · VISIBLE LIGHT FREQUENCY ============ -->
      <rect class="sh s-r" x="16" y="1586" width="388" height="130" rx="20"/>
      <rect class="card c-r" x="16" y="1581" width="388" height="130" rx="20"/>
      <rect class="bg-r" x="32" y="1597" width="32" height="32" rx="11"/>
      <text x="48" y="1618" text-anchor="middle" font-size="15">🌈</text>
      <text x="76" y="1618" class="ttl">Visible light frequency</text>
      <text x="388" y="1618" text-anchor="end" class="val tx-r">430 – 750 THz</text>

      <rect x="70" y="1648" width="280" height="28" rx="8" fill="url(#rainbow)" opacity="0.9"/>
      <rect x="70" y="1648" width="24" height="28" rx="8" fill="#FFFFFF" opacity="0.4">
        <animate attributeName="x" values="70;326;70" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="210" y="1700" text-anchor="middle" class="dim tx-r">700 nm → 400 nm</text>

      <!-- ============ 12 · ULTRAVIOLET FREQUENCY ============ -->
      <rect class="sh s-t" x="16" y="1726" width="388" height="130" rx="20"/>
      <rect class="card c-t" x="16" y="1721" width="388" height="130" rx="20"/>
      <rect class="bg-t" x="32" y="1737" width="32" height="32" rx="11"/>
      <text x="48" y="1758" text-anchor="middle" font-size="15">☀️</text>
      <text x="76" y="1758" class="ttl">Ultraviolet frequency</text>
      <text x="388" y="1758" text-anchor="end" class="val tx-t">0.75 – 30 PHz</text>

      <g stroke="#00C2A8" stroke-width="2.4" stroke-linecap="round">
        <line x1="210" y1="1784" x2="210" y2="1774"/>
        <line x1="210" y1="1828" x2="210" y2="1838"/>
