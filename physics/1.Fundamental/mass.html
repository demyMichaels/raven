<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Physics by Mass — 39 Quantities Measured in Kilograms</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF;
    --ink:#3C3C3C;
    --ink-soft:#777777;
    --muted:#AFAFAF;
    --line:#E5E5E5;
    --green:#58CC02;
    --green-d:#46A302;
    --green-l:#D7FFB8;
    --green-t:#4B8B00;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Nunito', ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg);color:var(--ink);font-weight:700;line-height:1.45;
    min-height:100vh;overflow-x:hidden;
    padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
  }
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:2px solid var(--line);
  }
  .topbar-inner{
    max-width:640px;margin:0 auto;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:900;letter-spacing:-.02em;}
  .brand-icon{
    width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 var(--green-d);flex-shrink:0;
  }
  .brand .accent{color:var(--green-t);}
  .stat{
    display:inline-flex;align-items:center;gap:5px;
    background:#F7F7F7;border:2px solid var(--line);border-radius:999px;
    padding:5px 12px;font-size:.7rem;font-weight:900;color:var(--ink-soft);
    letter-spacing:.03em;white-space:nowrap;
  }
  main{max-width:640px;margin:0 auto;padding:0 8px;}
  .hero{
    margin:18px 8px 6px;
    background:linear-gradient(165deg, #EAFBD9 0%, #F7FFF0 55%, #FFFFFF 100%);
    border:2px solid var(--green-l);border-radius:22px;
    padding:22px 18px 20px;text-align:center;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle, rgba(88,204,2,.14), transparent 70%);
    top:-80px;right:-70px;pointer-events:none;
  }
  .hero .mascot{display:block;font-size:46px;line-height:1;margin-bottom:8px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.06));}
  .hero h1{font-size:clamp(1.5rem, 7vw, 2rem);font-weight:900;letter-spacing:-.03em;line-height:1.12;margin-bottom:8px;}
  .hero p{max-width:420px;margin:0 auto;font-size:.86rem;font-weight:700;color:var(--ink-soft);}
  .svg-wrap{margin:12px 8px 0;border-radius:18px;overflow:hidden;background:#FFFFFF;}
  .svg-wrap svg{display:block;width:100%;height:auto;}
  footer{
    max-width:640px;margin:32px auto 0;padding:22px 18px 8px;
    border-top:2px solid var(--line);text-align:center;
    font-size:.75rem;font-weight:700;color:var(--muted);line-height:1.7;
  }
  footer strong{color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.001ms !important;animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    html{scroll-behavior:auto;}
  }
</style>
</head>
