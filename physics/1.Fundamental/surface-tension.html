<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Physics by Surface Tension — 30 Quantities</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{--bg:#FFFFFF;--ink:#3C3C3C;--ink-soft:#777;--muted:#AFAFAF;--line:#E5E5E5;
    --green:#58CC02;--green-d:#46A302;--green-l:#D7FFB8;--green-t:#4B8B00;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{font-family:'Nunito',ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);font-weight:700;line-height:1.45;min-height:100vh;
    overflow-x:hidden;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));}
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:2px solid var(--line);}
  .topbar-inner{max-width:640px;margin:0 auto;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:9px;font-size:1rem;font-weight:900;letter-spacing:-.02em;}
  .brand-icon{width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 var(--green-d);flex-shrink:0;}
  .brand .accent{color:var(--green-t);}
  .stat{display:inline-flex;align-items:center;gap:5px;background:#F7F7F7;border:2px solid var(--line);
    border-radius:999px;padding:5px 12px;font-size:.7rem;font-weight:900;color:var(--ink-soft);
    letter-spacing:.03em;white-space:nowrap;}
  main{max-width:640px;margin:0 auto;padding:0 8px;}
  .svg-wrap{margin:12px 8px 0;border-radius:18px;overflow:hidden;background:#FFFFFF;}
  .svg-wrap svg{display:block;width:100%;height:auto;}
  .primer-cap{text-align:center;padding:10px 14px 2px;font-size:.75rem;font-weight:800;color:var(--ink-soft);}
  .primer-cap strong{color:var(--green-t);}
  footer{max-width:640px;margin:32px auto 0;padding:22px 18px 8px;border-top:2px solid var(--line);
    text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);line-height:1.7;}
  footer strong{color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;
    animation-iteration-count:1!important;transition-duration:.001ms!important;}
    html{scroll-behavior:auto;}svg *{animation:none!important;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">💧</div>
      <div><span class="accent">Physics</span> by Surface Tension</div>
    </div>
    <div class="stat">30 quantities</div>
  </div>
</div>

<main>

  <!-- ============================================================= -->
  <!-- PRIMER                                                        -->
  <!-- ============================================================= -->
  <div class="svg-wrap" style="margin-top:16px;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" role="img"
         aria-label="Surface tension primer.">

      <defs>
        <radialGradient id="pr-blobG"><stop offset="0" stop-color="#D7FFB8" stop-opacity="0.9"/><stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/></radialGradient>
        <radialGradient id="pr-blobB"><stop offset="0" stop-color="#DDF4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></radialGradient>
        <radialGradient id="pr-blobP"><stop offset="0" stop-color="#F3E4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/></radialGradient>
      </defs>

      <style>
        text{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;}
        .p-h{font-size:22px;font-weight:900;fill:#3C3C3C;letter-spacing:-0.4px;}
        .p-hs{font-size:12px;font-weight:700;fill:#777;}
        .p-ttl{font-size:13px;font-weight:900;fill:#3C3C3C;}
        .p-sub{font-size:11px;font-weight:700;fill:#777;}
        .p-lbl{font-size:10px;font-weight:800;}
      </style>

      <rect width="420" height="900" fill="#FFFFFF"/>
      <circle cx="20"  cy="80"  r="200" fill="url(#pr-blobG)"/>
      <circle cx="410" cy="440" r="200" fill="url(#pr-blobB)"/>
      <circle cx="10"  cy="790" r="200" fill="url(#pr-blobP)"/>

      <text x="210" y="34" text-anchor="middle" font-size="30">💧</text>
      <text x="210" y="66" text-anchor="middle" class="p-h">Surface Tension</text>
      <text x="210" y="88" text-anchor="middle" class="p-hs">Why droplets bead up and some insects walk on water.</text>

      <!-- Card 1 · molecules -->
      <g transform="translate(16 110)">
        <rect x="0" y="0" width="388" height="150" rx="18" fill="#EAF6DE" stroke="#D7F2C0" stroke-width="2.5"/>
        <text x="20" y="26" class="p-ttl">1 · Surface molecules are pulled inward</text>
        <text x="20" y="44" class="p-sub">Fewer neighbours above → a net pull into the bulk.</text>
        <g transform="translate(194 105)">
          <line x1="-120" y1="0" x2="120" y2="0" stroke="#1CB0F6" stroke-width="2"/>
          <rect x="-120" y="0" width="240" height="34" fill="#DDF4FF" opacity="0.65"/>
          <!-- interior molecule with full neighbour shell -->
          <circle cx="-30" cy="17" r="5" fill="#0B7BB0"/>
          <g fill="#0B7BB0" opacity="0.45">
            <circle cx="-42" cy="17" r="3"/><circle cx="-18" cy="17" r="3"/>
            <circle cx="-30" cy="5"  r="3"/><circle cx="-30" cy="29" r="3"/>
          </g>
          <!-- two surface molecules with only a half shell -->
          <circle cx="-80" cy="0" r="5" fill="#C42B2B"/>
          <g fill="#C42B2B" opacity="0.45">
            <circle cx="-92" cy="0" r="3"/><circle cx="-68" cy="0" r="3"/><circle cx="-80" cy="12" r="3"/>
          </g>
          <line x1="-80" y1="6" x2="-80" y2="17" stroke="#C42B2B" stroke-width="1.5"/>
          <polygon points="-82,16 -78,16 -80,19" fill="#C42B2B"/>
          <circle cx="40" cy="0" r="5" fill="#C42B2B"/>
          <line x1="40" y1="6" x2="40" y2="17" stroke="#C42B2B" stroke-width="1.5"/>
          <polygon points="38,16 42,16 40,19" fill="#C42B2B"/>
        </g>
      </g>

      <!-- Card 2 · F/L definition -->
      <g transform="translate(16 270)">
        <rect x="0" y="0" width="388" height="150" rx="18" fill="#E1F3FE" stroke="#D8F0FE" stroke-width="2.5"/>
        <text x="20" y="26" class="p-ttl">2 · Force per length of contact line</text>
        <text x="20" y="44" class="p-sub">A film pulls its edges inward with γ per metre of edge.</text>
        <g transform="translate(194 110)">
          <!-- film slab -->
          <rect x="-100" y="-30" width="200" height="60" fill="#8FD9FB" opacity="0.45" stroke="#1CB0F6" stroke-width="1.5"/>
          <!-- movable bar on the right -->
          <rect x="98" y="-34" width="6" height="68" rx="2" fill="#0B7BB0"/>
          <!-- upward pull on the bar -->
          <line x1="101" y1="-42" x2="101" y2="-58" stroke="#1CB0F6" stroke-width="2" stroke-linecap="round"/>
          <polygon points="98,-56 104,-56 101,-62" fill="#1CB0F6"/>
          <text x="101" y="-68" text-anchor="middle" class="p-lbl" fill="#0B7BB0">F</text>
          <!-- label -->
          <text x="0" y="34" text-anchor="middle" class="p-lbl" fill="#0B7BB0">F = γ · L</text>
        </g>
      </g>

      <!-- Card 3 · Laplace -->
      <g transform="translate(16 430)">
        <rect x="0" y="0" width="388" height="150" rx="18" fill="#F3E4FF" stroke="#EBD9FA" stroke-width="2.5"/>
        <text x="20" y="26" class="p-ttl">3 · Small bubbles have higher pressure</text>
        <text x="20" y="44" class="p-sub">Same γ, smaller radius → higher ΔP = 2γ / r.</text>
        <g transform="translate(194 112)">
          <!-- small bubble -->
          <circle cx="-70" cy="0" r="22" fill="#E0BEFB" stroke="#8B44B8" stroke-width="2"/>
          <text x="-70" y="4" text-anchor="middle" class="p-lbl" fill="#8B44B8">Pₕ</text>
          <!-- large bubble -->
          <circle cx="70" cy="0" r="38" fill="#E0BEFB" stroke="#8B44B8" stroke-width="2"/>
          <text x="70" y="4" text-anchor="middle" class="p-lbl" fill="#8B44B8">Pₗ</text>
          <!-- arrow from small to large (air flows) -->
          <line x1="-42" y1="0" x2="22" y2="0" stroke="#8B44B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
          <polygon points="20,-5 30,0 20,5" fill="#8B44B8"/>
        </g>
      </g>

      <!-- Card 4 · Capillary -->
      <g transform="translate(16 590)">
        <rect x="0" y="0" width="388" height="150" rx="18" fill="#DDFAF5" stroke="#B8F0E7" stroke-width="2.5"/>
        <text x="20" y="26" class="p-ttl">4 · Narrow tubes climb higher</text>
        <text x="20" y="44" class="p-sub">Capillary rise: h = 2γ cos θ / (ρ g r).</text>
        <g transform="translate(194 108)">
          <!-- reservoir -->
          <rect x="-140" y="30" width="280" height="24" fill="#7FE5D6" opacity="0.55"/>
          <line x1="-140" y1="30" x2="140" y2="30" stroke="#00C2A8" stroke-width="1.5"/>
          <!-- wide tube -->
          <rect x="-70" y="-20" width="30" height="60" fill="none" stroke="#007F6E" stroke-width="2"/>
          <rect x="-68" y="6" width="26" height="34" fill="#00C2A8" opacity="0.75"/>
          <!-- narrow tube -->
          <rect x="30" y="-40" width="14" height="80" fill="none" stroke="#007F6E" stroke-width="2"/>
          <rect x="32" y="-34" width="10" height="74" fill="#00C2A8" opacity="0.75"/>
          <text x="-55" y="52" text-anchor="middle" class="p-lbl" fill="#007F6E">wide</text>
          <text x="37" y="52" text-anchor="middle" class="p-lbl" fill="#007F6E">narrow</text>
        </g>
      </g>

      <!-- Card 5 · Surfactant -->
      <g transform="translate(16 750)">
        <rect x="0" y="0" width="388" height="150" rx="18" fill="#FFF1DC" stroke="#FFE0B8" stroke-width="2.5"/>
        <text x="20" y="26" class="p-ttl">5 · Surfactants lower γ dramatically</text>
        <text x="20" y="44" class="p-sub">Soap molecules interrupt the surface layer — drops spread out flat.</text>
        <g transform="translate(194 118)">
          <!-- pure water drop -->
          <path d="M -90,-30 Q -70,-30 -70,0 Q -70,18 -90,18 Q -110,18 -110,0 Q -110,-30 -90,-30 Z" fill="#8FD9FB" stroke="#1CB0F6" stroke-width="2"/>
          <text x="-90" y="36" text-anchor="middle" class="p-lbl" fill="#0B7BB0">water</text>
          <!-- soap water drop (flatter) -->
          <path d="M 40,-6 Q 60,-10 90,-4 Q 120,-2 120,0 Q 90,8 60,8 Q 40,10 40,-6 Z" fill="#FFC97A" stroke="#FF9600" stroke-width="2"/>
          <text x="80" y="36" text-anchor="middle" class="p-lbl" fill="#B36A00">+ soap</text>
        </g>
      </g>
    </svg>
  </div>

  <div class="primer-cap">Now — <strong>30 quantities</strong>, from superfluid helium to molten tungsten.</div>

  <!-- ============================================================= -->
  <!-- MAIN DECK                                                     -->
  <!-- ============================================================= -->
  <div class="svg-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 4420" role="img"
         aria-label="Thirty surface tension quantities.">

      <defs>
        <radialGradient id="blobG"><stop offset="0" stop-color="#D7FFB8" stop-opacity="0.9"/><stop offset="1" stop-color="#D7FFB8" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobB"><stop offset="0" stop-color="#DDF4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#DDF4FF" stop-opacity="0"/></radialGradient>
        <radialGradient id="blobP"><stop offset="0" stop-color="#F3E4FF" stop-opacity="0.9"/><stop offset="1" stop-color="#F3E4FF" stop-opacity="0"/></radialGradient>
      </defs>

      <style>
        text{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;}
        .card{fill:#FFFFFF;stroke-width:2.5;}
        .sh{stroke:none;}
        .bg-g{fill:#EAF6DE;} .tx-g{fill:#4B8B00;} .c-g{stroke:#D7F2C0;} .s-g{fill:#A5E88A;}
        .bg-b{fill:#E1F3FE;} .tx-b{fill:#0B7BB0;} .c-b{stroke:#D8F0FE;} .s-b{fill:#8FD9FB;}
        .bg-p{fill:#F3E4FF;} .tx-p{fill:#8B44B8;} .c-p{stroke:#EBD9FA;} .s-p{fill:#E0BEFB;}
        .bg-o{fill:#FFF1DC;} .tx-o{fill:#B36A00;} .c-o{stroke:#FFE0B8;} .s-o{fill:#FFC97A;}
        .bg-r{fill:#FFECEC;} .tx-r{fill:#C42B2B;} .c-r{stroke:#FFD0D0;} .s-r{fill:#FFA3A3;}
        .bg-t{fill:#DDFAF5;} .tx-t{fill:#007F6E;} .c-t{stroke:#B8F0E7;} .s-t{fill:#7FE5D6;}
        .h1{font-size:25px;font-weight:900;fill:#3C3C3C;letter-spacing:-0.5px;}
        .h2{font-size:12px;font-weight:700;fill:#AFAFAF;}
        .ttl{font-size:13px;font-weight:800;fill:#3C3C3C;}
        .val{font-size:10.5px;font-weight:800;}
        .cap{font-size:11px;font-weight:700;fill:#AFAFAF;}
        .info{font-size:9.5px;font-weight:700;fill:#AFAFAF;letter-spacing:.005em;}
      </style>

      <rect width="420" height="4420" fill="#FFFFFF"/>
      <circle cx="20"  cy="90"   r="200" fill="url(#blobG)"/>
      <circle cx="410" cy="1400" r="220" fill="url(#blobB)"/>
      <circle cx="10"  cy="2600" r="210" fill="url(#blobP)"/>
      <circle cx="410" cy="3700" r="220" fill="url(#blobB)"/>

      <!-- HEADER -->
      <text x="210" y="70" text-anchor="middle" font-size="42">💧</text>
      <text x="210" y="118" text-anchor="middle" class="h1">Surface Tension</text>
      <text x="210" y="146" text-anchor="middle" class="h2">30 values · N/m · bar length on log scale</text>

      <!-- 01 · γ definition -->
      <rect class="sh s-g" x="16" y="181" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="176" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="192" width="32" height="32" rx="11"/>
      <text x="48" y="213" text-anchor="middle" font-size="15">💧</text>
      <text x="76" y="213" class="ttl">Surface tension γ</text>
      <foreignObject x="210" y="197" width="178" height="22">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:#4B8B00;">
          <math xmlns="http://www.w3.org/1998/Math/MathML"><mi>&#x3B3;</mi><mo>=</mo><mfrac><mi>F</mi><mi>L</mi></mfrac></math>
        </div>
      </foreignObject>
      <g transform="translate(210 260)">
        <rect x="-120" y="-24" width="240" height="48" fill="#A5E88A" opacity="0.35" stroke="#58CC02" stroke-width="1.5"/>
        <rect x="118" y="-28" width="6" height="56" rx="2" fill="#4B8B00"/>
        <line x1="121" y1="-36" x2="121" y2="-52" stroke="#58CC02" stroke-width="2" stroke-linecap="round"/>
        <polygon points="118,-50 124,-50 121,-56" fill="#58CC02"/>
        <text x="121" y="-62" text-anchor="middle" class="info" fill="#4B8B00">F</text>
        <text x="0" y="40" text-anchor="middle" class="info">force per unit length of contact line</text>
      </g>

      <!-- 02 · E = γA -->
      <rect class="sh s-g" x="16" y="321" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="316" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="332" width="32" height="32" rx="11"/>
      <text x="48" y="353" text-anchor="middle" font-size="15">🫧</text>
      <text x="76" y="353" class="ttl">Surface energy E</text>
      <foreignObject x="210" y="337" width="178" height="22">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:#4B8B00;">
          <math xmlns="http://www.w3.org/1998/Math/MathML"><mi>E</mi><mo>=</mo><mi>&#x3B3;</mi><mi>A</mi></math>
        </div>
      </foreignObject>
      <g transform="translate(210 258)">
        <circle cx="-50" cy="0" r="14" fill="#A5E88A" stroke="#58CC02" stroke-width="1.8"/>
        <circle cx="20" cy="0" r="14" fill="#A5E88A" stroke="#58CC02" stroke-width="1.8"/>
        <line x1="-30" y1="0" x2="0" y2="0" stroke="#4B8B00" stroke-width="1.2" stroke-dasharray="3 2"/>
        <polygon points="-2,-3 4,0 -2,3" fill="#4B8B00"/>
        <circle cx="80" cy="0" r="20" fill="#A5E88A" stroke="#58CC02" stroke-width="2"/>
        <text x="0" y="38" text-anchor="middle" class="info">merging reduces total surface — releases γΔA of energy</text>
      </g>

      <!-- 03 · Laplace -->
      <rect class="sh s-g" x="16" y="461" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="456" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="472" width="32" height="32" rx="11"/>
      <text x="48" y="493" text-anchor="middle" font-size="15">🎈</text>
      <text x="76" y="493" class="ttl">Laplace pressure ΔP</text>
      <foreignObject x="210" y="477" width="178" height="22">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:#4B8B00;">
          <math xmlns="http://www.w3.org/1998/Math/MathML"><mi>&#x394;P</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#x3B3;</mi></mrow><mi>r</mi></mfrac></math>
        </div>
      </foreignObject>
      <g transform="translate(210 262)">
        <circle cx="-60" cy="0" r="16" fill="#A5E88A" opacity="0.7" stroke="#58CC02" stroke-width="1.8"/>
        <circle cx="60" cy="0" r="28" fill="#A5E88A" opacity="0.7" stroke="#58CC02" stroke-width="1.8"/>
        <text x="-60" y="2" text-anchor="middle" class="info" fill="#4B8B00">Pₕ</text>
        <text x="60" y="2" text-anchor="middle" class="info" fill="#4B8B00">Pₗ</text>
        <text x="0" y="42" text-anchor="middle" class="info">smaller radius → higher internal pressure</text>
      </g>

      <!-- 04 · Capillary -->
      <rect class="sh s-g" x="16" y="601" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="596" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="612" width="32" height="32" rx="11"/>
      <text x="48" y="633" text-anchor="middle" font-size="15">🥤</text>
      <text x="76" y="633" class="ttl">Capillary rise h</text>
      <foreignObject x="210" y="617" width="178" height="22">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:#4B8B00;">
          <math xmlns="http://www.w3.org/1998/Math/MathML"><mi>h</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#x3B3;</mi><mi>cos&#x2061;&#x3B8;</mi></mrow><mrow><mi>&#x3C1;</mi><mi>g</mi><mi>r</mi></mrow></mfrac></math>
        </div>
      </foreignObject>
      <g transform="translate(210 258)">
        <line x1="-90" y1="20" x2="90" y2="20" stroke="#58CC02" stroke-width="1.5"/>
        <rect x="-90" y="20" width="180" height="14" fill="#A5E88A" opacity="0.5"/>
        <rect x="-50" y="-24" width="20" height="44" fill="none" stroke="#4B8B00" stroke-width="1.8"/>
        <rect x="-48" y="-6" width="16" height="26" fill="#A5E88A"/>
        <rect x="20" y="-36" width="10" height="56" fill="none" stroke="#4B8B00" stroke-width="1.8"/>
        <rect x="22" y="-30" width="6" height="50" fill="#A5E88A"/>
        <text x="0" y="46" text-anchor="middle" class="info">narrower tube → higher climb</text>
      </g>

      <!-- 05 · Young's equation -->
      <rect class="sh s-g" x="16" y="741" width="388" height="130" rx="20"/>
      <rect class="card c-g" x="16" y="736" width="388" height="130" rx="20"/>
      <rect class="bg-g" x="32" y="752" width="32" height="32" rx="11"/>
      <text x="48" y="773" text-anchor="middle" font-size="15">📐</text>
      <text x="76" y="773" class="ttl">Young's equation</text>
      <foreignObject x="210" y="757" width="178" height="22">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:flex-end;height:100%;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:#4B8B00;">
          <math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>&#x3B3;</mi><mi>sv</mi></msub><mo>=</mo><msub><mi>&#x3B3;</mi><mi>sl</mi></msub><mo>+</mo><msub><mi>&#x3B3;</mi><mi>lv</mi></msub><mi>cos&#x2061;&#x3B8;</mi></math>
        </div>
