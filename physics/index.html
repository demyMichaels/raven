<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#58CC02">
<title>The Nucleus | Physics Course Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8; --green-t:#4B8B00;
  --ink:#3C3C3C;
  --ink-soft:#777777;
  --muted:#AFAFAF;
  --line:#E5E5E5;
  --soft:#F7F7F7;
  --bg:#FFFFFF;
  --top-h:108px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html{scroll-behavior:smooth;}

body{
  font-family:'Nunito', ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-weight:700;
  line-height:1.45;
  overflow-x:hidden;
  padding-bottom:calc(78px + env(safe-area-inset-bottom, 0px));
}

a{text-decoration:none;color:inherit;}

/* ============ STICKY TOP BAR ============ */
.topbar{
  position:sticky;
  top:0;
  z-index:60;
  background:rgba(255,255,255,.97);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line);
}

header{
  max-width:1080px;
  margin:0 auto;
  padding:9px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:1.02rem;
  font-weight:900;
  letter-spacing:-.02em;
}

.brand-icon{
  width:30px;height:30px;
  border-radius:9px;
  background:var(--green);
  color:#fff;
  display:grid;place-items:center;
  font-size:.9rem;
  box-shadow:0 3px 0 var(--green-d);
  flex-shrink:0;
}

.brand .accent{color:var(--green-t);}

.stat{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:var(--soft);
  border:2px solid var(--line);
  border-radius:999px;
  padding:4px 11px;
  font-size:.7rem;
  font-weight:900;
  color:var(--ink-soft);
  letter-spacing:.02em;
  white-space:nowrap;
}

/* ============ SECTION CHIP BAR ============ */
.secnav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:8px 14px 10px;
  max-width:1080px;
  margin:0 auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
.secnav::-webkit-scrollbar{display:none;}

.snav{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 13px;
  border-radius:999px;
  font-size:.75rem;
  font-weight:900;
  letter-spacing:.01em;
  background:#fff;
  border:2px solid var(--line);
  color:var(--ink-soft);
  white-space:nowrap;
  transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.snav.active{
  background:var(--cl);
  border-color:var(--c);
  color:var(--ci);
}

/* ============ LAYOUT ============ */
.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:0 14px;
}

/* ============ HERO ============ */
.hero{
  margin-top:16px;
  background:linear-gradient(165deg, #EAFBD9 0%, #F7FFF0 55%, #FFFFFF 100%);
  border:2px solid var(--green-l);
  border-radius:24px;
  padding:24px 18px 22px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.hero::after{
  content:"";
  position:absolute;
  width:200px;height:200px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(88,204,2,.14), transparent 70%);
  top:-80px;right:-70px;
  pointer-events:none;
}

.mascot{
  display:block;
  font-size:52px;
  line-height:1;
  margin-bottom:10px;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.06));
}

.hero h1{
  font-size:clamp(1.8rem, 8vw, 2.4rem);
  font-weight:900;
  letter-spacing:-.03em;
  line-height:1.1;
  margin-bottom:8px;
}

.hero p{
  max-width:440px;
  margin:0 auto 16px;
  font-size:.88rem;
  font-weight:700;
  color:var(--ink-soft);
}

.topic-chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  justify-content:center;
  margin-bottom:20px;
}

.tchip{
  font-size:.66rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.08em;
  padding:5px 10px;
  border-radius:999px;
  background:#fff;
  border:2px solid var(--green-l);
  color:var(--green-t);
}

.cta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--green);
  color:#fff;
  border:none;
  border-radius:16px;
  padding:13px 24px;
  font-family:inherit;
  font-size:.88rem;
  font-weight:900;
  letter-spacing:.05em;
  text-transform:uppercase;
  box-shadow:0 4px 0 var(--green-d);
  transition:transform .09s ease, box-shadow .09s ease;
  cursor:pointer;
}
.cta:active{
  transform:translateY(4px);
  box-shadow:0 0 0 var(--green-d);
}

/* ============ SECTIONS ============ */
.sec{
  margin-top:30px;
  scroll-margin-top:var(--top-h);
}

.sec-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.sec-ico{
  width:36px;height:36px;
  border-radius:12px;
  background:var(--cl);
  display:grid;place-items:center;
  font-size:1.05rem;
  flex-shrink:0;
}

.sec-title{
  font-size:1.1rem;
  font-weight:900;
  letter-spacing:-.02em;
  line-height:1.2;
}

.sec-count{
  margin-left:auto;
  font-size:.64rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.08em;
  background:var(--cl);
  color:var(--ci);
  padding:4px 10px;
  border-radius:999px;
  white-space:nowrap;
}

/* ============ GRID ============ */
.grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:11px;
}

@media (min-width:520px){
  .grid{grid-template-columns:repeat(3, 1fr);gap:13px;}
}
@media (min-width:860px){
  .grid{grid-template-columns:repeat(4, 1fr);gap:14px;}
}
@media (min-width:1080px){
  .grid{grid-template-columns:repeat(5, 1fr);}
}

/* ============ CARD ============ */
.card{
  background:#fff;
  border:2px solid var(--line);
  border-radius:18px;
  box-shadow:0 4px 0 var(--cl);
  padding:12px 12px 10px;
  display:flex;
  flex-direction:column;
  aspect-ratio:1 / 1;
  transition:transform .09s ease, box-shadow .09s ease, border-color .09s ease;
  will-change:transform;
  position:relative;
}

.card:active{
  transform:translateY(4px);
  box-shadow:0 0 0 var(--cl);
  border-color:var(--c);
}

@media (hover:hover){
  .card:hover{
    border-color:var(--c);
    box-shadow:0 4px 0 var(--c);
  }
  .card:hover .arrow{
    background:var(--c);
    color:#fff;
  }
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:6px;
  margin-bottom:8px;
}

.num{
  font-size:.6rem;
  font-weight:900;
  letter-spacing:.07em;
  background:var(--cl);
  color:var(--ci);
  padding:3px 7px;
  border-radius:8px;
  line-height:1.3;
}

.ico{
  font-size:1.3rem;
  line-height:1;
  flex-shrink:0;
}

.card-title{
  flex:1;
  font-size:.8rem;
  font-weight:900;
  line-height:1.25;
  letter-spacing:-.01em;
  color:var(--ink);
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-foot{
  display:flex;
  justify-content:flex-end;
  margin-top:8px;
}

.arrow{
  width:24px;height:24px;
  border-radius:50%;
  background:var(--cl);
  color:var(--ci);
  display:grid;place-items:center;
  font-size:.68rem;
  font-weight:900;
  line-height:1;
  transition:background .15s ease, color .15s ease;
}

/* ============ BOTTOM NAV ============ */
.nav{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:70;
  background:#fff;
  border-top:2px solid var(--line);
  display:flex;
  gap:4px;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom, 0px));
  box-shadow:0 -2px 14px rgba(0,0,0,.05);
}

.nav a,
.nav button{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:6px 2px;
  border:none;
  background:none;
  border-radius:14px;
  font-family:inherit;
  font-size:.6rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.07em;
  color:var(--muted);
  cursor:pointer;
  transition:background .12s ease, color .12s ease;
}

.nav .n-ico{
  font-size:19px;
  line-height:1;
}

.nav a.active,
.nav button.active{
  color:var(--green-t);
  background:var(--green-l);
}

.nav a:active,
.nav button:active{
  background:var(--soft);
}

/* ============ FOOTER ============ */
footer{
  max-width:1080px;
  margin:40px auto 0;
  padding:22px 16px 6px;
  border-top:2px solid var(--line);
  text-align:center;
  font-size:.75rem;
  font-weight:700;
  color:var(--muted);
  line-height:1.65;
}

/* ============ LANDSCAPE ============ */
@media (max-height:480px) and (orientation:landscape){
  .hero{padding:16px 14px;}
  .mascot{font-size:36px;margin-bottom:6px;}
  .hero p{margin-bottom:12px;}
  .topic-chips{display:none;}
  .grid{grid-template-columns:repeat(4, 1fr);gap:10px;}
  .card{aspect-ratio:1.15 / 1;}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
  html{scroll-behavior:auto;}
}
</style>
</head>
<body>

<!-- ================= STICKY TOP ================= -->
<div class="topbar">
  <header>
    <div class="brand">
      <div class="brand-icon">⚛️</div>
      <div><span class="accent">The</span> Nucleus</div>
    </div>
    <div class="stat">📚 58 modules</div>
  </header>

  <nav class="secnav" id="secnav" aria-label="Jump to section"></nav>
</div>

<!-- ================= MAIN ================= -->
<main class="wrap">

  <section class="hero">
    <span class="mascot">⚛️</span>
    <h1>Physics</h1>
    <p>Your complete senior secondary physics course — from measurement to modern physics.</p>

    <div class="topic-chips">
      <span class="tchip">Measurement</span>
      <span class="tchip">Motion</span>
      <span class="tchip">Energy</span>
      <span class="tchip">Waves</span>
      <span class="tchip">Fields</span>
      <span class="tchip">Modern Physics</span>
    </div>

    <a class="cta" href="1.Fundamental/index.html">
      <span>Start Learning</span>
      <span>➜</span>
    </a>
  </section>

  <div id="courseMap"></div>

  <footer>
    <p><strong>The Nucleus</strong> — Physics Course Map</p>
    <p>7 sections · 58 modules · tap any card to open the lesson.</p>
  </footer>

</main>

<!-- ================= BOTTOM NAV ================= -->
<nav class="nav" aria-label="Main navigation">
  <button type="button" data-jump="top" class="active">
    <span class="n-ico">🏠</span>Home
  </button>
  <a href="units.html">
    <span class="n-ico">📏</span>Units
  </a>
  <button type="button" data-jump="map">
    <span class="n-ico">🧭</span>Sections
  </button>
</nav>

<script>
/* =========================================================
   PHYSICS MODULES — Complete Syllabus (1–58)
   ⚠️ Folder names are used verbatim to build href paths.
   ========================================================= */
const modules = [
  /* --- A · Measurements and Units (1–4) --- */
  { id: 1,  folder: "1.Fundamental",                        title: "Fundamental & Derived Units", icon: "📏", section: "A" },
  { id: 2,  folder: "2.Measuring_Instruments",              title: "Measuring Instruments",       icon: "🔬", section: "A" },
  { id: 3,  folder: "3.Dimension",                          title: "Dimensions",                  icon: "📐", section: "A" },
  { id: 4,  folder: "4.Limitations",                        title: "Limitations & Errors",        icon: "⚠️", section: "A" },

  /* --- B · Mechanics (5–24) --- */
  { id: 5,  folder: "5. Scalars and vectors",               title: "Scalars & Vectors",           icon: "➡️", section: "B" },
  { id: 6,  folder: "6.position_and_displacement",          title: "Position & Displacement",     icon: "📍", section: "B" },
  { id: 7,  folder: "7.Newton's_Law_of_motion",             title: "Newton's Laws",               icon: "⚖️", section: "B" },
  { id: 8,  folder: "8.Types_of_motion",                    title: "Types of Motion",             icon: "🔄", section: "B" },
  { id: 9,  folder: "9.Linear_Motion",                      title: "Linear Motion",               icon: "📈", section: "B" },
  { id: 10, folder: "10.Projectiles",                       title: "Projectiles",                 icon: "🎯", section: "B" },
  { id: 11, folder: "11.Gravitational_Field",               title: "Gravitational Field",         icon: "🌍", section: "B" },
  { id: 12, folder: "12.Equilibrium_of_Forces",             title: "Equilibrium of Forces",       icon: "⚖️", section: "B" },
  { id: 13, folder: "13.Principles_of_moments",             title: "Principles of Moments",       icon: "🔧", section: "B" },
  { id: 14, folder: "14.Centre_of_gravity_and_stability",   title: "Centre of Gravity",           icon: "📊", section: "B" },
  { id: 15, folder: "15.Friction",                          title: "Friction",                    icon: "🔥", section: "B" },
  { id: 16, folder: "16.Work_energy_and_power",             title: "Work, Energy & Power",        icon: "⚡", section: "B" },
  { id: 17, folder: "17.Energy_and_society",                title: "Energy & Society",            icon: "🏭", section: "B" },
  { id: 18, folder: "18.Dams_and_energy_production",        title: "Dams & Energy",               icon: "🌊", section: "B" },
  { id: 19, folder: "19.Nuclear_Energy",                    title: "Nuclear Energy",              icon: "☢️", section: "B" },
  { id: 20, folder: "20.Solar_energy",                      title: "Solar Energy",                icon: "☀️", section: "B" },
  { id: 21, folder: "21.Simple_machines",                   title: "Simple Machines",             icon: "⚙️", section: "B" },
  { id: 22, folder: "22.Elasticity",                        title: "Elasticity",                  icon: "🪷", section: "B" },
  { id: 23, folder: "23.Pressure",                          title: "Pressure",                    icon: "📊", section: "B" },
  { id: 24, folder: "24.Liquids_at_Rest",                   title: "Liquids at Rest",             icon: "💧", section: "B" },

  /* --- C · Heat & Thermodynamics (25–32) --- */
  { id: 25, folder: "25.Temperature_and_measurement",       title: "Temperature",                 icon: "🌡️", section: "C" },
  { id: 26, folder: "26.Quantity_of_heat",                  title: "Quantity of Heat",            icon: "🔥", section: "C" },
  { id: 27, folder: "27.Change_of_staate",                  title: "Change of State",             icon: "💨", section: "C" },
  { id: 28, folder: "28.Thermal_expansion",                 title: "Thermal Expansion",           icon: "📈", section: "C" },
  { id: 29, folder: "29.Gas_laws",                          title: "Gas Laws",                    icon: "🧪", section: "C" },
  { id: 30, folder: "30.Vapours_and_humidity",              title: "Vapours & Humidity",          icon: "💧", section: "C" },
  { id: 31, folder: "31.Kinetic_theory_of_matter",          title: "Kinetic Theory",              icon: "⚛️", section: "C" },
  { id: 32, folder: "32.Heat_transfer",                     title: "Heat Transfer",               icon: "🌡️", section: "C" },

  /* --- D · Waves & Sound (33–37) --- */
  { id: 33, folder: "33.Production_and_propagation_waves", title: "Wave Production",             icon: "🌊", section: "D" },
  { id: 34, folder: "34.Classification_of_waves",          title: "Wave Classification",         icon: "📊", section: "D" },
  { id: 35, folder: "35.Charateristics_of_waves",          title: "Wave Properties",             icon: "🔄", section: "D" },
  { id: 36, folder: "36.Propagation_of_sound",             title: "Sound Propagation",           icon: "🔊", section: "D" },
  { id: 37, folder: "37.Characteristics_of_sound",         title: "Sound Properties",            icon: "🎵", section: "D" },

  /* --- E · Light & Optics (38–42) --- */
  { id: 38, folder: "38.Light_energy",                      title: "Light Energy",                icon: "💡", section: "E" },
  { id: 39, folder: "39.Reflection_of_light",               title: "Reflection",                  icon: "🪞", section: "E" },
  { id: 40, folder: "40.Refraction_of_light",               title: "Refraction",                  icon: "🔍", section: "E" },
  { id: 41, folder: "41.Optical_instruments",               title: "Optical Instruments",         icon: "🔭", section: "E" },
  { id: 42, folder: "42.Dispersion_and_colours",            title: "Dispersion",                  icon: "🌈", section: "E" },

  /* --- F · Electricity & Magnetism (43–53) --- */
  { id: 43, folder: "43.Electrostatics",                    title: "Electrostatics",              icon: "⚡", section: "F" },
  { id: 44, folder: "44.Capacitors",                        title: "Capacitors",                  icon: "🔋", section: "F" },
  { id: 45, folder: "45.Electric_cells",                    title: "Electric Cells",              icon: "🔋", section: "F" },
  { id: 46, folder: "46.Current_electricity",               title: "Current Electricity",         icon: "⚡", section: "F" },
  { id: 47, folder: "47.Electrical_energy_and_power",       title: "Electrical Energy",           icon: "💡", section: "F" },
  { id: 48, folder: "48.magnets_and+magnetic_fields",       title: "Magnets & Fields",            icon: "🧲", section: "F" },
  { id: 49, folder: "49.Force_on_current_carrying_conductor", title: "Force on Conductor",        icon: "⚡", section: "F" },
  { id: 50, folder: "50.Electromagnetic_induction",         title: "EM Induction",                icon: "🔄", section: "F" },
  { id: 51, folder: "51.Inductance",                        title: "Inductance",                  icon: "⏲️", section: "F" },
  { id: 52, folder: "52.Eddy_current",                      title: "Eddy Current",                icon: "🔄", section: "F" },
  { id: 53, folder: "53.Simple_AC_Circuits",                title: "AC Circuits",                 icon: "📈", section: "F" },

  /* --- G · Modern Physics & Electronics (54–58) --- */
  { id: 54, folder: "54.Conduction_through_liquids",        title: "Conduction in Liquids",       icon: "💧", section: "G" },
  { id: 55, folder: "55.Conduction_through_gases",          title: "Conduction in Gases",         icon: "💨", section: "G" },
  { id: 56, folder: "56.Elementary_modern_physics",         title: "Modern Physics",              icon: "⚛️", section: "G" },
  { id: 57, folder: "57.Introductory_electronics",          title: "Electronics",                 icon: "📻", section: "G" },
  { id: 58, folder: "58.Fibre_optics_and_lasers",           title: "Fibre Optics",                icon: "💫", section: "G" }
];

/* =========================================================
   SECTION DEFINITIONS — title + Duolingo-style colour set
   ========================================================= */
const SECTIONS = {
  A: { name: "Measurements",                  icon: "📏", c: "#58CC02", cd: "#46A302", cl: "#D7FFB8", ci: "#4B8B00" },
  B: { name: "Mechanics",                     icon: "⚙️", c: "#1CB0F6", cd: "#1899D6", cl: "#DDF4FF", ci: "#0B7BB0" },
  C: { name: "Heat",                          icon: "🔥", c: "#FF9600", cd: "#E08600", cl: "#FFE9C7", ci: "#C46A00" },
  D: { name: "Waves",                         icon: "🌊", c: "#CE82FF", cd: "#B368E0", cl: "#F3E4FF", ci: "#8B44B8" },
  E: { name: "Optics",                        icon: "🔭", c: "#FFC800", cd: "#E0B000", cl: "#FFF4C7", ci: "#B08A00" },
  F: { name: "Electricity",                   icon: "⚡", c: "#FF4B4B", cd: "#E03E3E", cl: "#FFDCDC", ci: "#C42B2B" },
  G: { name: "Modern Physics & Electronics",  icon: "⚛️", c: "#00C2A8", cd: "#00A38D", cl: "#C9F7F0", ci: "#007F6E" }
};

const ORDER = ["A", "B", "C", "D", "E", "F", "G"];

/* =========================================================
   RENDER
   ========================================================= */
const chipHost = document.getElementById("secnav");
const mapHost  = document.getElementById("courseMap");

let chipsHTML = "";
let bodyHTML  = "";

ORDER.forEach(code => {
  const s = SECTIONS[code];
  const list = modules.filter(m => m.section === code);
  if (!list.length) return;

  const vars = `--c:${s.c};--cd:${s.cd};--cl:${s.cl};--ci:${s.ci}`;

  chipsHTML += `<a class="snav" href="#sec-${code}" data-sec="sec-${code}" style="${vars}">
      <span>${s.icon}</span>${s.name}
    </a>`;

  bodyHTML += `
    <section class="sec" id="sec-${code}" style="${vars}">
      <div class="sec-head">
        <div class="sec-ico">${s.icon}</div>
        <h2 class="sec-title">${s.name}</h2>
        <span class="sec-count">${list.length} units</span>
      </div>
      <div class="grid">
        ${list.map(m => `
          <a class="card" href="${m.folder}/index.html">
            <div class="card-top">
              <span class="num">${String(m.id).padStart(2, "0")}</span>
              <span class="ico">${m.icon}</span>
            </div>
            <div class="card-title">${m.title}</div>
            <div class="card-foot"><span class="arrow">➜</span></div>
          </a>`).join("")}
      </div>
    </section>`;
});

chipHost.innerHTML = chipsHTML;
mapHost.innerHTML  = bodyHTML;

/* =========================================================
   SCROLL SPY — highlight the active section chip
   ========================================================= */
const chipEls = Array.from(document.querySelectorAll(".snav"));
const secEls  = Array.from(document.querySelectorAll(".sec"));

function syncChips() {
  const probe = window.scrollY + 150;
  let current = null;

  secEls.forEach(sec => {
    if (sec.offsetTop <= probe) current = sec.id;
  });

  chipEls.forEach(chip => {
    chip.classList.toggle("active", chip.dataset.sec === current);
  });

  if (!current) return;

  const active = chipEls.find(c => c.dataset.sec === current);
  if (!active) return;

  /* Keep the active chip visible — scroll the bar, never the page */
  const cr = active.getBoundingClientRect();
  const kr = chipHost.getBoundingClientRect();

  if (cr.left < kr.left || cr.right > kr.right) {
    const delta = (cr.left - kr.left) - (kr.width - cr.width) / 2;
    chipHost.scrollLeft += delta;
  }
}

let ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    syncChips();
    ticking = false;
  });
}, { passive: true });

syncChips();

/* =========================================================
   BOTTOM NAV
   ========================================================= */
const navButtons = document.querySelectorAll(".nav [data-jump]");

navButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    const target = btn.dataset.jump;

    if (target === "top") {
      window.scrollTo({ top: 0, behavior: "smooth" });
      setActiveNav(btn);
      return;
    }

    if (target === "map") {
      const firstSec = document.querySelector(".sec");
      if (firstSec) {
        window.scrollTo({ top: firstSec.offsetTop - 118, behavior: "smooth" });
      }
      setActiveNav(btn);
    }
  });
});

function setActiveNav(el) {
  document.querySelectorAll(".nav a, .nav button").forEach(n => n.classList.remove("active"));
  if (el) el.classList.add("active");
}

/* Home becomes active again when the user scrolls back to the top */
window.addEventListener("scroll", () => {
  if (window.scrollY < 120) {
    setActiveNav(document.querySelector('.nav [data-jump="top"]'));
  }
}, { passive: true });
</script>
