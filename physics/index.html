<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#58CC02">
<title>Physics Path — WAEC · NECO · JAMB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8; --green-t:#58A700;
    --blue:#1CB0F6;  --blue-d:#1899D6;  --blue-l:#DDF4FF;
    --red:#FF4B4B;   --red-d:#EA2B2B;   --red-l:#FFDFE0;
    --yellow:#FFC800;--yellow-d:#E5A000;--yellow-l:#FFF4CC;
    --purple:#CE82FF;--purple-d:#A568CC;--purple-l:#F3E0FF;
    --text:#3C3C3C;  --text-2:#777777;  --gray:#AFAFAF;
    --border:#E5E5E5;--border-2:#D8D8D8;
    --bg:#FFFFFF;    --bg-2:#F7F7F7;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --topbar-h: 54px;
    --tabbar-h: 64px;
    --maxw: 480px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); font-weight:700;
    -webkit-font-smoothing:antialiased;-webkit-touch-callout:none;user-select:none;
  }
  button{font-family:inherit;touch-action:manipulation}

  #app{
    width:100%; height:100dvh; min-height:100vh;
    display:flex; flex-direction:column;
    background:var(--bg);
    padding-left:var(--safe-l); padding-right:var(--safe-r);
    position:relative; max-width:var(--maxw); margin:0 auto;
  }
  @media (min-width:540px){
    body{background:#e9edf1}
    #app{box-shadow:0 0 60px rgba(15,30,50,.10);border-left:1px solid rgba(0,0,0,.04);border-right:1px solid rgba(0,0,0,.04)}
  }

  .topbar{
    flex:0 0 auto;
    height:calc(var(--topbar-h) + var(--safe-t));
    padding:var(--safe-t) 16px 0;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg); border-bottom:2px solid var(--border); z-index:20;
  }
  .topbar.hidden{display:none}
  .tb-group{display:flex; align-items:center; gap:14px}
  .tb-stat{display:flex; align-items:center; gap:5px; font-size:16px; font-weight:900; color:var(--text); padding:6px 2px}
  .tb-stat .ico{font-size:20px; line-height:1}
  .tb-stat.hearts{color:var(--red)}
  .tb-stat.xp{color:var(--blue)}
  .tb-stat.streak{color:#FF9600}

  #screenRoot{flex:1 1 auto; position:relative; overflow:hidden; min-height:0}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column; min-height:0; background:var(--bg)}
  .screen.hidden{display:none}
  .scroll{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; min-height:0;
    -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .scroll-pad{padding:12px 16px calc(24px + var(--safe-b)); max-width:520px; margin:0 auto}

  .hero{
    background:linear-gradient(135deg,#58CC02 0%,#4CB302 100%);
    border-radius:20px; padding:18px 20px; color:#fff; margin-bottom:16px;
    box-shadow:0 4px 0 var(--green-d); position:relative; overflow:hidden;
  }
  .hero::after{content:'⚛️'; position:absolute; right:-14px; bottom:-20px; font-size:110px; opacity:.15; pointer-events:none}
  .hero h1{font-size:22px; font-weight:900; letter-spacing:-.4px; line-height:1.15; margin-bottom:4px; position:relative; z-index:2}
  .hero p{font-size:13px; font-weight:700; opacity:.92; line-height:1.4; position:relative; z-index:2; max-width:85%}
  .hero-stats{display:flex; gap:10px; margin-top:14px; position:relative; z-index:2}
  .hero-stat{background:rgba(255,255,255,.22); border-radius:10px; padding:6px 12px; font-size:12px; font-weight:900; letter-spacing:.3px}

  .unit{margin-bottom:22px}
  .unit-head{
    border-radius:16px; padding:13px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    color:#fff; margin-bottom:10px; position:relative; overflow:hidden;
    box-shadow:0 4px 0 rgba(0,0,0,.14);
  }
  .unit-head::after{content:''; position:absolute; inset:0; background:rgba(255,255,255,.08);
    clip-path:polygon(0 100%,100% 0,100% 100%); pointer-events:none}
  .uh-left{min-width:0; position:relative; z-index:2}
  .uh-eyebrow{font-size:10px; font-weight:900; letter-spacing:1.6px; text-transform:uppercase; opacity:.85}
  .uh-title{font-size:15px; font-weight:900; letter-spacing:-.2px; line-height:1.2; margin-top:2px}
  .uh-prog{font-size:11px; font-weight:800; opacity:.88; margin-top:3px}
  .uh-badge{flex:0 0 auto; background:rgba(255,255,255,.28); border-radius:10px; padding:6px 11px;
    font-size:11px; font-weight:900; letter-spacing:.5px; position:relative; z-index:2}
  .uh-badge.done{background:rgba(255,255,255,.92); color:var(--green-t)}

  .nodes{padding:18px 0 4px; display:flex; flex-direction:column; align-items:center; gap:16px}
  .node-row{display:flex; justify-content:center; width:100%; transition:transform .3s}
  .lnode-wrap{position:relative; display:flex; flex-direction:column; align-items:center}

  .lnode{
    width:72px; height:72px; border-radius:50%; border:none;
    cursor:pointer; display:grid; place-items:center;
    font-size:28px; position:relative;
    background:var(--border); box-shadow:0 6px 0 #CFCFCF;
    transition:transform .08s, box-shadow .08s; touch-action:manipulation;
  }
  .lnode:active:not(.locked){transform:translateY(4px); box-shadow:0 2px 0 #CFCFCF}
  .lnode.done,.lnode.avail,.lnode.current{background:var(--green); box-shadow:0 6px 0 var(--green-d); color:#fff}
  .lnode.done:active,.lnode.avail:active{transform:translateY(4px); box-shadow:0 2px 0 var(--green-d)}
  .lnode.current{animation:bob 1.9s ease-in-out infinite}
  .lnode.locked{background:#E9E9E9; box-shadow:0 6px 0 #D4D4D4; color:#B7B7B7; cursor:not-allowed}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  .lnode .crown{position:absolute; top:-12px; right:-8px; font-size:20px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.22))}
  .lnode .pulse{position:absolute; inset:-8px; border-radius:50%; border:3px solid var(--green); opacity:0; pointer-events:none}
  .lnode.current .pulse{animation:pulseRing 2.1s ease-out infinite}
  @keyframes pulseRing{0%{opacity:.65; transform:scale(.86)}100%{opacity:0; transform:scale(1.28)}}

  .start-bubble{
    position:absolute; top:-38px; left:50%; transform:translateX(-50%);
    background:#fff; border:2.5px solid var(--border); border-radius:12px;
    padding:5px 12px; font-size:10px; font-weight:900; letter-spacing:1.2px;
    color:var(--green); white-space:nowrap; box-shadow:0 3px 0 var(--border);
    animation:bob 1.9s ease-in-out infinite;
  }
  .start-bubble::after{content:''; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent;
    border-top:7px solid var(--border)}
  .lnode-label{font-size:11.5px; font-weight:800; color:var(--text-2); margin-top:9px;
    max-width:130px; text-align:center; line-height:1.25}
  .lnode.current + .lnode-label{color:var(--green-t)}
  .lnode.locked + .lnode-label{color:var(--gray)}

  #lessonScreen{background:#fff}
  .lesson-head{
    flex:0 0 auto;
    padding:calc(var(--safe-t) + 12px) 14px 12px;
    display:flex; align-items:center; gap:12px;
    background:#fff; border-bottom:2px solid var(--border); z-index:10;
  }
  .lesson-x{width:40px; height:40px; border-radius:12px; border:none; background:transparent;
    color:var(--gray); font-size:22px; font-weight:900; cursor:pointer;
    display:grid; place-items:center; flex:0 0 auto; transition:background .15s, color .15s}
  .lesson-x:active{background:var(--bg-2); color:var(--text)}
  .lesson-progress{flex:1 1 auto; height:16px; background:var(--border); border-radius:99px;
    overflow:hidden; position:relative}
  .lesson-progress-fill{height:100%; width:0; background:var(--green); border-radius:99px;
    transition:width .5s cubic-bezier(.4,0,.2,1); position:relative}
  .lesson-progress-fill::after{content:''; position:absolute; top:3px; left:8px; right:8px; height:4px;
    background:rgba(255,255,255,.4); border-radius:99px}
  .lesson-hearts{flex:0 0 auto; font-size:15px; letter-spacing:1px; padding-left:2px;
    min-width:64px; text-align:right}

  .lesson-main{flex:1 1 auto; overflow-y:auto; min-height:0;
    -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
    padding:20px 18px 24px; scrollbar-width:none}
  .lesson-main::-webkit-scrollbar{display:none}
  .lesson-inner{max-width:520px; margin:0 auto}

  .tag{display:inline-block; font-size:10px; font-weight:900; letter-spacing:1.6px;
    text-transform:uppercase; padding:5px 11px; border-radius:99px; margin-bottom:14px}
  .tag.guide{background:var(--blue-l); color:var(--blue-d)}
  .tag.quiz{background:var(--purple-l); color:var(--purple-d)}

  .guide h2{font-size:24px; font-weight:900; line-height:1.2; letter-spacing:-.4px; margin-bottom:14px}
  .guide-desc{font-size:15px; line-height:1.6; color:var(--text); font-weight:600;
    background:var(--bg-2); border-left:5px solid var(--blue);
    border-radius:0 12px 12px 0; padding:14px 16px; margin-bottom:18px}
  .gblock{margin-bottom:18px}
  .gblock-title{font-size:11px; font-weight:900; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--text-2); margin-bottom:9px;
    display:flex; align-items:center; gap:7px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{background:#fff; border:2px solid var(--border); border-bottom-width:4px;
    border-radius:12px; padding:9px 13px; font-size:13px; font-weight:800;
    font-family:ui-monospace,'SF Mono',Menlo,monospace; color:var(--text); word-break:break-word}
  .warn-box{background:var(--red-l); border:2px solid #FFC1C1; border-radius:14px; padding:14px 16px}
  .warn-box .gblock-title{color:var(--red-d); margin-bottom:10px}
  .warn-list{list-style:none; display:flex; flex-direction:column; gap:9px}
  .warn-list li{font-size:13.5px; font-weight:700; color:#B32424; display:flex; gap:9px;
    align-items:flex-start; line-height:1.45}
  .warn-list li::before{content:'✕'; font-weight:900; font-size:13px; flex:0 0 auto; margin-top:1px}

  .qtext{font-size:20px; font-weight:900; line-height:1.35; letter-spacing:-.3px; margin-bottom:20px}
  .options{display:flex; flex-direction:column; gap:11px}
  .opt{display:flex; align-items:center; gap:13px; width:100%; text-align:left;
    background:#fff; border:2px solid var(--border); border-bottom-width:4px;
    border-radius:14px; padding:15px 16px; cursor:pointer;
    transition:transform .08s, box-shadow .08s, background .15s, border-color .15s;
    font-family:inherit; font-size:15px; font-weight:700; color:var(--text); min-height:58px}
  .opt:active:not(:disabled){transform:translateY(2px); border-bottom-width:2px}
  .opt .key{flex:0 0 auto; width:28px; height:28px; border-radius:8px; background:var(--bg-2);
    border:2px solid var(--border); display:grid; place-items:center;
    font-size:11px; font-weight:900; color:var(--text-2)}
  .opt .label{flex:1; line-height:1.35}
  .opt.picked{border-color:var(--blue); background:var(--blue-l); color:var(--blue-d)}
  .opt.picked .key{background:var(--blue); border-color:var(--blue); color:#fff}
  .opt.correct{border-color:var(--green); background:var(--green-l); color:var(--green-t)}
  .opt.correct .key{background:var(--green); border-color:var(--green); color:#fff}
  .opt.wrong{border-color:var(--red); background:var(--red-l); color:var(--red-d)}
  .opt.wrong .key{background:var(--red); border-color:var(--red); color:#fff}
  .opt:disabled{cursor:default}

  .lesson-foot{flex:0 0 auto; background:#fff; border-top:2px solid var(--border);
    padding:14px 18px calc(14px + var(--safe-b)); transition:background .2s}
  .lesson-foot.ok{background:var(--green-l); border-top-color:#B6ED8A}
  .lesson-foot.no{background:var(--red-l); border-top-color:#FFBDBD}
  .foot-inner{max-width:520px; margin:0 auto}

  .fb-bar{display:flex; flex-direction:column; gap:12px}
  .fb-row{display:flex; align-items:center; gap:12px}
  .fb-ico{flex:0 0 auto; width:40px; height:40px; border-radius:50%;
    display:grid; place-items:center; font-size:22px; font-weight:900; color:#fff}
  .fb-ico.ok{background:var(--green)}
  .fb-ico.no{background:var(--red)}
  .fb-title{font-size:18px; font-weight:900; letter-spacing:-.2px; line-height:1.2}
  .fb-title.ok{color:var(--green-t)}
  .fb-title.no{color:var(--red-d)}
  .fb-text{font-size:13.5px; font-weight:700; color:var(--text); line-height:1.45;
    padding-left:52px; margin-top:-6px}

  .btn{border:none; border-radius:16px; padding:15px 24px; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:900; letter-spacing:1px;
    text-transform:uppercase; color:#fff; background:var(--green);
    box-shadow:0 4px 0 var(--green-d); transition:transform .08s, box-shadow .08s;
    white-space:nowrap; touch-action:manipulation; min-height:52px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px}
  .btn:active:not(:disabled){transform:translateY(4px); box-shadow:0 0 0 var(--green-d)}
  .btn:disabled{background:var(--border); color:var(--gray); box-shadow:0 4px 0 #CFCFCF; cursor:not-allowed}
  .btn.full{width:100%}
  .btn.red{background:var(--red); box-shadow:0 4px 0 var(--red-d)}
  .btn.red:active{box-shadow:0 0 0 var(--red-d)}
  .btn.ghost{background:#fff; color:var(--text-2); box-shadow:0 4px 0 var(--border); border:2px solid var(--border)}
  .btn.ghost:active{box-shadow:0 0 0 var(--border)}

  #doneScreen{background:linear-gradient(170deg,#58CC02 0%,#4CB302 55%,#3E9600 100%);
    align-items:center; justify-content:center; overflow-y:auto;
    -webkit-overflow-scrolling:touch; padding:24px 20px calc(24px + var(--safe-b))}
  .done-inner{max-width:420px; width:100%; text-align:center; margin:auto;
    animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{0%{transform:scale(.85); opacity:0}100%{transform:scale(1); opacity:1}}
  .trophy{font-size:80px; margin-bottom:8px;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.25)); animation:bob 2s ease-in-out infinite}
  .done-title{font-size:29px; font-weight:900; color:#fff; letter-spacing:-.6px; margin-bottom:6px}
  .done-sub{font-size:15px; font-weight:700; color:rgba(255,255,255,.92); margin-bottom:24px}
  .done-stats{display:flex; gap:10px; margin-bottom:22px}
  .done-stat{flex:1; background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.3);
    border-radius:16px; padding:14px 8px}
  .done-stat .ds-v{font-size:22px; font-weight:900; color:#FFD84D; line-height:1.1}
  .done-stat .ds-l{font-size:10px; font-weight:900; letter-spacing:1.2px;
    text-transform:uppercase; color:rgba(255,255,255,.88); margin-top:4px}
  .done-card{background:#fff; border-radius:20px; padding:16px; margin-bottom:20px;
    box-shadow:0 6px 0 rgba(0,0,0,.16); text-align:left}
  .done-card .dc-t{font-size:11px; font-weight:900; letter-spacing:1.4px;
    text-transform:uppercase; color:var(--gray); margin-bottom:8px}
  .done-card .dc-q{font-size:14px; font-weight:800; color:var(--text); line-height:1.5}
  .done-card .dc-a{margin-top:10px; font-size:13.5px; font-weight:800; color:var(--green-t); line-height:1.4}

  .stats-hero{background:linear-gradient(135deg,#1CB0F6,#1899D6); border-radius:20px;
    padding:18px 20px; color:#fff; margin-bottom:16px; box-shadow:0 4px 0 var(--blue-d)}
  .stats-hero h2{font-size:18px; font-weight:900; letter-spacing:-.3px; margin-bottom:14px}
  .stats-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
  .stat-card{background:rgba(255,255,255,.2); border-radius:12px; padding:12px}
  .stat-card .sv{font-size:22px; font-weight:900; line-height:1.1}
  .stat-card .sl{font-size:10px; font-weight:900; letter-spacing:1.2px;
    text-transform:uppercase; opacity:.85; margin-top:4px}
  .stat-section-title{font-size:11px; font-weight:900; letter-spacing:1.4px;
    text-transform:uppercase; color:var(--text-2); margin:20px 4px 10px}
  .stat-row{background:#fff; border:2px solid var(--border); border-bottom-width:4px;
    border-radius:14px; padding:12px 14px; margin-bottom:8px;
    display:flex; align-items:center; gap:12px}
  .stat-dot{width:10px; height:10px; border-radius:3px; flex:0 0 auto}
  .stat-info{flex:1; min-width:0}
  .stat-name{font-size:13px; font-weight:800; color:var(--text); line-height:1.2; margin-bottom:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .stat-bar{height:8px; background:var(--border); border-radius:99px; overflow:hidden; position:relative}
  .stat-bar-fill{height:100%; background:var(--green); border-radius:99px; transition:width .4s}
  .stat-count{font-size:11px; font-weight:900; color:var(--text-2);
    font-family:ui-monospace,monospace; flex:0 0 auto}
  .stat-count.done{color:var(--green-t)}

  .tabbar{flex:0 0 auto; height:calc(var(--tabbar-h) + var(--safe-b));
    padding-bottom:var(--safe-b); background:#fff; border-top:2px solid var(--border);
    display:flex; z-index:20}
  .tabbar.hidden{display:none}
  .tab{flex:1; background:transparent; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; color:var(--gray); padding:8px 4px;
    transition:color .15s, background .15s; position:relative;
    font-family:inherit; touch-action:manipulation}
  .tab .ti{font-size:24px; line-height:1; transition:transform .15s}
  .tab .tl{font-size:10px; font-weight:900; letter-spacing:.6px; text-transform:uppercase}
  .tab.active{color:var(--green)}
  .tab.active .ti{transform:translateY(-1px)}
  .tab:active{background:var(--bg-2)}
  .tab.active::before{content:''; position:absolute; top:0; left:20%; right:20%;
    height:3px; background:var(--green); border-radius:0 0 3px 3px}

  .modal-bg{position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:80;
    display:flex; align-items:flex-end; justify-content:center; animation:fade .2s; padding:0}
  @media (min-width:540px){ .modal-bg{align-items:center; padding:24px} }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#fff; width:100%; max-width:440px;
    border-radius:24px 24px 0 0; padding:22px 22px calc(22px + var(--safe-b));
    text-align:center; animation:slideUp .3s cubic-bezier(.2,1,.3,1)}
  @media (min-width:540px){ .modal{border-radius:24px; padding-bottom:22px} }
  @keyframes slideUp{0%{transform:translateY(20px); opacity:0}100%{transform:translateY(0); opacity:1}}
  .modal .grabber{width:36px; height:4px; border-radius:99px; background:var(--border-2); margin:0 auto 14px}
  @media (min-width:540px){ .modal .grabber{display:none} }
  .modal .m-ico{font-size:56px; margin-bottom:10px; line-height:1}
  .modal h3{font-size:22px; font-weight:900; letter-spacing:-.3px; margin-bottom:8px}
  .modal p{font-size:14.5px; font-weight:600; color:var(--text-2); line-height:1.5; margin-bottom:20px}
  .modal .m-row{display:flex; flex-direction:column; gap:10px}

  .toast{position:absolute; top:calc(var(--safe-t) + var(--topbar-h) + 10px);
    left:50%; transform:translateX(-50%) translateY(-14px);
    background:var(--text); color:#fff; font-size:13px; font-weight:800;
    padding:11px 20px; border-radius:99px; z-index:90; opacity:0;
    transition:.25s; pointer-events:none; white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:90vw; overflow:hidden; text-overflow:ellipsis}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (max-width:370px){
    .qtext{font-size:18px}
    .guide h2{font-size:21px}
    .hero h1{font-size:20px}
    .uh-title{font-size:14px}
    .lnode{width:66px; height:66px; font-size:25px}
    .btn{padding:14px 18px; font-size:14px}
    .opt{padding:13px 14px; font-size:14.5px}
    .hero{padding:16px}
    .guide-desc{font-size:14.5px}

['vector-notation','Vector Representation',1,['scalars-vectors'],'Drawing vectors as arrows; notation A, or bold; unit vector notation.','A = Ax i + Ay j|Length of arrow = magnitude','Arrow length is arbitrary|Vectors cannot be negative',['In Ax i + Ay j, the symbol i represents...',['The unit vector along x','The imaginary unit','The magnitude','A scalar'],0,'i-hat is the unit vector pointing along the positive x-axis.']],

['distance-displacement','Distance & Displacement',1,['position-coords'],'Distance is total path length; displacement is straight-line change in position.','dx = x_final - x_initial|distance >= |displacement|','Distance equals displacement|Displacement can exceed distance',['A car travels 5 km east then 5 km west. Its displacement is...',['0 km','10 km east','10 km west','5 km'],0,'Displacement = final - initial = 0, though the distance travelled is 10 km.']],

['types-of-motion','Types of Motion',2,['scalars-vectors'],'Random, rectilinear, translational, rotational, circular, orbital, spin, oscillatory.','Uniform vs non-uniform|Linear vs angular','All motion is the same type|Oscillatory is the same as circular',['Which of these describes a body moving back and forth about a mean position?',['Oscillatory','Rotational','Translational','Random'],0,'To-and-fro motion about a fixed point is called oscillatory motion.']],
['speed','Speed',2,['distance-displacement'],'Rate of change of distance. Scalar quantity.','speed = distance / time','Speed is a vector|Speed and velocity are identical',['The SI unit of speed is...',['m/s','m/s^2','m','m^2/s'],0,'Speed is distance divided by time, so its unit is metre per second.']],

['concept-force','Concept of Force',3,['vector-notation'],'A push or pull that changes motion. Vector quantity, measured in newtons.','1 N = 1 kg m/s^2|F_net = sum F','Force causes motion|Motion requires constant force',['Force is measured in...',['Newtons','Joules','Watts','Pascals'],0,'The SI unit of force is the newton (N).']],
['types-force','Types of Force',3,['concept-force'],'Contact forces (push, pull, friction) and non-contact / field forces (gravity, electric, magnetic).','Contact: acts on contact|Field: acts at a distance','Gravity requires contact|All forces act at a distance',['Which of these is a field force?',['Gravitational force','Friction','Tension','Normal force'],0,'Gravity acts without contact, so it is a field force.']],
['newton-first','Newton First Law',3,['concept-force'],'An object stays at rest or in uniform motion unless acted on by a net external force.','Sum F = 0 gives v = constant','Objects naturally slow down|Motion needs a force',['A puck sliding on a frictionless surface will...',['Keep moving at constant velocity','Slow down','Speed up','Stop immediately'],0,'Without a net force, a moving object continues at constant velocity.']],

['newton-second','Newton Second Law',3,['newton-first'],'Net force equals mass times acceleration. F = ma.','F = ma|F = dp/dt','F = mv|Force is the same as velocity',['A 2 kg mass accelerates at 3 m/s^2. The net force is...',['6 N','0.67 N','5 N','1.5 N'],0,'F = ma = 2 x 3 = 6 N.']],

['fbd','Free-Body Diagrams',3,['newton-second'],'Drawing every external force on a single object — the key tool for solving dynamics.','Sum Fx = m ax|Sum Fy = m ay','Include the object own force|Forget the normal force',['A free-body diagram should show...',['All external forces on the object','Only gravity','Only contact forces','The object mass'],0,'Show every external force acting on the body, including weight and normal force.']],

['viscosity-stokes','Viscosity & Stokes Law',3,['friction'],'Friction in fluids; terminal velocity; Stokes law for spherical objects.','F = 6 pi eta r v|Terminal v: mg = 6 pi eta r v','Viscosity is friction between solids|Terminal velocity is zero',['At terminal velocity, a falling sphere has...',['Zero acceleration','Zero velocity','Maximum acceleration','Zero weight'],0,'At terminal velocity, net force is zero so acceleration is zero.']],
['impulse','Impulse',3,['newton-second'],'Force applied over time — the change in momentum.','J = F dt|J = dp|Area under F-t graph','Impulse equals force|Longer contact time means more impulse',['The area under a force-time graph gives...',['Impulse','Work','Power','Acceleration'],0,'Impulse equals the area under a force-time graph.']],
['momentum','Momentum',3,['impulse'],'Mass in motion — a vector quantity.','p = mv|dp = F dt','Momentum is a scalar|Momentum = kinetic energy',['The momentum of a 3 kg mass moving at 4 m/s is...',['12 kg m/s','0.75 kg m/s','7 kg m/s','1.33 kg m/s'],0,'p = mv = 3 x 4 = 12 kg m/s.']],
['cons-momentum','Conservation of Linear Momentum',3,['momentum'],'In a closed system, total momentum before equals total momentum after.','m1 u1 + m2 u2 = m1 v1 + m2 v2','Momentum is lost in collisions|Works only for elastic collisions',['Total momentum is conserved in...',['All collisions in closed systems','Only elastic collisions','Only explosions','Never'],0,'Conservation of momentum holds for all collisions in a closed system.']],

['equilibrium-coplanar','Equilibrium of Coplanar Forces',4,['vector-resolution','newton-first'],'Conditions for equilibrium: net force = 0 and net torque = 0.','Sum Fx = 0|Sum Fy = 0|Sum torque = 0','Equilibrium means at rest only|One condition is enough',['For a body in equilibrium...',['Net force and net torque are zero','Only net force is zero','Only net torque is zero','Velocity is maximum'],0,'Both net force and net torque must be zero for full equilibrium.']],
['triangle-polygon','Triangle & Polygon of Forces',4,['equilibrium-coplanar','vector-addition'],'Three or more forces in equilibrium can be drawn head-to-tail to form a closed polygon.','Closed triangle means equilibrium','Forces in equilibrium form an open shape',['Three forces in equilibrium, drawn head-to-tail, form...',['A closed triangle','An open triangle','A straight line','A circle'],0,'In equilibrium, the force vectors close head-to-tail into a triangle.']],
['lami','Lami Theorem',4,['triangle-polygon'],'For three concurrent forces in equilibrium, each is proportional to the sine of the opposite angle.','A/sin a = B/sin b = C/sin c','Applies to any number of forces|Uses cos instead of sin',['Lami theorem applies to how many concurrent forces?',['Three','Two','Four','Any number'],0,'Lami theorem specifically applies to three concurrent forces in equilibrium.']],
['moments','Principle of Moments',4,['equilibrium-coplanar'],'For rotational equilibrium, sum of clockwise moments equals sum of anticlockwise moments.','Moment = F x d|Sum M_cw = Sum M_acw','Moment depends only on force|Distance measured from any point',['The moment of a force equals...',['Force x perpendicular distance','Force / distance','Force x time','Mass x distance'],0,'Moment = F x d, where d is the perpendicular distance to the pivot.']],
['couples-torque','Couples & Torque',4,['moments'],'Two equal, opposite, parallel forces form a couple; torque is their rotational effect.','Torque = F x perpendicular distance','A couple produces translation|Couple is the same as single force',['A couple produces...',['Rotation only','Translation only','Both rotation and translation','No motion'],0,'A couple produces pure rotation with no net translational force.']],

['stability','Stability & Equilibrium Types',4,['center-gravity'],'Stable, unstable, and neutral equilibrium; conditions for stability.','Stable: CG rises when displaced|Unstable: CG falls','All equilibria are stable|Wide base always means stability',['A body is most stable when its centre of gravity is...',['Low and its base wide','High and its base narrow','At the top','Off centre'],0,'Lowering the CG and widening the base increases stability.']],
['simple-machines','Simple Machines Overview',4,['moments'],'Levers, pulleys, inclined planes, wedges, screws, wheel and axle, gears.','MA = load / effort|VR = effort dist / load dist|eff = MA/VR x 100%','MA and VR are the same|Machines create energy',['The mechanical advantage of a machine is...',['Load / effort','Effort / load','Load x effort','Work / power'],0,'MA = load lifted divided by effort applied.']],
['levers','Levers',4,['simple-machines'],'Three classes of levers based on positions of fulcrum, load, and effort.','Class 1: F-L-E|Class 2: F-E-L|Class 3: F-L-E','All levers give mechanical advantage',['In a Class 1 lever, the fulcrum is...',['Between the load and effort','At one end','With load between fulcrum and effort','Never present'],0,'Class 1 levers have the fulcrum between load and effort, like a seesaw.']],

['wheel-axle-gears','Wheel & Axle and Gears',4,['simple-machines'],'Wheel-and-axle systems and gear trains.','VR = R / r|Gears: VR = N_driven / N_driver','Gears multiply energy|Larger gear always turns faster',['Two meshed gears of radii 10 cm and 30 cm have a VR of...',['3','0.33','30','10'],0,'VR = R/r = 30/10 = 3.']],

/* ===== L5 · WORK, ENERGY & POWER ===== */
['work','Work',5,['newton-second','vector-resolution'],'Work is done when a force moves an object through a distance in its direction.','W = F d cos t|W = dKE|Area under F-d graph','Holding a weight is work|Work is always positive',['Work is done only when...',['A force causes displacement','A force is applied','An object is at rest','Energy is destroyed'],0,'Work requires displacement in the direction of the applied force.']],
['energy-forms','Forms of Energy',5,['work'],'Mechanical, thermal, chemical, electrical, nuclear, light, sound.','All energy in joules (J)|1 kJ = 1000 J','Energy and force are the same|Energy can be created',['Which form of energy is stored in a stretched spring?',['Elastic potential','Kinetic','Thermal','Chemical'],0,'A stretched spring stores elastic potential energy.']],
['cons-energy','Conservation of Energy',5,['energy-forms'],'Energy cannot be created or destroyed — only converted from one form to another.','E_total = constant|KE1 + PE1 = KE2 + PE2','Energy is used up|Machines create energy',['A ball dropped from height h hits the ground with speed v. Ignoring air resistance, at what speed would it hit if dropped from 4h?',['2v','4v','v/2','v'],0,'v = sqrt(2gh), so quadrupling h doubles the speed.']],

['energy-society','Energy & Society',5,['cons-energy'],'Renewable and non-renewable resources; energy crises; environmental impact.','Renewable: solar, wind, hydro|Non-renewable: coal, oil, gas','All energy sources are renewable|Nuclear is fossil fuel',['Which is a renewable energy source?',['Solar','Coal','Natural gas','Petroleum'],0,'Solar energy is continuously replenished, unlike fossil fuels.']],
['energy-production','Energy Production (Dams, Solar, Nuclear)',5,['energy-society'],'Hydroelectric dams, solar collectors, photovoltaic cells, nuclear power.','Dam: PE to KE to electrical|Solar cell: light to electrical','Solar panels work at night|Nuclear energy = burning uranium',['Hydroelectric power converts...',['Gravitational PE to electrical','Heat to light','Nuclear to thermal','Chemical to kinetic'],0,'Falling water drives turbines, converting gravitational energy to electricity.']],

const byId = {};
NODES.forEach(n => byId[n.id] = n);

/* ORDER (topological by layer) */
const ORDER = (function(){
  const placed = new Set(), out = [];
  let guard = 0;
  while (out.length < NODES.length && guard++ < 500){
    const ready = NODES.filter(n => !placed.has(n.id) && n.pre.every(p => placed.has(p) || !byId[p]));
    if (!ready.length) break;
    ready.sort((a,b) => a.layer - b.layer || a.name.localeCompare(b.name));
    const pick = ready[0];
    out.push(pick.id); placed.add(pick.id);
  }
  NODES.forEach(n => { if (!placed.has(n.id)) out.push(n.id); });
  return out;
})();
const orderIdx = {};
ORDER.forEach((id,i) => orderIdx[id] = i);

const byLayer = LAYERS.map(() => []);
NODES.forEach(n => byLayer[n.layer].push(n));
byLayer.forEach(list => list.sort((a,b) => orderIdx[a.id] - orderIdx[b.id]));

/* STATE */
const KEY = 'nucleus_physics_app_v1';
const state = { done:{}, xp:0, streak:0, lastDay:null, hearts:5 };

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s){
      state.done = s.done || {};
      state.xp = s.xp || 0;
      state.streak = s.streak || 0;
      state.lastDay = s.lastDay || null;
      state.hearts = (s.hearts == null) ? 5 : s.hearts;
    }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function today(){ return new Date().toISOString().slice(0,10); }
function touchStreak(){
  const t = today();
  if (state.lastDay === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0,10);
  state.streak = (state.lastDay === y) ? state.streak + 1 : 1;
  state.lastDay = t; save();
}
load();

function isDone(id){ return !!state.done[id]; }
function isUnlocked(id){
  const n = byId[id];
  if (!n) return false;
  return n.pre.every(p => !byId[p] || isDone(p));
}
function unitProgress(layer){
  const list = byLayer[layer];
  const done = list.filter(n => isDone(n.id)).length;
  return { done, total:list.length, pct: list.length ? done / list.length : 0 };
}
function nextLessonId(){
  for (const id of ORDER){
    if (!isDone(id) && isUnlocked(id)) return id;
  }
  return null;
}
function isPerfect(id){ return state.done[id] && state.done[id].perfect; }

}

  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {

  if (tab === 'learn') { renderPath(); showScreen(pathScreen); }
  else if (tab === 'stats') { renderStats(); showScreen(statsScreen); }
  else if (tab === 'practice') { handlePractice(); }
}

/* PATH */
const OFFSETS = [0, 34, 54, 34, 0, -34, -54, -34];

function renderPath(){
  const totalDone = NODES.filter(n => isDone(n.id)).length;
  const pct = Math.round(totalDone / NODES.length * 100);

  let html = `
    <div class="hero">
      <h1>Physics Path</h1>
      <p>WAEC · NECO · JAMB — ${NODES.length} modules across 18 units.</p>
      <div class="hero-stats">
        <div class="hero-stat">${totalDone} / ${NODES.length} done</div>
        <div class="hero-stat">${pct}% complete</div>
      </div>
    </div>`;

  const nextId = nextLessonId();

  LAYERS.forEach((layer, li) => {
    const list = byLayer[li];
    if (!list.length) return;
    const prog = unitProgress(li);
    const allDone = prog.done === prog.total;

    html += `<section class="unit">
      <div class="unit-head" style="background:${layer.color};box-shadow:0 4px 0 ${layer.dark}">
        <div class="uh-left">
          <div class="uh-eyebrow">Unit ${li + 1}</div>
          <div class="uh-title">${layer.name}</div>
          <div class="uh-prog">${prog.done} of ${prog.total} lessons complete</div>
        </div>
        <div class="uh-badge ${allDone ? 'done' : ''}">${allDone ? 'DONE' : Math.round(prog.pct*100) + '%'}</div>
      </div>
      <div class="nodes">`;

    list.forEach((n, i) => {
      const done = isDone(n.id);
      const unlocked = isUnlocked(n.id);
      const isNext = n.id === nextId;
      const off = OFFSETS[i % OFFSETS.length];

      let cls = 'lnode', icon = '🔒';
      if (done){ cls += ' done'; icon = '✓'; }
      else if (isNext){ cls += ' current'; icon = '★'; }
      else if (unlocked){ cls += ' avail'; icon = '★'; }
      else { cls += ' locked'; }

      html += `<div class="node-row" style="transform:translateX(${off}px)">
        <div class="lnode-wrap">
          ${isNext ? '<div class="start-bubble">START</div>' : ''}
          <button class="${cls}" data-lesson="${n.id}" ${(!unlocked && !done) ? 'disabled' : ''}>
            <span class="pulse"></span>
            ${icon}
            ${(done && isPerfect(n.id)) ? '<span class="crown">👑</span>' : ''}
          </button>
          <div class="lnode-label">${n.name}</div>
        </div>
      </div>`;
    });

    html += `</div></section>`;
  });

  html += `<div style="height:8px"></div>`;
  pathInner.innerHTML = html;

  pathInner.querySelectorAll('[data-lesson]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      startLesson(btn.dataset.lesson);
    });
  });

  updateTop();
}

/* STATS */
function renderStats(){
  const totalDone = NODES.filter(n => isDone(n.id)).length;
  const perfect = NODES.filter(n => isPerfect(n.id)).length;
  const pct = Math.round(totalDone / NODES.length * 100);

  let html = `
    <div class="stats-hero">
      <h2>Your Progress</h2>
      <div class="stats-grid">
        <div class="stat-card"><div class="sv">${state.xp}</div><div class="sl">Total XP</div></div>
        <div class="stat-card"><div class="sv">${state.streak} ${state.streak >= 1 ? '🔥' : ''}</div><div class="sl">Day Streak</div></div>
        <div class="stat-card"><div class="sv">${totalDone}/${NODES.length}</div><div class="sl">Lessons</div></div>
        <div class="stat-card"><div class="sv">${perfect}</div><div class="sl">Perfect</div></div>
      </div>
    </div>
    <div class="stat-section-title">By Unit — ${pct}% overall</div>`;

  LAYERS.forEach((layer, li) => {
    const prog = unitProgress(li);
    const p = Math.round(prog.pct * 100);
    html += `<div class="stat-row">
      <span class="stat-dot" style="background:${layer.color}"></span>
      <div class="stat-info">
        <div class="stat-name">${layer.name}</div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:${p}%;background:${layer.color}"></div></div>
      </div>
      <span class="stat-count ${prog.done === prog.total ? 'done' : ''}">${prog.done}/${prog.total}</span>
    </div>`;
  });

  statsInner.innerHTML = html;
}

/* LESSON ENGINE */
let lesson = null;

function startLesson(id){
  const node = byId[id];
  if (!node) return;
  if (state.hearts <= 0){ showNoHearts(); return; }
  lesson = { node, step:'guide', picked:null, correct:false, firstTry:true, retry:isDone(id) };
  showScreen(lessonScreen);
  renderHearts();
  renderLesson();
}

function renderLesson(){
  if (!lesson) return;
  const n = lesson.node;

  if (lesson.step === 'guide'){
    lessonPbar.style.width = '45%';
    lessonFoot.className = 'lesson-foot';
    lessonMain.innerHTML = `
      <div class="lesson-inner guide">
        <span class="tag guide">Study Guide</span>
        <h2>${n.name}</h2>
        <p class="guide-desc">${n.desc}</p>
        ${n.formulas.length ? `
        <div class="gblock">
          <div class="gblock-title">🔑 Key points</div>
          <div class="chips">${n.formulas.map(f => `<span class="chip">${f}</span>`).join('')}</div>
        </div>` : ''}
        ${n.misc.length ? `
        <div class="gblock">
          <div class="warn-box">
            <div class="gblock-title">⚠️ Don't fall for these</div>
            <ul class="warn-list">${n.misc.map(m => `<li>${m}</li>`).join('')}</ul>
          </div>
        </div>` : ''}
      </div>`;
    lessonFoot.innerHTML = `<div class="foot-inner"><button class="btn full" id="toQuiz">Got it →</button></div>`;
    $('#toQuiz').addEventListener('click', () => { lesson.step = 'quiz'; renderLesson(); });
    lessonMain.scrollTop = 0;
    return;
  }

  if (lesson.step === 'quiz'){
    lessonPbar.style.width = '72%';
    lessonFoot.className = 'lesson-foot';
    const q = n.q;
    lessonMain.innerHTML = `
      <div class="lesson-inner">
        <span class="tag quiz">Question</span>
        <div class="qtext">${q.text}</div>
        <div class="options" id="opts">
          ${q.options.map((o, i) => `
            <button class="opt" data-opt="${i}">
              <span class="key">${'ABCD'[i]}</span>
              <span class="label">${o}</span>
            </button>`).join('')}
        </div>
      </div>`;
    lessonFoot.innerHTML = `<div class="foot-inner"><button class="btn full" id="checkBtn" disabled>Check</button></div>`;
    lessonMain.querySelectorAll('[data-opt]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (lesson.step !== 'quiz') return;
        lesson.picked = Number(btn.dataset.opt);
        lessonMain.querySelectorAll('[data-opt]').forEach(b => b.classList.remove('picked'));
        btn.classList.add('picked');
        $('#checkBtn').disabled = false;
      });
    });
    $('#checkBtn').addEventListener('click', submitAnswer);
    lessonMain.scrollTop = 0;
    return;
  }

  lessonPbar.style.width = '100%';
}

function submitAnswer(){
  if (!lesson || lesson.step !== 'quiz' || lesson.picked == null) return;
  const n = lesson.node, q = n.q;
  const ok = lesson.picked === q.answer;
  lesson.correct = ok;
  lesson.step = 'answered';
  if (!ok){
    lesson.firstTry = false;
    state.hearts = Math.max(0, state.hearts - 1);
    save(); renderHearts(); updateTop();
  }
  lessonMain.querySelectorAll('[data-opt]').forEach(btn => {
    const i = Number(btn.dataset.opt);
    btn.disabled = true;
    btn.classList.remove('picked');
    if (i === q.answer) btn.classList.add('correct');
    else if (i === lesson.picked) btn.classList.add('wrong');
  });
  lessonFoot.className = 'lesson-foot ' + (ok ? 'ok' : 'no');
  lessonFoot.innerHTML = `
    <div class="foot-inner">
      <div class="fb-bar">
        <div class="fb-row">
          <div class="fb-ico ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✕'}</div>
          <div class="fb-title ${ok ? 'ok' : 'no'}">${ok ? 'Correct!' : 'Not quite'}</div>
        </div>
        <div class="fb-text">${q.why}</div>
        <button class="btn full ${ok ? '' : 'red'}" id="contBtn">${ok ? 'Continue' : 'Got it'}</button>
      </div>
    </div>`;
  $('#contBtn').addEventListener('click', () => {
    if (!ok && state.hearts <= 0){ showNoHearts(); return; }
    finishLesson();
  });
}

function finishLesson(){
  const n = lesson.node;
  const firstTime = !isDone(n.id);
  const perfect = lesson.correct && lesson.firstTry;
  let earned = 0;
  if (firstTime){
    earned = perfect ? 15 : 10;
    state.xp += earned;
    state.done[n.id] = { perfect, xp: earned };
    if (state.hearts < 5) state.hearts++;
    touchStreak();
  } else {
    earned = lesson.correct ? 2 : 0;
    state.xp += earned;
    if (perfect && !isPerfect(n.id)) state.done[n.id].perfect = true;
  }
  save();
  showDone(n, earned, perfect, firstTime);
}

function showDone(n, earned, perfect, firstTime){
  doneScreen.innerHTML = `
    <div class="done-inner">
      <div class="trophy">${perfect ? '🏆' : '🎉'}</div>
      <div class="done-title">${firstTime ? 'Lesson complete!' : 'Practice complete!'}</div>
      <div class="done-sub">${n.name}</div>
      <div class="done-stats">
        <div class="done-stat"><div class="ds-v">+${earned}</div><div class="ds-l">XP</div></div>
        <div class="done-stat"><div class="ds-v">${lesson.correct ? '100%' : '0%'}</div><div class="ds-l">Accuracy</div></div>
        <div class="done-stat"><div class="ds-v">${perfect ? '★' : '—'}</div><div class="ds-l">Perfect</div></div>
      </div>
      <div class="done-card">
        <div class="dc-t">Remember</div>
        <div class="dc-q">${n.desc}</div>
        <div class="dc-a">✓ ${n.q.why}</div>
      </div>
      <button class="btn full" id="doneCont">Continue</button>
    </div>`;
  showScreen(doneScreen);
  $('#doneCont').addEventListener('click', () => { lesson = null; setTab('learn'); });
}

/* PRACTICE */
function handlePractice(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'learn'));
  currentTab = 'learn';
  const pool = NODES.filter(n => isDone(n.id));
  if (!pool.length){
    toast('Complete a lesson first to unlock practice');
    renderPath();
    showScreen(pathScreen);
    return;
  }
  const imperfect = pool.filter(n => !isPerfect(n.id));
  const source = imperfect.length ? imperfect : pool;
  const pick = source[Math.floor(Math.random() * source.length)];
  startLesson(pick.id);
}

/* MODALS */
function showNoHearts(){
  state.hearts = 5; save(); updateTop(); renderHearts();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <div class="grabber"></div>
      <div class="m-ico">💔</div>
      <h3>Out of hearts!</h3>
      <p>You ran out of hearts. Refill and keep going — every mistake is a chance to learn.</p>
      <div class="m-row">
        <button class="btn full" id="refillBtn">Refill hearts</button>
        <button class="btn full ghost" id="quitModal">Back to path</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(bg);
  bg.querySelector('#refillBtn').addEventListener('click', () => {
    state.hearts = 5; save(); updateTop(); renderHearts(); bg.remove();
  });
  bg.querySelector('#quitModal').addEventListener('click', () => {
    bg.remove(); lesson = null; setTab('learn');
  });
  bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
}

function confirmQuit(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <div class="grabber"></div>
      <div class="m-ico">🤔</div>
      <h3>Leave the lesson?</h3>
      <p>Your progress in this lesson will be lost.</p>
      <div class="m-row">
        <button class="btn full red" id="yesQuit">Quit lesson</button>
        <button class="btn full ghost" id="noQuit">Keep learning</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(bg);
  bg.querySelector('#yesQuit').addEventListener('click', () => {
    bg.remove(); lesson = null; setTab('learn');
  });
  bg.querySelector('#noQuit').addEventListener('click', () => bg.remove());
  bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
}

/* WIRING */
$('#quitBtn').addEventListener('click', () => {
  if (lesson && lesson.step === 'answered'){ lesson = null; setTab('learn'); return; }
  confirmQuit();
});

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => setTab(t.dataset.tab));
});

document.addEventListener('keydown', e => {
  if (!lesson || lesson.step !== 'quiz') return;
  const k = e.key.toUpperCase();
  const i = 'ABCD'.indexOf(k);
  if (i >= 0 && i < lesson.node.q.options.length){
    const btn = lessonMain.querySelector(`[data-opt="${i}"]`);
    if (btn) btn.click();
  }
  if (e.key === 'Enter'){
    const cb = $('#checkBtn');
    if (cb && !cb.disabled) cb.click();
    const cont = $('#contBtn');
    if (cont) cont.click();
  }
});

document.addEventListener('gesturestart', e => e.preventDefault(), { passive:false });
document.addEventListener('gesturechange', e => e.preventDefault(), { passive:false });

/* INIT */
updateTop();
renderPath();
renderStats();
setTab('learn');
</script>
</body>
</html>
