<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemistry Course Flow — WAEC · NECO · JAMB</title>
<style>
  :root{
    --bg:#0d1418; --panel:#16212a; --panel-2:#1a2733;
    --line:#1e2d38; --line-2:#2b4356;
    --ink:#c9dcef; --ink-soft:#7d8f9c; --ink-dim:#5d7284;
    --cyan:#4fc3ff; --green:#58cc02; --amber:#ffb347;
    --coral:#ff5a4a; --violet:#c07aff; --yellow:#ffe040;
    --pink:#ff4fa3; --flow:#4fe0a8;
    --waec:#58cc02; --neco:#4fc3ff; --jamb:#ffe040;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--ink); font-weight:600;}
  .app{width:100%; height:100vh; display:flex; flex-direction:column;}

  header{padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex:0 0 auto; z-index:10;}
  .title-block{flex:1; min-width:0;}
  .eyebrow{font-size:9.5px; font-weight:800; letter-spacing:1.4px;
    text-transform:uppercase; color:var(--cyan); margin-bottom:2px;}
  h1{font-size:16px; font-weight:800; color:#e6f1fa; line-height:1.15;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .exam-pills{display:flex; gap:5px; flex:0 0 auto;}
  .exam-pill{
    font-size:9px; font-weight:800; letter-spacing:.8px; padding:4px 8px;
    border-radius:99px; text-transform:uppercase; border:1.5px solid;
    cursor:pointer; transition:.15s; background:transparent;
    font-family:inherit; color:#7d8f9c; border-color:#2b4356;
  }
  .exam-pill.on[data-exam="WAEC"]{background:rgba(88,204,2,.18); color:#58cc02; border-color:rgba(88,204,2,.5);}
  .exam-pill.on[data-exam="NECO"]{background:rgba(79,195,255,.18); color:#4fc3ff; border-color:rgba(79,195,255,.5);}
  .exam-pill.on[data-exam="JAMB"]{background:rgba(255,224,64,.18); color:#ffe040; border-color:rgba(255,224,64,.5);}
  .exam-pill.off{opacity:.35;}
  .controls{display:flex; gap:5px; flex:0 0 auto;}
  .ctrl{min-width:34px; height:34px; padding:0 11px; background:var(--panel-2);
    border:1.5px solid var(--line); border-radius:9px; color:var(--ink-soft);
    font-family:inherit; font-size:13px; font-weight:800; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
    letter-spacing:.5px;}
  .ctrl:hover{border-color:var(--cyan); color:var(--cyan);}
  .ctrl.mode-on{background:rgba(79,224,168,.15); border-color:var(--flow); color:var(--flow);}
  .ctrl.wide{font-size:10px; letter-spacing:.8px; text-transform:uppercase; padding:0 12px;}

  .legend-bar{padding:8px 18px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; gap:10px; overflow-x:auto; flex:0 0 auto; scrollbar-width:none; z-index:9;}
  .legend-bar::-webkit-scrollbar{display:none}
  .legend-item{display:flex; align-items:center; gap:5px; font-size:9.5px;
    font-weight:800; letter-spacing:.9px; text-transform:uppercase;
    color:var(--ink-soft); flex:0 0 auto; white-space:nowrap;}
  .legend-swatch{width:10px; height:10px; border-radius:3px; flex:0 0 auto;}
  .legend-divider{width:1px; background:var(--line-2); margin:0 4px; flex:0 0 auto;}
  .legend-dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto;}

  .stage{flex:1; position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 20% 30%, rgba(79,195,255,.04), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(192,122,255,.04), transparent 40%),
      var(--bg);}
  #graph{width:100%; height:100%; display:block; cursor:grab; touch-action:none; user-select:none;}
  #graph.dragging{cursor:grabbing;}

  .hint{position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    font-size:9.5px; letter-spacing:1px; text-transform:uppercase;
    color:var(--ink-dim); font-weight:800; pointer-events:none;
    background:rgba(13,20,24,.85); padding:6px 14px; border-radius:99px;
    border:1px solid var(--line); transition:opacity .4s;}
  .hint.hide{opacity:0;}

  /* Flow mode banner */
  .flow-banner{position:absolute; top:12px; left:50%; transform:translateX(-50%);
    padding:8px 16px; border-radius:99px; background:rgba(79,224,168,.12);
    border:1.5px solid var(--flow); color:var(--flow); font-size:10px;
    font-weight:800; letter-spacing:1.2px; text-transform:uppercase;
    pointer-events:none; opacity:0; transition:opacity .3s; z-index:5;
    display:flex; align-items:center; gap:8px;}
  .flow-banner.show{opacity:1;}
  .flow-banner .pulse{width:7px; height:7px; border-radius:50%;
    background:var(--flow); animation:flowPulse 1.4s infinite;}
  @keyframes flowPulse{0%,100%{opacity:.4; transform:scale(.8)}50%{opacity:1; transform:scale(1.2)}}

  /* ===== NODES ===== */
  .node{cursor:pointer; transition:opacity .25s;}
  .node rect.node-bg{transition:stroke-opacity .15s, fill .15s; fill:#16212a; stroke-width:1.4;}
  .node:hover rect.node-bg{stroke-opacity:1; fill:#1c2c39;}
  .node.selected rect.node-bg{stroke-opacity:1; stroke-width:2.4; fill:#1f3040;}
  .node.dim{opacity:.10;}
  .node text{pointer-events:none;}
  .node .node-name{font-family:'Nunito',sans-serif; font-weight:800;
    fill:#d0e2f0; pointer-events:none;}
  .node .node-footer{font-family:ui-monospace,'SF Mono',monospace; font-weight:700;
    letter-spacing:.5px; pointer-events:none;}
  .node .mis-dot{fill:#ff4b4b;}
  .node .exam-badge{font-family:'Nunito',sans-serif; font-weight:800; font-size:7px;
    letter-spacing:.5px; pointer-events:none;}

  /* Flow step number badge */
  .node .step-badge{font-family:'Nunito',sans-serif; font-weight:900;
    pointer-events:none; transition:opacity .3s; opacity:0;}
  .node .step-badge circle{fill:var(--flow);}
  .node .step-badge text{fill:#0d1418;}
  .node.flow .step-badge{opacity:1;}

  /* Mastery ring */
  .node .mastery-ring{fill:none; stroke-width:2; pointer-events:none;}
  .node.mastery-learning .mastery-ring{stroke:var(--amber); opacity:.9;}
  .node.mastery-mastered .mastery-ring{stroke:var(--flow); opacity:1; stroke-width:2.5;}
  .node.mastery-mastered rect.node-bg{fill:rgba(79,224,168,.10);}
  .node.mastery-learning rect.node-bg{fill:rgba(255,179,71,.08);}

  /* Start and end markers */
  .node .role-marker{font-family:'Nunito',sans-serif; font-weight:900;
    pointer-events:none; letter-spacing:1px;}
  .node.flow.role-start .role-marker{fill:var(--flow);}
  .node.flow.role-end .role-marker{fill:var(--yellow);}

  /* ===== EDGES ===== */
  .edge{fill:none; stroke-linecap:round; transition:stroke .2s, stroke-opacity .2s, stroke-width .2s;}
  .edge.prereq{stroke:#3a5468; stroke-width:1.2; stroke-opacity:.4;}
  .edge.cross{stroke:#c07aff; stroke-width:1; stroke-opacity:.28; stroke-dasharray:4 4;}
  .edge.flow-path{stroke:var(--flow); stroke-width:2.4;
    stroke-opacity:.55; stroke-linecap:round; fill:none;
    filter:drop-shadow(0 0 4px rgba(79,224,168,.5));}
  .edge.highlight{stroke-opacity:1 !important; stroke-width:2.4;}
  .edge.highlight.prereq{stroke:#4fc3ff;}
  .edge.highlight.cross{stroke:#c07aff;}
  .edge.dim{stroke-opacity:.03 !important;}
  .edge.flow-path.dim{stroke-opacity:.15 !important;}

  /* ===== DETAIL PANEL ===== */
  .detail{position:absolute; left:0; right:0; bottom:0; max-height:78vh;
    background:var(--panel); border-top:2px solid var(--line-2);
    border-radius:22px 22px 0 0; transform:translateY(105%);
    transition:transform .4s cubic-bezier(.4,0,.2,1); z-index:20;
    box-shadow:0 -12px 40px rgba(0,0,0,.55); display:flex; flex-direction:column;}
  .detail.open{transform:translateY(0);}
  .detail-inner{padding:20px 22px 28px; overflow-y:auto; flex:1;
    scrollbar-width:thin; scrollbar-color:var(--line-2) transparent;}
  .detail-inner::-webkit-scrollbar{width:6px}
  .detail-inner::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:3px}

  .detail-close{position:absolute; top:12px; right:14px; width:34px; height:34px;
    border-radius:10px; background:var(--panel-2); border:1.5px solid var(--line);
    color:var(--ink-soft); font-size:18px; font-weight:800; cursor:pointer;
    display:grid; place-items:center; transition:.15s; z-index:2; font-family:inherit;}
  .detail-close:hover{border-color:var(--coral); color:var(--coral);}

  .detail-layer{font-size:10px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; margin-bottom:6px; display:flex;
    align-items:center; gap:8px; flex-wrap:wrap;}
  .detail h2{font-size:22px; font-weight:800; color:#e6f1fa; line-height:1.2;
    margin-bottom:8px; padding-right:40px;}
  .exam-chips{display:flex; gap:5px; margin-bottom:12px; flex-wrap:wrap;}
  .exam-chip{font-size:9px; font-weight:800; letter-spacing:.8px; padding:3px 9px;
    border-radius:99px; text-transform:uppercase; border:1.5px solid;}
  .exam-chip[data-exam="WAEC"]{color:#58cc02; border-color:rgba(88,204,2,.5);
    background:rgba(88,204,2,.08);}
  .exam-chip[data-exam="NECO"]{color:#4fc3ff; border-color:rgba(79,195,255,.5);
    background:rgba(79,195,255,.08);}
  .exam-chip[data-exam="JAMB"]{color:#ffe040; border-color:rgba(255,224,64,.5);
    background:rgba(255,224,64,.08);}

  /* Mastery pill */
  .mastery-row{display:flex; gap:6px; margin-bottom:14px;}
  .mastery-pill{flex:1; padding:8px 10px; border-radius:9px;
    background:var(--panel-2); border:1.5px solid var(--line);
    color:var(--ink-soft); font-family:inherit; font-size:10px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase; cursor:pointer;
    transition:.15s; display:flex; align-items:center; justify-content:center; gap:5px;}
  .mastery-pill:hover{border-color:var(--line-2);}
  .mastery-pill.active[data-state="learning"]{background:rgba(255,179,71,.15);
    border-color:var(--amber); color:var(--amber);}
  .mastery-pill.active[data-state="mastered"]{background:rgba(79,224,168,.15);
    border-color:var(--flow); color:var(--flow);}
  .mastery-pill.active[data-state="new"]{background:rgba(79,195,255,.12);
    border-color:var(--cyan); color:var(--cyan);}

  .detail-desc{font-size:14px; line-height:1.55; color:var(--ink-soft); margin-bottom:18px;}
  .detail-section{margin-bottom:16px;}
  .detail-section:last-child{margin-bottom:0;}
  .detail-label{font-size:10px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; color:var(--ink-dim); margin-bottom:8px;
    display:flex; align-items:center; gap:8px;}
  .detail-label .count{background:var(--panel-2); border:1px solid var(--line);
    padding:1px 7px; border-radius:99px; font-size:9px; color:var(--ink-soft);
    font-family:ui-monospace,monospace;}
  .detail-label.flow-label{color:var(--flow);}
  .detail-label.flow-label .count{color:var(--flow);
    border-color:rgba(79,224,168,.4); background:rgba(79,224,168,.08);}

  .chip-row{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{display:inline-flex; align-items:center; gap:6px;
    background:var(--panel-2); border:1.5px solid var(--line);
    border-radius:8px; padding:7px 10px; font-size:11.5px; font-weight:700;
    color:var(--ink); font-family:inherit; cursor:pointer; transition:.15s; text-align:left;}
  .chip:hover{border-color:var(--cyan); color:var(--cyan); transform:translateY(-1px);}
  .chip .cdot{width:6px; height:6px; border-radius:50%; flex:0 0 auto;}
  .chip.empty{background:transparent; border:none; color:var(--ink-dim);
    font-style:italic; cursor:default; padding:4px 0; font-weight:600;}
  .chip.empty:hover{color:var(--ink-dim); transform:none;}

  .detail-list{list-style:none; display:flex; flex-direction:column; gap:6px;}
  .detail-list li{font-size:12.5px; line-height:1.5; color:var(--ink);
    display:flex; gap:9px; align-items:flex-start; font-weight:600;}
  .detail-list li::before{content:''; width:5px; height:5px; border-radius:50%;
    flex:0 0 auto; margin-top:8px; background:var(--cyan);}
  .detail-list.warn li::before{background:var(--coral);}
  .detail-list.code li{font-family:ui-monospace,'SF Mono',monospace;
    background:var(--panel-2); border:1px solid var(--line);
    padding:7px 10px; border-radius:7px; font-size:11.5px; color:var(--amber);
    display:block;}
  .detail-list.code li::before{display:none;}

  @media (max-width:600px){
    header{padding:8px 12px; gap:8px;}
    h1{font-size:14px;}
    .exam-pill{font-size:8px; padding:3px 6px;}
    .legend-bar{padding:6px 12px;}
    .detail-inner{padding:18px 18px 24px;}
    .detail h2{font-size:19px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title-block">
      <div class="eyebrow">Chemistry · WAEC · NECO · JAMB</div>
      <h1>Course Flow Map</h1>
    </div>
    <div class="exam-pills" id="examPills">
      <button class="exam-pill on" data-exam="WAEC">WAEC</button>
      <button class="exam-pill on" data-exam="NECO">NECO</button>
      <button class="exam-pill on" data-exam="JAMB">JAMB</button>
    </div>
    <div class="controls">
      <button class="ctrl" id="flowToggle" title="Toggle flow mode">◉ Flow</button>
      <button class="ctrl" id="zoomOut" title="Zoom out">−</button>
      <button class="ctrl wide" id="zoomReset">Fit</button>
      <button class="ctrl" id="zoomIn" title="Zoom in">+</button>
    </div>
  </header>

  <div class="legend-bar" id="legendBar"></div>

  <main class="stage">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="flow-banner" id="flowBanner">
      <div class="pulse"></div>
      <span>Flow mode · Follow the numbered path</span>
    </div>
    <div class="hint" id="hint">Click any node to cycle mastery · Toggle Flow to see the path</div>
  </main>

  <div class="detail" id="detail">
    <button class="detail-close" id="detailClose">×</button>
    <div class="detail-inner" id="detailInner"></div>
  </div>

</div>

<script>
// ============================================================
// LAYERS
// ============================================================
const LAYERS = [
  { id:0,  name:'Foundations & Lab',            color:'#4fc3ff' },
  { id:1,  name:'Matter & Atomic Structure',    color:'#3fb8f0' },
  { id:2,  name:'Separation & Purification',    color:'#58cc02' },
  { id:3,  name:'Periodic Table',               color:'#7ac020' },
  { id:4,  name:'Chemical Bonding',             color:'#a3e635' },
  { id:5,  name:'Stoichiometry & Equations',    color:'#ff8c40' },
  { id:6,  name:'States of Matter & Gases',     color:'#ffb347' },
  { id:7,  name:'Solutions & Solubility',       color:'#ffe040' },
  { id:8,  name:'Energy & Enthalpy',            color:'#ff5a4a' },
  { id:9,  name:'Acids, Bases & Salts',         color:'#ff4fa3' },
  { id:10, name:'Kinetics & Equilibrium',       color:'#c07aff' },
  { id:11, name:'Redox & Electrochemistry',     color:'#a85fe0' },
  { id:12, name:'Non-Metals & Compounds',       color:'#40e0d0' },
  { id:13, name:'Metals & Compounds',           color:'#20c0b0' },
  { id:14, name:'Organic Chemistry',            color:'#40a0e0' },
  { id:15, name:'Industry & Environment',       color:'#6a80e0' },
  { id:16, name:'Practical Chemistry',          color:'#a050e0' }
];

// ============================================================
// NODES — full chemistry syllabus
// ============================================================
const NODES = [
  /* L0 */
  { id:'scientific-method', name:'Scientific Method', layer:0, pre:[], exams:['WAEC','NECO','JAMB'],
    desc:'Observation, hypothesis, experiment, theory — the framework for all chemistry inquiry.',
    formulas:['Observation → Hypothesis → Experiment → Theory'],
    misc:['Theory is final truth','One experiment proves a law'] },
  { id:'measurement', name:'Measurement', layer:0, pre:['scientific-method'], exams:['WAEC','NECO','JAMB'],
    desc:'Mass, volume, temperature, pressure, time — the quantities measured in the chemistry lab.',
    formulas:['mass (kg)','volume (dm³)','temperature (K)'],
    misc:['All measurements are exact','Same instrument gives same reading'] },
  { id:'si-units', name:'SI Units', layer:0, pre:['measurement'], exams:['WAEC','NECO','JAMB'],
    desc:'The seven SI base units and how they combine to form derived units used in chemistry.',
    formulas:['mol = amount','kg = mass','K = temperature','dm³ = volume'],
    misc:['Units are optional','Any unit system works'] },
  { id:'accuracy-precision', name:'Accuracy & Precision', layer:0, pre:['measurement'], exams:['WAEC','NECO','JAMB'],
    desc:'Accuracy is closeness to true value; precision is reproducibility.',
    formulas:['% error = (|true − meas|/true) × 100'],
    misc:['Accuracy and precision mean the same','More readings always better'] },
  { id:'sigfig-standard', name:'Sig Figs & Standard Form', layer:0, pre:['measurement'], exams:['WAEC','NECO','JAMB'],
    desc:'How many digits matter; writing very small/large numbers as a × 10ⁿ.',
    formulas:['0.0025 → 2 s.f.','6.02 × 10²³'],
    misc:['Trailing zeros never count','All digits are significant'] },
  { id:'graphing-data', name:'Graphing & Data', layer:0, pre:['measurement'], exams:['WAEC','NECO','JAMB'],
    desc:'Plotting measured values, drawing lines of best fit, reading slopes and intercepts.',
    formulas:['y = mx + c','slope = Δy/Δx'],
    misc:['Always connect the dots','Slope has no meaning'] },
  { id:'math-tools', name:'Mathematical Tools', layer:0, pre:['measurement'], exams:['WAEC','NECO','JAMB'],
    desc:'Logarithms, exponents, proportional reasoning, and algebra used throughout chemistry.',
    formulas:['pH = −log[H⁺]','C₁V₁ = C₂V₂'],
    misc:['Logs are only for large numbers','Exponents multiply'] },
  { id:'lab-safety', name:'Lab Safety & Apparatus', layer:0, pre:['scientific-method'], exams:['WAEC','NECO','JAMB'],
    desc:'Bunsen burner, titration setup, fume cupboard, safety rules.',
    formulas:['Never pipette by mouth','Acid into water'],
    misc:['Safety rules are optional','All chemicals are safe'] },

  /* L1 */
  { id:'concepts-matter', name:'Concepts of Matter', layer:1, pre:['measurement'], exams:['WAEC','NECO','JAMB'],
    desc:'Matter occupies space and has mass. Made of particles; exists in three states.',
    formulas:['matter → atoms → molecules'],
    misc:['Matter is continuous','All matter is visible'] },
  { id:'elements-compounds', name:'Elements, Compounds & Mixtures', layer:1, pre:['concepts-matter'], exams:['WAEC','NECO','JAMB'],
    desc:'Elements = one atom type; compounds = chemically combined; mixtures = physically combined.',
    formulas:['Element: O, H, C','Compound: H₂O'],
    misc:['Compounds separate easily','Mixtures have fixed composition'] },
  { id:'phys-chem-changes', name:'Physical & Chemical Changes', layer:1, pre:['elements-compounds'], exams:['WAEC','NECO','JAMB'],
    desc:'Physical changes are reversible; chemical changes create new substances.',
    formulas:['Physical: melting','Chemical: burning'],
    misc:['Boiling is chemical change','Burning is physical change'] },
  { id:'pure-impure', name:'Pure & Impure Substances', layer:1, pre:['elements-compounds'], exams:['WAEC','NECO','JAMB'],
    desc:'Pure substances melt and boil at sharp fixed temperatures; impurities lower mp and raise bp.',
    formulas:['Pure: sharp mp/bp','Impure: range of mp/bp'],
    misc:['Pure = clean','Impurities raise melting point'] },
  { id:'atomic-structure', name:'Atomic Structure', layer:1, pre:['concepts-matter'], exams:['WAEC','NECO','JAMB'],
    desc:'Atoms have a nucleus of protons and neutrons, surrounded by electrons in shells.',
    formulas:['Z = protons','A = protons + neutrons'],
    misc:['Atom is mostly empty space','Electrons orbit like planets'] },
  { id:'atomic-models', name:'Atomic Models', layer:1, pre:['atomic-structure'], exams:['WAEC','NECO','JAMB'],
    desc:'Dalton, Thomson, Rutherford, Bohr — evolving models of atomic structure.',
    formulas:['Dalton → Thomson → Rutherford → Bohr'],
    misc:['Bohr model is final truth','All models are equal'] },
  { id:'atomic-number-mass', name:'Atomic & Mass Number', layer:1, pre:['atomic-structure'], exams:['WAEC','NECO','JAMB'],
    desc:'Atomic number Z = number of protons; mass number A = protons + neutrons.',
    formulas:['A = Z + N','ᴬZ X notation'],
    misc:['Atomic number = neutron count','Mass number = atomic number'] },
  { id:'isotopes', name:'Isotopes', layer:1, pre:['atomic-number-mass'], exams:['WAEC','NECO','JAMB'],
    desc:'Atoms of the same element with different neutron numbers.',
    formulas:['¹²C, ¹³C, ¹⁴C','Cl-35, Cl-37'],
    misc:['Isotopes have different chemistry','Isotopes have different atomic number'] },
  { id:'relative-atomic-mass', name:'Relative Atomic Mass', layer:1, pre:['isotopes'], exams:['WAEC','NECO','JAMB'],
    desc:'Weighted average of isotope masses relative to carbon-12.',
    formulas:['Aᵣ = Σ(abundance × mass)/100'],
    misc:['RAM is the mass number','All isotopes equally abundant'] },
  { id:'electron-config', name:'Electron Configuration', layer:1, pre:['atomic-structure'], exams:['WAEC','NECO','JAMB'],
    desc:'Electrons fill orbitals by Aufbau principle, Pauli exclusion, and Hund\'s rule.',
    formulas:['1s² 2s² 2p⁶ 3s² 3p⁶','2n² rule'],
    misc:['Electrons fill randomly','4s fills before 3d'] },
  { id:'orbitals-shapes', name:'Shapes of Orbitals', layer:1, pre:['electron-config'], exams:['WAEC','NECO','JAMB'],
    desc:'s orbitals are spherical; p orbitals are dumbbell-shaped.',
    formulas:['s: spherical','p: three orientations'],
    misc:['Orbitals are 2D circles','All p orbitals identical'] },
  { id:'radioactivity', name:'Radioactivity', layer:1, pre:['atomic-structure'], exams:['WAEC','NECO','JAMB'],

function isPrereq(a, b){
  return (byId[a]?.pre || []).includes(b) || (byId[b]?.pre || []).includes(a);

// ============================================================
// FLOW COMPUTATION — topological sort with layer priority
// ============================================================
function computeFlowOrder(examFilter){
  const available = NODES.filter(n => (n.exams || []).some(ex => examFilter.has(ex)));
  const availableIds = new Set(available.map(n => n.id));
  const remaining = new Map(); // id -> { pre: [...], layer }
  available.forEach(n => {
    const pre = n.pre.filter(p => availableIds.has(p));
    remaining.set(n.id, { node: n, pre: pre.slice() });
  });

  const ordered = [];
  const done = new Set();

  while (ordered.length < available.length){
    // find ready nodes (all prereqs done)
    const ready = [...remaining.values()].filter(item =>
      item.pre.every(p => done.has(p))
    );

    if (!ready.length) break; // cycle or missing prereq

    // sort: layer asc, then prereq count asc, then name
    ready.sort((a, b) => {
      if (a.node.layer !== b.node.layer) return a.node.layer - b.node.layer;
      if (a.node.pre.length !== b.node.pre.length) return a.node.pre.length - b.node.pre.length;
      return a.node.name.localeCompare(b.node.name);
    });

    const next = ready[0];
    ordered.push(next.node.id);
    done.add(next.node.id);
    remaining.delete(next.node.id);
  }

  return ordered;
}

// In flow mode, order within layer by flow step
function orderLayerNodes(){
  byLayer.forEach((list, layerId) => {
    list.sort((a, b) => {
      if (state.flowMode){
        return (state.stepByNode[a.id] || 9999) - (state.stepByNode[b.id] || 9999);
      }
      return 0;
    });
  });
}

orderLayerNodes();

byLayer.forEach(list => {
  const gap = 18;
  const totalH = list.length * NODE_H + (list.length - 1) * gap;
  const startY = Math.max(80, CENTER_Y - totalH / 2);
  list.forEach((n, i) => {
    n.x = COL_X[n.layer];
    n.y = startY + i * (NODE_H + gap);
  });
});

// Barycenter in graph mode (uses prereqs)
function runBarycenter(){
  for (let iter = 0; iter < 6; iter++){
    NODES.forEach(n => {
      if (n.pre.length === 0){ n._want = n.y; return; }
      const avg = n.pre.reduce((s, p) => s + (byId[p]?.y ?? n.y), 0) / n.pre.length;
      n._want = avg;
    });
    byLayer.forEach(list => {
      list.sort((a, b) => (a._want ?? a.y) - (b._want ?? b.y));
      const gap = 18;
      const totalH = list.length * NODE_H + (list.length - 1) * gap;
      const startY = Math.max(80, CENTER_Y - totalH / 2);
      list.forEach((n, i) => {
        n.y = startY + i * (NODE_H + gap);
      });
    });
  }
}

if (!state.flowMode) runBarycenter();

const SVG_NS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs = {}){
  const el = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function splitName(name){
  if (name.length <= 16) return [name];
  const words = name.split(' ');
  if (words.length === 1) return [name];
  let best = 1, bestDiff = Infinity;
  for (let i = 1; i < words.length; i++){
    const a = words.slice(0, i).join(' ');
    const b = words.slice(i).join(' ');
    const diff = Math.abs(a.length - b.length);
    if (diff < bestDiff){ bestDiff = diff; best = i; }
  }
  return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
}

function drawFlowPath(){
  // Connect each node to the next in flow order
  const order = state.flowOrder;
  for (let i = 0; i < order.length - 1; i++){
    const from = byId[order[i]];
    const to = byId[order[i + 1]];
    if (!from || !to) continue;

    const x1 = from.x + NODE_W / 2;
    const y1 = from.y + NODE_H;
    const x2 = to.x + NODE_W / 2;
    const y2 = to.y;
    const midY = (y1 + y2) / 2;

    let d;
    if (Math.abs(from.x - to.x) < 1){
      // Same column — simple vertical
      d = `M ${x1} ${y1} L ${x2} ${y2}`;
    } else if (from.x < to.x){
      // Moving right — arc from bottom to top
      d = `M ${x1} ${y1} C ${x1} ${midY + 20}, ${x2} ${midY - 20}, ${x2} ${y2}`;
    } else {
      // Moving left (rare)
      d = `M ${x1} ${y1} C ${x1 + 60} ${y1 + 30}, ${x2 - 60} ${y2 - 30}, ${x2} ${y2}`;
    }

    const path = svg('path', {
      d, class:'edge flow-path',
      'data-from': from.id, 'data-to': to.id
    });
    flowEdgeEls.push({ el: path, from: from.id, to: to.id });
    flowGroup.appendChild(path);
  }
}

function drawEdge(from, to, type){
  const x1 = from.x + NODE_W;
  const y1 = from.y + NODE_H / 2;
  const x2 = to.x;
  const y2 = to.y + NODE_H / 2;
  const dx = Math.max(40, (x2 - x1) * 0.5);
  const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

  const path = svg('path', {
    d, class:`edge ${type}`,
    'data-from': from.id, 'data-to': to.id
  });
  if (type === 'prereq') path.setAttribute('marker-end', 'url(#arrow)');
  edgeEls.push({ el: path, from: from.id, to: to.id, type });
  edgesGroup.appendChild(path);
}

function applyExamFilter(){
  const visibleSet = new Set();
  NODES.forEach(n => {
    const visible = (n.exams || []).some(ex => state.examFilter.has(ex));
    if (visible) visibleSet.add(n.id);
    nodeEls[n.id].style.display = visible ? '' : 'none';
  });
  edgeEls.forEach(e => {
    const show = visibleSet.has(e.from) && visibleSet.has(e.to);
    e.el.style.display = show ? '' : 'none';
  });
  flowEdgeEls.forEach(e => {
    const show = state.flowMode && visibleSet.has(e.from) && visibleSet.has(e.to);
    e.el.style.display = show ? '' : 'none';
  });
  if (state.selected && !visibleSet.has(state.selected)){
    clearSelection();
  }
}

// HOVER
// ============================================================
function hoverNode(id){
  const connected = new Set([id]);
  edgeEls.forEach(e => {
    if (e.from === id || e.to === id){
      connected.add(e.from); connected.add(e.to);
    }
  });
  NODES.forEach(n => {
    nodeEls[n.id].classList.toggle('dim', !connected.has(n.id));
  });
  edgeEls.forEach(e => {
    const on = e.from === id || e.to === id;
    e.el.classList.toggle('highlight', on);
    e.el.classList.toggle('dim', !on);
  });
  flowEdgeEls.forEach(e => {
    const on = e.from === id || e.to === id;
    e.el.classList.toggle('highlight', on);
    if (state.flowMode) e.el.classList.toggle('dim', !on);
  });
}

function unhoverNode(){
  if (state.selected) return;
  NODES.forEach(n => nodeEls[n.id].classList.remove('dim'));
  edgeEls.forEach(e => e.el.classList.remove('highlight','dim'));
  flowEdgeEls.forEach(e => e.el.classList.remove('highlight','dim'));
}

// SELECT
// ============================================================
function selectNode(id){
  state.selected = id;
  const connected = new Set([id]);
  edgeEls.forEach(e => {
    if (e.from === id || e.to === id){
      connected.add(e.from); connected.add(e.to);
    }
  });
  NODES.forEach(n => {
    const g = nodeEls[n.id];
    g.classList.toggle('selected', n.id === id);
    g.classList.toggle('dim', !connected.has(n.id));
  });
  edgeEls.forEach(e => {
    const on = e.from === id || e.to === id;
    e.el.classList.toggle('highlight', on);
    e.el.classList.toggle('dim', !on);
  });
  flowEdgeEls.forEach(e => {
    const on = e.from === id || e.to === id;
    e.el.classList.toggle('highlight', on);
    if (state.flowMode) e.el.classList.toggle('dim', !on);
  });
  showDetail(byId[id]);
}

function clearSelection(){
  state.selected = null;
  NODES.forEach(n => nodeEls[n.id].classList.remove('dim','selected'));
  edgeEls.forEach(e => e.el.classList.remove('highlight','dim'));
  flowEdgeEls.forEach(e => e.el.classList.remove('highlight','dim'));
  closeDetail();
}

  if (!items || !items.length) return '';
  return section(label, items.length,
    `<ul class="detail-list ${cls}">${items.map(i => `<li>${i}</li>`).join('')}</ul>`);
}

function showDetail(node){
  const layer = LAYERS[node.layer];
  const nexts = NEXT[node.id] || [];
  const crosses = CROSS_MAP[node.id] || [];
  const exams = node.exams || [];
  const step = state.flowOrder.indexOf(node.id) + 1;
  const m = getMastery(node.id);

  let html = `
    <div class="detail-layer" style="color:${layer.color}">
      Phase ${node.layer + 1} · ${layer.name}
      <span style="color:var(--flow); margin-left:6px;">· Step ${step} of ${state.flowOrder.length}</span>
    </div>
    <h2>${node.name}</h2>
    <div class="exam-chips">
      ${exams.map(ex => `<span class="exam-chip" data-exam="${ex}">${ex}</span>`).join('')}
    </div>

    <div class="mastery-row">
      <button class="mastery-pill ${m==='new'?'active':''}" data-state="new" data-mid="${node.id}">◯ Not started</button>
      <button class="mastery-pill ${m==='learning'?'active':''}" data-state="learning" data-mid="${node.id}">◐ Learning</button>
      <button class="mastery-pill ${m==='mastered'?'active':''}" data-state="mastered" data-mid="${node.id}">✓ Mastered</button>
    </div>

    <p class="detail-desc">${node.desc}</p>
  `;

  html += section('Prerequisites', node.pre.length,
    node.pre.length
      ? `<div class="chip-row">${node.pre.map(chipHTML).join('')}</div>`
      : `<span class="chip empty">None — this is an entry point.</span>`);

  html += section('Leads to', nexts.length,
    nexts.length
      ? `<div class="chip-row">${nexts.map(chipHTML).join('')}</div>`
      : `<span class="chip empty">Terminal node.</span>`);

  const crossChips = crosses.map(chipHTML).join('');
  if (crosses.length){
    html += section('Cross-links', crosses.length,
      `<div class="chip-row">${crossChips}</div>`);
  }

  html += listSection('Key formulas', node.formulas, 'code');
  html += listSection('Common misconceptions', node.misc, 'warn');

  detailInner.innerHTML = html;

  detailInner.querySelectorAll('[data-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.jump;
      centerOn(id);
      selectNode(id);
    });
  });

  // Mastery pill clicks
  detailInner.querySelectorAll('.mastery-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.mid;
      const st = btn.dataset.state;
      setMastery(id, st);
      showDetail(byId[id]);
    });
  });

  detailEl.classList.add('open');
}

function closeDetail(){ detailEl.classList.remove('open'); }
document.getElementById('detailClose').addEventListener('click', clearSelection);

// ============================================================
// PAN / ZOOM
// ============================================================
const view = { tx:0, ty:0, scale:1 };
function applyTransform(){
  viewport.setAttribute('transform',
    `translate(${view.tx} ${view.ty}) scale(${view.scale})`);
}
function fitToView(){
  const rect = svgEl.getBoundingClientRect();
  const cw = rect.width, ch = rect.height;
  const scale = Math.min(cw / CANVAS_W, ch / CANVAS_H) * 0.92;
  view.scale = scale;
  view.tx = (cw - CANVAS_W * scale) / 2;
  view.ty = (ch - CANVAS_H * scale) / 2;
  applyTransform();
}
function centerOn(id){
  const n = byId[id];
  if (!n) return;
  const rect = svgEl.getBoundingClientRect();
  const cw = rect.width, ch = rect.height;
  view.tx = cw / 2 - (n.x + NODE_W/2) * view.scale;
  view.ty = ch / 2 - (n.y + NODE_H/2) * view.scale;
  applyTransform();
}
document.getElementById('zoomIn').onclick = () => zoomAt(svgEl.clientWidth/2, svgEl.clientHeight/2, 1.25);
document.getElementById('zoomOut').onclick = () => zoomAt(svgEl.clientWidth/2, svgEl.clientHeight/2, 0.8);
document.getElementById('zoomReset').onclick = fitToView;
function zoomAt(px, py, factor){
  const newScale = Math.max(0.12, Math.min(4, view.scale * factor));
  const wx = (px - view.tx) / view.scale;
  const wy = (py - view.ty) / view.scale;
  view.scale = newScale;
  view.tx = px - wx * newScale;
  view.ty = py - wy * newScale;
  applyTransform();
}

let isDragging = false, dragStart = null, moved = false;
svgEl.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.node')) return;
  isDragging = true; moved = false;
  dragStart = { x:e.clientX, y:e.clientY, tx:view.tx, ty:view.ty };
  svgEl.classList.add('dragging');
  svgEl.setPointerCapture(e.pointerId);
});
svgEl.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
  view.tx = dragStart.tx + dx;
  view.ty = dragStart.ty + dy;
  applyTransform();
});
function endDrag(e){
  if (!isDragging) return;
  isDragging = false;
  svgEl.classList.remove('dragging');
  try { svgEl.releasePointerCapture(e.pointerId); } catch(_){}
  if (!moved && !e.target.closest('.node')) clearSelection();
}
svgEl.addEventListener('pointerup', endDrag);
svgEl.addEventListener('pointercancel', endDrag);
svgEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = svgEl.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.12 : 0.89);
}, { passive:false });

// ============================================================
// FLOW TOGGLE
// ============================================================
const flowBanner = document.getElementById('flowBanner');
const flowToggle = document.getElementById('flowToggle');

flowToggle.addEventListener('click', () => {
  state.flowMode = !state.flowMode;
  flowToggle.classList.toggle('mode-on', state.flowMode);
  flowToggle.textContent = state.flowMode ? '◉ Flow ON' : '◉ Flow';
  flowBanner.classList.toggle('show', state.flowMode);

  // Recompute layout
  orderLayerNodes();

  if (state.flowMode){
    // Flow mode: strict flow-step order within each layer
    // (already ordered by orderLayerNodes)
  } else {
    // Graph mode: barycenter
    runBarycenter();
  }

  // Reposition nodes
  byLayer.forEach(list => {
    const gap = 18;
    const totalH = list.length * NODE_H + (list.length - 1) * gap;
    const startY = Math.max(80, CENTER_Y - totalH / 2);
    list.forEach((n, i) => {
      n.y = startY + i * (NODE_H + gap);
    });
  });

  render();
});

// ============================================================
// LEGEND
// ============================================================
function buildLegend(){
  const bar = document.getElementById('legendBar');
  bar.innerHTML = '';

  // Mastery legend
  const mg = document.createElement('div');
  mg.className = 'legend-item';
  mg.innerHTML = `
    <span class="legend-dot" style="background:#58cc02;"></span>
    <span>Mastered</span>`;
  bar.appendChild(mg);

  const lg = document.createElement('div');
  lg.className = 'legend-item';
  lg.innerHTML = `
    <span class="legend-dot" style="background:#ffb347;"></span>
    <span>Learning</span>`;
  bar.appendChild(lg);

  const ng = document.createElement('div');
  ng.className = 'legend-item';
  ng.innerHTML = `
    <span class="legend-dot" style="background:#5d7284;"></span>
    <span>Not started</span>`;
  bar.appendChild(ng);

  const div = document.createElement('div');
  div.className = 'legend-divider';
  bar.appendChild(div);

  // Layer legend (abbreviated)
  LAYERS.forEach(layer => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `
      <span class="legend-swatch" style="background:${layer.color}"></span>
      <span>${layer.name}</span>`;
    bar.appendChild(item);
  });
}

// ============================================================
// EXAM FILTER PILLS
// ============================================================
document.querySelectorAll('.exam-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    const ex = pill.dataset.exam;
    if (state.examFilter.has(ex)){
      if (state.examFilter.size === 1) return;
      state.examFilter.delete(ex);
      pill.classList.remove('on');
      pill.classList.add('off');
    } else {
      state.examFilter.add(ex);
      pill.classList.add('on');
      pill.classList.remove('off');
    }
    // Recompute flow order
    state.flowOrder = computeFlowOrder(state.examFilter);
    state.stepByNode = {};
    state.flowOrder.forEach((id, i) => { state.stepByNode[id] = i + 1; });
    // Re-render
    orderLayerNodes();
    byLayer.forEach(list => {
      const gap = 18;
      const totalH = list.length * NODE_H + (list.length - 1) * gap;
      const startY = Math.max(80, CENTER_Y - totalH / 2);
      list.forEach((n, i) => {
        n.y = startY + i * (NODE_H + gap);
      });
    });
    render();
  });
});

setTimeout(() => document.getElementById('hint').classList.add('hide'), 5000);

// INIT
// ============================================================
render();
buildLegend();

window.addEventListener('resize', () => { if (!state.selected) fitToView(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') clearSelection();
});
