<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔬 Separation Station – Learn Chemistry</title>
    <style>
        /* ─────────────── RESET & BASE ─────────────── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0c1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }

        .app-wrap {
            max-width: 780px;
            width: 100%;
            background: linear-gradient(145deg, #1a1430, #110d22);
            border-radius: 48px 48px 32px 32px;
            padding: 20px 22px 28px;
            box-shadow: 0 20px 60px rgba(90, 40, 200, 0.25), inset 0 1px 0 rgba(255, 200, 255, 0.06);
            border: 1px solid rgba(160, 100, 255, 0.12);
            position: relative;
            overflow: hidden;
        }
        .app-wrap::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(120, 60, 255, 0.04), transparent 60%);
            pointer-events: none;
        }

        /* ─────────────── HEADER ─────────────── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(160, 100, 255, 0.08);
            position: relative;
            z-index: 2;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #d4c0ff;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.3px;
        }
        .logo span {
            background: rgba(120, 60, 255, 0.15);
            padding: 4px 14px 4px 12px;
            border-radius: 40px;
            border: 1px solid rgba(160, 100, 255, 0.15);
        }
        .logo .emoji {
            font-size: 1.6rem;
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 18px 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(160, 100, 255, 0.08);
            backdrop-filter: blur(4px);
        }
        .stats .star-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #f7d44a;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .stats .star-wrap .num {
            color: #fff3d0;
            min-width: 20px;
            text-align: center;
        }
        .stats .progress-wrap {
            width: 60px;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
        }
        .stats .progress-wrap .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a06aff, #7c3aff);
            border-radius: 10px;
            transition: width 0.6s ease;
        }
        .stats .lvl {
            color: rgba(200, 180, 255, 0.4);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .mute-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(160, 100, 255, 0.08);
            border-radius: 40px;
            color: #b0a0d0;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 1.0rem;
            line-height: 1.4;
            transition: all 0.2s;
        }
        .mute-btn:hover {
            background: rgba(160, 100, 255, 0.08);
        }

        /* ─────────────── CHARACTER ─────────────── */
        .char-section {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 12px 0 10px;
            position: relative;
            z-index: 2;
        }
        #charCanvas {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 30%, #1f1838, #130e22);
            border: 2px solid rgba(160, 100, 255, 0.12);
            box-shadow: 0 0 40px rgba(120, 60, 255, 0.05);
            cursor: default;
        }
        .char-speech {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 16px;
            border-radius: 20px 20px 20px 4px;
            border: 1px solid rgba(160, 100, 255, 0.06);
            color: #c8b8f0;
            font-size: 0.92rem;
            line-height: 1.5;
            min-height: 48px;
            display: flex;
            align-items: center;
            transition: all 0.3s;
        }
        .char-speech .highlight {
            color: #c89aff;
            font-weight: 500;
        }

        /* ─────────────── LEVEL GRID ─────────────── */
        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            padding: 16px 0 8px;
            position: relative;
            z-index: 2;
        }
        .level-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(160, 100, 255, 0.06);
            border-radius: 20px;
            padding: 14px 10px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            backdrop-filter: blur(4px);
            min-height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .level-card:hover {
            background: rgba(160, 100, 255, 0.06);
            border-color: rgba(160, 100, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(90, 40, 200, 0.1);
        }
        .level-card:active {
            transform: scale(0.96);
        }
        .level-card .icon {
            font-size: 2rem;
            line-height: 1.2;
            margin-bottom: 4px;
        }
        .level-card .name {
            color: #d4c8f0;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }
        .level-card .sub {
            color: rgba(200, 180, 255, 0.3);
            font-size: 0.6rem;
            margin-top: 2px;
        }
        .level-card .stars {
            display: flex;
            gap: 3px;
            margin-top: 6px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: rgba(255, 215, 0, 0.15);
        }
        .level-card .stars .filled {
            color: #f7d44a;
        }
        .level-card .lock {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 0.7rem;
            color: rgba(200, 180, 255, 0.15);
        }
        .level-card.completed {
            border-color: rgba(160, 100, 255, 0.2);
            background: rgba(120, 60, 255, 0.04);
        }

        /* ─────────────── GAME CONTAINER ─────────────── */
        .game-container {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 28px;
            padding: 20px 18px 18px;
            margin-top: 4px;
            border: 1px solid rgba(160, 100, 255, 0.06);
            min-height: 320px;
            display: none;
            flex-direction: column;
        }
        .game-container.active {
            display: flex;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .game-header .title {
            color: #d4c0ff;
            font-weight: 700;
            font-size: 1.05rem;
        }
        .game-header .back-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(160, 100, 255, 0.08);
            color: #b0a0d0;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .game-header .back-btn:hover {
            background: rgba(160, 100, 255, 0.08);
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            position: relative;
        }

        /* ─────────────── GAME: FILTRATION ─────────────── */
        .filtration-game {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
        }
        .filtration-game .apparatus {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .filtration-game .app-part {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .filtration-game .app-part .label {
            color: rgba(200, 180, 255, 0.3);
            font-size: 0.6rem;
            letter-spacing: 0.5px;
        }
        .filtration-game .beaker {
            width: 80px;
            height: 70px;
            border: 2px solid rgba(160, 200, 255, 0.15);
            border-top: none;
            border-radius: 0 0 30% 30%;
            position: relative;
            background: rgba(100, 180, 255, 0.03);
            overflow: hidden;
            transition: all 0.4s;
        }
        .filtration-game .beaker .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(180deg, rgba(100, 200, 255, 0.2), rgba(80, 160, 255, 0.35));
            border-radius: 0 0 30% 30%;
            transition: height 0.8s ease;
        }
        .filtration-game .beaker .liquid .particles {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(200, 180, 100, 0.2) 2px, transparent 2px);
            background-size: 16px 16px;
            opacity: 0.5;
        }
        .filtration-game .funnel {
            width: 50px;
            height: 60px;
            border: 2px solid rgba(160, 200, 255, 0.12);
            border-bottom: none;
            border-radius: 60% 60% 0 0 / 80% 80% 0 0;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.3s;
        }
        .filtration-game .funnel .filter-paper {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 16px;
            background: rgba(220, 220, 200, 0.15);
            border-radius: 0 0 20% 20%;
            border: 1px solid rgba(200, 200, 180, 0.1);
            transition: all 0.3s;
            cursor: grab;
        }
        .filtration-game .funnel .filter-paper.placed {
            background: rgba(220, 220, 200, 0.3);
            border-color: rgba(200, 200, 180, 0.3);
            box-shadow: 0 0 20px rgba(160, 200, 255, 0.05);
        }
        .filtration-game .flask {
            width: 60px;
            height: 65px;
            border: 2px solid rgba(160, 200, 255, 0.12);
            border-top: none;
            border-radius: 0 0 40% 40%;
            position: relative;
            background: rgba(100, 180, 255, 0.02);
            overflow: hidden;
        }
        .filtration-game .flask .filtrate {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, rgba(100, 200, 255, 0.1), rgba(80, 180, 255, 0.2));
            border-radius: 0 0 40% 40%;
            transition: height 0.8s ease;
        }
        .filtration-game .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            padding-top: 8px;
        }
        .filtration-game .actions button {
            background: rgba(160, 100, 255, 0.08);
            border: 1px solid rgba(160, 100, 255, 0.12);
            color: #c8b8f0;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.25s;
            font-weight: 500;
        }
        .filtration-game .actions button:hover {
            background: rgba(160, 100, 255, 0.15);
            border-color: rgba(160, 100, 255, 0.25);
        }
        .filtration-game .actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .filtration-game .status {
            color: rgba(200, 180, 255, 0.4);
            font-size: 0.8rem;
            min-height: 24px;
            text-align: center;
        }

        /* ─────────────── GAME: MAGNETIC ─────────────── */
        .magnetic-game {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }
        .magnetic-game .mix-area {
            position: relative;
            width: 200px;
            height: 100px;
            background: rgba(60, 40, 80, 0.3);
            border-radius: 20px;
            border: 1px solid rgba(160, 100, 255, 0.06);
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 6px;
            padding: 12px;
        }
        .magnetic-game .mix-area .particle {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transition: all 0.3s;
            cursor: default;
            flex-shrink: 0;
        }
        .magnetic-game .mix-area .particle.sand {
            background: radial-gradient(circle at 30% 30%, #c8b080, #a08860);
        }
        .magnetic-game .mix-area .particle.iron {
            background: radial-gradient(circle at 30% 30%, #888899, #555566);
            box-shadow: 0 0 8px rgba(160, 140, 200, 0.1);
            transition: all 0.4s;
        }
        .magnetic-game .mix-area .particle.iron.collected {
            transform: translateY(-40px) scale(0.3);
            opacity: 0;
            pointer-events: none;
        }
        .magnetic-game .magnet {
            width: 60px;
            height: 28px;
            background: linear-gradient(180deg, #6a4a8a, #4a2a6a);
            border-radius: 12px 12px 6px 6px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.6rem;
            letter-spacing: 1px;
            transition: all 0.2s;
            user-select: none;
            touch-action: none;
            box-shadow: 0 4px 20px rgba(120, 60, 255, 0.15);
            border: 1px solid rgba(160, 100, 255, 0.1);
        }
        .magnetic-game .magnet:active {
            transform: scale(0.92);
            cursor: grabbing;
        }
        .magnetic-game .magnet.active {
            background: linear-gradient(180deg, #8a5aaa, #5a3a7a);
            box-shadow: 0 0 40px rgba(120, 60, 255, 0.2);
        }
        .magnetic-game .mag-status {
            color: rgba(200, 180, 255, 0.4);
            font-size: 0.8rem;
            min-height: 24px;
        }
        .magnetic-game .collected-count {
            color: #c8b8f0;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* ─────────────── GAME: DISTILLATION ─────────────── */
        .distillation-game {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }
        .distillation-game .dist-app {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .distillation-game .dist-part {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .distillation-game .dist-part .label {
            color: rgba(200, 180, 255, 0.2);
            font-size: 0.55rem;
            letter-spacing: 0.3px;
        }
        .distillation-game .flask-heat {
            width: 56px;
            height: 60px;
            border: 2px solid rgba(160, 200, 255, 0.08);
            border-top: none;
            border-radius: 0 0 40% 40%;
            position: relative;
            background: rgba(100, 180, 255, 0.02);
            overflow: hidden;
            transition: all 0.3s;
        }
        .distillation-game .flask-heat .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, rgba(100, 200, 255, 0.15), rgba(80, 160, 255, 0.3));
            border-radius: 0 0 40% 40%;
            transition: height 0.6s;
        }
        .distillation-game .flask-heat .vapor {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: rgba(200, 220, 255, 0.1);
            border-radius: 50%;
            opacity: 0;
            transition: all 0.4s;
            box-shadow: 0 0 20px rgba(160, 200, 255, 0.05);
        }
        .distillation-game .flask-heat .vapor.active {
            opacity: 1;
            transform: translateX(-50%) translateY(-20px) scale(1.4);
            box-shadow: 0 0 40px rgba(160, 200, 255, 0.08);
        }
        .distillation-game .condenser {
            width: 20px;
            height: 70px;
            background: linear-gradient(180deg, rgba(100, 120, 180, 0.05), rgba(80, 100, 160, 0.08));
            border: 1px solid rgba(160, 200, 255, 0.06);
            border-radius: 4px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 4px 0;
        }
        .distillation-game .condenser .coolant {
            width: 12px;
            height: 4px;
            background: rgba(100, 200, 255, 0.04);
            border-radius: 2px;
        }
        .distillation-game .condenser .drip {
            position: absolute;
            bottom: -6px;
            width: 4px;
            height: 4px;
            background: rgba(160, 200, 255, 0.1);
            border-radius: 50%;
            opacity: 0;
            transition: all 0.3s;
        }
        .distillation-game .condenser .drip.active {
            opacity: 1;
            transform: translateY(6px);
        }
        .distillation-game .flask-collect {
            width: 48px;
            height: 50px;
            border: 2px solid rgba(160, 200, 255, 0.06);
            border-top: none;
            border-radius: 0 0 40% 40%;
            position: relative;
            background: rgba(100, 180, 255, 0.02);
            overflow: hidden;
        }
        .distillation-game .flask-collect .collect-liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, rgba(100, 200, 255, 0.05), rgba(80, 180, 255, 0.12));
            border-radius: 0 0 40% 40%;
            transition: height 0.8s ease;
        }
        .distillation-game .heat-btn {
            background: rgba(255, 160, 80, 0.08);
            border: 1px solid rgba(255, 160, 80, 0.12);
            color: #f0c8a0;
            padding: 8px 28px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.25s;
        }
        .distillation-game .heat-btn:hover {
            background: rgba(255, 160, 80, 0.15);
        }
        .distillation-game .heat-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .distillation-game .dist-status {
            color: rgba(200, 180, 255, 0.4);
            font-size: 0.8rem;
            min-height: 24px;
        }

        /* ─────────────── GAME: CHROMATOGRAPHY ─────────────── */
        .chromatography-game {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
        }
        .chromatography-game .chrom-paper {
            width: 120px;
            height: 150px;
            background: rgba(255, 248, 235, 0.04);
            border: 1px solid rgba(200, 200, 180, 0.06);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        .chromatography-game .chrom-paper .spot {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(200, 100, 200, 0.3), rgba(160, 60, 160, 0.1));
            transition: all 0.3s;
            cursor: pointer;
        }
        .chromatography-game .chrom-paper .spot:hover {
            transform: translateX(-50%) scale(1.1);
        }
        .chromatography-game .chrom-paper .spot.placed {
            background: radial-gradient(circle at 30% 30%, rgba(200, 100, 200, 0.5), rgba(160, 60, 160, 0.2));
            box-shadow: 0 0 20px rgba(200, 100, 200, 0.05);
        }
        .chromatography-game .chrom-paper .color-band {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            border-radius: 2px;
            opacity: 0;
            transition: all 0.6s;
            height: 0px;
            bottom: 20px;
        }
        .chromatography-game .chrom-paper .color-band.show {
            opacity: 1;
        }
        .chromatography-game .chrom-paper .color-band.band1 {
            background: rgba(200, 80, 200, 0.3);
            height: 18px;
            bottom: 38px;
        }
        .chromatography-game .chrom-paper .color-band.band2 {
            background: rgba(80, 180, 200, 0.2);
            height: 14px;
            bottom: 58px;
        }
        .chromatography-game .chrom-paper .color-band.band3 {
            background: rgba(200, 180, 80, 0.2);
            height: 10px;
            bottom: 76px;
        }
        .chromatography-game .chrom-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .chromatography-game .chrom-actions button {
            background: rgba(160, 100, 255, 0.08);
            border: 1px solid rgba(160, 100, 255, 0.12);
            color: #c8b8f0;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.25s;
        }
        .chromatography-game .chrom-actions button:hover {
            background: rgba(160, 100, 255, 0.15);
        }
        .chromatography-game .chrom-actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .chromatography-game .chrom-status {
            color: rgba(200, 180, 255, 0.4);
            font-size: 0.8rem;
            min-height: 24px;
        }

        /* ─────────────── CELEBRATION OVERLAY ─────────────── */
        .celebration {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(10, 6, 20, 0.7);
            backdrop-filter: blur(6px);
            border-radius: 28px;
            z-index: 10;
            animation: fadeCeleb 0.5s ease;
        }
        .celebration.show {
            display: flex;
        }
        @keyframes fadeCeleb {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .celebration .big {
            font-size: 3.6rem;
            letter-spacing: 6px;
            animation: floatStars 1.8s ease-in-out infinite;
        }
        @keyframes floatStars {
            0%,

                transform: translateY(0) scale(1);

        @media (max-width: 540px) {

            .filtration-game .apparatus,
            .distillation-game .dist-app {
                gap: 10px;

            .filtration-game .beaker {
                width: 60px;
                height: 55px;
            }
            .filtration-game .funnel {

                height: 48px;

            .filtration-game .flask {

            }

            }

                height: 40px;
            }
            .chromatography-game .chrom-paper {
                width: 90px;
                height: 120px;
            }
            .magnetic-game .mix-area {
                width: 160px;
                height: 80px;
            }
            .celebration .big {
                font-size: 2.6rem;
            }
            .celebration .msg {

        }

        @media (max-width: 400px) {
            .level-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stats .lvl {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrap">
        <!-- ─── HEADER ─── -->
        <div class="header">
            <div class="logo">
                <span class="emoji">🔬</span>
                <span>Separation Station</span>
            </div>
            <div class="stats">
                <div class="star-wrap">
                    ⭐ <span class="num" id="starCount">0</span>
                </div>
                <div class="progress-wrap">
                    <div class="bar" id="progressBar"></div>
                </div>
                <span class="lvl" id="levelLabel">LVL 1</span>

        <!-- ─── CHARACTER ─── -->

            </div>
        </div>

        <!-- ─── LEVEL GRID ─── -->
        <div class="level-grid" id="levelGrid">
            <div class="level-card" data-level="0" data-method="filtration">
                <div class="icon">🧪</div>
                <div class="name">Filtration</div>

                <div class="stars" id="stars-0"><span>☆</span><span>☆</span><span>☆</span></div>
            </div>
            <div class="level-card" data-level="1" data-method="magnetic">
                <div class="icon">🧲</div>
                <div class="name">Magnetic</div>
                <div class="sub">solid + solid</div>
                <div class="stars" id="stars-1"><span>☆</span><span>☆</span><span>☆</span></div>
            </div>
            <div class="level-card" data-level="2" data-method="distillation">
                <div class="icon">🔥</div>
                <div class="name">Distillation</div>
                <div class="sub">liquid + liquid</div>
                <div class="stars" id="stars-2"><span>☆</span><span>☆</span><span>☆</span></div>
            </div>
            <div class="level-card" data-level="3" data-method="chromatography">
                <div class="icon">🎨</div>
                <div class="name">Chromatography</div>
                <div class="sub">liquid + liquid</div>
                <div class="stars" id="stars-3"><span>☆</span><span>☆</span><span>☆</span></div>
            </div>
        </div>

        <!-- ─── GAME CONTAINER ─── -->
        <div class="game-container" id="gameContainer">
            <div class="game-header">
                <span class="title" id="gameTitle">Filtration</span>
                <button class="back-btn" id="backBtn">← Back</button>
            </div>
            <div class="game-area" id="gameArea">
                <!-- games injected here -->
            </div>
            <!-- celebration overlay -->
            <div class="celebration" id="celebration">
                <div class="big">🌟✨🌟</div>
                <div class="msg">🎉 Method Mastered!</div>
                <div class="star-reward">⭐ +1</div>
                <div class="sub-msg">You're becoming a separation scientist!</div>
            </div>
        </div>

    </div>

    <script>
        // ──────────────────────────────────────────────────────────────
        //  SOUND MANAGER – Web Audio synth effects
        // ──────────────────────────────────────────────────────────────
        const SoundManager = (() => {
            let ctx = null;
            let muted = false;

            function init() {
                if (!ctx) {
                    try {
                        ctx = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        ctx = null;
                    }
                }
                // Resume if suspended (autoplay policy)
                if (ctx && ctx.state === 'suspended') {
                    ctx.resume();
                }
            }

            function toggleMute() {
                muted = !muted;
                return muted;
            }

            function play(type) {
                if (muted || !ctx) return;
                try {
                    switch (type) {
                        case 'click':
                            playTone(700, 0.06, 'sine');
                            break;
                        case 'success':
                            playTone(523, 0.15);
                            setTimeout(() => playTone(659, 0.15), 120);
                            setTimeout(() => playTone(784, 0.2), 240);
                            break;
                        case 'error':
                            playTone(200, 0.25, 'sawtooth');
                            break;
                        case 'collect':
                            playTone(880, 0.08, 'sine');
                            setTimeout(() => playTone(1100, 0.08), 80);
                            break;
                        case 'drop':
                            playTone(300, 0.12, 'sine');
                            setTimeout(() => playTone(200, 0.2, 'sine'), 100);
                            break;
                        case 'pop':
                            playTone(500, 0.05, 'sine');
                            setTimeout(() => playTone(400, 0.05, 'sine'), 50);
                            break;
                        default:
                            break;
                    }
                } catch (e) { /* ignore */ }
            }

            function playTone(freq, dur, type = 'sine') {
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + dur);
            }

            return { init, toggleMute, play, get muted() { return muted; } };
        })();

        // ──────────────────────────────────────────────────────────────
        //  MAIN APP
        // ──────────────────────────────────────────────────────────────

        (function() {
            'use strict';

            // ─── STATE ───
            const state = {
                stars: 0,
                completed: [false, false, false, false],
                starCounts: [0, 0, 0, 0],
                currentLevel: -1,
                gameActive: false,
                filtration: { filterPlaced: false, poured: false, done: false },
                magnetic: { collected: 0, total: 8, done: false },
                distillation: { heated: false, done: false, progress: 0 },
                chromatography: { spotted: false, developed: false, done: false },
            };

            const levelNames = ['Filtration', 'Magnetic Separation', 'Distillation', 'Chromatography'];
            const levelIcons = ['🧪', '🧲', '🔥', '🎨'];

            // ─── DOM REFS ───
            const canvas = document.getElementById('charCanvas');
            const ctx = canvas.getContext('2d');
            const speech = document.getElementById('speechBubble');
            const grid = document.getElementById('levelGrid');
            const gameContainer = document.getElementById('gameContainer');
            const gameArea = document.getElementById('gameArea');
            const gameTitle = document.getElementById('gameTitle');
            const backBtn = document.getElementById('backBtn');
            const celebration = document.getElementById('celebration');
            const starCountEl = document.getElementById('starCount');
            const progressBar = document.getElementById('progressBar');
            const levelLabel = document.getElementById('levelLabel');
            const muteBtn = document.getElementById('muteBtn');

            // ─── SOUND INIT ───
            SoundManager.init();
            muteBtn.addEventListener('click', () => {
                const muted = SoundManager.toggleMute();
                muteBtn.textContent = muted ? '🔇' : '🔊';
                if (!muted) SoundManager.init(); // resume audio context
            });

            // ─── CHARACTER DRAWING ───
            let charAnim = 0;
            let charState = 'idle'; // idle | happy | think

            function drawCharacter(pose) {
                const w = 160,
                    h = 160;
                ctx.clearRect(0, 0, w, h);

                const cx = 80,
                    cy = 90;
                const s = 1.0;
                const bob = pose === 'idle' ? Math.sin(charAnim * 0.04) * 1.5 : 0;

                ctx.shadowColor = 'rgba(120,60,255,0.08)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetY = 4;

                // body
                const bodyGrad = ctx.createRadialGradient(cx - 10, cy - 10 + bob, 10, cx, cy + bob, 45);
                bodyGrad.addColorStop(0, '#4a3a6a');
                bodyGrad.addColorStop(1, '#2a1a4a');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(cx, cy + 8 + bob, 32, 38, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(160,120,200,0.04)';
                ctx.beginPath();
                ctx.ellipse(cx - 6, cy + 16 + bob, 10, 18, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx + 6, cy + 16 + bob, 10, 18, 0, 0, Math.PI * 2);
                ctx.fill();

                // head
                ctx.shadowBlur = 12;
                const headY = cy - 22 + bob;
                const headGrad = ctx.createRadialGradient(cx - 8, headY - 6, 8, cx, headY, 32);
                headGrad.addColorStop(0, '#e8d8c8');
                headGrad.addColorStop(1, '#c8b8a8');
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.ellipse(cx, headY, 28, 30, 0, 0, Math.PI * 2);
                ctx.fill();

                // ears
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#c8b0a0';
                ctx.beginPath();
                ctx.moveTo(cx - 26, headY - 14);
                ctx.lineTo(cx - 18, headY - 38);
                ctx.lineTo(cx - 8, headY - 20);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(cx + 26, headY - 14);
                ctx.lineTo(cx + 18, headY - 38);
                ctx.lineTo(cx + 8, headY - 20);
                ctx.fill();
                ctx.fillStyle = '#d8b8a8';
                ctx.beginPath();
                ctx.moveTo(cx - 22, headY - 18);
                ctx.lineTo(cx - 18, headY - 32);
                ctx.lineTo(cx - 12, headY - 22);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(cx + 22, headY - 18);
                ctx.lineTo(cx + 18, headY - 32);
                ctx.lineTo(cx + 12, headY - 22);
                ctx.fill();

                // glasses
                ctx.shadowBlur = 4;
                ctx.strokeStyle = 'rgba(160,130,200,0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(cx - 11, headY - 2, 10, 9, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.ellipse(cx + 11, headY - 2, 10, 9, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - 2, headY - 4);
                ctx.lineTo(cx + 2, headY - 4);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - 20, headY - 4);
                ctx.lineTo(cx - 26, headY - 8);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + 20, headY - 4);
                ctx.lineTo(cx + 26, headY - 8);
                ctx.stroke();

                // eyes
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#f8f4f0';
                ctx.beginPath();
                ctx.ellipse(cx - 12, headY - 2, 7, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx + 12, headY - 2, 7, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                const eyeOff = pose === 'think' ? -2 : 0;
                ctx.fillStyle = '#2a1a3a';
                ctx.beginPath();
                ctx.arc(cx - 12 + eyeOff, headY + 1, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx + 12 + eyeOff, headY + 1, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(cx - 14 + eyeOff, headY - 3, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx + 10 + eyeOff, headY - 3, 2, 0, Math.PI * 2);
                ctx.fill();

                // mouth
                if (pose === 'happy') {
                    ctx.strokeStyle = '#9a6a7a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(cx, headY + 8, 8, 0.1, Math.PI - 0.1);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,120,150,0.08)';
                    ctx.beginPath();
                    ctx.ellipse(cx - 20, headY + 8, 6, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cx + 20, headY + 8, 6, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (pose === 'think') {
                    ctx.strokeStyle = '#9a6a7a';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, headY + 6, 5, 0.2, Math.PI - 0.2);
                    ctx.stroke();
                    ctx.fillStyle = '#d8c8b8';
                    ctx.shadowBlur = 4;
                    ctx.beginPath();
                    ctx.ellipse(cx + 22, headY + 14, 5, 8, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.strokeStyle = '#9a6a7a';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, headY + 4, 5, 0.2, Math.PI - 0.2);
                    ctx.stroke();
                }

                // arms
                ctx.shadowBlur = 6;
                ctx.fillStyle = '#3a2a5a';
                ctx.beginPath();
                ctx.ellipse(cx - 32, cy + 8 + bob, 6, 14, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx + 32, cy + 8 + bob, 6, 14, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#d8c8b8';
                ctx.beginPath();
                ctx.ellipse(cx - 34, cy + 20 + bob, 5, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx + 34, cy + 20 + bob, 5, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // tail
                ctx.fillStyle = '#3a2a5a';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.ellipse(cx - 30, cy + 34 + bob, 6, 16, -0.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(255,200,100,0.15)';
                ctx.fillText('⭐', cx, cy + 12 + bob);
            }

            // ─── ANIMATION LOOP ───
            function animateChar() {
                charAnim++;
                drawCharacter(charState);
                requestAnimationFrame(animateChar);
            }

            // ─── SPEECH ───
            function say(text, highlight = '') {
                if (highlight) {
                    speech.innerHTML = text.replace(highlight, `<span class="highlight">${highlight}</span>`);
                } else {
                    speech.textContent = text;
                }
            }

            // ─── UPDATE UI ───
            function updateUI() {
                const total = state.completed.length;
                const done = state.completed.filter(Boolean).length;
                const pct = (done / total) * 100;
                progressBar.style.width = pct + '%';
                starCountEl.textContent = state.stars;
                const lvl = Math.min(3, Math.floor(done / 1) + 1);
                levelLabel.textContent = 'LVL ' + lvl;
                for (let i = 0; i < 4; i++) {
                    const container = document.getElementById('stars-' + i);
                    if (container) {
                        const filled = state.starCounts[i] || 0;
                        container.innerHTML = '';
                        for (let s = 0; s < 3; s++) {
                            const span = document.createElement('span');
                            span.textContent = s < filled ? '⭐' : '☆';
                            if (s < filled) span.style.color = '#f7d44a';
                            container.appendChild(span);
                        }
                    }
                    const card = grid.querySelector(`[data-level="${i}"]`);
                    if (card) {
                        if (state.completed[i]) {
                            card.classList.add('completed');
                        } else {
                            card.classList.remove('completed');
                        }
                    }
                }
            }

            // ─── CELEBRATION ───
            function showCelebration(starsEarned = 1) {
                const el = celebration;
                const starReward = el.querySelector('.star-reward');
                starReward.textContent = '⭐ +' + starsEarned;
                el.classList.add('show');
                charState = 'happy';
                SoundManager.play('success');
                say('🎉 Amazing! You mastered that method!', '');
                setTimeout(() => {
                    el.classList.remove('show');
                    charState = 'idle';
                    say('👏 Ready for the next challenge?', '');
                }, 2800);
            }

            // ─── COMPLETE LEVEL ───
            function completeLevel(idx, starsEarned = 1) {
                if (state.completed[idx]) return;
                state.completed[idx] = true;
                state.starCounts[idx] = Math.min(3, starsEarned);
                state.stars += starsEarned;
                updateUI();
                showCelebration(starsEarned);
            }

            // ─── NAVIGATION ───
            function openLevel(idx) {
                SoundManager.play('click');
                state.currentLevel = idx;
                state.gameActive = true;
                grid.style.display = 'none';
                gameContainer.classList.add('active');
                gameTitle.textContent = levelIcons[idx] + ' ' + levelNames[idx];
                renderGame(idx);
                charState = 'idle';
                say('🧪 Let\'s explore ' + levelNames[idx] + '! Follow the steps.', '');
            }

            function closeGame() {
                SoundManager.play('click');
                state.gameActive = false;
                state.currentLevel = -1;
                gameContainer.classList.remove('active');
                grid.style.display = 'grid';
                charState = 'idle';
                say('👋 Tap a <span class="highlight">separation method</span> to learn it!', 'separation method');
                updateUI();
            }

            // ─── RENDER GAME ───
            function renderGame(idx) {
                const area = gameArea;
                area.innerHTML = '';
                celebration.classList.remove('show');
                switch (idx) {
                    case 0:
                        renderFiltration(area);
                        break;
                    case 1:
                        renderMagnetic(area);
                        break;
                    case 2:
                        renderDistillation(area);
                        break;
                    case 3:
                        renderChromatography(area);
                        break;
                    default:
                        area.innerHTML = '<div style="color:rgba(200,180,255,0.3);padding:40px;">Coming soon!</div>';
                }
            }

            // ─── GAME: FILTRATION ───
            function renderFiltration(area) {
                const s = state.filtration;
                s.done = false;
                s.filterPlaced = false;
                s.poured = false;

                area.innerHTML = `
                    <div class="filtration-game">
                        <div class="apparatus">
                            <div class="app-part">
                                <div class="label">mixture</div>
                                <div class="beaker" id="beaker">
                                    <div class="liquid" id="beakerLiquid" style="height:65%;">
                                        <div class="particles"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="app-part">
                                <div class="label">funnel</div>
                                <div class="funnel" id="funnel">
                                    <div class="filter-paper" id="filterPaper">📄</div>
                                </div>
                            </div>
                            <div class="app-part">
                                <div class="label">filtrate</div>
                                <div class="flask" id="flask">
                                    <div class="filtrate" id="filtrate"></div>
                                </div>
                            </div>
                        </div>
                        <div class="actions">
                            <button id="placeFilter">📄 Place Filter Paper</button>
                            <button id="pourBtn" disabled>💧 Pour Mixture</button>
                            <button id="resetFilt" style="opacity:0.5;">↺ Reset</button>
                        </div>
                        <div class="status" id="filtStatus">Step 1: Place the filter paper in the funnel.</div>
                    </div>
                `;

                const placeBtn = document.getElementById('placeFilter');
                const pourBtn = document.getElementById('pourBtn');
                const resetBtn = document.getElementById('resetFilt');
                const status = document.getElementById('filtStatus');
                const filterPaper = document.getElementById('filterPaper');
                const beakerLiquid = document.getElementById('beakerLiquid');
                const filtrate = document.getElementById('filtrate');

                placeBtn.addEventListener('click', () => {
                    if (s.filterPlaced) return;
                    SoundManager.play('pop');
                    s.filterPlaced = true;
                    filterPaper.classList.add('placed');
                    filterPaper.textContent = '📄✓';
                    status.textContent = '✅ Filter paper placed! Now pour the mixture.';
                    pourBtn.disabled = false;
                    say('🧪 Good! Now pour the mixture through the funnel.', '');
                    charState = 'happy';
                    setTimeout(() => charState = 'idle', 600);
                });

                pourBtn.addEventListener('click', () => {
                    if (s.poured || s.done) return;
                    SoundManager.play('drop');
                    s.poured = true;
                    beakerLiquid.style.height = '20%';
                    status.textContent = '⏳ Filtering...';
                    pourBtn.disabled = true;
                    say('💧 The liquid passes through, leaving solids behind!', '');
                    setTimeout(() => {
                        filtrate.style.height = '55%';
                        status.textContent = '✅ Filtration complete! Clean liquid collected.';
                        s.done = true;
                        completeLevel(0, 1);
                        say('🎉 Filtration: solid separated from liquid!', '');
                        charState = 'happy';
                        SoundManager.play('success');
                    }, 1200);
                });

                resetBtn.addEventListener('click', () => {
                    SoundManager.play('click');
                    s.filterPlaced = false;
                    s.poured = false;
                    s.done = false;
                    filterPaper.classList.remove('placed');
                    filterPaper.textContent = '📄';
                    beakerLiquid.style.height = '65%';
                    filtrate.style.height = '0%';
                    pourBtn.disabled = true;
                    status.textContent = 'Step 1: Place the filter paper in the funnel.';
                    say('🔄 Reset. Try again!', '');
                    charState = 'idle';
                });
            }

            // ─── GAME: MAGNETIC SEPARATION ───
            function renderMagnetic(area) {
                const s = state.magnetic;
                s.collected = 0;
                s.done = false;
                const total = s.total;

                area.innerHTML = `
                    <div class="magnetic-game">
                        <div class="mix-area" id="mixArea"></div>
                        <div class="magnet" id="magnet">🧲</div>
                        <div class="collected-count">Collected: <span id="magCount">0</span> / ${total}</div>
                        <div class="mag-status" id="magStatus">Drag the magnet over the mixture to collect iron filings.</div>
                        <button id="resetMag" style="background:rgba(160,100,255,0.05);border:1px solid rgba(160,100,255,0.06);color:#b0a0d0;padding:6px 20px;border-radius:40px;font-size:0.7rem;cursor:pointer;margin-top:4px;">↺ Reset</button>
                    </div>
                `;

                const mixArea = document.getElementById('mixArea');
                const magCount = document.getElementById('magCount');
                const magStatus = document.getElementById('magStatus');
                const magnet = document.getElementById('magnet');
                const resetBtn = document.getElementById('resetMag');

                const particles = [];
                const totalP = total + 6;
                for (let i = 0; i < totalP; i++) {
                    const el = document.createElement('div');
                    const isIron = i < total;
                    el.className = 'particle ' + (isIron ? 'iron' : 'sand');
                    el.dataset.iron = isIron ? 'true' : 'false';
                    el.dataset.collected = 'false';
                    const mx = 12 + Math.random() * (mixArea.clientWidth - 30 || 140);
                    const my = 12 + Math.random() * (mixArea.clientHeight - 30 || 60);
                    el.style.position = 'absolute';
                    el.style.left = mx + 'px';
                    el.style.top = my + 'px';
                    el.style.width = (10 + Math.random() * 8) + 'px';
                    el.style.height = el.style.width;
                    mixArea.appendChild(el);
                    particles.push(el);
                }

                let isDragging = false;

                function startDrag(e) {
                    e.preventDefault();
                    isDragging = true;
                    magnet.classList.add('active');
                    charState = 'think';
                    say('🧲 Drag me over the mixture!', '');
                    SoundManager.play('click');
                }

                function moveDrag(e) {
                    if (!isDragging) return;
                    e.preventDefault();
                    const rect = mixArea.getBoundingClientRect();
                    const cx = (e.clientX || e.touches?.[0]?.clientX || 0);
                    const cy = (e.clientY || e.touches?.[0]?.clientY || 0);
                    const mx = cx - rect.left - 30;
                    const my = cy - rect.top - 14;
                    magnet.style.position = 'absolute';
                    magnet.style.left = Math.max(0, Math.min(rect.width - 60, mx)) + 'px';
                    magnet.style.top = Math.max(0, Math.min(rect.height - 28, my)) + 'px';

                    const magX = parseInt(magnet.style.left) + 30;
                    const magY = parseInt(magnet.style.top) + 14;
                    let collected = 0;
                    particles.forEach(p => {
                        if (p.dataset.iron === 'false') return;
                        if (p.dataset.collected === 'true') return;
                        const px = parseInt(p.style.left) + 7;
                        const py = parseInt(p.style.top) + 7;
                        const dist = Math.hypot(magX - px, magY - py);
                        if (dist < 30) {
                            p.dataset.collected = 'true';
                            p.classList.add('collected');
                            collected++;
                            SoundManager.play('collect');
                        }
                    });
                    if (collected > 0) {
                        s.collected += collected;
                        magCount.textContent = s.collected;
                        if (s.collected >= total) {
                            s.done = true;
                            magStatus.textContent = '✅ All iron filings collected! Magnetic separation works!';
                            completeLevel(1, 1);
                            charState = 'happy';
                            say('🧲 Magnetic separation: solids separated by magnetism!', '');
                            magnet.classList.remove('active');
                            isDragging = false;
                            SoundManager.play('success');
                        } else {
                            magStatus.textContent = '🧲 Collected ' + s.collected + ' of ' + total + ' iron filings.';
                        }
                    }
                }

                function endDrag(e) {
                    e.preventDefault();
                    isDragging = false;
                    magnet.classList.remove('active');
                    if (!s.done) {
                        charState = 'idle';
                        say('🧲 Keep dragging to collect more iron filings!', '');
                    }
                }

                magnet.addEventListener('mousedown', startDrag);
                document.addEventListener('mousemove', moveDrag);
                document.addEventListener('mouseup', endDrag);
                magnet.addEventListener('touchstart', startDrag, { passive: false });
                document.addEventListener('touchmove', moveDrag, { passive: false });
                document.addEventListener('touchend', endDrag, { passive: false });

                resetBtn.addEventListener('click', () => {
                    SoundManager.play('click');
                    s.collected = 0;
                    s.done = false;
                    magCount.textContent = '0';
                    magStatus.textContent = 'Drag the magnet over the mixture to collect iron filings.';
                    magnet.style.position = 'relative';
                    magnet.style.left = 'auto';
                    magnet.style.top = 'auto';
                    particles.forEach(p => {
                        if (p.dataset.iron === 'true') {
                            p.dataset.collected = 'false';
                            p.classList.remove('collected');
                            p.style.transform = '';
                            p.style.opacity = '1';
                        }
                    });
                    charState = 'idle';
                    say('🔄 Reset. Try collecting all the iron!', '');
                });
            }

            // ─── GAME: DISTILLATION ───
            function renderDistillation(area) {
                const s = state.distillation;
                s.done = false;
                s.heated = false;
                s.progress = 0;

                area.innerHTML = `
                    <div class="distillation-game">
                        <div class="dist-app">
                            <div class="dist-part">
                                <div class="label">mixture</div>
                                <div class="flask-heat" id="distFlask">
                                    <div class="liquid" id="distLiquid" style="height:55%;"></div>
                                    <div class="vapor" id="vapor"></div>
                                </div>
                            </div>
                            <div class="dist-part">
                                <div class="label">condenser</div>
                                <div class="condenser" id="condenser">
                                    <div class="coolant"></div>
                                    <div class="coolant"></div>
                                    <div class="coolant"></div>
                                    <div class="drip" id="drip"></div>
                                </div>
                            </div>
                            <div class="dist-part">
                                <div class="label">pure liquid</div>
                                <div class="flask-collect" id="distCollect">
                                    <div class="collect-liquid" id="collectLiquid"></div>
                                </div>
                            </div>
                        </div>
                        <button class="heat-btn" id="heatBtn">🔥 Heat</button>
                        <div class="dist-status" id="distStatus">Press "Heat" to start distillation.</div>
                        <button id="resetDist" style="background:rgba(160,100,255,0.05);border:1px solid rgba(160,100,255,0.06);color:#b0a0d0;padding:6px 20px;border-radius:40px;font-size:0.7rem;cursor:pointer;margin-top:4px;">↺ Reset</button>
                    </div>
                `;

                const heatBtn = document.getElementById('heatBtn');
                const status = document.getElementById('distStatus');
                const vapor = document.getElementById('vapor');
                const drip = document.getElementById('drip');
                const collectLiquid = document.getElementById('collectLiquid');
                const resetBtn = document.getElementById('resetDist');

                let heating = false;
                let progress = 0;

                heatBtn.addEventListener('click', () => {
                    if (s.done || heating) return;
                    SoundManager.play('click');
                    heating = true;
                    s.heated = true;
                    heatBtn.disabled = true;
                    status.textContent = '🔥 Heating... vapors rising!';
                    say('🔥 Heat causes the liquid with lower boiling point to vaporize.', '');
                    charState = 'think';

                    let interval = setInterval(() => {
                        progress += 0.04;
                        s.progress = progress;
                        if (progress >= 1) {
                            clearInterval(interval);
                            heating = false;
                            s.done = true;
                            vapor.classList.remove('active');
                            drip.classList.remove('active');
                            collectLiquid.style.height = '70%';
                            status.textContent = '✅ Distillation complete! Pure liquid collected.';
                            completeLevel(2, 1);
                            charState = 'happy';
                            say('🎉 Distillation: separates liquids by boiling point!', '');
                            SoundManager.play('success');
                            return;
                        }
                        if (progress > 0.1) {
                            vapor.classList.add('active');
                            SoundManager.play('pop');
                        }
                        if (progress > 0.4) {
                            drip.classList.add('active');
                            const h = Math.min(70, progress * 80);
                            collectLiquid.style.height = h + '%';
                            if (progress % 0.2 < 0.02) SoundManager.play('drop');
                        }
                        if (progress > 0.6) {
                            status.textContent = '💧 Condensing... collecting pure liquid.';
                        }
                    }, 180);
                });

                resetBtn.addEventListener('click', () => {
                    SoundManager.play('click');
                    s.done = false;
                    s.heated = false;
                    s.progress = 0;
                    heating = false;
                    progress = 0;
                    heatBtn.disabled = false;
                    vapor.classList.remove('active');
                    drip.classList.remove('active');
                    collectLiquid.style.height = '0%';
                    status.textContent = 'Press "Heat" to start distillation.';
                    charState = 'idle';
                    say('🔄 Reset. Try distilling the mixture!', '');
                });
            }

            // ─── GAME: CHROMATOGRAPHY ───
            function renderChromatography(area) {
                const s = state.chromatography;
                s.done = false;
                s.spotted = false;
                s.developed = false;

                area.innerHTML = `
                    <div class="chromatography-game">
                        <div class="chrom-paper" id="chromPaper">
                            <div class="spot" id="chromSpot"></div>
                            <div class="color-band band1" id="band1"></div>
                            <div class="color-band band2" id="band2"></div>
                            <div class="color-band band3" id="band3"></div>
                        </div>
                        <div class="chrom-actions">
                            <button id="spotBtn">💧 Apply Sample</button>
                            <button id="developBtn" disabled>🌊 Develop</button>
                            <button id="resetChrom" style="opacity:0.5;">↺ Reset</button>
                        </div>
                        <div class="chrom-status" id="chromStatus">Step 1: Apply a sample to the paper.</div>
                    </div>
                `;

                const spotBtn = document.getElementById('spotBtn');
                const developBtn = document.getElementById('developBtn');
                const resetBtn = document.getElementById('resetChrom');
                const status = document.getElementById('chromStatus');
                const spot = document.getElementById('chromSpot');
                const band1 = document.getElementById('band1');
                const band2 = document.getElementById('band2');
                const band3 = document.getElementById('band3');

                spotBtn.addEventListener('click', () => {
                    if (s.spotted) return;
                    SoundManager.play('pop');
                    s.spotted = true;
                    spot.classList.add('placed');
                    status.textContent = '✅ Sample applied! Now develop the chromatogram.';
                    developBtn.disabled = false;
                    say('🧪 The sample is on the paper. Now we add solvent.', '');
                    charState = 'happy';
                    setTimeout(() => charState = 'idle', 500);
                });

                developBtn.addEventListener('click', () => {
                    if (s.developed || s.done) return;
                    SoundManager.play('click');
                    s.developed = true;
                    developBtn.disabled = true;
                    spotBtn.disabled = true;
                    status.textContent = '🌊 Solvent rising... colors separating!';
                    say('🎨 Different compounds move at different speeds, separating into bands.', '');

                    setTimeout(() => {
                        band1.classList.add('show');
                        status.textContent = '🌈 A band appears!';
                        SoundManager.play('collect');
                    }, 400);
                    setTimeout(() => {
                        band2.classList.add('show');
                        status.textContent = '🌈 Second band!';
                        SoundManager.play('collect');
                    }, 800);
                    setTimeout(() => {
                        band3.classList.add('show');
                        status.textContent = '✅ Chromatography complete! Components separated by color.';
                        s.done = true;
                        completeLevel(3, 1);
                        charState = 'happy';
                        say('🎉 Chromatography: separates mixtures by attraction to the paper!', '');
                        SoundManager.play('success');
                    }, 1200);
                });

                resetBtn.addEventListener('click', () => {
                    SoundManager.play('click');
                    s.spotted = false;
                    s.developed = false;
                    s.done = false;
                    spot.classList.remove('placed');
                    band1.classList.remove('show');
                    band2.classList.remove('show');
                    band3.classList.remove('show');
                    developBtn.disabled = true;
                    spotBtn.disabled = false;
                    status.textContent = 'Step 1: Apply a sample to the paper.';
                    charState = 'idle';
                    say('🔄 Reset. Try chromatography!', '');
                });
            }

            // ─── EVENT BINDING ───
            grid.addEventListener('click', (e) => {
                const card = e.target.closest('.level-card');
                if (!card) return;
                const idx = parseInt(card.dataset.level);
                if (isNaN(idx)) return;
                openLevel(idx);
            });

            backBtn.addEventListener('click', closeGame);

            // ─── INIT ───
            updateUI();
            animateChar();
            say('👋 Tap a <span class="highlight">separation method</span> to learn it!', 'separation method');

            // ─── KEYBOARD SHORTCUT: ESC to close ───
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && state.gameActive) {
                    closeGame();
                }
            });

        })();
    </script>

</body>
</html>
