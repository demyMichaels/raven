<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Exam Prep — WAEC · NECO · JAMB</title>
<style>
  :root{
    --bg:#0d1418; --panel:#16212a; --panel-2:#1a2733; --panel-3:#0f1a24;
    --line:#1e2d38; --line-2:#2b4356;
    --ink:#e6f1fa; --ink-soft:#a8bccb; --ink-dim:#5d7284;
    --cyan:#4fc3ff; --green:#58cc02; --amber:#ffb347;
    --coral:#ff5a4a; --violet:#c07aff; --yellow:#ffe040;
    --pink:#ff4fa3; --orange:#ff8c40;
    --waec:#58cc02; --neco:#4fc3ff; --jamb:#ffe040;
    --red:#ff4b4b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--ink); font-weight:600;
    display:flex; justify-content:center;}
  .app{width:100%; max-width:640px; height:100vh; display:flex; flex-direction:column;
    position:relative; background:var(--bg); overflow:hidden;}

  /* ===== HEADER ===== */
  header{padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex:0 0 auto; z-index:10;}
  .logo{width:36px; height:36px; border-radius:10px;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    display:grid; place-items:center; font-size:18px; flex:0 0 auto;
    box-shadow:0 4px 12px rgba(79,195,255,.25);}
  .title-block{flex:1; min-width:0;}
  .eyebrow{font-size:9.5px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; color:var(--cyan); margin-bottom:2px;}
  h1{font-size:15px; font-weight:800; color:var(--ink); line-height:1.1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .exam-switch{display:flex; gap:4px; flex:0 0 auto;}
  .exam-switch button{
    min-width:34px; height:32px; padding:0 9px;
    background:var(--panel-2); border:1.5px solid var(--line);
    border-radius:8px; color:var(--ink-soft); font-family:inherit;
    font-size:10px; font-weight:800; letter-spacing:.6px; cursor:pointer;
    transition:.15s; text-transform:uppercase;
  }
  .exam-switch button.on[data-exam="WAEC"]{background:rgba(88,204,2,.15);
    color:var(--waec); border-color:rgba(88,204,2,.5);}
  .exam-switch button.on[data-exam="NECO"]{background:rgba(79,195,255,.15);
    color:var(--neco); border-color:rgba(79,195,255,.5);}
  .exam-switch button.on[data-exam="JAMB"]{background:rgba(255,224,64,.15);
    color:var(--jamb); border-color:rgba(255,224,64,.5);}
  .exam-switch button:not(.on){opacity:.55;}

  /* ===== MAIN ===== */
  main{flex:1; overflow-y:auto; overflow-x:hidden; padding-bottom:82px;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
    position:relative;}
  main::-webkit-scrollbar{width:6px}
  main::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
  .screen{display:none;}
  .screen.active{display:block; animation:slide .3s cubic-bezier(.4,0,.2,1);}
  @keyframes slide{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:translateY(0)}}

  .pad{padding:18px 16px;}

  /* ===== TYPOGRAPHY ===== */
  h2{font-size:20px; font-weight:800; line-height:1.2; margin-bottom:6px;}
  h3{font-size:15px; font-weight:800; line-height:1.25; margin-bottom:6px;}
  p{font-size:14px; line-height:1.55; color:var(--ink-soft); font-weight:600;}
  .section-eyebrow{font-size:10px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; color:var(--ink-dim); margin:22px 16px 10px;
    display:flex; align-items:center; gap:8px;}

  /* ===== HOME / DASHBOARD ===== */
  .hero-card{margin:16px; padding:20px; border-radius:18px;
    background:linear-gradient(135deg,#16212a 0%, #0f1a24 100%);
    border:1.5px solid var(--line-2); position:relative; overflow:hidden;}
  .hero-card::before{content:''; position:absolute; top:-60px; right:-60px;
    width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle, rgba(79,195,255,.15), transparent 70%);}
  .hero-row{display:flex; align-items:center; gap:18px; position:relative; z-index:1;}
  .readiness-ring{position:relative; flex:0 0 auto; width:100px; height:100px;}
  .readiness-ring svg{transform:rotate(-90deg); display:block;}
  .readiness-ring .ring-label{position:absolute; inset:0; display:grid;
    place-items:center; flex-direction:column; font-weight:800;}
  .readiness-ring .pct{font-size:22px; color:var(--ink); line-height:1;}
  .readiness-ring .lbl{font-size:8px; letter-spacing:1px; text-transform:uppercase;
    color:var(--ink-dim); margin-top:2px;}
  .hero-info{flex:1; min-width:0;}
  .hero-info .title{font-size:16px; font-weight:800; margin-bottom:4px; line-height:1.25;}
  .hero-info .sub{font-size:12px; color:var(--ink-soft); line-height:1.4; font-weight:600;}
  .hero-info .exam-tag{display:inline-flex; align-items:center; gap:5px;
    margin-top:8px; padding:3px 9px; border-radius:99px; font-size:10px;
    font-weight:800; letter-spacing:.7px; text-transform:uppercase;
    background:rgba(88,204,2,.15); color:var(--waec);
    border:1px solid rgba(88,204,2,.4);}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;
    margin:0 16px 8px;}
  .stat-tile{padding:14px 10px; border-radius:14px; background:var(--panel);
    border:1.5px solid var(--line); text-align:center;}
  .stat-tile .n{font-size:19px; font-weight:800; line-height:1;
    color:var(--ink);}
  .stat-tile .l{font-size:9px; font-weight:800; letter-spacing:.7px;
    text-transform:uppercase; color:var(--ink-dim); margin-top:5px;}
  .stat-tile.green .n{color:var(--green);}
  .stat-tile.amber .n{color:var(--amber);}
  .stat-tile.red .n{color:var(--coral);}

  .action-row{display:flex; gap:10px; margin:16px 16px 0;}
  .action-btn{flex:1; padding:14px 12px; border-radius:14px;
    background:var(--panel-2); border:1.5px solid var(--line);
    color:var(--ink); font-family:inherit; font-size:13px; font-weight:800;
    cursor:pointer; transition:.15s; text-align:left; display:flex;
    align-items:center; gap:10px;}
  .action-btn:hover{border-color:var(--cyan); transform:translateY(-1px);}
  .action-btn:active{transform:translateY(1px);}
  .action-btn .ico{font-size:20px; flex:0 0 auto;}
  .action-btn .ab-title{font-size:12.5px; font-weight:800; color:var(--ink);}
  .action-btn .ab-sub{font-size:10px; color:var(--ink-dim); margin-top:2px;
    font-weight:600; letter-spacing:.3px;}
  .action-btn.primary{background:linear-gradient(135deg,var(--green),#4aa802);
    border-color:var(--green); color:#fff;}
  .action-btn.primary .ab-title{color:#fff;}
  .action-btn.primary .ab-sub{color:rgba(255,255,255,.85);}
  .action-btn.primary:hover{border-color:var(--green-dark);}

  /* Continue card */
  .continue-card{margin:0 16px; padding:16px; border-radius:16px;
    background:var(--panel); border:1.5px solid var(--line-2);
    display:flex; align-items:center; gap:14px; cursor:pointer;
    transition:.15s; position:relative; overflow:hidden;}
  .continue-card:hover{border-color:var(--cyan);}
  .continue-card .cc-icon{width:48px; height:48px; border-radius:12px;
    background:linear-gradient(135deg,#12283a,#1a3a52);
    display:grid; place-items:center; font-size:22px; flex:0 0 auto;}
  .continue-card .cc-body{flex:1; min-width:0;}
  .continue-card .cc-lbl{font-size:9.5px; font-weight:800; letter-spacing:1px;
    text-transform:uppercase; color:var(--cyan); margin-bottom:3px;}
  .continue-card .cc-title{font-size:14px; font-weight:800; color:var(--ink);
    line-height:1.25; margin-bottom:3px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .continue-card .cc-sub{font-size:11px; color:var(--ink-soft); font-weight:600;}
  .continue-card .arrow{color:var(--ink-dim); font-size:20px; flex:0 0 auto;}

  /* Weak topics */
  .weak-list{display:flex; flex-direction:column; gap:8px; margin:0 16px;}
  .weak-item{padding:12px 14px; border-radius:12px; background:var(--panel);
    border:1.5px solid rgba(255,90,74,.3); display:flex; align-items:center; gap:12px;
    cursor:pointer; transition:.15s;}
  .weak-item:hover{border-color:var(--coral); transform:translateX(3px);}
  .weak-item .wi-left{flex:1; min-width:0;}
  .weak-item .wi-title{font-size:13px; font-weight:800; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .weak-item .wi-meta{font-size:10.5px; color:var(--coral); font-weight:700;
    margin-top:2px; letter-spacing:.3px;}
  .weak-item .wi-pct{font-size:14px; font-weight:800; color:var(--coral);
    font-family:ui-monospace,monospace; flex:0 0 auto;}

  /* ===== SYLLABUS ===== */
  .filter-bar{display:flex; gap:6px; padding:14px 16px 4px;
    overflow-x:auto; scrollbar-width:none; flex:0 0 auto; position:sticky;
    top:0; background:var(--bg); z-index:5; border-bottom:1px solid transparent;
    transition:border-color .2s;}
  .filter-bar.scrolled{border-color:var(--line);}
  .filter-bar::-webkit-scrollbar{display:none}
  .filter-chip{padding:6px 12px; border-radius:99px; background:var(--panel);
    border:1.5px solid var(--line); color:var(--ink-soft); font-family:inherit;
    font-size:11px; font-weight:800; letter-spacing:.5px; cursor:pointer;
    white-space:nowrap; transition:.15s; flex:0 0 auto;}
  .filter-chip:hover{border-color:var(--line-2);}
  .filter-chip.on{background:var(--panel-2); color:var(--cyan);
    border-color:var(--cyan);}
  .filter-chip .cnt{font-size:9px; opacity:.7; margin-left:3px;}

  .layer-section{padding:0 16px; margin-top:20px;}
  .layer-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .layer-pip{width:8px; height:22px; border-radius:4px; flex:0 0 auto;}
  .layer-name{font-size:12px; font-weight:800; letter-spacing:1.1px;
    text-transform:uppercase; color:var(--ink-soft); flex:1;}
  .layer-stat{font-family:ui-monospace,monospace; font-size:10px;
    color:var(--ink-dim); letter-spacing:.5px;}

  .topic-list{display:flex; flex-direction:column; gap:6px;}
  .topic-row{padding:12px 13px; border-radius:12px; background:var(--panel);
    border:1.5px solid var(--line); display:flex; align-items:center; gap:12px;
    cursor:pointer; transition:.15s;}
  .topic-row:hover{border-color:var(--line-2); transform:translateX(2px);}
  .topic-row.mastered{background:rgba(88,204,2,.06);
    border-color:rgba(88,204,2,.35);}
  .topic-row.learning{background:rgba(79,195,255,.05);
    border-color:rgba(79,195,255,.3);}

  .status-dot{width:22px; height:22px; border-radius:50%; flex:0 0 auto;
    border:2px solid var(--line-2); display:grid; place-items:center;
    font-size:11px; font-weight:800; color:var(--ink-dim); background:var(--panel-3);}
  .topic-row.mastered .status-dot{background:var(--green); border-color:var(--green);
    color:#fff;}
  .topic-row.learning .status-dot{background:var(--cyan); border-color:var(--cyan);
    color:#0d1418;}

  .topic-info{flex:1; min-width:0;}
  .topic-name{font-size:13px; font-weight:800; color:var(--ink); line-height:1.25;
    margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topic-row.mastered .topic-name{color:var(--green-light, #c8f78a);}
  .topic-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .exam-mini{font-size:8px; font-weight:800; letter-spacing:.5px;
    padding:1px 5px; border-radius:99px; border:1px solid;
    text-transform:uppercase; opacity:.9;}
  .exam-mini[data-e="WAEC"]{color:var(--waec); border-color:rgba(88,204,2,.4);}
  .exam-mini[data-e="NECO"]{color:var(--neco); border-color:rgba(79,195,255,.4);}
  .exam-mini[data-e="JAMB"]{color:var(--jamb); border-color:rgba(255,224,64,.4);}
  .topic-pre{font-size:10px; color:var(--ink-dim); font-weight:700;
    letter-spacing:.3px;}

  .topic-progress{flex:0 0 auto; display:flex; flex-direction:column;
    align-items:flex-end; gap:3px;}
  .tp-bar{width:52px; height:4px; border-radius:2px; background:var(--line);
    overflow:hidden;}
  .tp-bar-fill{height:100%; background:var(--green); border-radius:2px;
    transition:width .3s;}
  .tp-pct{font-family:ui-monospace,monospace; font-size:10px; color:var(--ink-dim);
    letter-spacing:.5px;}

  /* ===== TOPIC DETAIL ===== */
  .topic-hero{padding:20px 16px 14px;
    background:linear-gradient(180deg, var(--panel) 0%, transparent 100%);
    border-bottom:1px solid var(--line);}
  .topic-hero .th-layer{font-size:10px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; margin-bottom:6px;}
  .topic-hero h2{font-size:22px; margin-bottom:8px; padding-right:20px;}
  .topic-hero .th-exams{display:flex; gap:5px; flex-wrap:wrap;
    margin-bottom:12px;}
  .topic-hero .th-status{display:inline-flex; align-items:center; gap:6px;
    padding:5px 11px; border-radius:99px; font-size:10px; font-weight:800;
    letter-spacing:.7px; text-transform:uppercase; border:1.5px solid;
    cursor:pointer; user-select:none; font-family:inherit; background:transparent;}
  .th-status.new{color:var(--ink-dim); border-color:var(--line-2);}
  .th-status.learning{color:var(--cyan); border-color:var(--cyan);
    background:rgba(79,195,255,.08);}
  .th-status.mastered{color:var(--green); border-color:var(--green);
    background:rgba(88,204,2,.08);}
  .th-status:hover{border-color:var(--cyan);}

  .detail-block{padding:0 16px; margin-top:18px;}
  .detail-block h4{font-size:10px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; color:var(--ink-dim); margin-bottom:10px;
    display:flex; align-items:center; gap:8px;}
  .detail-block h4 .cnt{background:var(--panel-2); border:1px solid var(--line);
    padding:1px 7px; border-radius:99px; font-size:9px; color:var(--ink-soft);
    font-family:ui-monospace,monospace;}
  .desc-text{font-size:13.5px; line-height:1.6; color:var(--ink-soft);
    font-weight:600;}

  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{display:inline-flex; align-items:center; gap:6px;
    background:var(--panel-2); border:1.5px solid var(--line);
    border-radius:9px; padding:7px 11px; font-size:11.5px; font-weight:700;
    color:var(--ink); font-family:inherit; cursor:pointer; transition:.15s;
    text-align:left;}
  .chip:hover{border-color:var(--cyan); color:var(--cyan); transform:translateY(-1px);}
  .chip .cdot{width:6px; height:6px; border-radius:50%; flex:0 0 auto;}
  .chip.empty{background:transparent; border:none; color:var(--ink-dim);
    font-style:italic; cursor:default; padding:4px 0; font-weight:600; font-size:12px;}
  .chip.empty:hover{color:var(--ink-dim); transform:none;}

  .detail-list{list-style:none; display:flex; flex-direction:column; gap:6px;}
  .detail-list li{font-size:12.5px; line-height:1.5; color:var(--ink);
    display:flex; gap:9px; align-items:flex-start; font-weight:600;}
  .detail-list li::before{content:''; width:5px; height:5px; border-radius:50%;
    flex:0 0 auto; margin-top:8px; background:var(--cyan);}
  .detail-list.warn li::before{background:var(--coral);}
  .detail-list.code li{font-family:ui-monospace,'SF Mono',monospace;
    background:var(--panel-2); border:1px solid var(--line);
    padding:8px 11px; border-radius:8px; font-size:12px; color:var(--amber);
    display:block; letter-spacing:.3px;}
  .detail-list.code li::before{display:none;}

  .study-actions{display:flex; gap:10px; padding:0 16px; margin-top:22px;
    margin-bottom:20px;}
  .study-btn{flex:1; padding:14px; border-radius:14px; border:none;
    font-family:inherit; font-size:13px; font-weight:800; letter-spacing:.6px;
    text-transform:uppercase; cursor:pointer; transition:.12s;
    display:flex; align-items:center; justify-content:center; gap:8px;}
  .study-btn.primary{background:var(--green); color:#fff;
    box-shadow:0 4px 0 var(--green-dark, #3d8a00);}
  .study-btn.primary:active{transform:translateY(2px); box-shadow:0 2px 0 #3d8a00;}
  .study-btn.secondary{background:var(--panel-2); border:1.5px solid var(--line);
    color:var(--ink);}
  .study-btn.secondary:hover{border-color:var(--cyan); color:var(--cyan);}

  /* ===== PRACTICE ===== */
  .practice-top{padding:14px 16px 0; display:flex; align-items:center;
    gap:12px; position:sticky; top:0; background:var(--bg); z-index:5;}
  .practice-close{width:32px; height:32px; border-radius:50%; background:var(--panel);
    border:1.5px solid var(--line); color:var(--ink-soft); font-size:18px;
    cursor:pointer; font-family:inherit; display:grid; place-items:center;
    flex:0 0 auto;}
  .practice-close:hover{border-color:var(--coral); color:var(--coral);}
  .practice-prog{flex:1; height:10px; background:var(--panel);
    border-radius:99px; overflow:hidden;}
  .practice-prog-fill{height:100%; background:var(--green);
    transition:width .35s cubic-bezier(.4,0,.2,1);}
  .practice-counter{font-family:ui-monospace,monospace; font-size:11px;
    color:var(--ink-soft); font-weight:700; flex:0 0 auto;}

  .q-body{padding:22px 16px 100px;}
  .q-topic{font-size:10px; font-weight:800; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--cyan); margin-bottom:8px;}
  .q-prompt{font-size:17px; font-weight:800; line-height:1.35; margin-bottom:18px;
    color:var(--ink);}
  .q-options{display:flex; flex-direction:column; gap:10px;}
  .q-opt{display:flex; align-items:center; gap:13px; text-align:left;
    padding:14px 15px; background:var(--panel); border:2px solid var(--line);
    border-radius:13px; font-family:inherit; font-size:14px; font-weight:700;
    color:var(--ink); cursor:pointer; transition:.12s; width:100%;}
  .q-opt:hover:not(.locked){border-color:var(--line-2); background:var(--panel-2);}
  .q-opt .qonum{flex:0 0 26px; height:26px; border-radius:8px;
    border:2px solid var(--line-2); display:grid; place-items:center;
    font-size:12px; font-weight:800; color:var(--ink-soft);}
  .q-opt.correct{background:rgba(88,204,2,.12); border-color:var(--green);}
  .q-opt.correct .qonum{background:var(--green); border-color:var(--green);
    color:#fff;}
  .q-opt.wrong{background:rgba(255,75,75,.12); border-color:var(--red);}
  .q-opt.wrong .qonum{background:var(--red); border-color:var(--red); color:#fff;}
  .q-opt.locked{cursor:default;}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}}

  .fb-bar{position:fixed; bottom:0; left:0; right:0; max-width:640px;
    margin:0 auto; padding:16px 18px 20px; z-index:30;
    transform:translateY(140%); transition:transform .3s cubic-bezier(.4,0,.2,1);
    border-top:2px solid transparent;}
  .fb-bar.show{transform:translateY(0);}
  .fb-bar.correct{background:linear-gradient(180deg,#1a2e10,#0f1e08);
    border-color:var(--green);}
  .fb-bar.wrong{background:linear-gradient(180deg,#2e1210,#1e0806);
    border-color:var(--red);}
  .fb-head{display:flex; align-items:center; gap:10px;
    font-size:17px; font-weight:800; margin-bottom:6px;}
  .fb-head .fb-ico{width:32px; height:32px; border-radius:50%;
    display:grid; place-items:center; color:#fff; font-size:17px;
    font-weight:800; flex:0 0 auto;}
  .fb-bar.correct .fb-head{color:#c8f78a;}
  .fb-bar.correct .fb-ico{background:var(--green);}
  .fb-bar.wrong .fb-head{color:#ffb8b8;}
  .fb-bar.wrong .fb-ico{background:var(--red);}
  .fb-body{font-size:13px; line-height:1.5; color:var(--ink-soft);
    margin-bottom:12px; padding-left:42px; font-weight:600;}
  .fb-btn{width:100%; padding:14px; border:none; border-radius:13px;
    background:var(--green); color:#fff; font-family:inherit; font-size:14px;
    font-weight:800; letter-spacing:.7px; text-transform:uppercase;
    cursor:pointer; transition:.12s; box-shadow:0 4px 0 #3d8a00;}
  .fb-btn:active{transform:translateY(2px); box-shadow:0 2px 0 #3d8a00;}
  .fb-bar.wrong .fb-btn{background:var(--red); box-shadow:0 4px 0 #a02020;}
  .fb-bar.wrong .fb-btn:active{box-shadow:0 2px 0 #a02020;}

  /* Practice setup */
  .setup-wrap{padding:20px 16px 40px;}
  .mode-card{padding:16px; border-radius:14px; background:var(--panel);
    border:1.5px solid var(--line); margin-bottom:10px; cursor:pointer;
    transition:.15s; display:flex; align-items:center; gap:14px;}
  .mode-card:hover{border-color:var(--cyan); transform:translateY(-1px);}
  .mode-card .mc-ico{width:44px; height:44px; border-radius:12px;

const STORAGE_KEY = 'physics_prep_v1';
const state = {
  exam: 'WAEC',
  screen: 'home',
  currentTopic: null,
  filter: 'all',
  // progress: { [nodeId]: { status:'new'|'learning'|'mastered', correct, attempts, total } }
  progress: {},

  session: null
};

// Load persisted progress
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  if (saved.progress) state.progress = saved.progress;
  if (saved.exam) state.exam = saved.exam;
} catch(e){}

function save(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      progress: state.progress,
      exam: state.exam
    }));
  } catch(e){}
}

// ============================================================
// HELPERS
// ============================================================
function topicStatus(id){
  const p = state.progress[id];
  if (!p) return 'new';
  return p.status || 'new';
}

function topicProgressPct(id){
  const p = state.progress[id];
  if (!p) return 0;
  if (p.status === 'mastered') return 100;
  if (p.status === 'learning') return Math.min(66, Math.round((p.correct / 5) * 100));
  return 0;
}

function examNodes(exam){
  return NODES.filter(n => n.exams.includes(exam));
}

function examStats(exam){
  const list = examNodes(exam);
  let mastered = 0, learning = 0, newCount = 0;
  list.forEach(n => {
    const s = topicStatus(n.id);
    if (s === 'mastered') mastered++;
    else if (s === 'learning') learning++;
    else newCount++;
  });
  return { total: list.length, mastered, learning, new: newCount };
}

function overallReadiness(exam){
  const s = examStats(exam);
  return s.total ? Math.round((s.mastered / s.total) * 100) : 0;
}

function updateTopicProgress(nodeId, isCorrect){
  const p = state.progress[nodeId] || { status:'new', correct:0, attempts:0 };
  p.attempts++;
  if (isCorrect) p.correct++;
  if (p.status === 'new') p.status = 'learning';
  // Mastery: 3+ correct in a row OR correct >= 4
  if (p.correct >= 4 || (p.correct >= 3 && p.correct === p.attempts)) {
    p.status = 'mastered';
  }
  state.progress[nodeId] = p;
  save();
}

function weakTopics(exam, limit=3){
  const list = examNodes(exam).filter(n => {
    const p = state.progress[n.id];
    return p && p.attempts >= 2 && (p.correct / p.attempts) < 0.6;
  });
  return list.slice(0, limit);
}

function nextRecommended(exam){
  const list = examNodes(exam);
  // First: any learning-status topic
  const learning = list.find(n => topicStatus(n.id) === 'learning');
  if (learning) return learning;
  // Next: the first non-mastered topic whose prereqs are all mastered
  for (const n of list){
    if (topicStatus(n.id) === 'mastered') continue;
    const prereqsReady = n.pre.every(pid => {
      const pnode = byId[pid];
      return pnode && pnode.exams.includes(exam) ? topicStatus(pid) === 'mastered' : true;
    });
    if (prereqsReady) return n;
  }
  return null;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hide);
  t._hide = setTimeout(() => t.classList.remove('show'), 1800);
}

function renderSyllabus(main){
  const exam = state.exam;
  const nodes = examNodes(exam);
  const filters = ['all', 'new', 'learning', 'mastered'];

  let filterCounts = {
    all: nodes.length,
    new: nodes.filter(n => topicStatus(n.id) === 'new').length,
    learning: nodes.filter(n => topicStatus(n.id) === 'learning').length,
    mastered: nodes.filter(n => topicStatus(n.id) === 'mastered').length
  };

  // Group by layer
  const grouped = {};
  nodes.forEach(n => {
    if (state.filter !== 'all'){
      if (state.filter === 'new' && topicStatus(n.id) !== 'new') return;
      if (state.filter === 'learning' && topicStatus(n.id) !== 'learning') return;
      if (state.filter === 'mastered' && topicStatus(n.id) !== 'mastered') return;
    }
    if (!grouped[n.layer]) grouped[n.layer] = [];
    grouped[n.layer].push(n);
  });

  main.innerHTML = `
    <div class="filter-bar" id="filterBar">
      ${filters.map(f => `
        <button class="filter-chip ${state.filter === f ? 'on' : ''}" data-f="${f}">
          ${f === 'all' ? 'All' : f === 'new' ? 'Not started' : f === 'learning' ? 'Learning' : 'Mastered'}
          <span class="cnt">${filterCounts[f]}</span>
        </button>
      `).join('')}
    </div>
    <div id="syllabusList"></div>
  `;

  const list = document.getElementById('syllabusList');

  Object.keys(grouped).map(Number).sort((a,b) => a-b).forEach(layerId => {
    const layer = LAYERS[layerId];
    const topics = grouped[layerId];
    const masteredInLayer = topics.filter(n => topicStatus(n.id) === 'mastered').length;

    const section = document.createElement('div');
    section.className = 'layer-section';
    section.innerHTML = `
      <div class="layer-head">
        <span class="layer-pip" style="background:${layer.color}"></span>
        <span class="layer-name">${layer.name}</span>
        <span class="layer-stat">${masteredInLayer}/${topics.length}</span>
      </div>
      <div class="topic-list">
        ${topics.map(n => {
          const s = topicStatus(n.id);
          const pct = topicProgressPct(n.id);
          return `
            <div class="topic-row ${s}" data-topic="${n.id}">
              <div class="status-dot">${s === 'mastered' ? '✓' : s === 'learning' ? '·' : ''}</div>
              <div class="topic-info">
                <div class="topic-name">${n.name}</div>
                <div class="topic-meta">
                  ${n.exams.map(e => `<span class="exam-mini" data-e="${e}">${e}</span>`).join('')}
                  <span class="topic-pre">${n.pre.length} prereq${n.pre.length === 1 ? '' : 's'}</span>
                </div>
              </div>
              <div class="topic-progress">
                <div class="tp-bar">
                  <div class="tp-bar-fill" style="width:${pct}%; background:${s==='mastered'?'var(--green)':s==='learning'?'var(--cyan)':'var(--line)'}"></div>
                </div>
                <div class="tp-pct">${pct}%</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    list.appendChild(section);
  });

  // If empty
  if (!list.children.length){
    list.innerHTML = `<div style="padding:40px 16px;text-align:center;color:var(--ink-dim);font-weight:700;font-size:13px;">No topics match this filter.</div>`;
  }

  // wire
  document.querySelectorAll('#filterBar .filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      state.filter = btn.dataset.f;
      render();
    });
  });
  document.querySelectorAll('[data-topic]').forEach(el => {
    el.addEventListener('click', () => openTopic(el.dataset.topic));
  });

  // scroll shadow
  const mainEl = document.getElementById('mainScroll');
  const fb = document.getElementById('filterBar');
  mainEl.onscroll = () => {
    if (fb) fb.classList.toggle('scrolled', mainEl.scrollTop > 4);
  };
}

    list.appendChild(row);
  });
  document.getElementById('backBtn').addEventListener('click', render);
}

// ============================================================
// SESSION LOGIC
// ============================================================
function makeQuestion(nodeId){
  const node = byId[nodeId];
  const types = [];
  if (node.formulas?.length) types.push('formula');
  if (node.misc?.length) types.push('misconception');
  if (node.pre.length) types.push('prereq');
  if (NEXT[node.id]?.length) types.push('next');
  types.push('layer');

  const type = types[Math.floor(Math.random() * types.length)];
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function shuffle(arr){
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  if (type === 'formula'){
    const correct = pick(node.formulas);
    const distractors = [];
    let guard = 0;
    while (distractors.length < 3 && guard++ < 60){
      const other = pick(NODES);
      if (!other.formulas?.length || other.id === node.id) continue;
      const f = pick(other.formulas);
      if (f === correct || distractors.includes(f)) continue;
      distractors.push(f);
    }
    const opts = shuffle([correct, ...distractors]);
    return {
      nodeId: node.id,
      prompt: `Which formula belongs to "${node.name}"?`,
      options: opts,
      correct: opts.indexOf(correct),
      explain: `${correct} — the key formula for ${node.name}.`
    };
  }

  if (type === 'misconception'){
    const correct = pick(node.misc);
    const distractors = [];
    let guard = 0;
    while (distractors.length < 3 && guard++ < 60){
      const other = pick(NODES);
      if (!other.misc?.length || other.id === node.id) continue;
      const m = pick(other.misc);
      if (m === correct || distractors.includes(m)) continue;
      distractors.push(m);
    }
    const opts = shuffle([correct, ...distractors]);
    return {
      nodeId: node.id,
      prompt: `Which is a common misconception about "${node.name}"?`,
      options: opts,
      correct: opts.indexOf(correct),
      explain: `Students often wrongly believe: ${correct}.`
    };
  }

  if (type === 'prereq'){
    const correct = pick(node.pre);
    const correctNode = byId[correct];
    const distractors = [];
    let guard = 0;
    while (distractors.length < 3 && guard++ < 80){
      const other = pick(NODES);
      if (other.id === correct || other.id === node.id) continue;
      if (node.pre.includes(other.id)) continue;
      distractors.push(other.id);
    }
    const opts = shuffle([correct, ...distractors]);
    return {
      nodeId: node.id,
      prompt: `Which topic must be understood BEFORE "${node.name}"?`,
      options: opts.map(id => byId[id].name),
      correct: opts.indexOf(correct),
      explain: `${correctNode.name} is a prerequisite for ${node.name}.`
    };
  }

  if (type === 'next'){
    const correct = pick(NEXT[node.id]);
    const correctNode = byId[correct];
    const distractors = [];
    let guard = 0;
    while (distractors.length < 3 && guard++ < 80){
      const other = pick(NODES);
      if (other.id === correct || other.id === node.id) continue;
      if ((NEXT[node.id] || []).includes(other.id)) continue;
      distractors.push(other.id);
    }
    const opts = shuffle([correct, ...distractors]);
    return {
      nodeId: node.id,
      prompt: `Which topic does "${node.name}" directly unlock?`,
      options: opts.map(id => byId[id].name),
      correct: opts.indexOf(correct),
      explain: `${correctNode.name} follows from ${node.name}.`
    };
  }

  // layer
  const correct = node.layer;
  const distractors = [];
  while (distractors.length < 3){
    const l = Math.floor(Math.random() * LAYERS.length);
    if (l === correct || distractors.includes(l)) continue;
    distractors.push(l);
  }
  const opts = shuffle([correct, ...distractors]);
  return {
    nodeId: node.id,
    prompt: `Which layer does "${node.name}" belong to?`,
    options: opts.map(l => LAYERS[l].name),
    correct: opts.indexOf(correct),
    explain: `"${node.name}" belongs to Layer ${correct} · ${LAYERS[correct].name}.`
  };
}

function startSession(nodeIds, count, label){
  // build pool of unique questions
  const questions = [];
  let guard = 0;
  while (questions.length < count && guard++ < count * 8){
    const nodeId = nodeIds[Math.floor(Math.random() * nodeIds.length)];
    const q = makeQuestion(nodeId);
    if (q) questions.push(q);
  }
  state.session = {
    active: true,
    label,
    questions,
    idx: 0,
    correct: 0,
    answered: false,
    nodeIds
  };
  setScreen('practice');
}

function startQuickPractice(){
  const ids = examNodes(state.exam).map(n => n.id);
  startSession(ids, 10, 'Quick Practice');
}

function startWeakPractice(){
  const weak = weakTopics(state.exam, 6);
  const ids = weak.length ? weak.map(n => n.id) : examNodes(state.exam).map(n => n.id);
  startSession(ids, 10, 'Weak Areas');
}

function startExamSim(){
  const ids = examNodes(state.exam).map(n => n.id);
  startSession(ids, 20, `${state.exam} Exam Sim`);
}

function startTopicPractice(id){
  const node = byId[id];
  // also include prereqs for context
  const pool = [id, ...(node.pre.slice(0, 2))];
  startSession(pool, 8, node.name);
}

function startLayerPractice(layerId){
  const ids = NODES.filter(n => n.layer === layerId && n.exams.includes(state.exam)).map(n => n.id);
  if (!ids.length){ showToast('No topics in this layer for ' + state.exam); return; }
  startSession(ids, 10, LAYERS[layerId].name);
}

// ============================================================
// SESSION RENDER
// ============================================================
function renderSession(main){
  const sess = state.session;
  if (!sess || sess.idx >= sess.questions.length){
    finishSession();
    return;
  }
  const q = sess.questions[sess.idx];
  const node = byId[q.nodeId];
  const layer = LAYERS[node.layer];
  const pct = (sess.idx / sess.questions.length) * 100;

  main.innerHTML = `
    <div class="practice-top">
      <button class="practice-close" id="sessClose">×</button>
      <div class="practice-prog"><div class="practice-prog-fill" style="width:${pct}%"></div></div>
      <div class="practice-counter">${sess.idx + 1}/${sess.questions.length}</div>
    </div>
    <div class="q-body">
      <div class="q-topic" style="color:${layer.color}">${layer.name} · ${sess.label}</div>
      <div class="q-prompt">${q.prompt}</div>
      <div class="q-options" id="qOptions">
        ${q.options.map((opt, i) => `
          <button class="q-opt" data-i="${i}">
            <span class="qonum">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    </div>
    <div class="fb-bar" id="fbBar">
      <div class="fb-head">
        <div class="fb-ico" id="fbIco">✓</div>
        <div id="fbTitle">Correct!</div>
      </div>
      <div class="fb-body" id="fbBody">Well done.</div>
      <button class="fb-btn" id="fbBtn">Continue</button>
    </div>
  `;

  document.querySelectorAll('#qOptions .q-opt').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('sessClose').addEventListener('click', () => {
    if (confirm('Leave this session? Progress will be lost.')){
      state.session = null;
      setScreen('practice');
    }
  });
  document.getElementById('fbBtn').addEventListener('click', nextQuestion);
}

function handleAnswer(idx){
  const sess = state.session;
  if (sess.answered) return;
  sess.answered = true;
  const q = sess.questions[sess.idx];
  const isCorrect = idx === q.correct;

  document.querySelectorAll('#qOptions .q-opt').forEach((o, i) => {
    o.classList.add('locked');
    if (i === q.correct) o.classList.add('correct');
    if (i === idx && !isCorrect){ o.classList.add('wrong','shake');
      setTimeout(() => o.classList.remove('shake'), 450); }
  });

  if (isCorrect) sess.correct++;
  updateTopicProgress(q.nodeId, isCorrect);

  // show feedback
  const fb = document.getElementById('fbBar');
  fb.classList.add('show');
  fb.classList.remove('correct','wrong');
  fb.classList.add(isCorrect ? 'correct' : 'wrong');
  document.getElementById('fbIco').textContent = isCorrect ? '✓' : '✕';
  document.getElementById('fbTitle').textContent = isCorrect ? 'Correct!' : 'Not quite';
  document.getElementById('fbBody').innerHTML = q.explain;
  document.getElementById('fbBtn').textContent =
    sess.idx === sess.questions.length - 1 ? 'Finish' : 'Continue';
}

function nextQuestion(){
  const sess = state.session;
  if (!sess) return;
  if (sess.idx >= sess.questions.length - 1){
    finishSession();
    return;
  }
  sess.idx++;
  sess.answered = false;
  renderSession(document.getElementById('mainScroll'));
}

function finishSession(){
  const sess = state.session;
  state.session = {
    ...sess,
    active: false,
    finished: true
  };
  setScreen('results');
}

// ============================================================
// RESULTS
// ============================================================
function renderResults(main){
  const sess = state.session;
  if (!sess || !sess.finished){
    setScreen('practice');
    return;
  }
  const total = sess.questions.length;
  const correct = sess.correct;
  const pct = Math.round((correct / total) * 100);

  let emoji = '💪', title = 'Keep practicing';
  if (pct >= 90){ emoji = '🏆'; title = 'Outstanding'; }
  else if (pct >= 75){ emoji = '🎯'; title = 'Great work'; }
  else if (pct >= 50){ emoji = '📈'; title = 'Solid effort'; }

  main.innerHTML = `
    <div class="results-wrap">
      <div class="results-emoji">${emoji}</div>
      <div class="results-title">${title}</div>
      <div class="results-sub">${sess.label} · ${total} questions</div>

      <div class="results-stats">
        <div class="rstat"><div class="n">${correct}/${total}</div><div class="l">Correct</div></div>
        <div class="rstat"><div class="n">${pct}%</div><div class="l">Score</div></div>
        <div class="rstat"><div class="n">+${correct * 5}</div><div class="l">XP</div></div>
      </div>

      <div class="results-actions">
        <button class="primary" id="againBtn">Try again</button>
        <button class="secondary" id="backHomeBtn">Back to dashboard</button>
      </div>
    </div>
  `;
  launchConfetti(pct >= 75 ? 100 : 40);

  document.getElementById('againBtn').addEventListener('click', () => {
    const ids = sess.nodeIds;
    const count = total;
    state.session = null;
    startSession(ids, count, sess.label);
  });
  document.getElementById('backHomeBtn').addEventListener('click', () => {
    state.session = null;
    setScreen('home');
  });
}

// ============================================================
// PROGRESS / ANALYTICS
// ============================================================
function renderProgress(main){
  const exam = state.exam;
  const stats = examStats(exam);
  const readiness = overallReadiness(exam);
  const ringColor = exam === 'WAEC' ? '#58cc02' : exam === 'NECO' ? '#4fc3ff' : '#ffe040';

  // Layer breakdown
  const layerData = LAYERS.map(layer => {
    const nodes = NODES.filter(n => n.layer === layer.id && n.exams.includes(exam));
    const mastered = nodes.filter(n => topicStatus(n.id) === 'mastered').length;
    return { layer, total: nodes.length, mastered };
  }).filter(d => d.total > 0);

  // Accuracy across all attempts
  let totalAttempts = 0, totalCorrect = 0;
  Object.values(state.progress).forEach(p => {
    totalAttempts += p.attempts || 0;
    totalCorrect += p.correct || 0;
  });
  const overallAcc = totalAttempts ? Math.round((totalCorrect / totalAttempts) * 100) : 0;

  main.innerHTML = `
    <div class="progress-wrap">
      <h2 style="margin-bottom:16px;">Progress — ${exam}</h2>

      <div class="prog-card">
        <div class="pc-head">
          <div class="pc-title" style="color:${ringColor};">Syllabus coverage</div>
          <div class="pc-val">${readiness}%</div>
        </div>
        <div class="prog-bar">
          <div class="prog-bar-fill" style="width:${readiness}%; background:${ringColor};"></div>
        </div>
        <div class="prog-sub">${stats.mastered} mastered · ${stats.learning} learning · ${stats.new} not started</div>
      </div>

      <div class="prog-card">
        <div class="pc-head">
          <div class="pc-title">Overall accuracy</div>
          <div class="pc-val">${overallAcc}%</div>
        </div>
        <div class="prog-bar">
          <div class="prog-bar-fill" style="width:${overallAcc}%; background:${overallAcc >= 70 ? 'var(--green)' : overallAcc >= 40 ? 'var(--amber)' : 'var(--coral)'};"></div>
        </div>
        <div class="prog-sub">${totalCorrect} correct out of ${totalAttempts} attempts</div>
      </div>

      <div class="section-eyebrow" style="margin-left:0; margin-right:0;">Layer breakdown</div>
      <div class="layer-breakdown">
        ${layerData.map(d => {
          const p = d.total ? Math.round((d.mastered / d.total) * 100) : 0;
          return `
            <div class="lb-row">
              <span class="lb-pip" style="background:${d.layer.color}"></span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:12px;font-weight:800;color:var(--ink);margin-bottom:6px;">${d.layer.name}</div>
                <div class="prog-bar" style="height:5px;">
                  <div class="prog-bar-fill" style="width:${p}%;background:${d.layer.color};"></div>
                </div>
              </div>
              <span class="lb-stat">${d.mastered}/${d.total}</span>
            </div>
          `;
        }).join('')}
      </div>

      <div style="height:30px;"></div>
    </div>
  `;
}

// ============================================================
// MASTERY
// ============================================================
function renderMastery(main){
  const exam = state.exam;
  const stats = examStats(exam);
  const readiness = overallReadiness(exam);
  const allDone = stats.mastered === stats.total;

  // overall across all exams
  const allMastered = NODES.filter(n => topicStatus(n.id) === 'mastered').length;
  const allTotal = NODES.length;

  main.innerHTML = `
    <div class="mastery-wrap">
      <div class="mastery-seal">${allDone ? '🏆' : '🎯'}</div>
      <div class="mastery-title">${allDone ? 'Full Mastery' : exam + ' Progress'}</div>
      <div class="mastery-sub">
        ${allDone
          ? `You've mastered all ${stats.total} topics in the ${exam} physics syllabus.`
          : `You've mastered ${stats.mastered} of ${stats.total} ${exam} topics so far.`}
      </div>

      <div class="mastery-cert">
        <div class="cert-eyebrow">Certificate of Completion</div>
        <div class="cert-title">Physics Mastery — ${exam}</div>
        <div class="cert-sub">
          WAEC · NECO · JAMB integrated syllabus<br>
          ${allDone ? '✓ All topics mastered' : `${stats.mastered}/${stats.total} topics mastered`}
        </div>
      </div>

      <div class="mastery-stats">

        <div class="mstat"><div class="n">${readiness}%</div><div class="l">${exam} Ready</div></div>
        <div class="mstat"><div class="n">${allMastered}</div><div class="l">Across All Exams</div></div>
        <div class="mstat"><div class="n">${allTotal}</div><div class="l">Total Topics</div></div>

}

// ============================================================
// CONFETTI
// ============================================================
function launchConfetti(amount){
  amount = amount || 100;
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#58CC02','#1CB0F6','#FFC800','#CE82FF','#FF4B4B','#ffb347','#ff4fa3','#4fc3ff'];
  const parts = [];
  for (let i = 0; i < amount; i++){
    parts.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.5,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 4,
      size: 5 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.3,
      life: 0
    });
  }
  let frame = 0;
  function tick(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05;
      p.rot += p.rotV; p.life++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - p.life / 220);
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
      ctx.restore();
    });
    frame++;
    if (frame < 260) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  tick();
}
