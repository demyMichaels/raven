<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#58CC02">
<title>Chemlingo — Learn Chemistry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8; --green-t:#58A700;
    --blue:#1CB0F6;  --blue-d:#1899D6;  --blue-l:#DDF4FF;
    --red:#FF4B4B;   --red-d:#EA2B2B;   --red-l:#FFDFE0;
    --yellow:#FFC800;--yellow-d:#E5A000;--yellow-l:#FFF4CC;
    --purple:#CE82FF;--purple-d:#A568CC;--purple-l:#F3E0FF;
    --text:#3C3C3C;  --text-2:#777777;  --gray:#AFAFAF;
    --border:#E5E5E5;--border-2:#D8D8D8;
    --bg:#FFFFFF;    --bg-2:#F7F7F7;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --topbar-h: 54px;
    --tabbar-h: 64px;
    --maxw: 480px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); font-weight:700;
    -webkit-font-smoothing:antialiased;
    -webkit-touch-callout:none;
    user-select:none;
  }
  button{font-family:inherit;touch-action:manipulation}
  input,textarea{-webkit-user-select:text;user-select:text}

  /* ============ APP SHELL ============ */
  #app{
    width:100%; height:100dvh; min-height:100vh;
    display:flex; flex-direction:column;
    background:var(--bg);
    padding-left:var(--safe-l); padding-right:var(--safe-r);
    position:relative;
    max-width:var(--maxw);
    margin:0 auto;
  }
  @media (min-width:540px){
    body{background:#e9edf1}
    #app{
      box-shadow:0 0 60px rgba(15,30,50,.10);
      border-left:1px solid rgba(0,0,0,.04);
      border-right:1px solid rgba(0,0,0,.04);
    }
  }

  /* ============ TOP BAR ============ */
  .topbar{
    flex:0 0 auto;
    height:calc(var(--topbar-h) + var(--safe-t));
    padding:var(--safe-t) 16px 0;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg);
    border-bottom:2px solid var(--border);
    z-index:20;
    transition:transform .25s, opacity .2s;
  }
  .topbar.hidden{display:none}
  .tb-group{display:flex; align-items:center; gap:14px}
  .tb-stat{
    display:flex; align-items:center; gap:5px;
    font-size:16px; font-weight:900; color:var(--text);
    padding:6px 2px;
  }
  .tb-stat .ico{font-size:20px; line-height:1}
  .tb-stat.hearts{color:var(--red)}
  .tb-stat.xp{color:var(--blue)}
  .tb-stat.streak{color:#FF9600}

  /* ============ SCREEN ROOT ============ */
  #screenRoot{
    flex:1 1 auto;
    position:relative;
    overflow:hidden;
    min-height:0;
  }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    min-height:0;
    background:var(--bg);
  }
  .screen.hidden{display:none}
  .scroll{
    flex:1 1 auto;
    overflow-y:auto;
    overflow-x:hidden;
    min-height:0;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}
  .scroll-pad{
    padding:12px 16px calc(24px + var(--safe-b));
    max-width:520px;
    margin:0 auto;
  }

  /* ============ PATH ============ */
  .hero{
    background:linear-gradient(135deg,#58CC02 0%,#4CB302 100%);
    border-radius:20px;
    padding:18px 20px;
    color:#fff;
    margin-bottom:16px;
    box-shadow:0 4px 0 var(--green-d);
    position:relative; overflow:hidden;
  }
  .hero::after{
    content:'⚗️'; position:absolute; right:-14px; bottom:-20px;
    font-size:110px; opacity:.15; pointer-events:none;
  }
  .hero h1{
    font-size:22px; font-weight:900; letter-spacing:-.4px;
    line-height:1.15; margin-bottom:4px; position:relative; z-index:2;
  }
  .hero p{
    font-size:13px; font-weight:700; opacity:.92; line-height:1.4;
    position:relative; z-index:2; max-width:85%;
  }
  .hero-stats{
    display:flex; gap:10px; margin-top:14px; position:relative; z-index:2;
  }
  .hero-stat{
    background:rgba(255,255,255,.22);
    border-radius:10px;
    padding:6px 12px;
    font-size:12px; font-weight:900; letter-spacing:.3px;
  }

  .unit{margin-bottom:22px}
  .unit-head{
    border-radius:16px;
    padding:13px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    color:#fff; margin-bottom:10px;
    position:relative; overflow:hidden;
    box-shadow:0 4px 0 rgba(0,0,0,.14);
  }
  .unit-head::after{
    content:''; position:absolute; inset:0;
    background:rgba(255,255,255,.08);
    clip-path:polygon(0 100%,100% 0,100% 100%);
    pointer-events:none;
  }
  .uh-left{min-width:0; position:relative; z-index:2}
  .uh-eyebrow{
    font-size:10px; font-weight:900; letter-spacing:1.6px;
    text-transform:uppercase; opacity:.85;
  }
  .uh-title{
    font-size:15px; font-weight:900; letter-spacing:-.2px;
    line-height:1.2; margin-top:2px;
  }
  .uh-prog{
    font-size:11px; font-weight:800; opacity:.88; margin-top:3px;
  }
  .uh-badge{
    flex:0 0 auto;
    background:rgba(255,255,255,.28);
    border-radius:10px;
    padding:6px 11px;
    font-size:11px; font-weight:900; letter-spacing:.5px;
    position:relative; z-index:2;
  }
  .uh-badge.done{background:rgba(255,255,255,.92); color:var(--green-t)}

  .nodes{
    padding:18px 0 4px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .node-row{
    display:flex; justify-content:center; width:100%;
    transition:transform .3s;
  }
  .lnode-wrap{
    position:relative; display:flex; flex-direction:column; align-items:center;
  }

  .lnode{
    width:72px; height:72px; border-radius:50%; border:none;
    cursor:pointer; display:grid; place-items:center;
    font-size:28px; position:relative;
    background:var(--border);
    box-shadow:0 6px 0 #CFCFCF;
    transition:transform .08s, box-shadow .08s;
    touch-action:manipulation;
  }
  .lnode:active:not(.locked){transform:translateY(4px); box-shadow:0 2px 0 #CFCFCF}
  .lnode.done,.lnode.avail,.lnode.current{
    background:var(--green); box-shadow:0 6px 0 var(--green-d); color:#fff;
  }
  .lnode.done:active,.lnode.avail:active{transform:translateY(4px); box-shadow:0 2px 0 var(--green-d)}
  .lnode.current{animation:bob 1.9s ease-in-out infinite}
  .lnode.locked{
    background:#E9E9E9; box-shadow:0 6px 0 #D4D4D4; color:#B7B7B7;
    cursor:not-allowed;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  .lnode .crown{
    position:absolute; top:-12px; right:-8px; font-size:20px;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.22));
  }
  .lnode .pulse{
    position:absolute; inset:-8px; border-radius:50%;
    border:3px solid var(--green); opacity:0; pointer-events:none;
  }
  .lnode.current .pulse{animation:pulseRing 2.1s ease-out infinite}
  @keyframes pulseRing{0%{opacity:.65; transform:scale(.86)}100%{opacity:0; transform:scale(1.28)}}

  .start-bubble{
    position:absolute; top:-38px; left:50%; transform:translateX(-50%);
    background:#fff; border:2.5px solid var(--border);
    border-radius:12px; padding:5px 12px;
    font-size:10px; font-weight:900; letter-spacing:1.2px;
    color:var(--green); white-space:nowrap;
    box-shadow:0 3px 0 var(--border);
    animation:bob 1.9s ease-in-out infinite;
  }
  .start-bubble::after{
    content:''; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:7px solid transparent; border-right:7px solid transparent;
    border-top:7px solid var(--border);
  }
  .lnode-label{
    font-size:11.5px; font-weight:800; color:var(--text-2);
    margin-top:9px; max-width:130px; text-align:center; line-height:1.25;
  }
  .lnode.current + .lnode-label{color:var(--green-t)}
  .lnode.locked + .lnode-label{color:var(--gray)}

  /* ============ LESSON ============ */
  #lessonScreen{background:#fff}
  .lesson-head{
    flex:0 0 auto;
    padding:calc(var(--safe-t) + 12px) 14px 12px;
    display:flex; align-items:center; gap:12px;
    background:#fff;
    border-bottom:2px solid var(--border);
    z-index:10;
  }
  .lesson-x{
    width:40px; height:40px; border-radius:12px;
    border:none; background:transparent;
    color:var(--gray); font-size:22px; font-weight:900;
    cursor:pointer; display:grid; place-items:center;
    flex:0 0 auto;
    transition:background .15s, color .15s;
  }
  .lesson-x:active{background:var(--bg-2); color:var(--text)}
  .lesson-progress{
    flex:1 1 auto;
    height:16px;
    background:var(--border);
    border-radius:99px;
    overflow:hidden;
    position:relative;
  }
  .lesson-progress-fill{
    height:100%; width:0%;
    background:var(--green);
    border-radius:99px;
    transition:width .5s cubic-bezier(.4,0,.2,1);
    position:relative;
  }
  .lesson-progress-fill::after{
    content:''; position:absolute;
    top:3px; left:8px; right:8px; height:4px;
    background:rgba(255,255,255,.4); border-radius:99px;
  }
  .lesson-hearts{
    flex:0 0 auto;
    font-size:15px; letter-spacing:1px;
    padding-left:2px;
    min-width:64px; text-align:right;
  }

  .lesson-main{
    flex:1 1 auto;
    overflow-y:auto;
    min-height:0;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
    padding:20px 18px 24px;
    scrollbar-width:none;
  }
  .lesson-main::-webkit-scrollbar{display:none}
  .lesson-inner{max-width:520px; margin:0 auto}

  .tag{
    display:inline-block;
    font-size:10px; font-weight:900; letter-spacing:1.6px;
    text-transform:uppercase; padding:5px 11px; border-radius:99px;
    margin-bottom:14px;
  }
  .tag.guide{background:var(--blue-l); color:var(--blue-d)}
  .tag.quiz{background:var(--purple-l); color:var(--purple-d)}

  .guide h2{
    font-size:24px; font-weight:900; line-height:1.2;
    letter-spacing:-.4px; margin-bottom:14px;
  }
  .guide-desc{
    font-size:15px; line-height:1.6; color:var(--text); font-weight:600;
    background:var(--bg-2);
    border-left:5px solid var(--blue);
    border-radius:0 12px 12px 0;
    padding:14px 16px; margin-bottom:18px;
  }
  .gblock{margin-bottom:18px}
  .gblock-title{
    font-size:11px; font-weight:900; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--text-2);
    margin-bottom:9px;
    display:flex; align-items:center; gap:7px;
  }
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    background:#fff;
    border:2px solid var(--border);
    border-bottom-width:4px;
    border-radius:12px;
    padding:9px 13px;
    font-size:13px; font-weight:800;
    font-family:ui-monospace,'SF Mono',Menlo,monospace;
    color:var(--text);
    word-break:break-word;
  }
  .warn-box{
    background:var(--red-l);
    border:2px solid #FFC1C1;
    border-radius:14px;
    padding:14px 16px;
  }
  .warn-box .gblock-title{color:var(--red-d); margin-bottom:10px}
  .warn-list{list-style:none; display:flex; flex-direction:column; gap:9px}
  .warn-list li{
    font-size:13.5px; font-weight:700; color:#B32424;
    display:flex; gap:9px; align-items:flex-start; line-height:1.45;
  }
  .warn-list li::before{
    content:'✕'; font-weight:900; font-size:13px;
    flex:0 0 auto; margin-top:1px;
  }

  .qtext{
    font-size:20px; font-weight:900; line-height:1.35;
    letter-spacing:-.3px; margin-bottom:20px;
  }
  .options{display:flex; flex-direction:column; gap:11px}
  .opt{
    display:flex; align-items:center; gap:13px;
    width:100%; text-align:left;
    background:#fff;
    border:2px solid var(--border);
    border-bottom-width:4px;
    border-radius:14px;
    padding:15px 16px;
    cursor:pointer;
    transition:transform .08s, box-shadow .08s, background .15s, border-color .15s;
    font-family:inherit;
    font-size:15px; font-weight:700; color:var(--text);
    min-height:58px;
  }
  .opt:active:not(:disabled){
    transform:translateY(2px); border-bottom-width:2px;
  }
  .opt .key{
    flex:0 0 auto;
    width:28px; height:28px; border-radius:8px;
    background:var(--bg-2);
    border:2px solid var(--border);
    display:grid; place-items:center;
    font-size:11px; font-weight:900; color:var(--text-2);
  }
  .opt .label{flex:1; line-height:1.35}
  .opt.picked{border-color:var(--blue); background:var(--blue-l); color:var(--blue-d)}
  .opt.picked .key{background:var(--blue); border-color:var(--blue); color:#fff}
  .opt.correct{border-color:var(--green); background:var(--green-l); color:var(--green-t)}
  .opt.correct .key{background:var(--green); border-color:var(--green); color:#fff}
  .opt.wrong{border-color:var(--red); background:var(--red-l); color:var(--red-d)}
  .opt.wrong .key{background:var(--red); border-color:var(--red); color:#fff}
  .opt:disabled{cursor:default}

  /* Lesson foot — sticky action bar */
  .lesson-foot{
    flex:0 0 auto;
    background:#fff;
    border-top:2px solid var(--border);
    padding:14px 18px calc(14px + var(--safe-b));
    transition:background .2s;
  }
  .lesson-foot.ok{background:var(--green-l); border-top-color:#B6ED8A}
  .lesson-foot.no{background:var(--red-l); border-top-color:#FFBDBD}
  .foot-inner{max-width:520px; margin:0 auto}

  /* Feedback layout (mobile) */
  .fb-bar{display:flex; flex-direction:column; gap:12px}
  .fb-row{display:flex; align-items:center; gap:12px}
  .fb-ico{
    flex:0 0 auto;
    width:40px; height:40px; border-radius:50%;
    display:grid; place-items:center;
    font-size:22px; font-weight:900; color:#fff;
  }
  .fb-ico.ok{background:var(--green)}
  .fb-ico.no{background:var(--red)}
  .fb-title{
    font-size:18px; font-weight:900; letter-spacing:-.2px; line-height:1.2;
  }
  .fb-title.ok{color:var(--green-t)}
  .fb-title.no{color:var(--red-d)}
  .fb-text{
    font-size:13.5px; font-weight:700; color:var(--text);
    line-height:1.45;
    padding-left:52px;
    margin-top:-6px;
  }

  /* ============ BUTTONS ============ */
  .btn{
    border:none;
    border-radius:16px;
    padding:15px 24px;
    cursor:pointer;
    font-family:inherit;
    font-size:15px; font-weight:900; letter-spacing:1px;
    text-transform:uppercase;
    color:#fff;
    background:var(--green);
    box-shadow:0 4px 0 var(--green-d);
    transition:transform .08s, box-shadow .08s;
    white-space:nowrap;
    touch-action:manipulation;
    min-height:52px;
    display:inline-flex; align-items:center; justify-content:center;
    gap:8px;
  }
  .btn:active:not(:disabled){
    transform:translateY(4px);
    box-shadow:0 0 0 var(--green-d);
  }
  .btn:disabled{
    background:var(--border); color:var(--gray);
    box-shadow:0 4px 0 #CFCFCF; cursor:not-allowed;
  }
  .btn.full{width:100%}
  .btn.red{background:var(--red); box-shadow:0 4px 0 var(--red-d)}
  .btn.red:active{box-shadow:0 0 0 var(--red-d)}
  .btn.ghost{
    background:#fff; color:var(--text-2);
    box-shadow:0 4px 0 var(--border);
    border:2px solid var(--border);
  }
  .btn.ghost:active{box-shadow:0 0 0 var(--border)}

  /* ============ DONE SCREEN ============ */
  #doneScreen{
    background:linear-gradient(170deg,#58CC02 0%,#4CB302 55%,#3E9600 100%);
    align-items:center; justify-content:center;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:24px 20px calc(24px + var(--safe-b));
  }
  .done-inner{
    max-width:420px; width:100%;
    text-align:center;
    margin:auto;
    animation:pop .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{0%{transform:scale(.85); opacity:0}100%{transform:scale(1); opacity:1}}
  .trophy{
    font-size:80px; margin-bottom:8px;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.25));
    animation:bob 2s ease-in-out infinite;
  }
  .done-title{
    font-size:29px; font-weight:900; color:#fff;
    letter-spacing:-.6px; margin-bottom:6px;
  }
  .done-sub{
    font-size:15px; font-weight:700;
    color:rgba(255,255,255,.92); margin-bottom:24px;
  }
  .done-stats{display:flex; gap:10px; margin-bottom:22px}
  .done-stat{
    flex:1;
    background:rgba(255,255,255,.18);
    border:2px solid rgba(255,255,255,.3);
    border-radius:16px;
    padding:14px 8px;
  }
  .done-stat .ds-v{
    font-size:22px; font-weight:900; color:#FFD84D; line-height:1.1;
  }
  .done-stat .ds-l{
    font-size:10px; font-weight:900; letter-spacing:1.2px;
    text-transform:uppercase; color:rgba(255,255,255,.88);
    margin-top:4px;
  }
  .done-card{
    background:#fff; border-radius:20px; padding:16px;
    margin-bottom:20px;
    box-shadow:0 6px 0 rgba(0,0,0,.16);
    text-align:left;
  }
  .done-card .dc-t{
    font-size:11px; font-weight:900; letter-spacing:1.4px;
    text-transform:uppercase; color:var(--gray);
    margin-bottom:8px;
  }
  .done-card .dc-q{
    font-size:14px; font-weight:800; color:var(--text);
    line-height:1.5;
  }
  .done-card .dc-a{
    margin-top:10px; font-size:13.5px; font-weight:800;
    color:var(--green-t);
    line-height:1.4;
  }

  /* ============ STATS SCREEN ============ */
  .stats-hero{
    background:linear-gradient(135deg,#1CB0F6,#1899D6);
    border-radius:20px;
    padding:18px 20px; color:#fff;
    margin-bottom:16px;
    box-shadow:0 4px 0 var(--blue-d);
  }
  .stats-hero h2{
    font-size:18px; font-weight:900; letter-spacing:-.3px;
    margin-bottom:14px;
  }
  .stats-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
  }
  .stat-card{
    background:rgba(255,255,255,.2);
    border-radius:12px;
    padding:12px;
  }
  .stat-card .sv{
    font-size:22px; font-weight:900; line-height:1.1;
  }
  .stat-card .sl{
    font-size:10px; font-weight:900; letter-spacing:1.2px;
    text-transform:uppercase; opacity:.85; margin-top:4px;
  }

  .stat-section-title{
    font-size:11px; font-weight:900; letter-spacing:1.4px;
    text-transform:uppercase; color:var(--text-2);
    margin:20px 4px 10px;
  }
  .stat-row{
    background:#fff;
    border:2px solid var(--border);
    border-bottom-width:4px;
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:8px;
    display:flex; align-items:center; gap:12px;
  }
  .stat-dot{
    width:10px; height:10px; border-radius:3px; flex:0 0 auto;
  }
  .stat-info{flex:1; min-width:0}
  .stat-name{
    font-size:13px; font-weight:800; color:var(--text);
    line-height:1.2; margin-bottom:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .stat-bar{
    height:8px; background:var(--border); border-radius:99px;
    overflow:hidden; position:relative;
  }
  .stat-bar-fill{
    height:100%; background:var(--green); border-radius:99px;
    transition:width .4s;
  }
  .stat-count{
    font-size:11px; font-weight:900; color:var(--text-2);
    font-family:ui-monospace,monospace;
    flex:0 0 auto;
  }
  .stat-count.done{color:var(--green-t)}

  /* ============ BOTTOM TAB BAR ============ */
  .tabbar{
    flex:0 0 auto;
    height:calc(var(--tabbar-h) + var(--safe-b));
    padding-bottom:var(--safe-b);
    background:#fff;
    border-top:2px solid var(--border);
    display:flex;
    z-index:20;
  }
  .tabbar.hidden{display:none}
  .tab{
    flex:1;
    background:transparent;
    border:none;
    cursor:pointer;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:3px;
    color:var(--gray);
    padding:8px 4px;
    transition:color .15s, background .15s;
    position:relative;
    font-family:inherit;
    touch-action:manipulation;
  }
  .tab .ti{font-size:24px; line-height:1; transition:transform .15s}
  .tab .tl{
    font-size:10px; font-weight:900; letter-spacing:.6px;
    text-transform:uppercase;
  }
  .tab.active{color:var(--green)}
  .tab.active .ti{transform:translateY(-1px)}
  .tab:active{background:var(--bg-2)}
  .tab.active::before{
    content:'';
    position:absolute; top:0; left:20%; right:20%;
    height:3px; background:var(--green);
    border-radius:0 0 3px 3px;
  }

  /* ============ MODAL / BOTTOM SHEET ============ */
  .modal-bg{
    position:absolute; inset:0;
    background:rgba(0,0,0,.5);
    z-index:80;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    animation:fade .2s;
    padding:0;
  }
  @media (min-width:540px){ .modal-bg{align-items:center; padding:24px} }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff;
    width:100%; max-width:440px;
    border-radius:24px 24px 0 0;
    padding:22px 22px calc(22px + var(--safe-b));
    text-align:center;
    animation:slideUp .3s cubic-bezier(.2,1,.3,1);
  }
  @media (min-width:540px){
    .modal{border-radius:24px; padding-bottom:22px}
    @keyframes slideUp{
      0%{transform:scale(.94); opacity:0}
      100%{transform:scale(1); opacity:1}
    }
  }
  @keyframes slideUp{
    0%{transform:translateY(20px); opacity:0}
    100%{transform:translateY(0); opacity:1}
  }
  .modal .grabber{
    width:36px; height:4px; border-radius:99px;
    background:var(--border-2);
    margin:0 auto 14px;
  }
  @media (min-width:540px){ .modal .grabber{display:none} }
  .modal .m-ico{font-size:56px; margin-bottom:10px; line-height:1}
  .modal h3{
    font-size:22px; font-weight:900; letter-spacing:-.3px;
    margin-bottom:8px;
  }
  .modal p{
    font-size:14.5px; font-weight:600; color:var(--text-2);
    line-height:1.5; margin-bottom:20px;
  }
  .modal .m-row{display:flex; flex-direction:column; gap:10px}

  /* ============ TOAST ============ */
  .toast{
    position:absolute; top:calc(var(--safe-t) + var(--topbar-h) + 10px);
    left:50%;
    transform:translateX(-50%) translateY(-14px);
    background:var(--text); color:#fff;
    font-size:13px; font-weight:800;
    padding:11px 20px;
    border-radius:99px;
    z-index:90;
    opacity:0;
    transition:.25s;
    pointer-events:none;
    white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    max-width:90vw;
    overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* ============ RESPONSIVE TWEAKS ============ */
  @media (max-width:370px){
    .qtext{font-size:18px}
    .guide h2{font-size:21px}
    .hero h1{font-size:20px}
    .uh-title{font-size:14px}
    .lnode{width:66px; height:66px; font-size:25px}
    .btn{padding:14px 18px; font-size:14px}
    .opt{padding:13px 14px; font-size:14.5px}
    .hero{padding:16px}
    .guide-desc{font-size:14.5px}
    .fb-text{padding-left:0}
  }

  @media (min-width:600px){
    .qtext{font-size:22px}
    .guide h2{font-size:26px}
  }
</style>

['measurement','Measurement',0,['scientific-method'],'Mass, volume, temperature, pressure and time — the quantities measured in the chemistry lab.','mass (kg)|volume (dm3)|temperature (K)','All measurements are exact|Same instrument gives same reading',['Which quantity is measured in kelvin (K)?',['Temperature','Mass','Volume','Pressure'],0,'Kelvin is the SI base unit of thermodynamic temperature.']],

['sigfig-standard','Sig Figs & Standard Form',0,['measurement'],'How many digits actually matter, and how to write very small or large numbers as a x 10^n.','0.0025 has 2 s.f.|6.02 x 10^23','Trailing zeros never count|All digits are significant',['How many significant figures are in 0.00250?',['3','2','4','5'],0,'The leading zeros are not significant, but the trailing zero after 5 is: 2, 5, 0 gives 3 s.f.']],

['elements-compounds','Elements, Compounds & Mixtures',1,['concepts-matter'],'Elements have one type of atom; compounds are chemically combined; mixtures are physically combined.','Element: O, H, C|Compound: H2O','Compounds separate easily|Mixtures have fixed composition',['Which of these is a compound?',['H2O','O2','Fe','Air'],0,'Water is a compound — two elements chemically combined in a fixed ratio.']],
['phys-chem-changes','Physical & Chemical Changes',1,['elements-compounds'],'Physical changes are reversible and form no new substance; chemical changes create new substances.','Physical: melting|Chemical: burning','Boiling is a chemical change|Burning is a physical change',['Which of these is a chemical change?',['Burning of wood','Melting of ice','Boiling of water','Dissolving sugar'],0,'Burning produces new substances (ash, CO2, water vapour), so it is a chemical change.']],

["relative-atomic-mass","Relative Atomic Mass",1,["isotopes"],"The weighted average mass of the isotopes of an element compared with 1/12 the mass of carbon-12.","Ar = sum(abundance x mass) / 100","RAM is the same as mass number|All isotopes are equally abundant",["Relative atomic mass is measured relative to…",["Carbon-12","Hydrogen-1","Oxygen-16","Nitrogen-14"],0,"The modern standard is 1/12 of the mass of a carbon-12 atom."]],

['bond-properties','Bond Type & Properties',4,['ionic-bonding','covalent-bonding','metallic-bonding'],'Bond type predicts melting point, solubility, conductivity and hardness.','Ionic: high mp|Covalent: low mp','All compounds conduct electricity|Solubility has no pattern',['Ionic compounds generally…',['Have high melting points and conduct when molten','Have very low melting points','Are gases at room temperature','Do not conduct when molten'],0,'Strong electrostatic forces in the lattice need a lot of energy to break, and molten ions carry charge.']],

['laws-combination','Laws of Chemical Combination',5,['elements-compounds'],'The fundamental laws governing how elements combine to form compounds.','Definite proportion|Multiple proportion','The laws are only approximations|Modern chemistry ignores them',['The law of definite proportions states that a compound always has…',['The same elements in the same mass ratio','A varying composition','The same number of atoms in every sample','A fixed boiling point'],0,'A given compound always contains the same elements in the same fixed mass ratio.']],
['definite-proportions','Law of Definite Proportion',5,['laws-combination'],'A given compound always contains the same elements in the same mass ratio.','H2O is always 1:8 H:O','Composition varies from sample to sample|Water composition changes',['In water, the mass ratio of hydrogen to oxygen is always…',['1 : 8','1 : 16','1 : 2','2 : 1'],0,'2 g of hydrogen combine with 16 g of oxygen, giving a fixed ratio of 1:8.']],
['multiple-proportions','Law of Multiple Proportions',5,['laws-combination'],'When two elements form more than one compound, the mass ratios are small whole numbers.','CO vs CO2: 1:2','The ratios are arbitrary|No pattern exists',['Carbon forms CO and CO2. This illustrates the law of…',['Multiple proportions','Definite proportions','Conservation of mass','Partial pressures'],0,'The masses of oxygen combining with a fixed mass of carbon are in a small whole-number ratio.']],
['conservation-mass','Conservation of Mass',5,['laws-combination'],'Matter is neither created nor destroyed in a chemical reaction.','sum of reactant masses = sum of product masses','Mass increases during reactions|It only applies to open systems',['In a closed system, the total mass of the reactants…',['Equals the total mass of the products','Is always less than the products','Is always more than the products','Cannot be compared with the products'],0,'No atoms are created or destroyed, so total mass stays constant.']],
['chemical-symbols','Chemical Symbols & Formulae',5,['elements-compounds'],'Symbols come from Latin names; formulae show atom ratios and valency determines the formula.','Na, K, Fe, Cu|H2O, H2SO4','Symbols always come from English names|Valency does not matter',['The formula of sulphuric acid is…',['H2SO4','HSO4','H2SO3','H2S'],0,'Sulphuric acid is H2SO4 — two hydrogens, one sulphur, four oxygens.']],
['chemical-equations','Chemical Equations',5,['chemical-symbols'],'Represent reactions with formulae and balance the atoms on both sides.','2H2 + O2 -> 2H2O','Coefficients may be fractions|Subscripts are changed to balance',['Which is the correctly balanced equation?',['2H2 + O2 -> 2H2O','H2 + O2 -> H2O','H2 + O2 -> H2O2','2H2 + 2O2 -> 2H2O'],0,'Four H and two O on each side, the equation is balanced.']],
['mole-concept','Mole Concept',5,['chemical-equations','math-tools','sigfig-standard'],'1 mole = 6.02 x 10^23 particles = molar mass in grams = 22.4 dm3 at STP.','n = m / M|n = N / NA|NA = 6.02 x 10^23','The mole is a unit of mass|Molar mass varies with temperature',['One mole of any substance contains…',['6.02 x 10^23 particles','6.02 x 10^20 particles','22.4 particles','1.00 x 10^23 particles'],0,'Avogadro number is 6.02 x 10^23 particles per mole.']],
['empirical-molecular','Empirical & Molecular Formulae',5,['mole-concept'],'Empirical formula is the simplest ratio; molecular formula is the actual number of atoms.','% -> moles -> ratio|Mr = n x empirical formula mass','The empirical formula is always the molecular formula|The molecular formula is simpler',['The empirical formula shows…',['The simplest whole-number ratio of atoms','The actual number of atoms in a molecule','Only the molar mass','The state of matter'],0,'The empirical formula gives the simplest ratio only.']],
['concentration-calc','Concentration Calculations',5,['mole-concept'],'Molarity, molality, mass concentration and dilution calculations.','C = n / V|C1V1 = C2V2','Concentration is measured in grams only|Dilution changes the number of moles',['Concentration in mol/dm3 equals…',['Moles / volume in dm3','Volume / moles','Mass x volume','Moles x mass'],0,'Molarity is the number of moles of solute per cubic decimetre of solution.']],
['solution-prep','Preparation of Solutions',5,['concentration-calc'],'Weigh, dissolve, transfer to a volumetric flask, then make up to the mark.','n = C V|mass = n x M','Any flask will do|Volume does not matter',['A standard solution is prepared in a…',['Volumetric flask','Beaker','Conical flask','Test tube'],0,'A volumetric flask gives a single accurate fixed volume.']],
['gas-volume-calc','Gas Volume Calculations',5,['mole-concept'],'Molar volume at STP (22.4 dm3/mol) and at RTP (24 dm3/mol).','V = n x 22.4 dm3 at STP','All gases occupy the same volume regardless of conditions|Molar volume is constant at all temperatures',['At STP, one mole of any gas occupies…',['22.4 dm3','24.0 dm3','1.0 dm3','44.8 dm3'],0,'The molar volume of any gas at STP is 22.4 dm3.']],
['iupac-nomenclature','IUPAC Nomenclature',5,['chemical-symbols'],'The systematic naming of inorganic and organic compounds using prefix + root + suffix.','Prefix + root + suffix','Common names are IUPAC names|Naming is completely arbitrary',['The IUPAC name for NaCl is…',['Sodium chloride','Sodium chlorate','Sodium chlorite','Chlorine sodide'],0,'NaCl is a simple binary ionic compound: sodium chloride.']],

['kinetic-theory','Kinetic Theory of Matter',6,['concepts-matter'],'All matter is made of particles that are in constant random motion.','PV = one-third N m c^2|KE_avg = (3/2) k T','Particles are stationary|Motion depends only on mass',['The kinetic theory states that particles of matter are…',['In constant random motion','Always stationary','Only moving in gases','Fixed in position'],0,'Particles of all matter are in continuous random motion.']],
['states-matter','States of Matter',6,['kinetic-theory'],'Solid, liquid and gas — distinguished by how the particles are arranged and how free they are.','Solid > Liquid > Gas density','All states have the same energy|Gases are the heaviest state',['In which state are the particles farthest apart?',['Gas','Liquid','Solid','They are all the same'],0,'Gas particles are far apart with weak forces between them.']],
['brownian-motion','Brownian Motion',6,['kinetic-theory'],'The random jiggling of small particles caused by unequal molecular collisions.','Observed first by Robert Brown','The motion is deterministic|It only happens in gases',['Brownian motion is caused by…',['Unequal molecular collisions','Gravity','Magnetism','Light pressure'],0,'Bombardment by molecules on all sides is unbalanced, causing random movement.']],
['diffusion','Diffusion & Graham Law',6,['kinetic-theory'],'Particles spread out due to random motion; lighter gases diffuse faster.','Rate1 / Rate2 = sqrt(M2 / M1)','Heavier gases diffuse faster|Diffusion needs an external energy supply',['Graham law says the rate of diffusion is inversely proportional to…',['The square root of the molar mass','The molar mass','The temperature','The pressure'],0,'Rate is proportional to 1 / sqrt(M), so lighter molecules diffuse more quickly.']],
['changes-state','Changes of State',6,['states-matter'],'Melting, boiling, freezing, condensation and sublimation.','Melting: solid -> liquid','Temperature rises during melting|State changes are chemical changes',['The change from liquid to gas is called…',['Vaporisation','Condensation','Sublimation','Freezing'],0,'Liquid to gas is vaporisation (evaporation or boiling).']],
['boyles-law','Boyle Law',6,['states-matter','graphing-data'],'Pressure and volume are inversely proportional at constant temperature.','P1V1 = P2V2|PV = k','P is proportional to V|It applies at constant pressure',['Boyle law states that at constant temperature…',['PV = constant','P / V = constant','V / T = constant','P / T = constant'],0,'Pressure multiplied by volume stays constant when temperature is fixed.']],
['charles-law','Charles Law',6,['states-matter','graphing-data'],'Volume and absolute temperature are directly proportional at constant pressure.','V1 / T1 = V2 / T2','It uses the Celsius scale|V is inversely proportional to T',['Charles law states that at constant pressure…',['V / T = constant','PV = constant','P / T = constant','V x T = constant'],0,'Volume divided by absolute temperature is constant at fixed pressure.']],
['avogadros-law','Avogadro Law',6,['states-matter','mole-concept'],'Equal volumes of gases at the same temperature and pressure contain equal numbers of molecules.','V proportional to n|Vm = 22.4 dm3','Volume depends on mass|It only applies to solids',['Avogadro law states that equal volumes of gases at the same T and P contain…',['Equal numbers of molecules','Equal masses','Equal numbers of atoms always','Different numbers of molecules'],0,'The number of molecules depends only on volume, temperature and pressure.']],
['gaylussac-law','Gay-Lussac Law',6,['states-matter'],'Pressure and absolute temperature are directly proportional at constant volume.','P1 / T1 = P2 / T2','It uses the Celsius scale|P is inversely proportional to T',['Gay-Lussac law relates pressure to…',['Absolute temperature at constant volume','Volume at constant temperature','Moles at constant volume','Density at constant mass'],0,'At fixed volume, P / T stays constant.']],
['daltons-law','Dalton Partial Pressure',6,['boyles-law'],'The total pressure of a gas mixture equals the sum of the partial pressures.','P_total = P1 + P2 + P3','Gases interact chemically in the mixture|Partial pressure is always zero',['Dalton law of partial pressures says the total pressure is…',['The sum of the partial pressures','The product of the partial pressures','The average of the partial pressures','Always equal to one partial pressure'],0,'Each gas contributes its own partial pressure independently.']],
['ideal-gas-eqn','Ideal Gas Equation',6,['boyles-law','charles-law','avogadros-law'],'Combines all the gas laws. R = 8.314 J/(mol K).','PV = nRT','It applies to real gases under all conditions|R has no units',['In PV = nRT, R is the…',['Gas constant','Gravitational constant','Reaction rate','Molar mass'],0,'R is the universal molar gas constant, 8.314 J/(mol K).']],
['vapour-density','Vapour Density & Mr',6,['avogadros-law'],'Vapour density is the mass of a vapour compared with an equal volume of hydrogen.','VD = Mr / 2|Mr = 2 x VD','Vapour density equals molar mass|It only applies to solids',['Vapour density is related to molar mass by…',['Mr = 2 x vapour density','Mr = vapour density','Mr = vapour density / 2','Mr = vapour density squared'],0,'Since H2 has Mr = 2, the molar mass is twice the vapour density.']],
['ideal-real-gases','Ideal vs Real Gases',6,['ideal-gas-eqn'],'Real gases deviate from ideal behaviour at high pressure and low temperature.','Van der Waals equation','All gases behave ideally|Real gases never deviate',['Real gases deviate most from ideal behaviour at…',['High pressure and low temperature','Low pressure and high temperature','Standard conditions','All conditions equally'],0,'At high pressure and low temperature, molecular volume and intermolecular forces matter.']],

['solubility-basics','Solubility Concepts',7,['classification-mixtures'],'The maximum amount of solute that dissolves in a given solvent at a given temperature.','g solute / 100 g solvent','Solubility is fixed for all temperatures|Solubility does not depend on temperature',['Solubility is usually expressed as…',['Grams of solute per 100 g of solvent','Grams of solvent per 100 g of solute','Moles per gram','Volume per mole'],0,'Solubility is conventionally given as grams of solute per 100 g of solvent.']],
['saturation-types','Saturated / Unsaturated / Supersaturated',7,['solubility-basics'],'Unsaturated can dissolve more; saturated is at the limit; supersaturated holds more than the limit.','Unsaturated < saturated < supersaturated','Saturated means concentrated|Supersaturated solutions are stable',['A saturated solution is one that…',['Cannot dissolve more solute at that temperature','Can dissolve unlimited solute','Contains no solute at all','Is always very dilute'],0,'At saturation, the dissolved and undissolved solute are in equilibrium.']],
['solubility-curves','Solubility Curves',7,['solubility-basics','graphing-data'],'Graphs of solubility against temperature. Most solids increase; most gases decrease.','Read solubility at any temperature','All salts have the same curve|Gases are more soluble in hot water',['For most solids, solubility as temperature increases…',['Increases','Decreases','Stays the same','Halves'],0,'Most solid solutes dissolve better in hot solvent.']],
['solvents-uses','Solvents for Fats & Paints',7,['solubility-basics'],'Organic solvents dissolve non-polar substances; water dissolves polar and ionic ones.','Like dissolves like','Water dissolves everything|All solvents are polar',['The rule for solubility of one substance in another is…',['Like dissolves like','Hot dissolves cold','Heavy dissolves light','Acid dissolves base'],0,'Polar solvents dissolve polar solutes; non-polar solvents dissolve non-polar solutes.']],
['true-false-solutions','True Solutions vs Colloids vs Suspensions',7,['classification-mixtures'],'True solutions have particles under 1 nm; colloids 1-1000 nm; suspensions over 1000 nm.','True: transparent|Colloid: Tyndall effect','Colloids are true solutions|Suspensions are transparent',['Which of these is a true solution?',['Salt solution','Milk','Fog','Muddy water'],0,'Salt dissolves completely into ions, giving a transparent true solution.']],
['colloids-suspensions','Colloids & Suspensions in Real Life',7,['true-false-solutions'],'Fog, milk and aerosols are colloids; harmattan haze and muddy water are suspensions.','Fog = liquid in gas|Milk = liquid in liquid','Milk is a true solution|Fog is a suspension',['The Tyndall effect is shown by…',['Colloids','True solutions','Pure water','Air'],0,'Colloid particles are large enough to scatter a beam of light.']],

['enthalpy','Enthalpy & Energy Changes',8,['states-matter'],'Heat change at constant pressure. dH = H(products) - H(reactants).','dH = H_products - H_reactants','Enthalpy is a form of heat|dH is always positive',['Enthalpy change dH is measured at constant…',['Pressure','Volume only','Temperature only','Mass'],0,'Enthalpy is defined as the heat change at constant pressure.']],
['endo-exo','Endothermic & Exothermic',8,['enthalpy'],'Endothermic absorbs heat (dH > 0); exothermic releases heat (dH < 0).','Exo: burning|Endo: photosynthesis','All reactions release heat|Bond breaking releases energy',['An exothermic reaction…',['Releases heat and has negative dH','Absorbs heat and has positive dH','Releases heat and has positive dH','Absorbs heat and has negative dH'],0,'Exothermic reactions give out heat, so dH is negative.']],
['energy-diagrams','Energy Level Diagrams',8,['endo-exo'],'Show reactant and product energy levels; dH is the difference and Ea is the peak height.','dH = E_products - E_reactants|Ea = peak - reactant','There is no activation energy|dH equals the activation energy',['Activation energy on an energy diagram is the gap between…',['The reactant level and the peak','The reactant and product levels','Zero and the peak','The product level and the peak'],0,'Ea is the energy barrier the reactants must overcome.']],
['heat-reaction','Heat of Reaction',8,['enthalpy'],'Standard heats of neutralisation, combustion, formation and solution.','dH_neutral = -57.3 kJ/mol','All reactions have the same dH|Heat of formation of an element is never zero',['The standard heat of neutralisation of a strong acid by a strong base is about…',['-57.3 kJ/mol','+57.3 kJ/mol','-285 kJ/mol','0 kJ/mol'],0,'Strong acid plus strong base always releases about 57.3 kJ per mole of water formed.']],
['entropy','Entropy & Disorder',8,['endo-exo'],'A measure of disorder. Solid < liquid < gas, and it increases with temperature.','dS > 0 means more disorder','Entropy decreases spontaneously|Solids have the highest entropy',['Entropy is a measure of…',['Disorder in a system','Heat released','Bond strength','Reaction rate'],0,'Entropy quantifies how spread out the energy and particles are.']],
['spontaneity-gibbs','Gibbs Free Energy',8,['entropy'],'A reaction is spontaneous when dG < 0. At equilibrium dG = 0.','dG = dH - T dS','All exothermic reactions are spontaneous|dG always equals dH',['A reaction is spontaneous when…',['dG < 0','dG > 0','dG = 0','dH = 0'],0,'Negative Gibbs free energy means the process can proceed on its own.']],

['acid-base-definitions','Acid-Base Definitions',9,['chemical-equations'],'Arrhenius, Bronsted-Lowry (proton donor/acceptor) and Lewis (electron pair) definitions.','HCl -> H+ + Cl-','There is only one definition of an acid|All acids behave the same',['According to Bronsted-Lowry, an acid is a…',['Proton donor','Proton acceptor','Electron pair donor','Electron pair acceptor'],0,'A Bronsted-Lowry acid donates a proton (H+).']],
['acid-base-properties','Properties of Acids, Bases & Salts',9,['acid-base-definitions'],'Acids taste sour and turn litmus red; bases are bitter, slippery and turn litmus blue.','Acid + metal -> salt + H2','All acids are dangerous to touch|Bases taste sour',['Acids turn litmus…',['Red','Blue','Green','Colourless'],0,'Acids turn blue litmus red.']],
['strong-weak-acids','Strong vs Weak Acids',9,['acid-base-properties'],'Strong acids ionise completely in water; weak acids ionise only partially.','Strong: alpha approx 1|Weak: alpha much less than 1','Strong means concentrated|Weak acids contain no H+ ions',['A strong acid in water…',['Ionises completely','Ionises partially','Does not ionise at all','Acts as a base'],0,'Strong acids are fully ionised, so the solution contains only ions.']],
['basicity-acids','Basicity of Acids',9,['acid-base-properties'],'The number of replaceable H+ ions: monobasic, dibasic or tribasic.','Monobasic: 1 H+|Dibasic: 2 H+','All acids are monobasic|Basicity is the same as strength',['H2SO4 is dibasic because it has…',['Two replaceable hydrogen ions','Two sulphur atoms','Two oxygen atoms','A double bond'],0,'Dibasic means two replaceable H+ ions per molecule.']],
['ph-poh','pH and pOH Scale',9,['strong-weak-acids','math-tools'],'pH = -log[H+]. Acidic < 7, neutral = 7, basic > 7, and pH + pOH = 14.','pH = -log[H+]|pH + pOH = 14','pH 0 is neutral|The pH scale is linear',['A solution of pH 3 is…',['Acidic','Neutral','Basic','Amphoteric'],0,'Any pH below 7 is acidic.']],
['indicators','Acid-Base Indicators',9,['acid-base-properties'],'Substances that change colour at a specific pH, such as methyl orange and phenolphthalein.','Methyl orange: red to yellow|Phenolphthalein: colourless to pink','All indicators change at the same pH|Phenolphthalein is colourless in base',['Phenolphthalein in a basic solution is…',['Pink','Colourless','Blue','Yellow'],0,'Phenolphthalein turns pink in alkaline solution and stays colourless in acid.']],
['neutralization','Neutralization',9,['acid-base-properties'],'Acid plus base gives salt plus water. It is exothermic and is the basis of titration.','HCl + NaOH -> NaCl + H2O','Neutralisation is endothermic|No salt is formed',['Acid + base gives…',['Salt + water','Salt + hydrogen','Salt + oxygen','Base + water'],0,'Neutralisation produces a salt and water.']],
['titration','Acid-Base Titration',9,['neutralization','concentration-calc','measurement'],'Determines an unknown concentration using a standard solution and an indicator.','Ca Va / Cb Vb = na / nb','The end point and equivalence point are identical|Any indicator works for any titration',['The point at which the indicator changes colour in a titration is the…',['End point','Equivalence point','Neutral point','Saturation point'],0,'The end point is observed; the equivalence point is theoretical.']],
['salt-preparation','Preparation of Salts',9,['neutralization'],'Prepared by neutralisation, precipitation, or by reacting a metal with an acid.','Acid + base -> salt|Acid + metal -> salt','All salts are soluble in water|Only one method exists',['Which salt is prepared by precipitation?',['BaSO4','NaCl','CuSO4','KNO3'],0,'Barium sulphate is insoluble, so it is made by mixing two soluble solutions.']],
['salt-types','Types of Salts',9,['salt-preparation'],'Normal, acidic, basic and double salts (including alums).','Normal: all H+ replaced|Double: two different cations','All salts are neutral|Double salts are the same as complex ions',['NaHSO4 is an example of…',['An acidic salt','A normal salt','A basic salt','A double salt'],0,'It still contains a replaceable hydrogen, so it is an acidic salt.']],
['salt-hydrolysis','Hydrolysis of Salts',9,['salt-types','ph-poh'],'Salts of a weak acid or weak base hydrolyse to give acidic or basic solutions.','NH4Cl -> acidic|CH3COONa -> basic','All salt solutions are neutral|Their pH is always 7',['A solution of NH4Cl in water is…',['Acidic','Basic','Neutral','Amphoteric'],0,'NH4+ is the conjugate acid of a weak base, so it hydrolyses to give an acidic solution.']],
['oxides-types','Oxides Classification',9,['acid-base-properties'],'Acidic, basic, amphoteric and neutral oxides.','Acidic: CO2, SO2|Basic: Na2O|Amphoteric: Al2O3','All oxides are basic|Oxides cannot be classified',['Which oxide is amphoteric?',['Al2O3','Na2O','CO2','CO'],0,'Aluminium oxide reacts with both acids and alkalis.']],
['alums','Alums & Complex Salts',9,['salt-types'],'Double sulphates with the general formula M+ M3+ (SO4)2 . 12H2O.','KAl(SO4)2 . 12H2O','Alums are simple salts|Their formula varies widely',['An alum is a…',['Double sulphate','Single chloride','Basic oxide','Carbonate'],0,'Alums are hydrated double sulphates of a monovalent and a trivalent metal.']],

['rate-reaction','Rate of Reaction',10,['mole-concept','graphing-data'],'The change in concentration of a reactant or product per unit time.','Rate = change in concentration / change in time','The rate is always constant|Rate equals the amount of product',['Rate of reaction is defined as…',['Change in concentration per unit time','Total amount of product formed','Mass of reactant used','Time taken for the reaction to finish'],0,'Rate measures how quickly concentration changes with time.']],
['rate-factors','Factors Affecting Rate',10,['rate-reaction'],'Temperature, concentration, surface area, pressure and catalysts all affect the rate.','Higher T gives faster rate|Higher concentration gives faster rate','Temperature does not affect rate|Surface area has no effect',['Increasing temperature generally…',['Increases the rate of reaction','Decreases the rate of reaction','Has no effect on the rate','Stops the reaction'],0,'More particles have energy above the activation energy at higher temperature.']],
['collision-theory','Collision Theory',10,['rate-reaction'],'Reactions occur when molecules collide with enough energy and the correct orientation.','Rate depends on collisions and orientation','Every collision leads to reaction|Orientation does not matter',['According to collision theory, a reaction occurs when molecules collide with…',['Sufficient energy and the correct orientation','Any amount of energy','Sufficient energy only','The correct orientation only'],0,'Both the energy barrier and the geometry must be right.']],
['activation-energy','Activation Energy',10,['collision-theory'],'The minimum energy needed for a reaction. Catalysts lower it.','Lower Ea gives faster reaction','Ea is constant for all reactions|Catalysts increase Ea',['A catalyst speeds up a reaction by…',['Lowering the activation energy','Raising the activation energy','Increasing dH','Changing the products formed'],0,'A catalyst provides an alternative pathway with a lower energy barrier.']],
['arrhenius-law','Arrhenius Law',10,['activation-energy','math-tools'],'The rate constant depends exponentially on temperature.','k = A exp(-Ea / RT)','Rate decreases as temperature rises|Ea has no effect on k',['The Arrhenius equation is…',['k = A exp(-Ea / RT)','k = A + Ea / RT','k = RT / Ea','k = A exp(Ea / RT)'],0,'The rate constant rises exponentially as temperature increases.']],
['rate-curves','Reaction Rate Curves',10,['rate-reaction','graphing-data'],'Concentration-time curves; the slope at any point gives the rate.','Reactant: decreasing curve|Product: increasing curve','Reactant concentration increases|The slope is not the rate',['On a concentration-time graph, the rate at any instant is the…',['Slope of the curve','Area under the curve','Intercept on the y-axis','Maximum value'],0,'The gradient of the tangent gives the instantaneous rate.']],
['reversible-reactions','Reversible Reactions',10,['chemical-equations'],'Reactions that can proceed in both the forward and reverse directions.','N2 + 3H2 <-> 2NH3 (equilibrium)','All reactions go to completion|Reversible means forward only',['A reversible reaction is shown by…',['A double arrow (equilibrium symbol)','A single arrow','An equals sign','A plus sign'],0,'The double arrow symbol shows that both directions are possible.']],
['dynamic-equilibrium','Dynamic Equilibrium',10,['reversible-reactions'],'Forward and reverse rates are equal, so concentrations stay constant.','Rate_forward = Rate_reverse','The reaction has stopped|The concentrations are equal',['At dynamic equilibrium…',['Forward and reverse rates are equal','The reaction has completely stopped','The concentrations of reactants and products are equal','Only the forward reaction occurs'],0,'Both reactions continue, but at the same rate.']],
['lechatelier','Le Chatelier Principle',10,['dynamic-equilibrium'],'When a stress is applied, the equilibrium shifts to counteract that stress.','Higher T shifts the endothermic direction','No shift ever occurs|A catalyst shifts the equilibrium position',['Increasing pressure on N2 + 3H2 (equilibrium) 2NH3 shifts the equilibrium…',['To the right','To the left','Not at all','It stops the reaction'],0,'There are fewer gas moles on the right (2 vs 4), so higher pressure favours ammonia.']],
['equilibrium-constant','Equilibrium Constant K',10,['dynamic-equilibrium','mole-concept'],'K = [products] / [reactants], and it is constant at a given temperature.','Kc = [C][D] / [A][B]','K changes when concentration changes|K is always equal to 1',['The equilibrium constant K changes when…',['The temperature changes','The concentration changes','The pressure changes','A catalyst is added'],0,'Only temperature changes the value of K.']],

['oxidation-reduction','Oxidation & Reduction',11,['chemical-equations'],'Oxidation is loss of electrons; reduction is gain of electrons.','OIL RIG (Oxidation Is Loss, Reduction Is Gain)','Oxidation is gain of electrons|Reduction is loss of electrons',['Oxidation is the…',['Loss of electrons','Gain of electrons','Loss of oxygen','Gain of hydrogen'],0,'OIL RIG: Oxidation Is Loss, Reduction Is Gain of electrons.']],
['oxidation-numbers','Oxidation Numbers',11,['oxidation-reduction'],'The charge an atom would have if all its bonds were fully ionic.','Free element = 0|Oxygen = -2 in most compounds','Every element has oxidation state 0|Oxidation state equals the charge',['The oxidation number of oxygen in most compounds is…',['-2','+2','0','-1'],0,'Oxygen is usually -2, except in peroxides (-1) and with fluorine.']],
['redox-agents','Oxidizing & Reducing Agents',11,['oxidation-reduction'],'An oxidising agent gains electrons; a reducing agent loses electrons.','KMnO4: oxidising agent|H2, CO: reducing agents','The oxidising agent is itself oxidised|The reducing agent is itself reduced',['A reducing agent…',['Loses electrons and is oxidised','Gains electrons and is reduced','Loses electrons and is reduced','Gains electrons and is oxidised'],0,'The reducing agent gives electrons away, so it is itself oxidised.']],
['balancing-redox','Balancing Redox Equations',11,['oxidation-numbers'],'Balance the atoms, then make electrons lost equal electrons gained.','Half-reaction method','Charge does not need to balance|Electrons may be unbalanced',['When balancing a redox equation, the number of electrons lost must…',['Equal the number of electrons gained','Be twice the number of electrons gained','Always be zero','Be ignored'],0,'Electrons are conserved, so the totals must match.']],
['electrolytes','Electrolytes & Non-electrolytes',11,['ionic-bonding'],'Electrolytes conduct electricity when dissolved or molten; non-electrolytes do not.','Strong: fully ionised|Weak: partially ionised','All solutions conduct electricity|Only liquids conduct',['Which of these is a strong electrolyte?',['NaCl solution','Sugar solution','Pure water','Ethanol'],0,'Sodium chloride dissociates completely into ions in water.']],
['faraday-electrolysis','Faraday Laws of Electrolysis',11,['electrolytes','mole-concept'],'The mass deposited is proportional to the charge passed. 1 mole of electrons = 96500 C.','m = Z I t|F = 96500 C/mol','Mass deposited depends on voltage|One faraday is 1000 C',['One faraday equals…',['96500 C','9650 C','1000 C','6.02 x 10^23 C'],0,'One faraday is the charge on one mole of electrons: 96500 coulombs.']],
['electrolysis-solutions','Electrolysis of Solutions',11,['faraday-electrolysis'],'Electrolysis of CuSO4, NaCl and dilute H2SO4 solutions.','CuSO4: Cu deposited at the cathode','Hydrogen is always released at the anode|Copper is always deposited at the anode',['During electrolysis of CuSO4 solution with copper electrodes, copper is deposited at the…',['Cathode','Anode','Both electrodes','Neither electrode'],0,'Positive Cu2+ ions move to the negative cathode and are reduced to copper.']],

  { name:'Industry & Environment',   color:'#6366F1', dark:'#4F46E5' },
  { name:'Practical Chemistry',      color:'#9333EA', dark:'#7E22CE' }
];

const byId = {};
NODES.forEach(n => byId[n.id] = n);

/* ============================================================
   ORDER (topological, layer-priority)
   ============================================================ */
const ORDER = (function(){
  const placed = new Set(), out = [];
  let guard = 0;
  while (out.length < NODES.length && guard++ < 500){
    const ready = NODES.filter(n => !placed.has(n.id) && n.pre.every(p => placed.has(p)));
    if (!ready.length) break;
    ready.sort((a,b) => a.layer - b.layer || a.name.localeCompare(b.name));
    const pick = ready[0];
    out.push(pick.id); placed.add(pick.id);
  }
  NODES.forEach(n => { if (!placed.has(n.id)) out.push(n.id); });
  return out;
})();
const orderIdx = {};
ORDER.forEach((id,i) => orderIdx[id] = i);

const byLayer = LAYERS.map(() => []);
NODES.forEach(n => byLayer[n.layer].push(n));
byLayer.forEach(list => list.sort((a,b) => orderIdx[a.id] - orderIdx[b.id]));

/* ============================================================
   STATE
   ============================================================ */
const KEY = 'chemlingo_v1';
const state = { done:{}, xp:0, streak:0, lastDay:null, hearts:5 };

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s){
      state.done = s.done || {};
      state.xp = s.xp || 0;
      state.streak = s.streak || 0;
      state.lastDay = s.lastDay || null;
      state.hearts = (s.hearts == null) ? 5 : s.hearts;
    }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function today(){ return new Date().toISOString().slice(0,10); }
function touchStreak(){
  const t = today();
  if (state.lastDay === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0,10);
  state.streak = (state.lastDay === y) ? state.streak + 1 : 1;
  state.lastDay = t;
  save();
}
load();

function isDone(id){ return !!state.done[id]; }
function isUnlocked(id){
  const n = byId[id];
  if (!n) return false;
  return n.pre.every(p => isDone(p));
}
function unitProgress(layer){
  const list = byLayer[layer];
  const done = list.filter(n => isDone(n.id)).length;
  return { done, total:list.length, pct: list.length ? done / list.length : 0 };
}
function nextLessonId(){
  for (const id of ORDER){
    if (!isDone(id) && isUnlocked(id)) return id;
  }
  return null;
}
function isPerfect(id){ return state.done[id] && state.done[id].perfect; }

/* ============================================================
   UI HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const pathScreen = $('#pathScreen');
const lessonScreen = $('#lessonScreen');
const doneScreen = $('#doneScreen');
const statsScreen = $('#statsScreen');
const topbar = $('#topbar');
const tabbar = $('#tabbar');
const pathInner = $('#pathInner');
const statsInner = $('#statsInner');
const lessonMain = $('#lessonMain');
const lessonFoot = $('#lessonFoot');
const lessonPbar = $('#lessonPbar');
const lessonHearts = $('#lessonHearts');
const toastEl = $('#toast');

let currentTab = 'learn';

function showScreen(screen, opts){
  opts = opts || {};
  [pathScreen, lessonScreen, doneScreen, statsScreen].forEach(s => s.classList.add('hidden'));
  screen.classList.remove('hidden');

  const isLesson = (screen === lessonScreen);
  const isDone = (screen === doneScreen);
  topbar.classList.toggle('hidden', isLesson || isDone);
  tabbar.classList.toggle('hidden', isLesson || isDone);
}

function toast(msg, ms){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), ms || 1800);
}
function updateTop(){
  $('#streakVal').textContent = state.streak;
  $('#xpVal').textContent = state.xp;
  $('#heartsVal').textContent = state.hearts;
}
function renderHearts(){
  const n = Math.max(0, Math.min(3, state.hearts));
  lessonHearts.textContent = '❤️'.repeat(n) + '🖤'.repeat(3 - n);
}
function setTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  if (tab === 'learn') { renderPath(); showScreen(pathScreen); }
  else if (tab === 'stats') { renderStats(); showScreen(statsScreen); }
  else if (tab === 'practice') { handlePractice(); }
}

/* ============================================================
   PATH
   ============================================================ */
const OFFSETS = [0, 34, 54, 34, 0, -34, -54, -34];

function renderPath(){
  const totalDone = NODES.filter(n => isDone(n.id)).length;
  const pct = Math.round(totalDone / NODES.length * 100);

  let html = `
    <div class="hero">
      <h1>Chemistry Path</h1>
      <p>WAEC . NECO . JAMB — ${NODES.length} topics, one lesson at a time.</p>
      <div class="hero-stats">
        <div class="hero-stat">${totalDone} / ${NODES.length} done</div>
        <div class="hero-stat">${pct}% complete</div>
      </div>
    </div>`;

  const nextId = nextLessonId();

  LAYERS.forEach((layer, li) => {
    const list = byLayer[li];
    if (!list.length) return;
    const prog = unitProgress(li);
    const allDone = prog.done === prog.total;

    html += `<section class="unit">
      <div class="unit-head" style="background:${layer.color};box-shadow:0 4px 0 ${layer.dark}">
        <div class="uh-left">
          <div class="uh-eyebrow">Unit ${li + 1}</div>
          <div class="uh-title">${layer.name}</div>
          <div class="uh-prog">${prog.done} of ${prog.total} lessons complete</div>
        </div>
        <div class="uh-badge ${allDone ? 'done' : ''}">${allDone ? 'DONE' : Math.round(prog.pct*100) + '%'}</div>
      </div>
      <div class="nodes">`;

    list.forEach((n, i) => {
      const done = isDone(n.id);
      const unlocked = isUnlocked(n.id);
      const isNext = n.id === nextId;
      const off = OFFSETS[i % OFFSETS.length];

      let cls = 'lnode', icon = '🔒';
      if (done){ cls += ' done'; icon = '✓'; }
      else if (isNext){ cls += ' current'; icon = '★'; }
      else if (unlocked){ cls += ' avail'; icon = '★'; }
      else { cls += ' locked'; }

      html += `<div class="node-row" style="transform:translateX(${off}px)">
        <div class="lnode-wrap">
          ${isNext ? '<div class="start-bubble">START</div>' : ''}
          <button class="${cls}" data-lesson="${n.id}" ${(!unlocked && !done) ? 'disabled' : ''}>
            <span class="pulse"></span>
            ${icon}
            ${(done && isPerfect(n.id)) ? '<span class="crown">👑</span>' : ''}
          </button>
          <div class="lnode-label">${n.name}</div>
        </div>
      </div>`;
    });

    html += `</div></section>`;
  });

  html += `<div style="height:8px"></div>`;
  pathInner.innerHTML = html;

  pathInner.querySelectorAll('[data-lesson]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      startLesson(btn.dataset.lesson);
    });
  });

  updateTop();
}

/* ============================================================
   STATS
   ============================================================ */
function renderStats(){
  const totalDone = NODES.filter(n => isDone(n.id)).length;
  const perfect = NODES.filter(n => isPerfect(n.id)).length;
  const pct = Math.round(totalDone / NODES.length * 100);

  let html = `
    <div class="stats-hero">
      <h2>Your Progress</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="sv">${state.xp}</div>
          <div class="sl">Total XP</div>
        </div>
        <div class="stat-card">
          <div class="sv">${state.streak} ${state.streak >= 1 ? '🔥' : ''}</div>
          <div class="sl">Day Streak</div>
        </div>
        <div class="stat-card">
          <div class="sv">${totalDone}/${NODES.length}</div>
          <div class="sl">Lessons</div>
        </div>
        <div class="stat-card">
          <div class="sv">${perfect}</div>
          <div class="sl">Perfect</div>
        </div>
      </div>
    </div>
    <div class="stat-section-title">By Unit — ${pct}% overall</div>`;

  LAYERS.forEach((layer, li) => {
    const prog = unitProgress(li);
    const p = Math.round(prog.pct * 100);
    html += `<div class="stat-row">
      <span class="stat-dot" style="background:${layer.color}"></span>
      <div class="stat-info">
        <div class="stat-name">${layer.name}</div>
        <div class="stat-bar">
          <div class="stat-bar-fill" style="width:${p}%;background:${layer.color}"></div>
        </div>
      </div>
      <span class="stat-count ${prog.done === prog.total ? 'done' : ''}">${prog.done}/${prog.total}</span>
    </div>`;
  });

  statsInner.innerHTML = html;
}

/* ============================================================
   LESSON ENGINE
   ============================================================ */
let lesson = null;

function startLesson(id){
  const node = byId[id];
  if (!node) return;
  if (state.hearts <= 0){ showNoHearts(); return; }

  lesson = {
    node,
    step: 'guide',
    picked: null,
    correct: false,
    firstTry: true,
    retry: isDone(id)
  };
  showScreen(lessonScreen);
  renderHearts();
  renderLesson();
}

function renderLesson(){
  if (!lesson) return;
  const n = lesson.node;

  if (lesson.step === 'guide'){
    lessonPbar.style.width = '45%';
    lessonFoot.className = 'lesson-foot';
    lessonMain.innerHTML = `
      <div class="lesson-inner guide">
        <span class="tag guide">Study Guide</span>
        <h2>${n.name}</h2>
        <p class="guide-desc">${n.desc}</p>
        ${n.formulas.length ? `
        <div class="gblock">
          <div class="gblock-title">🔑 Key points</div>
          <div class="chips">
            ${n.formulas.map(f => `<span class="chip">${f}</span>`).join('')}
          </div>
        </div>` : ''}
        ${n.misc.length ? `
        <div class="gblock">
          <div class="warn-box">
            <div class="gblock-title">⚠️ Don't fall for these</div>
            <ul class="warn-list">
              ${n.misc.map(m => `<li>${m}</li>`).join('')}
            </ul>
          </div>
        </div>` : ''}
      </div>`;

    lessonFoot.innerHTML = `
      <div class="foot-inner">
        <button class="btn full" id="toQuiz">Got it →</button>
      </div>`;
    $('#toQuiz').addEventListener('click', () => {
      lesson.step = 'quiz';
      renderLesson();
    });
    lessonMain.scrollTop = 0;
    return;
  }

  if (lesson.step === 'quiz'){
    lessonPbar.style.width = '72%';
    lessonFoot.className = 'lesson-foot';
    const q = n.q;
    lessonMain.innerHTML = `
      <div class="lesson-inner">
        <span class="tag quiz">Question</span>
        <div class="qtext">${q.text}</div>
        <div class="options" id="opts">
          ${q.options.map((o, i) => `
            <button class="opt" data-opt="${i}">
              <span class="key">${'ABCD'[i]}</span>
              <span class="label">${o}</span>
            </button>`).join('')}
        </div>
      </div>`;

    lessonFoot.innerHTML = `
      <div class="foot-inner">
        <button class="btn full" id="checkBtn" disabled>Check</button>
      </div>`;

    lessonMain.querySelectorAll('[data-opt]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (lesson.step !== 'quiz') return;
        lesson.picked = Number(btn.dataset.opt);
        lessonMain.querySelectorAll('[data-opt]').forEach(b => b.classList.remove('picked'));
        btn.classList.add('picked');
        $('#checkBtn').disabled = false;
      });
    });

    $('#checkBtn').addEventListener('click', submitAnswer);
    lessonMain.scrollTop = 0;
    return;
  }

  lessonPbar.style.width = '100%';
}

function submitAnswer(){
  if (!lesson || lesson.step !== 'quiz' || lesson.picked == null) return;
  const n = lesson.node, q = n.q;
  const ok = lesson.picked === q.answer;
  lesson.correct = ok;
  lesson.step = 'answered';

  if (!ok){
    lesson.firstTry = false;
    state.hearts = Math.max(0, state.hearts - 1);
    save();
    renderHearts();
    updateTop();
  }

  lessonMain.querySelectorAll('[data-opt]').forEach(btn => {
    const i = Number(btn.dataset.opt);
    btn.disabled = true;
    btn.classList.remove('picked');
    if (i === q.answer) btn.classList.add('correct');
    else if (i === lesson.picked) btn.classList.add('wrong');
  });

  lessonFoot.className = 'lesson-foot ' + (ok ? 'ok' : 'no');
  lessonFoot.innerHTML = `
    <div class="foot-inner">
      <div class="fb-bar">
        <div class="fb-row">
          <div class="fb-ico ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✕'}</div>
          <div class="fb-title ${ok ? 'ok' : 'no'}">${ok ? 'Correct!' : 'Not quite'}</div>
        </div>
        <div class="fb-text">${q.why}</div>
        <button class="btn full ${ok ? '' : 'red'}" id="contBtn">${ok ? 'Continue' : 'Got it'}</button>
      </div>
    </div>`;

  $('#contBtn').addEventListener('click', () => {
    if (!ok && state.hearts <= 0){ showNoHearts(); return; }
    finishLesson();
  });
}

function finishLesson(){
  const n = lesson.node;
  const firstTime = !isDone(n.id);
  const perfect = lesson.correct && lesson.firstTry;

  let earned = 0;
  if (firstTime){
    earned = perfect ? 15 : 10;
    state.xp += earned;
    state.done[n.id] = { perfect, xp: earned };
    if (state.hearts < 5) state.hearts++;
    touchStreak();
  } else {
    earned = lesson.correct ? 2 : 0;
    state.xp += earned;
    if (perfect && !isPerfect(n.id)) state.done[n.id].perfect = true;
  }
  save();

  showDone(n, earned, perfect, firstTime);
}

function showDone(n, earned, perfect, firstTime){
  doneScreen.innerHTML = `
    <div class="done-inner">
      <div class="trophy">${perfect ? '🏆' : '🎉'}</div>
      <div class="done-title">${firstTime ? 'Lesson complete!' : 'Practice complete!'}</div>
      <div class="done-sub">${n.name}</div>
      <div class="done-stats">
        <div class="done-stat">
          <div class="ds-v">+${earned}</div>
          <div class="ds-l">XP</div>
        </div>
        <div class="done-stat">
          <div class="ds-v">${lesson.correct ? '100%' : '0%'}</div>
          <div class="ds-l">Accuracy</div>
        </div>
        <div class="done-stat">
          <div class="ds-v">${perfect ? '★' : '—'}</div>
          <div class="ds-l">Perfect</div>
        </div>
      </div>
      <div class="done-card">
        <div class="dc-t">Remember</div>
        <div class="dc-q">${n.desc}</div>
        <div class="dc-a">✓ ${n.q.why}</div>
      </div>
      <button class="btn full" id="doneCont">Continue</button>
    </div>`;

  showScreen(doneScreen);
  $('#doneCont').addEventListener('click', () => {
    lesson = null;
    setTab('learn');
  });
}

/* ============================================================
   PRACTICE
   ============================================================ */
function handlePractice(){
  // Reset tab to learn visually then launch a random completed lesson
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === 'learn');
  });
  currentTab = 'learn';

  const pool = NODES.filter(n => isDone(n.id));
  if (!pool.length){
    toast('Complete a lesson first to unlock practice');
    renderPath();
    showScreen(pathScreen);
    return;
  }
  // Prefer "learning" (imperfect) lessons, then random
  const imperfect = pool.filter(n => !isPerfect(n.id));
  const source = imperfect.length ? imperfect : pool;
  const pick = source[Math.floor(Math.random() * source.length)];
  startLesson(pick.id);
}

/* ============================================================
   MODALS
   ============================================================ */
function showNoHearts(){
  state.hearts = 5;
  save();
  updateTop();
  renderHearts();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <div class="grabber"></div>
      <div class="m-ico">💔</div>
      <h3>Out of hearts!</h3>
      <p>You ran out of hearts. Refill and keep going — every mistake is a chance to learn.</p>
      <div class="m-row">
        <button class="btn full" id="refillBtn">Refill hearts</button>
        <button class="btn full ghost" id="quitModal">Back to path</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(bg);

  bg.querySelector('#refillBtn').addEventListener('click', () => {
    state.hearts = 5; save(); updateTop(); renderHearts();
    bg.remove();
  });
  bg.querySelector('#quitModal').addEventListener('click', () => {
    bg.remove(); lesson = null; setTab('learn');
  });
  bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
}

function confirmQuit(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <div class="grabber"></div>
      <div class="m-ico">🤔</div>
      <h3>Leave the lesson?</h3>
      <p>Your progress in this lesson will be lost.</p>
      <div class="m-row">
        <button class="btn full red" id="yesQuit">Quit lesson</button>
        <button class="btn full ghost" id="noQuit">Keep learning</button>
      </div>
    </div>`;
  document.getElementById('app').appendChild(bg);
  bg.querySelector('#yesQuit').addEventListener('click', () => {
    bg.remove(); lesson = null; setTab('learn');
  });
  bg.querySelector('#noQuit').addEventListener('click', () => bg.remove());
  bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
}

/* ============================================================
   WIRING
   ============================================================ */
$('#quitBtn').addEventListener('click', () => {
  if (lesson && lesson.step === 'answered'){ lesson = null; setTab('learn'); return; }
  confirmQuit();
});

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => setTab(t.dataset.tab));
});

document.addEventListener('keydown', e => {
  if (!lesson || lesson.step !== 'quiz') return;
  const k = e.key.toUpperCase();
  const i = 'ABCD'.indexOf(k);
  if (i >= 0 && i < lesson.node.q.options.length){
    const btn = lessonMain.querySelector(`[data-opt="${i}"]`);
    if (btn) btn.click();
  }
  if (e.key === 'Enter'){
    const cb = $('#checkBtn');
    if (cb && !cb.disabled) cb.click();
    const cont = $('#contBtn');
    if (cont) cont.click();
  }
});

/* Prevent pinch-zoom on iOS Safari for a more native app feel */
document.addEventListener('gesturestart', e => e.preventDefault(), { passive:false });
document.addEventListener('gesturechange', e => e.preventDefault(), { passive:false });

/* Refresh heights when the on-screen keyboard opens/closes or orientation changes */
window.addEventListener('resize', () => {
  document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
});
window.dispatchEvent(new Event('resize'));

/* ============================================================
   INIT
   ============================================================ */
updateTop();
renderPath();
renderStats();
setTab('learn');
</script>
</body>
</html>
